<style>
  :root {
    /* Paleta tomada directo de la carta real (Lista de precios 2026):
       crema de fondo, tinta casi negra para precios/texto, teal oscuro
       para títulos, dorado para presentaciones y acentos — un solo
       sistema de marca para todos los lotes, no un color por cada uno. */
    --crema: #FCFAF3; --crema-alt: #F3EEE0; --cafe: #201B14; --cafe-soft: #7A6F5F;
    --teal: #274652; --teal-bg: #E7EDEE;
    --dorado: #D6A23A; --dorado-bg: #FBF0DA;
    --linea: #E7DFCE; --blanco: #FFFFFF;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--crema); color: var(--cafe);
    font-family: 'Outfit', system-ui, sans-serif; font-size: 16px; line-height: 1.5;
    -webkit-font-smoothing: antialiased; padding-bottom: 90px;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 18px 16px 24px; position: relative; z-index: 1; }
  .marca-agua { position: fixed; top: 8%; left: 50%; transform: translateX(-50%); width: 360px; max-width: 92vw; opacity: .05; z-index: 0; pointer-events: none; }
  header { text-align: center; margin-bottom: 20px; }
  header img { width: 76px; height: 76px; border-radius: 50%; border: 1px solid var(--linea); object-fit: cover; }
  header h1 { font-size: 21px; margin: 10px 0 2px; }
  header p { font-size: 13.5px; color: var(--cafe-soft); margin: 0; }

  .card { background: var(--blanco); border: 1px solid var(--linea); border-radius: 16px; padding: 16px; margin-bottom: 14px; box-shadow: 0 3px 14px rgba(62,39,35,.05); }
  .card-lote { padding: 0; overflow: hidden; scroll-margin-top: 66px; }
  #resumenPedido { scroll-margin-top: 66px; }
  .lote-cabecera { padding: 20px 18px 18px; background: var(--crema-alt); }
  .lote-cabecera h3 { margin: 0; font-family: 'Baloo 2', 'Outfit', sans-serif; font-weight: 700; font-size: 30px; line-height: 1; color: var(--teal); }
  .lote-presentaciones { padding: 4px 18px 16px; }

  .guia-pasos { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 14px; scrollbar-width: none; }
  .guia-pasos::-webkit-scrollbar { display: none; }
  .guia-paso { flex-shrink: 0; display: flex; align-items: center; gap: 7px; font-family: 'Outfit', sans-serif; font-size: 12px; font-weight: 600; color: var(--cafe-soft); background: var(--blanco); border: 1px solid var(--linea); border-radius: 20px; padding: 7px 13px 7px 7px; }
  .guia-paso b { display: inline-flex; align-items: center; justify-content: center; width: 19px; height: 19px; border-radius: 50%; background: var(--dorado); color: #fff; font-size: 10.5px; flex-shrink: 0; }

  .nav-rapida { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 18px; scrollbar-width: none; position: sticky; top: 0; z-index: 40; background: var(--crema); }
  .nav-rapida::-webkit-scrollbar { display: none; }
  .nav-rapida a { flex-shrink: 0; font-family: 'Outfit', sans-serif; font-size: 13px; font-weight: 700; text-decoration: none; padding: 8px 16px; border-radius: 20px; border: 1.5px solid var(--linea); background: var(--blanco); color: var(--teal); }
  .exoticos-banner { background: var(--dorado-bg); border: 1.5px solid var(--dorado); text-align: center; }
  .exoticos-banner p { font-size: 13.5px; color: var(--cafe-soft); line-height: 1.5; }
  .wa-inline {
    display: inline-flex; align-items: center; gap: 6px; background: #25D366; color: #fff;
    text-decoration: none; font-weight: 700; font-size: 13.5px; padding: 9px 16px; border-radius: 20px;
  }

  .pres-fila { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 0; border-top: 1px solid var(--linea); }
  .pres-fila:first-of-type { border-top: none; }
  .pres-nombre { font-size: 13px; font-weight: 700; color: var(--dorado); text-transform: uppercase; letter-spacing: .2px; }
  .pres-precio { font-size: 16.5px; font-weight: 800; color: var(--cafe); margin-top: 1px; }
  .molienda-toggle { display: flex; gap: 6px; margin-top: 6px; }
  .molienda-btn {
    font-family: 'Outfit', sans-serif; font-size: 11.5px; font-weight: 600; color: var(--cafe-soft);
    background: var(--crema-alt); border: 1px solid var(--linea); border-radius: 20px;
    padding: 5px 12px; cursor: pointer;
  }
  .molienda-btn.activo { background: var(--dorado-bg); border-color: var(--dorado); color: var(--cafe); font-weight: 700; }
  .stepper { display: flex; align-items: center; gap: 8px; }
  .stepper button { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--linea); background: var(--crema-alt); font-size: 16px; font-weight: 700; cursor: pointer; color: var(--cafe); }
  .stepper span { min-width: 18px; text-align: center; font-weight: 700; }

  .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
  .field label { font-size: 13px; font-weight: 600; color: var(--cafe-soft); }
  .field input, .field textarea { font-family: 'Outfit', sans-serif; font-size: 16px; padding: 11px 12px; border: 1px solid var(--linea); border-radius: 10px; background: var(--blanco); color: var(--cafe); }
  .field textarea { resize: vertical; min-height: 60px; }

  .carrito-barra {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
    background: var(--blanco); border-top: 1px solid var(--linea); box-shadow: 0 -6px 20px rgba(62,39,35,.10);
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    transform: translateY(100%); opacity: 0; transition: transform .28s ease, opacity .28s ease; pointer-events: none;
  }
  .carrito-barra.visible { transform: translateY(0); opacity: 1; pointer-events: auto; }
  .carrito-barra .fila { display: flex; align-items: center; justify-content: space-between; max-width: 560px; margin: 0 auto; cursor: pointer; }
  .carrito-barra .ver-carrito { display: flex; align-items: center; gap: 10px; background: none; border: none; cursor: pointer; padding: 4px; text-align: left; }
  .carrito-barra .ver-carrito svg { width: 26px; height: 26px; color: var(--cafe); flex-shrink: 0; }
  .carrito-barra .total { font-weight: 800; font-size: 17px; }
  .carrito-barra .total small { display: block; font-size: 11px; font-weight: 600; color: var(--cafe-soft); }
  .carrito-barra button.enviar { font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 15px; background: var(--teal); color: #fff; border: none; border-radius: 30px; padding: 13px 22px; cursor: pointer; }
  .carrito-barra button.enviar:disabled { opacity: .45; cursor: not-allowed; }
  @keyframes cp-pulso { 0%,100% { transform: scale(1); } 50% { transform: scale(1.12); } }
  .carrito-barra .ver-carrito.animar svg { animation: cp-pulso .4s ease; }

  .item-linea { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--linea); font-size: 14px; }
  .item-linea button { background: none; border: none; color: var(--cafe-soft); text-decoration: underline; font-size: 13px; cursor: pointer; }

  .metodo-bloque { padding: 4px 0 12px; border-bottom: 1px solid var(--linea); }
  .metodo-titulo { font-size: 12.5px; font-weight: 600; color: var(--cafe-soft); margin: 0 0 8px; }
  .metodo-opciones { display: flex; flex-wrap: wrap; gap: 7px; }
  .metodo-pill { display: flex; align-items: center; gap: 6px; font-family: 'Outfit', sans-serif; font-size: 12px; font-weight: 600; color: var(--cafe); background: var(--crema-alt); border: 1.5px solid var(--linea); border-radius: 20px; padding: 6px 12px 6px 8px; cursor: pointer; }
  .metodo-pill svg { width: 24px; height: 24px; flex-shrink: 0; }
  .metodo-pill.activo { background: var(--dorado-bg); border-color: var(--dorado); color: var(--cafe); }
  .metodo-pill small { display: block; font-weight: 500; opacity: .75; font-size: 10px; margin-top: 1px; }
  .metodo-diferente { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--cafe-soft); margin-top: 10px; cursor: pointer; }
  .metodo-diferente input { width: 15px; height: 15px; flex-shrink: 0; }
  .metodo-unidad { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 7px; }
  .metodo-unidad span { font-size: 12px; color: var(--cafe-soft); flex-shrink: 0; }
  .metodo-unidad select { flex: 1; font-family: 'Outfit', sans-serif; font-size: 12.5px; padding: 7px 8px; border: 1px solid var(--linea); border-radius: 8px; background: var(--blanco); color: var(--cafe); }
  .metodo-grupo { margin-top: 14px; padding-top: 10px; border-top: 1px dashed var(--linea); }
  .metodo-grupo-titulo { font-size: 12px; font-weight: 700; color: var(--cafe); margin: 0 0 4px; }

  .add-btn { width: 100%; font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 16px; background: var(--cafe); color: #fff; border: none; border-radius: 30px; padding: 15px; cursor: pointer; }
  .add-btn:disabled { opacity: .5; cursor: not-allowed; }

  .toast { position: fixed; left: 50%; bottom: 100px; transform: translateX(-50%); background: var(--cafe); color: #fff; padding: 12px 18px; border-radius: 12px; font-size: 14px; font-weight: 600; z-index: 100; box-shadow: 0 8px 24px rgba(0,0,0,.2); }

  .confirmacion { text-align: center; padding: 40px 20px; }
  .confirmacion .check { font-size: 56px; margin-bottom: 10px; }
  .confirmacion h2 { margin: 0 0 8px; }
  .confirmacion p { color: var(--cafe-soft); font-size: 14.5px; margin: 0 0 20px; }
  .confirmacion a.wa {
    display: inline-flex; align-items: center; gap: 8px; background: #25D366; color: #fff;
    text-decoration: none; font-weight: 700; padding: 14px 24px; border-radius: 30px; font-size: 15px;
  }
</style>
</head>

<script>
/* ================================================================
   NÚMERO DE WHATSAPP DE CAFÉ PANDORA
   Cámbialo por el tuyo en formato internacional, sin +, sin espacios.
   Ejemplo Colombia: 573001234567
================================================================ */
const NUMERO_WHATSAPP = '573183926578'; // Café Pandora

const LOTES = ['Lavado', 'Honey', 'Natural', 'Exotico'];
const ORDEN_PRES = ['Media lb', 'Libra', 'Kilo', 'Cuarterón'];

const MOLIENDAS = ['Molido', 'En grano'];

// Métodos de preparación: le sirven a quien muele el café para saber qué
// tan fino dejarlo. Se ofrecen solo cuando el cliente eligió "Molido".
const METODOS = [
  { id: 'prensa',    nombre: 'Prensa francesa',    grano: 'Gruesa' },
  { id: 'v60',       nombre: 'V60',                grano: 'Media' },
  { id: 'electrica', nombre: 'Cafetera eléctrica', grano: 'Media fina' },
  { id: 'moka',      nombre: 'Moka',               grano: 'Fina' },
];
// Estilo de trazo fino inspirado en tu lámina de referencia (siphon/aeropress/
// v60/chemex/moka/prensa/espresso/turkish) — dibujados en el mismo lenguaje
// visual para que los 4 que usamos aquí se vean como parte de un mismo set.
const ICONOS_METODO = {
  prensa: '<svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><rect x="12" y="14" width="16" height="20" rx="1"/><line x1="20" y1="6" x2="20" y2="14"/><circle cx="20" cy="4.3" r="1.4"/><path d="M28 18c3 .5 5 2.5 5 5s-2 4.5-5 5"/><line x1="12" y1="34" x2="28" y2="34"/></svg>',
  v60: '<svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M11 10h18l-7 14h-4l-7-14Z"/><path d="M14 24c-3 1-5 3-5 6 0 3.5 4.9 6 11 6s11-2.5 11-6c0-3-2-5-5-6"/></svg>',
  electrica: '<svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="30" width="22" height="5" rx="1"/><path d="M13 30l1.5-13h11l1.5 13"/><path d="M27 19c2.3.2 3.7 1.1 3.7 2.2s-1.4 2-3.7 2.2"/><rect x="15" y="10" width="10" height="6" rx="1"/><line x1="17" y1="7" x2="23" y2="7"/></svg>',
  moka: '<svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 35h10l-1.5-8h-7L15 35Z"/><path d="M13.5 27h13l-2.5-9h-8l-2.5 9Z"/><path d="M15.5 18 13 8h14l-2.5 10"/><circle cx="20" cy="5.4" r="1.3"/><line x1="20" y1="6.7" x2="20" y2="8"/><path d="M27 12c2.3.3 3.8 1.4 3.8 2.8S29.3 17.3 27 17.6"/></svg>',
};
function nombreMetodo(id) {
  const m = METODOS.find(x => x.id === id);
  return m ? `${m.nombre} (${m.grano})` : null;
}

let precios = [];
let carrito = {}; // clave "Lote|Presentacion|Molienda" -> {lote, presentacion, molienda, precio, cantidad}
let moliendaSeleccionada = {}; // clave "Lote|Presentacion" -> 'Molido' | 'En grano' (lo que se ve elegido ahora mismo)
const fmt = n => '$' + Math.round(Number(n) || 0).toLocaleString('es-CO');
const idSeguro = s => s.replace(/[^a-zA-Z0-9]/g, '_');

async function cargarCatalogo() {
  try {
    const res = await fetch('/api/catalogo-publico');
    precios = await res.json();
  } catch {
    precios = [];
  }
  recuperarBorrador();
  pintarCatalogo();
  pintarBannerExoticos();
  pintarNavRapida();
  actualizarBarra();
}

// Fila de atajos pegada arriba (☕ Lavado · Honey · Natural · Exóticos) para
// que en un catálogo largo el cliente no tenga que scrollear a ciegas.
function pintarNavRapida() {
  const nav = document.getElementById('navRapida');
  const disponibles = LOTES.filter(l => l === 'Exotico'
    ? precioDe('Exotico', 'Media lb') > 0
    : ORDEN_PRES.some(p => precioDe(l, p) > 0));
  if (disponibles.length < 2) { nav.style.display = 'none'; return; }
  nav.innerHTML = disponibles.map(l => `<a href="#${l === 'Exotico' ? 'bannerExoticos' : 'lote-' + l.toLowerCase()}" class="${l.toLowerCase()}">${l === 'Exotico' ? 'Exóticos' : l}</a>`).join('');
}

// El precio de Exóticos sale de lo que dejes puesto en Configuración → la
// tarifa web de café → Exotico. Si lo dejas en $0, el aviso ni aparece.
function pintarBannerExoticos() {
  const precio = precioDe('Exotico', 'Media lb');
  const banner = document.getElementById('bannerExoticos');
  if (!precio) { banner.style.display = 'none'; return; }
  banner.style.display = 'block';
  document.getElementById('precioExoticos').innerHTML = `Media libra (250 gr) · ${fmt(precio)}<br><i>Pregunta por disponibilidad</i>`;
}

function precioDe(lote, presentacion) {
  const f = precios.find(p => p.lote === lote && p.presentacion === presentacion);
  return f ? f.precio : 0;
}

function pintarCatalogo() {
  const cont = document.getElementById('catalogo');
  cont.innerHTML = LOTES.filter(l => l !== 'Exotico').map(lote => {
    const filas = ORDEN_PRES.filter(p => precioDe(lote, p) > 0);
    if (!filas.length) return '';
    return `
      <div class="card card-lote" id="lote-${lote.toLowerCase()}">
        <div class="lote-cabecera ${lote.toLowerCase()}">
          <h3>${lote}</h3>
        </div>
        <div class="lote-presentaciones">
        ${filas.map(p => {
          const claveBase = lote + '|' + p;
          const idSafe = idSeguro(claveBase);
          const molienda = moliendaSeleccionada[claveBase] || 'Molido';
          const clave = claveBase + '|' + molienda;
          const cant = carrito[clave] ? carrito[clave].cantidad : 0;
          return `
          <div class="pres-fila">
            <div>
              <div class="pres-nombre">${p}</div>
              <div class="pres-precio">${fmt(precioDe(lote, p))}</div>
              <div class="molienda-toggle">
                ${MOLIENDAS.map(m => `<button type="button" class="molienda-btn ${m === molienda ? 'activo' : ''}" onclick="cambiarMolienda('${lote}','${p}','${m}', this)">${m}</button>`).join('')}
              </div>
            </div>
            <div class="stepper">
              <button onclick="cambiarCantidad('${lote}','${p}',-1)">−</button>
              <span id="cant-${idSafe}">${cant}</span>
              <button onclick="cambiarCantidad('${lote}','${p}',1)">+</button>
            </div>
          </div>`;
        }).join('')}
        </div>
      </div>`;
  }).join('') || '<div class="card">No hay productos disponibles ahora mismo. Escríbenos directo por WhatsApp.</div>';
}

// Si eliges "En grano" para una Libra de Lavado y luego "Molido" para otra
// Libra de Lavado, quedan como DOS líneas distintas en el carrito — el
// selector solo decide a cuál de las dos le suman los botones +/− ahora mismo.
function cambiarMolienda(lote, presentacion, valor, btn) {
  const claveBase = lote + '|' + presentacion;
  moliendaSeleccionada[claveBase] = valor;
  const clave = claveBase + '|' + valor;
  const cant = carrito[clave] ? carrito[clave].cantidad : 0;
  const el = document.getElementById('cant-' + idSeguro(claveBase));
  if (el) el.textContent = cant;
  if (btn) {
    btn.parentElement.querySelectorAll('.molienda-btn').forEach(b => b.classList.remove('activo'));
    btn.classList.add('activo');
  }
}

function cambiarCantidad(lote, presentacion, delta) {
  const claveBase = lote + '|' + presentacion;
  const molienda = moliendaSeleccionada[claveBase] || 'Molido';
  const clave = claveBase + '|' + molienda;
  const actual = carrito[clave] || { lote, presentacion, molienda, precio: precioDe(lote, presentacion), cantidad: 0 };
  actual.cantidad = Math.max(0, actual.cantidad + delta);
  if (actual.cantidad === 0) delete carrito[clave];
  else carrito[clave] = actual;
  const el = document.getElementById('cant-' + idSeguro(claveBase));
  if (el) el.textContent = actual.cantidad;
  actualizarBarra();
}

function actualizarBarra() {
  const items = Object.values(carrito);
  const barra = document.getElementById('barraCarrito');
  const totalItems = items.reduce((s, it) => s + it.cantidad, 0);
  const totalDinero = items.reduce((s, it) => s + it.cantidad * it.precio, 0);
  const yaVisible = barra.classList.contains('visible');
  barra.classList.toggle('visible', totalItems > 0);
  // Pequeño rebote en el icono del carrito cada vez que cambia la cantidad,
  // para que el cliente note que su pedido "se movió" sin tener que mirar el número.
  if (totalItems > 0) {
    const boton = document.getElementById('verCarrito');
    boton.classList.remove('animar');
    void boton.offsetWidth;
    boton.classList.add('animar');
  }
  document.getElementById('barra-cantidad').textContent = totalItems + (totalItems === 1 ? ' producto' : ' productos');
  document.getElementById('barra-total').textContent = fmt(totalDinero);
  pintarResumenPedido(items, totalDinero);
  guardarBorrador();
}

// El botón del carrito no envía el pedido — lleva al cliente directo a donde
// revisa lo que lleva, elige la molienda/método y confirma.
function irAlResumen() {
  document.getElementById('resumenPedido').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// Muestra lo que lleva el carrito ANTES de enviarlo, con un botón para
// quitar cada línea — así el cliente repasa su pedido, no solo ve un total.
function pintarResumenPedido(items, totalDinero) {
  const cont = document.getElementById('resumenPedido');
  if (!items.length) { cont.style.display = 'none'; return; }
  cont.style.display = 'block';
  cont.innerHTML = `
    <div class="card">
      <h3 style="margin-top:0">Tu pedido</h3>
      ${items.map(it => `
        <div class="item-linea">
          <span>${it.cantidad} × ${it.presentacion} de ${it.lote} <span style="color:var(--cafe-soft);font-size:12.5px">(${it.molienda})</span></span>
          <span style="display:flex;align-items:center;gap:10px">
            <b>${fmt(it.cantidad * it.precio)}</b>
            <button onclick="quitarLineaResumen('${it.lote}','${it.presentacion}','${it.molienda}')">Quitar</button>
          </span>
        </div>`).join('')}
      ${bloqueMetodoGlobal(items)}
      <div class="item-linea" style="border-bottom:none;font-weight:800;padding-top:12px">
        <span>Total</span><span>${fmt(totalDinero)}</span>
      </div>
    </div>`;
}

// Por defecto el método de preparación es UNO SOLO para todo el pedido —
// no importa si es Honey, Lavado o Natural, la mayoría de clientes prepara
// todo su café igual. Solo si marcan "moliendas distintas" se discrimina
// unidad por unidad (y ahí sí, sin importar de qué lote sea cada una).
let metodoModoDiferente = false;
let metodoGlobalActual = null;

function itemsMolido(items) {
  return items.filter(it => it.molienda === 'Molido');
}

// Mantiene it.metodos con un elemento por unidad. En modo "único" las nuevas
// unidades heredan el método global vigente; en modo "diferente" heredan el
// último valor de esa misma línea (o quedan sin elegir).
function asegurarMetodos(it) {
  if (!Array.isArray(it.metodos)) it.metodos = [];
  const relleno = metodoModoDiferente ? (it.metodos[it.metodos.length - 1] || null) : metodoGlobalActual;
  while (it.metodos.length < it.cantidad) it.metodos.push(relleno);
  it.metodos.length = it.cantidad;
}

function metodoUnicoActual(molidos) {
  const todos = molidos.flatMap(it => it.metodos);
  if (!todos.length) return null;
  return todos.every(m => m === todos[0]) ? todos[0] : null;
}

function bloqueMetodoGlobal(items) {
  const molidos = itemsMolido(items);
  if (!molidos.length) return '';
  molidos.forEach(asegurarMetodos);
  const totalUnidades = molidos.reduce((s, it) => s + it.cantidad, 0);
  const unico = metodoUnicoActual(molidos);
  return `
    <div class="metodo-bloque">
      <p class="metodo-titulo">☕ Si llevas café molido, dinos en qué lo preparas para moler a tu medida</p>
      <div class="metodo-opciones">
        ${METODOS.map(m => `
          <button type="button" class="metodo-pill ${(!metodoModoDiferente && unico === m.id) ? 'activo' : ''}"
            onclick="elegirMetodoGlobal('${m.id}')">
            ${ICONOS_METODO[m.id]}<span>${m.nombre}<small>${m.grano}</small></span>
          </button>`).join('')}
      </div>
      ${totalUnidades > 1 ? `
        <label class="metodo-diferente">
          <input type="checkbox" ${metodoModoDiferente ? 'checked' : ''} onchange="toggleMetodoGlobalDiferente(this.checked)">
          Necesito moliendas distintas entre las unidades
        </label>
        ${metodoModoDiferente ? molidos.map(it => `
          <div class="metodo-grupo">
            <p class="metodo-grupo-titulo">${it.presentacion} de ${it.lote}${it.cantidad > 1 ? ` (${it.cantidad})` : ''}</p>
            ${it.metodos.map((val, i) => `
              <div class="metodo-unidad">
                <span>${it.cantidad > 1 ? 'Unidad ' + (i + 1) : 'Molienda'}</span>
                <select onchange="elegirMetodoUnidad('${it.lote}','${it.presentacion}','${it.molienda}', ${i}, this.value)">
                  <option value="">Elige el método…</option>
                  ${METODOS.map(m => `<option value="${m.id}" ${val === m.id ? 'selected' : ''}>${m.nombre} (${m.grano})</option>`).join('')}
                </select>
              </div>`).join('')}
          </div>`).join('') : ''}
      ` : ''}
    </div>`;
}

function elegirMetodoGlobal(metodoId) {
  metodoGlobalActual = metodoId;
  metodoModoDiferente = false;
  itemsMolido(Object.values(carrito)).forEach(it => { it.metodos = new Array(it.cantidad).fill(metodoId); });
  actualizarBarra();
}

function toggleMetodoGlobalDiferente(checked) {
  metodoModoDiferente = checked;
  if (!checked) {
    itemsMolido(Object.values(carrito)).forEach(it => { it.metodos = new Array(it.cantidad).fill(metodoGlobalActual); });
  }
  actualizarBarra();
}

function elegirMetodoUnidad(lote, presentacion, molienda, index, metodoId) {
  const it = carrito[lote + '|' + presentacion + '|' + molienda]; if (!it) return;
  asegurarMetodos(it);
  it.metodos[index] = metodoId || null;
  actualizarBarra();
}

function quitarLineaResumen(lote, presentacion, molienda) {
  const clave = lote + '|' + presentacion + '|' + molienda;
  delete carrito[clave];
  const claveBase = lote + '|' + presentacion;
  const el = document.getElementById('cant-' + idSeguro(claveBase));
  if (el && (moliendaSeleccionada[claveBase] || 'Molido') === molienda) el.textContent = '0';
  actualizarBarra();
}

/* ---------- Guardar y recuperar el pedido a medias (por si se cierra la página) ---------- */
const CLAVE_BORRADOR = 'cp_pedido_borrador';
function guardarBorrador() {
  try {
    localStorage.setItem(CLAVE_BORRADOR, JSON.stringify({
      carrito, moliendaSeleccionada,
      nombre: document.getElementById('p-nombre')?.value || '',
      telefono: document.getElementById('p-telefono')?.value || '',
      notas: document.getElementById('p-notas')?.value || '',
    }));
  } catch {}
}
function recuperarBorrador() {
  try {
    const guardado = JSON.parse(localStorage.getItem(CLAVE_BORRADOR) || 'null');
    if (!guardado) return;
    carrito = guardado.carrito || {};
    moliendaSeleccionada = guardado.moliendaSeleccionada || {};
    if (guardado.nombre) document.getElementById('p-nombre').value = guardado.nombre;
    if (guardado.telefono) document.getElementById('p-telefono').value = guardado.telefono;
    if (guardado.notas) document.getElementById('p-notas').value = guardado.notas;
  } catch {}
}
function borrarBorrador() {
  try { localStorage.removeItem(CLAVE_BORRADOR); } catch {}
}

async function enviarPedido() {
  const items = Object.values(carrito);
  if (!items.length) return;
  const nombre = document.getElementById('p-nombre').value.trim();
  const telefono = document.getElementById('p-telefono').value.trim();
  const soloDigitos = telefono.replace(/\D/g, '');
  // Si le falta algo del formulario, lo llevamos directo ahí en vez de
  // dejarlo adivinando qué le faltó — sobre todo si venía tocando "Enviar"
  // desde la barra flotante sin haber bajado a ver el formulario.
  if (!nombre || soloDigitos.length < 7) {
    document.getElementById('datosCliente').scrollIntoView({ behavior: 'smooth', block: 'start' });
    const campo = !nombre ? 'p-nombre' : 'p-telefono';
    mostrarToast(!nombre ? 'Escribe tu nombre para poder contactarte.' : 'Escribe un número de celular válido.');
    setTimeout(() => document.getElementById(campo).focus(), 400);
    return;
  }

  const btn = document.getElementById('btnEnviar');
  btn.disabled = true;
  const notas = document.getElementById('p-notas').value.trim();
  const payload = {
    nombreCliente: nombre,
    telefono,
    notas: notas || null,
    items: items.map(it => ({
      lote: it.lote, presentacion: it.presentacion, molienda: it.molienda, cantidad: it.cantidad, valor: it.cantidad * it.precio,
      metodos: (it.molienda === 'Molido' && Array.isArray(it.metodos) && it.metodos.some(Boolean))
        ? it.metodos.map(id => id ? nombreMetodo(id) : null)
        : undefined,
    })),
  };

  try {
    const res = await fetch('/api/pedidos-web', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    if (!res.ok) throw new Error('No se pudo enviar');
    const total = items.reduce((s, it) => s + it.cantidad * it.precio, 0);
    borrarBorrador();
    mostrarConfirmacion(nombre, items, total, notas);
  } catch {
    mostrarToast('Hubo un problema enviando el pedido. Intenta de nuevo.');
    btn.disabled = false;
  }
}

function mostrarConfirmacion(nombre, items, total, notas) {
  document.getElementById('catalogo').style.display = 'none';
  document.getElementById('resumenPedido').style.display = 'none';
  document.querySelectorAll('.wrap > .card').forEach(c => c.style.display = 'none');
  document.getElementById('barraCarrito').style.display = 'none';

  const detalle = items.map(it => {
    let linea = `• ${it.cantidad} ${it.presentacion} de ${it.lote} (${it.molienda})`;
    if (it.molienda === 'Molido' && Array.isArray(it.metodos) && it.metodos.some(Boolean)) {
      const todosIguales = it.metodos.every(m => m === it.metodos[0]);
      if (todosIguales) linea += ` — ${nombreMetodo(it.metodos[0])}`;
      else linea += '\n' + it.metodos.map((m, i) => `   ${i + 1}) ${m ? nombreMetodo(m) : 'sin elegir método'}`).join('\n');
    }
    return linea;
  }).join('\n');
  const mensaje = `¡Hola! Soy ${nombre} y quiero hacer este pedido en Café Pandora:\n\n${detalle}\n\nTotal: ${fmt(total)}${notas ? '\n\nNotas: ' + notas : ''}`;
  const linkWa = `https://wa.me/${NUMERO_WHATSAPP}?text=${encodeURIComponent(mensaje)}`;

  document.getElementById('pantallaFinal').innerHTML = `
    <div class="confirmacion">
      <div class="check">✅</div>
      <h2>¡Pedido recibido!</h2>
      <p>Dale al botón para confirmarlo por WhatsApp y coordinar contigo la entrega y el pago.</p>
      <a class="wa" href="${linkWa}" target="_blank" rel="noopener">📲 Confirmar por WhatsApp</a>
    </div>`;
}

function mostrarToast(msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2800);
}

cargarCatalogo();
</script>
