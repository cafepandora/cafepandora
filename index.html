/* ================================================================
   COSECHA & TUESTE (trazabilidad)
   Cierra el ciclo del inventario: todo lo demás resta stock,
   el tueste es lo único que suma.
================================================================ */
let trazaSubTab = 'cosechas';
function cambiarTrazaSubTab(t) { trazaSubTab = t; renderTrazabilidad(); }

function renderTrazabilidad() {
  const cont = document.getElementById('view-trazabilidad');
  if (!cont) return;

  // --- Proyección global: qué café se espera tener ---
  const cosechasPend = state.cosechas.filter(c => c.kilosPergaminoReal == null);
  const pergaminoDeCosechas = state.cosechas.reduce((s, c) =>
    s + (c.kilosPergaminoReal != null ? Number(c.kilosPergaminoReal) : proyectarDesdeCereza(c.kilosCereza).pergamino), 0);
  const pergaminoComprado = state.pergamino.reduce((s, p) => s + Number(p.kilosPergamino || 0), 0);
  const pergaminoTotal = pergaminoDeCosechas + pergaminoComprado;
  const proy = proyectarDesdePergamino(pergaminoTotal);
  const yaTostado = state.tuestes.reduce((s, t) => s + Number(t.kilosTostado || 0), 0);

  cont.innerHTML = `
    <div class="stat-grid">
      <div class="stat"><div class="n">${pergaminoTotal.toFixed(1)} kg</div><div class="l">Pergamino acumulado (finca + comprado)</div></div>
      <div class="stat"><div class="n">${proy.verde.toFixed(1)} kg</div><div class="l">Verde esperado al trillar</div></div>
      <div class="stat"><div class="n pos">${Math.round(proy.libras)}</div><div class="l">Libras de 500 g esperadas</div></div>
      <div class="stat"><div class="n">${yaTostado.toFixed(1)} kg</div><div class="l">Ya tostado a la fecha</div></div>
    </div>

    ${panelRendimientos()}

    <div class="subtabs">
      <button class="${trazaSubTab==='cosechas'?'active':''}" onclick="cambiarTrazaSubTab('cosechas')">Cosechas (${state.cosechas.length})</button>
      <button class="${trazaSubTab==='comprado'?'active':''}" onclick="cambiarTrazaSubTab('comprado')">Comprado (${state.pergamino.length})</button>
      <button class="${trazaSubTab==='tueste'?'active':''}" onclick="cambiarTrazaSubTab('tueste')">Tueste (${state.tuestes.length})</button>
    </div>

    ${trazaSubTab === 'cosechas' ? vistaCosechas(cosechasPend) : ''}
    ${trazaSubTab === 'comprado' ? vistaPergamino() : ''}
    ${trazaSubTab === 'tueste' ? vistaTueste() : ''}
  `;
}

/* ---------- Panel de rendimientos ---------- */
function panelRendimientos() {
  const r = rendimientosReales();
  const fila = (titulo, d, formato) => {
    const aprendido = d.real != null;
    return `
      <div class="rend-fila">
        <div class="rend-nombre">${titulo}</div>
        <div class="rend-valor ${aprendido ? 'aprendido' : ''}">${formato(d.valor)}</div>
        <div class="rend-estado">${aprendido
          ? `<span class="badge-real">Tuyo</span> ${d.muestras} registro${d.muestras===1?'':'s'} · genérico era ${formato(d.generico)}`
          : `<span class="badge-gen">Genérico</span> faltan ${d.faltan} registro${d.faltan===1?'':'s'} para calcular el tuyo`}</div>
      </div>`;
  };
  const pct = v => (v * 100).toFixed(1) + '%';
  return `
    <div class="rend-card">
      <h4>Rendimientos de tu café</h4>
      <p class="rend-intro">Las proyecciones usan tus datos reales apenas hay suficientes registros. Mientras tanto, usan el estimado genérico.</p>
      ${fila('Cereza → pergamino', r.cerezaAPergamino, pct)}
      ${fila('Pergamino → verde', r.pergaminoAVerde, pct)}
      ${fila('Merma de tueste', r.mermaTueste, pct)}
    </div>`;
}

/* ---------- Cosechas ---------- */
function vistaCosechas(pendientes) {
  const hoy = Date.now();
  const listas = pendientes.filter(c => fechaSecadoEstimada(c.fecha, c.proceso).getTime() <= hoy);

  return `
    <div class="card">
      <h3 class="section-title" style="margin-top:0">Registrar cosecha</h3>
      <div class="row">
        <div class="field"><label>Fecha de recolección</label>
          <input id="co-fecha" type="date" value="${hoyISO()}"></div>
        <div class="field"><label>Kilos en cereza</label>
          <input id="co-kilos" type="number" min="0" step="0.1" placeholder="0" oninput="previsualizarCosecha()"></div>
        <div class="field"><label>Proceso</label>
          <select id="co-proceso" onchange="previsualizarCosecha()">${LOTES.map(l => `<option>${l}</option>`).join('')}</select></div>
      </div>
      <div id="co-preview" class="preview-cadena"></div>
      <div class="row"><div class="field"><label>Notas</label>
        <input id="co-notas" placeholder="Lote, sector de la finca, observaciones…"></div></div>
      <button class="add-btn" onclick="registrarCosecha(this)">Registrar cosecha</button>
    </div>

    ${listas.length ? `<div id="stockAlert" style="display:block;background:var(--verde-bg);border-color:var(--verde);color:var(--verde)">
      ✅ ${listas.length} cosecha${listas.length===1?'':'s'} ya deberían estar secas — pesa el pergamino y anótalo con el botón ⚖️
    </div>` : ''}

    <h3 class="section-title">Historial de cosechas</h3>
    <div class="ledger">
      ${paginar(state.cosechas.slice().sort((a,b)=>b.fecha-a.fecha), 'cosechas', c => {
        const p = proyectarDesdeCereza(c.kilosCereza);
        const seco = fechaSecadoEstimada(c.fecha, c.proceso);
        const yaSeco = seco.getTime() <= Date.now();
        const real = c.kilosPergaminoReal != null;
        return `
        <div class="ledger-row">
          <div class="main">
            <div class="title">${Number(c.kilosCereza).toFixed(1)} kg cereza · ${escapeHtml(c.proceso)}</div>
            <div class="meta">Cosechado ${fechaCorta(c.fecha)} · ${real
              ? 'pergamino real: ' + Number(c.kilosPergaminoReal).toFixed(1) + ' kg'
              : (yaSeco ? 'secado estimado listo' : 'seco aprox. ' + fechaCorta(seco.getTime()))}</div>
            <div class="details">${c.kilosVerdeReal > 0
              ? `Verde real tras trillar: <b>${Number(c.kilosVerdeReal).toFixed(1)} kg</b>`
              : `≈ ${p.pergamino.toFixed(1)} kg pergamino → ${p.verde.toFixed(1)} kg verde → ${Math.round(p.libras)} libras`}</div>
          </div>
          <div class="acciones">
            <button onclick="abrirPesarPergamino(${c.id})" title="Anotar pergamino real">⚖️</button>
            ${real ? `<button onclick="abrirTrilla('cosecha', ${c.id})" title="Anotar verde tras trillar">🌾</button>` : ''}
            <button onclick="eliminarCosecha(${c.id})" title="Eliminar">✕</button>
          </div>
        </div>`;
      }, 'Todavía no hay cosechas registradas.')}
    </div>`;
}

function previsualizarCosecha() {
  const el = document.getElementById('co-preview');
  if (!el) return;
  const kg = Number(document.getElementById('co-kilos').value) || 0;
  const proceso = document.getElementById('co-proceso').value;
  if (!kg) { el.innerHTML = ''; return; }
  const p = proyectarDesdeCereza(kg);
  const seco = fechaSecadoEstimada(Date.now(), proceso);
  el.innerHTML = `
    <div class="cadena">
      <span><b>${kg.toFixed(1)}</b> kg cereza</span><i>→</i>
      <span><b>${p.pergamino.toFixed(1)}</b> kg pergamino</span><i>→</i>
      <span><b>${p.verde.toFixed(1)}</b> kg verde</span><i>→</i>
      <span><b>${p.tostado.toFixed(1)}</b> kg tostado</span><i>=</i>
      <span class="destacado"><b>${Math.round(p.libras)}</b> libras</span>
    </div>
    <div class="cadena-nota">Secado estimado para el ${seco.toLocaleDateString('es-CO', { day:'2-digit', month:'long' })} (${DIAS_SECADO[proceso]} días de ${proceso})</div>`;
}

async function registrarCosecha(btn) {
  const kilosCereza = Number(document.getElementById('co-kilos').value) || 0;
  if (!kilosCereza) return toast('Escribe cuántos kilos de cereza se cosecharon.', 'error');
  btn.disabled = true;
  try {
    const payload = {
      fecha: new Date(document.getElementById('co-fecha').value + 'T12:00:00').getTime(),
      kilosCereza,
      proceso: document.getElementById('co-proceso').value,
      notas: document.getElementById('co-notas').value.trim() || null,
      usuario: localStorage.getItem('cp_usuario') || 'Equipo',
    };
    const res = await apiFetch('/api/cosechas', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
    state.cosechas.push(await res.json());
    guardarCacheLocal('cosechas');
    toast('Cosecha registrada');
    renderTrazabilidad();
  } finally { btn.disabled = false; }
}

function abrirPesarPergamino(id) {
  const c = state.cosechas.find(x => x.id === id); if (!c) return;
  const p = proyectarDesdeCereza(c.kilosCereza);
  abrirModal(`
    <h3>Pergamino real de la cosecha</h3>
    <p style="font-size:13px;color:var(--cafe-soft);margin-top:-6px">
      ${Number(c.kilosCereza).toFixed(1)} kg de cereza del ${fechaCorta(c.fecha)} · estimado ${p.pergamino.toFixed(1)} kg</p>
    <div class="row"><div class="field"><label>Kilos de pergamino seco (pesados)</label>
      <input id="pp-kilos" type="number" min="0" step="0.1" value="${c.kilosPergaminoReal ?? p.pergamino.toFixed(1)}"></div></div>
    <div class="modal-actions">
      <button class="add-btn" onclick="guardarPergaminoReal(${id}, this)">Guardar</button>
      <button class="sec-btn" onclick="cerrarModal()">Cancelar</button>
    </div>`);
}

async function guardarPergaminoReal(id, btn) {
  btn.disabled = true;
  const kilosPergaminoReal = Math.max(0, Number(document.getElementById('pp-kilos').value) || 0);
  const c = state.cosechas.find(x => x.id === id);
  if (c) c.kilosPergaminoReal = kilosPergaminoReal;
  guardarCacheLocal('cosechas');
  cerrarModal();
  renderTrazabilidad();
  await apiFetch('/api/cosechas/' + id, { method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ kilosPergaminoReal }) });
  toast('Pergamino real anotado');
}

async function eliminarCosecha(id) {
  if (!confirm('¿Eliminar este registro de cosecha?')) return;
  state.cosechas = state.cosechas.filter(x => x.id !== id);
  guardarCacheLocal('cosechas'); renderTrazabilidad();
  await apiFetch('/api/cosechas/' + id, { method:'DELETE' });
}

/* ---------- Anotar el verde real tras trillar ---------- */
function abrirTrilla(tipo, id) {
  const esCosecha = tipo === 'cosecha';
  const reg = esCosecha ? state.cosechas.find(x => x.id === id) : state.pergamino.find(x => x.id === id);
  if (!reg) return;
  const pergamino = esCosecha ? Number(reg.kilosPergaminoReal) : Number(reg.kilosPergamino);
  const r = rendimientosReales();
  const estimado = pergamino * r.pergaminoAVerde.valor;

  abrirModal(`
    <h3>Café verde después de trillar</h3>
    <p style="font-size:13px;color:var(--cafe-soft);margin-top:-6px">
      Entraron ${pergamino.toFixed(1)} kg de pergamino · estimado ${estimado.toFixed(1)} kg de verde</p>
    <div class="row"><div class="field"><label>Kilos de verde (pesados)</label>
      <input id="tr-kilos" type="number" min="0" step="0.1" value="${reg.kilosVerdeReal ?? estimado.toFixed(1)}"></div></div>
    <p style="font-size:12.5px;color:var(--cafe-soft)">Con este dato la app calcula el rendimiento real de trilla de tu café.</p>
    <div class="modal-actions">
      <button class="add-btn" onclick="guardarTrilla('${tipo}', ${id}, this)">Guardar</button>
      <button class="sec-btn" onclick="cerrarModal()">Cancelar</button>
    </div>`);
}

async function guardarTrilla(tipo, id, btn) {
  btn.disabled = true;
  const kilosVerdeReal = Math.max(0, Number(document.getElementById('tr-kilos').value) || 0);
  const esCosecha = tipo === 'cosecha';
  const lista = esCosecha ? state.cosechas : state.pergamino;
  const reg = lista.find(x => x.id === id);
  if (reg) reg.kilosVerdeReal = kilosVerdeReal;
  guardarCacheLocal(esCosecha ? 'cosechas' : 'pergamino');
  cerrarModal();
  renderTrazabilidad();
  await apiFetch('/api/' + (esCosecha ? 'cosechas' : 'pergamino') + '/' + id, {
    method: 'PATCH', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ kilosVerdeReal }),
  });
  toast('Verde real anotado · rendimiento actualizado');
}

    toast('Compra registrada');

  } finally { btn.disabled = false; }
}

async function eliminarPergamino(id) {

  guardarCacheLocal('pergamino'); renderTrazabilidad();

}

function previsualizarTueste(manual) {
  const el = document.getElementById('tu-preview');
  if (!el) return;
  const verde = Number(document.getElementById('tu-verde').value) || 0;
  const campoTostado = document.getElementById('tu-tostado');
  // Si no has escrito el peso real de salida, se propone el teórico (merma 13%).
  if (!manual && verde) campoTostado.value = (verde * (1 - RENDIMIENTO.mermaTueste)).toFixed(1);
  const tostado = Number(campoTostado.value) || 0;
  if (!verde && !tostado) { el.innerHTML = ''; return; }
  const merma = verde > 0 ? (1 - tostado / verde) * 100 : 0;
  const fueraDeRango = verde > 0 && (merma < 8 || merma > 22);
  el.innerHTML = `
    <div class="cadena">
      <span><b>${verde.toFixed(1)}</b> kg verde</span><i>→</i>
      <span><b>${tostado.toFixed(1)}</b> kg tostado</span><i>=</i>
      <span class="destacado"><b>${Math.round(tostado / KG_POR_LIBRA_VENTA)}</b> libras</span>
    </div>
    <div class="cadena-nota${fueraDeRango ? ' alerta' : ''}">Merma: ${merma.toFixed(1)}%${fueraDeRango ? ' — revisa los pesos, lo normal ronda el 13%' : ''}</div>`;
}

async function registrarTueste(btn) {
  const kilosVerde = Number(document.getElementById('tu-verde').value) || 0;
  if (!kilosVerde) return toast('Escribe cuántos kilos de verde entraron.', 'error');
  const tostadoTexto = document.getElementById('tu-tostado').value;
  const kilosTostado = tostadoTexto === '' ? null : Number(tostadoTexto) || 0;
  if (kilosTostado != null && kilosTostado > kilosVerde) return toast('El tostado no puede pesar más que el verde.', 'error');
  btn.disabled = true;
  try {
    const payload = {
      fecha: new Date(document.getElementById('tu-fecha').value + 'T12:00:00').getTime(),
      lote: document.getElementById('tu-lote').value,
      kilosVerde, kilosTostado,
      origen: document.getElementById('tu-origen').value,
      notasCata: document.getElementById('tu-notas').value.trim() || null,
      usuario: localStorage.getItem('cp_usuario') || 'Equipo',
    };
    const res = await apiFetch('/api/tuestes', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
    state.tuestes.push(await res.json());
    guardarCacheLocal('tuestes');
    toast(kilosTostado != null ? `Tueste registrado · +${kilosTostado.toFixed(1)} kg al inventario` : 'Entrada de verde registrada — anota la salida con 🔥 cuando la sepas');
    await sincronizar(); // trae el inventario ya actualizado
  } finally { btn.disabled = false; }
}

/* ---------- Anotar la salida del tueste (después, cuando se sepa) ---------- */
function abrirSalidaTueste(id) {
  const t = state.tuestes.find(x => x.id === id); if (!t) return;
  const esLavado = t.lote === 'Lavado';
  abrirModal(`
    <h3>Salida del tueste — ${escapeHtml(t.lote)}</h3>
    <p style="font-size:13px;color:var(--cafe-soft);margin-top:-6px">Entraron ${Number(t.kilosVerde).toFixed(1)} kg de verde el ${fechaCorta(t.fecha)}.</p>
    ${esLavado ? `
      <div class="row">
        <div class="field"><label>Tostión Media (kg)</label><input id="ts-media" type="number" min="0" step="0.1" value="${t.kilosTostadoMedia ?? ''}" oninput="previsualizarSalidaTueste(${id})"></div>
        <div class="field"><label>Tostión Media alta (kg)</label><input id="ts-media-alta" type="number" min="0" step="0.1" value="${t.kilosTostadoMediaAlta ?? ''}" oninput="previsualizarSalidaTueste(${id})"></div>
      </div>
    ` : `
      <div class="row"><div class="field"><label>Kilos tostados</label><input id="ts-total" type="number" min="0" step="0.1" value="${t.kilosTostado ?? ''}" oninput="previsualizarSalidaTueste(${id})"></div></div>

}

function previsualizarSalidaTueste(id) {
  const t = state.tuestes.find(x => x.id === id); if (!t) return;
  const esLavado = t.lote === 'Lavado';
  const total = esLavado
    ? (Number(document.getElementById('ts-media')?.value) || 0) + (Number(document.getElementById('ts-media-alta')?.value) || 0)
    : Number(document.getElementById('ts-total')?.value) || 0;
  const el = document.getElementById('ts-preview'); if (!el) return;
  if (!total) { el.innerHTML = ''; return; }
  const merma = t.kilosVerde > 0 ? (1 - total / t.kilosVerde) * 100 : 0;
  const fueraDeRango = merma < 8 || merma > 22;
  el.innerHTML = `
    <div class="cadena"><span><b>${total.toFixed(1)}</b> kg tostado</span><i>=</i><span class="destacado"><b>${Math.round(total / KG_POR_LIBRA_VENTA)}</b> libras</span></div>
    <div class="cadena-nota${fueraDeRango ? ' alerta' : ''}">Merma: ${merma.toFixed(1)}%${fueraDeRango ? ' — revisa los pesos, lo normal ronda el 13%' : ''}</div>`;
}

async function guardarSalidaTueste(id, btn) {
  const t = state.tuestes.find(x => x.id === id); if (!t) return;
  const esLavado = t.lote === 'Lavado';
  btn.disabled = true;
  try {
    let payload, nuevoTotal;
    if (esLavado) {
      const media = Math.max(0, Number(document.getElementById('ts-media').value) || 0);
      const mediaAlta = Math.max(0, Number(document.getElementById('ts-media-alta').value) || 0);
      nuevoTotal = media + mediaAlta;
      payload = { kilosTostadoMedia: media, kilosTostadoMediaAlta: mediaAlta };
    } else {
      nuevoTotal = Math.max(0, Number(document.getElementById('ts-total').value) || 0);
      payload = { kilosTostado: nuevoTotal };
    }
    if (!nuevoTotal) return toast('Escribe cuánto salió tostado.', 'error');
    if (nuevoTotal > t.kilosVerde) return toast('El tostado no puede pesar más que el verde.', 'error');

    const res = await apiFetch('/api/tuestes/' + id, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    const actualizado = await res.json();
    Object.assign(t, actualizado);
    guardarCacheLocal('tuestes');
    cerrarModal();
    toast('Salida anotada · inventario actualizado');
    await sincronizar();
  } finally { btn.disabled = false; }
}

async function eliminarTueste(id) {
  if (!confirm('¿Eliminar este tueste? Los kilos que sumó se descuentan del inventario.')) return;
  state.tuestes = state.tuestes.filter(x => x.id !== id);
  guardarCacheLocal('tuestes'); renderTrazabilidad();
  await apiFetch('/api/tuestes/' + id, { method:'DELETE' });
  sincronizar();
}

/* ================================================================
   GRÁFICOS DEL RESUMEN (Chart.js)
================================================================ */
let rangoMeses = 6;
const graficos = {};
function cambiarRango(n) { rangoMeses = n; renderResumen(); }

/* ================================================================
   MEJORES CLIENTES
   Solo aparecen los clientes que llevan 2 o más meses distintos
   comprando — un cliente de una sola vez todavía no es un patrón.
================================================================ */
let periodoClientes = 'mes';
const MIN_MESES_CLIENTE = 2;
function cambiarPeriodoClientes(p) { periodoClientes = p; renderResumen(); }

// Cuántos kilos de café lleva una venta (ignora las líneas de maquila).
function kilosDeVenta(v) {
  if (v.items && v.items.length && v.items[0] && v.items[0].tipo) {
    return v.items.filter(it => it.tipo === 'cafe' && it.presentacion)
      .reduce((s, it) => s + (KG_PRESENTACION[it.presentacion] || 0) * (Number(it.cantidad) || 0), 0);
  }
  if (v.tipoVenta !== 'maquila' && v.presentacion) {
    return (KG_PRESENTACION[v.presentacion] || 0) * (Number(v.cantidad) || 1);
  }
  return 0;
}
const KG_PRESENTACION = { 'Media lb': 0.25, 'Libra': 0.5, 'Kilo': 1, 'Cuarterón': 2.5 };

// Cuántos periodos (semanas/meses/años) distintos cubre el historial de un
// cliente — sirve para promediar "por periodo" y no por compra suelta.
function clavePeriodo(ts, periodo) {
  const d = new Date(Number(ts));
  if (periodo === 'ano') return String(d.getFullYear());
  if (periodo === 'mes') return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  // semana ISO aproximada: año + número de semana
  const inicio = new Date(d.getFullYear(), 0, 1);
  const semana = Math.ceil((((d - inicio) / 86400000) + inicio.getDay() + 1) / 7);
  return d.getFullYear() + '-S' + String(semana).padStart(2, '0');
}

function renderMejoresClientes() {
  const cont = document.getElementById('bloqueMejoresClientes');
  if (!cont) return;

  const candidatos = listaClientes()
    .filter(c => c.compras > 0)
    .map(c => {
      const ventas = state.ventas.filter(v => normalizar(v.cliente) === normalizar(c.nombre));
      const mesesDistintos = new Set(ventas.map(v => mesDe(v.ts))).size;
      const periodos = new Set(ventas.map(v => clavePeriodo(v.ts, periodoClientes))).size || 1;
      const dinero = ventas.reduce((s, v) => s + (Number(v.valor) || 0), 0);
      const kilos = ventas.reduce((s, v) => s + kilosDeVenta(v), 0);
      return {
        nombre: c.nombre, mesesDistintos, compras: ventas.length,
        dineroTotal: dinero, kilosTotal: kilos,
        dineroProm: dinero / periodos, kilosProm: kilos / periodos,
      };
    })
    .filter(c => c.mesesDistintos >= MIN_MESES_CLIENTE)
    .sort((a, b) => b.dineroProm - a.dineroProm)
    .slice(0, 8);

  if (!candidatos.length) {
    cont.innerHTML = `<div class="empty">Todavía no hay clientes con ${MIN_MESES_CLIENTE} o más meses de compras.<br>Esta tabla se llena sola a medida que se repitan.</div>`;
    graficos.clientes?.destroy();
    graficos.clientes = null;
    return;
  }

  const etiqueta = { semana: 'por semana', mes: 'por mes', ano: 'por año' }[periodoClientes];
  cont.innerHTML = `
    <div class="chart-card">
      <h4>Promedio de compra ${etiqueta}</h4>
      <div class="chart-box"><canvas id="chartClientes"></canvas></div>
    </div>
    <div class="tabla-clientes">
      <div class="fila-cliente encabezado">
        <span>Cliente</span><span>Compras</span><span>Prom. ${etiqueta}</span><span>Kg ${etiqueta}</span>
      </div>
      ${candidatos.map(c => `
        <div class="fila-cliente" style="cursor:pointer" onclick="abrirFichaCliente('${escapeAttr(c.nombre).replace(/'/g,"\\'")}')">
          <span class="nombre">${escapeHtml(c.nombre)}</span>
          <span>${c.compras}</span>
          <span class="dinero">${fmt(c.dineroProm)}</span>
          <span>${c.kilosProm.toFixed(2)} kg</span>
        </div>`).join('')}
    </div>`;

  if (typeof Chart === 'undefined') return;
  const css = getComputedStyle(document.documentElement);
  graficos.clientes?.destroy();
  graficos.clientes = new Chart(document.getElementById('chartClientes'), {
    type: 'bar',
    data: {
      labels: candidatos.map(c => c.nombre),
      datasets: [{
        label: 'Promedio ' + etiqueta,
        data: candidatos.map(c => Math.round(c.dineroProm)),
        backgroundColor: css.getPropertyValue('--verde').trim(),
        borderRadius: 6, maxBarThickness: 34,
      }],
    },
    options: {
      indexAxis: 'y', responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: {
          label: c => '$' + Math.round(c.parsed.x).toLocaleString('es-CO'),

// Devuelve las claves de mes ('2026-09') hacia atrás desde el mes elegido.
function mesesDelRango(mesBase, cantidad) {
  const [a, m] = mesBase.split('-').map(Number);
  const out = [];
  for (let i = cantidad - 1; i >= 0; i--) {
    const d = new Date(a, m - 1 - i, 1);
    out.push(d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'));
  }
  return out;
}
const etiquetaMes = clave => {
  const [a, m] = clave.split('-').map(Number);
  return new Date(a, m - 1, 1).toLocaleDateString('es-CO', { month: 'short', year: '2-digit' });
};

function dibujarGraficos(mesBase) {
  if (typeof Chart === 'undefined') return; // si el CDN no cargó, la app sigue funcionando igual
  const meses = mesesDelRango(mesBase, rangoMeses);
  const css = getComputedStyle(document.documentElement);
  const verde = css.getPropertyValue('--verde').trim();
  const terracota = css.getPropertyValue('--terracota').trim();
  const cafe = css.getPropertyValue('--cafe').trim();
  const linea = css.getPropertyValue('--linea').trim();
  Chart.defaults.font.family = "'Outfit', sans-serif";
  Chart.defaults.font.size = 13;
  Chart.defaults.color = css.getPropertyValue('--cafe-soft').trim();

  const dinero = v => '$' + Math.round(v).toLocaleString('es-CO');
  const ejeDinero = {
    grid: { color: linea }, border: { display: false },
    ticks: { callback: v => v >= 1000000 ? (v/1000000).toFixed(1)+'M' : (v/1000).toFixed(0)+'k' }
  };

  // --- 1. Ingresos cobrados vs egresos, mes a mes ---
  const ingresos = meses.map(mm => state.ventas
    .filter(v => mesDe(v.ts) === mm && v.estado === 'Pagado')
    .reduce((s, v) => s + (Number(v.valor) || 0), 0));
  const egresos = meses.map(mm =>
    state.gastos.filter(g => mesDe(g.ts) === mm).reduce((s, g) => s + (Number(g.monto) || 0), 0) +
    state.finca.filter(f => mesDe(f.ts) === mm).reduce((s, f) => s + (Number(f.monto) || 0), 0));

  graficos.flujo?.destroy();
  graficos.flujo = new Chart(document.getElementById('chartFlujo'), {
    type: 'bar',
    data: {
      labels: meses.map(etiquetaMes),
      datasets: [
        { label: 'Cobrado', data: ingresos, backgroundColor: verde, borderRadius: 6, maxBarThickness: 34 },
        { label: 'Egresos', data: egresos, backgroundColor: terracota, borderRadius: 6, maxBarThickness: 34 },
      ],
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { position: 'bottom', labels: { boxWidth: 12, usePointStyle: true, pointStyle: 'circle', padding: 16 } },
        tooltip: { callbacks: { label: c => c.dataset.label + ': ' + dinero(c.parsed.y) } },
      },
      scales: { x: { grid: { display: false }, border: { display: false } }, y: ejeDinero },
    },
  });

  // --- 2. Egresos por categoría (gastos + finca juntos) en todo el rango ---
  const porCategoria = {};
  state.gastos.filter(g => meses.includes(mesDe(g.ts)))
    .forEach(g => { porCategoria[g.categoria || 'Otro'] = (porCategoria[g.categoria || 'Otro'] || 0) + (Number(g.monto) || 0); });
  state.finca.filter(f => meses.includes(mesDe(f.ts)))
    .forEach(f => { const k = 'Finca: ' + (f.categoria || 'Otro'); porCategoria[k] = (porCategoria[k] || 0) + (Number(f.monto) || 0); });
  const catOrdenadas = Object.entries(porCategoria).sort((a, b) => b[1] - a[1]);
  const paleta = ['#AD4B31', '#4A6B48', '#8A6A1F', '#3E2723', '#8A7A70', '#C97B5A', '#6E8B6B', '#B99C5B', '#5A4038', '#A8998E'];

  graficos.categorias?.destroy();
  graficos.categorias = new Chart(document.getElementById('chartCategorias'), {
    type: 'doughnut',
    data: {
      labels: catOrdenadas.map(([k]) => k),
      datasets: [{ data: catOrdenadas.map(([, v]) => v), backgroundColor: catOrdenadas.map((_, i) => paleta[i % paleta.length]), borderWidth: 0 }],
    },
    options: {
      responsive: true, maintainAspectRatio: false, cutout: '58%',
      plugins: {
        legend: { position: 'right', labels: { boxWidth: 10, usePointStyle: true, pointStyle: 'circle', padding: 10, font: { size: 12 } } },
        tooltip: { callbacks: { label: c => c.label + ': ' + dinero(c.parsed) } },
      },
    },
  });

  // --- 3. Ventas por lote de café en todo el rango ---
  const porLoteRango = {};
  state.ventas.filter(v => meses.includes(mesDe(v.ts)))
    .forEach(v => lotesDeVenta(v).forEach(([lote, val]) => { porLoteRango[lote] = (porLoteRango[lote] || 0) + (Number(val) || 0); }));
  const lotesOrdenados = Object.entries(porLoteRango).sort((a, b) => b[1] - a[1]);

  graficos.lotes?.destroy();
  graficos.lotes = new Chart(document.getElementById('chartLotes'), {
    type: 'bar',
    data: {
      labels: lotesOrdenados.map(([k]) => k),
      datasets: [{ label: 'Ventas', data: lotesOrdenados.map(([, v]) => v), backgroundColor: cafe, borderRadius: 6, maxBarThickness: 40 }],
    },
    options: {
      indexAxis: 'y',
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => dinero(c.parsed.x) } } },
      scales: { x: ejeDinero, y: { grid: { display: false }, border: { display: false } } },
    },
  });
}

/* ---------- Ficha de cliente: todo su historial en un solo lugar ---------- */
function abrirFichaCliente(nombre) {
  const ventas = state.ventas.filter(v => normalizar(v.cliente) === normalizar(nombre)).sort((a, b) => b.ts - a.ts);
  const total = ventas.reduce((s, v) => s + (Number(v.valor) || 0), 0);
  const cobrado = ventas.filter(v => v.estado === 'Pagado').reduce((s, v) => s + (Number(v.valor) || 0), 0);
  const porCobrar = total - cobrado;
  const meses = new Set(ventas.map(v => mesDe(v.ts))).size;
  const pref = ultimaPreferenciaCafe(nombre);

  abrirModal(`
    <h3>${escapeHtml(nombre)}</h3>
    <div class="stat-grid" style="margin-bottom:14px">
      <div class="stat"><div class="n">${ventas.length}</div><div class="l">Compras (${meses} mes${meses===1?'':'es'} distintos)</div></div>
      <div class="stat"><div class="n">${fmt(total)}</div><div class="l">Total histórico</div></div>
      <div class="stat"><div class="n pos">${fmt(cobrado)}</div><div class="l">Cobrado</div></div>
      <div class="stat"><div class="n ${porCobrar>0?'neg':''}">${fmt(porCobrar)}</div><div class="l">Por cobrar</div></div>
    </div>
    ${pref ? `<p style="font-size:13px;color:var(--cafe-soft);margin-top:-6px">Suele pedir: <b>${escapeHtml(pref.lote)}</b>${pref.molienda ? ', ' + escapeHtml(pref.molienda) : ''}${pref.tueste ? ', Tostión ' + escapeHtml(pref.tueste) : ''}</p>` : ''}

    <h3 class="section-title">Historial de compras</h3>
    <div class="ledger">
      ${ventas.length ? ventas.slice(0, 30).map(v => `
        <div class="ledger-row">
          <div class="main">
            <div class="title">${new Date(Number(v.ts)).toLocaleDateString('es-CO')} ${v.origenWeb ? '<span class="badge-web">🌐</span>' : ''}</div>
            <div class="details">${escapeHtml(detalleVenta(v))}</div>
          </div>
          <span class="tag ${v.estado === 'Pagado' ? 'pagado' : 'pendiente'}">${v.estado}</span>
          <div class="amount pos">${fmt(v.valor)}</div>
        </div>`).join('') : '<div class="empty">Sin compras todavía.</div>'}
      ${ventas.length > 30 ? `<div class="empty">… y ${ventas.length - 30} compras más antiguas.</div>` : ''}
    </div>
    <div class="modal-actions">
      <button class="sec-btn" style="flex:1" onclick="cerrarModal()">Cerrar</button>
    </div>
  `);
}

function abrirRenombrarCliente(nombreActual) {

    <p style="font-size:13px;color:var(--cafe-soft);margin-top:-6px">Se actualiza en todas las ventas que tengan este nombre. Si escribes el nombre de otro cliente ya existente, los dos quedan unificados en uno solo.</p>
    <div class="row"><div class="field"><label>Nombre correcto</label><input id="rc-nombre" value="${escapeAttr(nombreActual)}"></div></div>
    <div class="modal-actions">
      <button class="add-btn" onclick="guardarRenombreCliente('${escapeAttr(nombreActual).replace(/'/g,"\\'")}', this)">Guardar</button>

    </div>
  `);
}

async function guardarRenombreCliente(nombreActual, btn) {
  const nuevo = document.getElementById('rc-nombre').value.trim();
  if (!nuevo) return toast('Escribe un nombre.', 'error');
  btn.disabled = true;
  const variantes = variantesDeCliente(nombreActual);
  try {
    const res = await apiFetch('/api/clientes-unificar', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ valoresViejos: variantes, nombreNuevo: nuevo }),
    });
    if (!res.ok) throw new Error();
    cerrarModal();
    toast('Cliente actualizado');
    await sincronizar();
  } catch {
    toast('No se pudo renombrar. Intenta de nuevo.', 'error');
  } finally {
    btn.disabled = false;
  }
}
async function guardarPrecioCafe(id) {
  const precio = Number(document.getElementById('pc-' + id).value) || 0;
  const p = state.preciosCafe.find(x => x.id === id); if (p) p.precio = precio;
  guardarCacheLocal('preciosCafe');
  await apiFetch('/api/precios-cafe/' + id, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ precio }) });
}
async function guardarTarifa(id) {
  const precio = Number(document.getElementById('tar-' + id).value) || 0;
  const m = state.maquila.find(x => x.id === id); m.precio = precio;
  guardarCacheLocal('maquila');
  await apiFetch('/api/maquila/' + id, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ precio }) });
}

================================================================ */
function toast(mensaje, tipo) {
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast' + (tipo === 'error' ? ' error' : '');

}

  const HEAD = v => ({ v, s: 'head' });

  /* ---------- 1) Resumen mensual: todo el negocio, mes a mes ---------- */
  const meses = [...new Set([
    ...state.ventas.map(v => mesDe(v.ts)),
    ...state.gastos.map(g => mesDe(g.ts)),
    ...state.finca.map(f => mesDe(f.ts)),

  const hojaResumen = {

    rows: [
      [HEAD('Lote'), HEAD('Stock (kg)'), HEAD('Alerta')],
      ...state.inventario.map(i => [i.lote, NUM2(i.stockLb), Number(i.stockLb) < 5 ? 'Bajo (<5 kg)' : 'Normal']),
    ],
  };

  /* ---------- 7) Rendimientos y mermas reales ---------- */
  const r = rendimientosReales();
  const hojaMermas = {
    name: 'Mermas y rendimientos',
    cols: [26, 16, 16, 16, 30],
    rows: [
      [HEAD('Etapa'), HEAD('Tu rendimiento'), HEAD('Genérico'), HEAD('Muestras'), HEAD('Estado')],
      ['Cereza → pergamino', PCT(r.cerezaAPergamino.valor), PCT(r.cerezaAPergamino.generico), r.cerezaAPergamino.muestras, r.cerezaAPergamino.real!=null ? 'Calculado con tus datos' : `Genérico (faltan ${r.cerezaAPergamino.faltan})`],
      ['Pergamino → verde', PCT(r.pergaminoAVerde.valor), PCT(r.pergaminoAVerde.generico), r.pergaminoAVerde.muestras, r.pergaminoAVerde.real!=null ? 'Calculado con tus datos' : `Genérico (faltan ${r.pergaminoAVerde.faltan})`],
      ['Merma de tueste', PCT(r.mermaTueste.valor), PCT(r.mermaTueste.generico), r.mermaTueste.muestras, r.mermaTueste.real!=null ? 'Calculado con tus datos' : `Genérico (faltan ${r.mermaTueste.faltan})`],
    ],
  };

  /* ---------- 8) Cosechas ---------- */
  const hojaCosechas = {
    name: 'Cosechas',
    cols: [16, 14, 14, 18, 16, 30],
    rows: [
      [HEAD('Fecha'), HEAD('Kg cereza'), HEAD('Proceso'), HEAD('Kg pergamino real'), HEAD('Kg pergamino esperado'), HEAD('Notas')],
      ...state.cosechas.slice().sort((a,b)=>b.fecha-a.fecha).map(c => {
        const p = proyectarDesdeCereza(c.kilosCereza);
        return [FECHA(c.fecha), NUM2(c.kilosCereza), c.proceso, c.kilosPergaminoReal!=null ? NUM2(c.kilosPergaminoReal) : '', NUM2(p.pergamino), c.notas || ''];
      }),
    ],
  };

  /* ---------- 9) Pergamino comprado ---------- */
  const hojaPergamino = {
    name: 'Pergamino comprado',
    cols: [16, 22, 14, 14, 16, 14],
    rows: [
      [HEAD('Fecha'), HEAD('Proveedor'), HEAD('Kg pergamino'), HEAD('Proceso'), HEAD('Kg verde real'), HEAD('Costo')],
      ...state.pergamino.slice().sort((a,b)=>b.fecha-a.fecha).map(p => [FECHA(p.fecha), p.proveedor || '', NUM2(p.kilosPergamino), p.proceso, p.kilosVerdeReal!=null ? NUM2(p.kilosVerdeReal) : '', MONEY(p.costo)]),
      [],
      [BOLD('TOTAL'), null, null, null, null, MONEY_B(state.pergamino.reduce((s,p)=>s+(Number(p.costo)||0),0))],
    ],
  };

  /* ---------- 10) Tuestes ---------- */
  const hojaTuestes = {
    name: 'Tuestes',
    cols: [16, 14, 14, 14, 14, 14, 14, 14, 30],
    rows: [
      [HEAD('Fecha'), HEAD('Lote'), HEAD('Kg verde'), HEAD('Kg tostado'), HEAD('Media'), HEAD('Media alta'), HEAD('Merma'), HEAD('Origen'), HEAD('Notas de cata')],
      ...state.tuestes.slice().sort((a,b)=>b.fecha-a.fecha).map(t => {
        const tieneSalida = t.kilosTostado != null;
        const merma = tieneSalida && t.kilosVerde > 0 ? 1 - t.kilosTostado / t.kilosVerde : null;
        return [FECHA(t.fecha), t.lote, NUM2(t.kilosVerde), tieneSalida ? NUM2(t.kilosTostado) : 'pendiente',
          t.kilosTostadoMedia != null ? NUM2(t.kilosTostadoMedia) : '', t.kilosTostadoMediaAlta != null ? NUM2(t.kilosTostadoMediaAlta) : '',
          merma != null ? PCT(merma) : '', t.origen || '', t.notasCata || ''];
      }),
      [],
      [BOLD('TOTAL'), null, NUM2(state.tuestes.reduce((s,t)=>s+(Number(t.kilosVerde)||0),0)), NUM2(state.tuestes.reduce((s,t)=>s+(Number(t.kilosTostado)||0),0))],
    ],
  };

  /* ---------- 11) Mejores clientes ---------- */
  const clientesConDatos = listaClientes().filter(c => c.compras > 0).sort((a,b) => b.total - a.total);
  const hojaClientes = {
    name: 'Clientes',
    cols: [26, 12, 16, 16, 22],
    rows: [
      [HEAD('Cliente'), HEAD('Compras'), HEAD('Total comprado'), HEAD('Promedio por compra'), HEAD('Última compra')],
      ...clientesConDatos.map(c => [c.nombre, c.compras, MONEY(c.total), MONEY(c.promedio), c.ultima ? new Date(Number(c.ultima.ts)).toLocaleDateString('es-CO') : '']),
    ],
  };

  /* ---------- 12) Precios de café vigentes ---------- */
  const ordenPres = ['Media lb', 'Libra', 'Kilo', 'Cuarterón'];
  const hojaPrecios = {
    name: 'Precios de café',
    cols: [14, 16, 16, 16],
    rows: [
      [HEAD('Lote'), HEAD('Presentación'), HEAD('Precio normal'), HEAD('Precio distribuidor')],
      ...LOTES.map(lote => ordenPres.map(p => {
        const n = state.preciosCafe.find(x => x.lote === lote && x.presentacion === p && x.tipoCliente === 'normal');
        const d = state.preciosCafe.find(x => x.lote === lote && x.presentacion === p && x.tipoCliente === 'distribuidor');
        return [lote, p, MONEY(n ? n.precio : 0), MONEY(d ? d.precio : 0)];
      })).flat(),
    ],
  };

  /* ---------- 13) Tarifas de maquila vigentes ---------- */
  const hojaTarifasMaquila = {
    name: 'Tarifas maquila',
    cols: [20, 16, 16],
    rows: [
      [HEAD('Servicio'), HEAD('Presentación')  , HEAD('Precio')],
      ...state.maquila.slice().sort((a,b)=>a.servicio.localeCompare(b.servicio)).map(t => [t.servicio, t.presentacion || 'por kg', MONEY(t.precio)]),
    ],
  };

  const nombre = 'CafePandora_' + new Date().toISOString().split('T')[0] + '.xlsx';
  try {
    XLSXLite.download([
      hojaResumen, hojaVentas, hojaMaquila, hojaGastos, hojaFinca, hojaInventario,
      hojaMermas, hojaCosechas, hojaPergamino, hojaTuestes, hojaClientes,
      hojaPrecios, hojaTarifasMaquila,
    ], nombre);
    localStorage.setItem('cp_ultimo_export', String(Date.now()));
    renderRecordatorioExport();
    toast('Respaldo completo exportado');
  } catch (err) {
    toast('No se pudo generar el Excel: ' + err.message, 'error');
  }
}

/* ================================================================
   ARRANQUE
================================================================ */
function iniciarApp() {
  document.getElementById('filtroMes').value = hoyMes();
  cargarCacheLocal();
  renderTodo();
  sincronizar();
}
</script>
</body>
