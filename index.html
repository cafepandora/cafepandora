/* ================================================================
   MEJORES CLIENTES — 3 vistas con reglas distintas a propósito:
   - Semanal: el ranking de ESTA semana (lunes a lunes), sin exigir
     historial — un cliente nuevo que compró mucho esta semana sí cuenta.
   - Mensual: el ranking del mes que esté elegido arriba (filtroMes) —
     "viaja" entre meses con el mismo selector de siempre, sin exigir
     historial tampoco. Apenas se completa un mes, desde el día 1 del
     siguiente ya se puede consultar ese mes cerrado.
   - Anual: pensado como un promedio mensual de plata que deja cada
     cliente en lo que va del año — SÍ exige 2+ meses distintos (con 1
     solo mes el "promedio mensual" todavía no dice nada), y ese
     promedio se recalcula solo, sumando cada mes nuevo que se cierra.
================================================================ */
let periodoClientes = 'mes';
const MIN_MESES_ANUAL = 2;
function cambiarPeriodoClientes(p) { conservarScroll(() => { periodoClientes = p; renderResumen(); }); }

// Cuántos kilos de café lleva una venta (ignora las líneas de maquila).
function kilosDeVenta(v) {
  if (v.items && v.items.length && v.items[0] && v.items[0].tipo) {
    return v.items.filter(it => it.tipo === 'cafe' && it.presentacion)
      .reduce((s, it) => s + (KG_PRESENTACION[it.presentacion] || 0) * (Number(it.cantidad) || 0), 0);
  }
  if (v.tipoVenta !== 'maquila' && v.presentacion) {
    return (KG_PRESENTACION[v.presentacion] || 0) * (Number(v.cantidad) || 1);
  }
  return 0;
}
const KG_PRESENTACION = { 'Media lb': 0.25, 'Libra': 0.5, 'Kilo': 1, 'Cuarterón': 2.5 };

// Cuántos kilos de café, por lote, lleva una venta — igual que
// kilosDeVenta() pero sin sumar todos los lotes en un solo número, para
// poder medir qué tan rápido se vende CADA lote por separado.
function kilosDeVentaPorLote(v) {
  const out = {};
  if (v.items && v.items.length && v.items[0] && v.items[0].tipo) {
    v.items.filter(it => it.tipo === 'cafe' && it.lote && it.presentacion).forEach(it => {
      out[it.lote] = (out[it.lote] || 0) + (KG_PRESENTACION[it.presentacion] || 0) * (Number(it.cantidad) || 0);
    });
  } else if (v.tipoVenta !== 'maquila' && v.lote && v.presentacion) {
    out[v.lote] = (KG_PRESENTACION[v.presentacion] || 0) * (Number(v.cantidad) || 1);
  }
  return out;
}
// Kilos/día vendidos de un lote en los últimos DIAS_VELOCIDAD_INVENTARIO
// días — usado para proyectar cuánto dura el stock actual (ver
// renderInventario()).
function velocidadVentaLote(lote) {
  const desde = Date.now() - DIAS_VELOCIDAD_INVENTARIO * 86400000;
  const kilos = state.ventas.filter(v => v.ts >= desde)
    .reduce((s, v) => s + (kilosDeVentaPorLote(v)[lote] || 0), 0);
  return kilos / DIAS_VELOCIDAD_INVENTARIO;
}

// Margen ESTIMADO por lote, con todo el histórico (no solo el mes filtrado
// — igual que el balance de cuentas, porque lo que se vende un mes casi
// nunca es lo que se cosechó ese mismo mes, comparar mes a mes daría un
// número que no significa nada). Ingreso: suma real de lo vendido de cada
// lote. Costo: cereza comprada de ese proceso (costo real, directo) MÁS
// una porción de los gastos de finca, repartida proporcional a cuántos
// kilos de cereza propia se cosecharon de cada proceso — es una
// aproximación (la finca no separa sus gastos por proceso), no contabilidad
// exacta, así que la UI lo deja claro como "estimado".
// Precio promedio de TODO el histórico guardado de precioFnc (no por mes
// — simplificación a propósito: el margen por lote ya es "todo el
// histórico", y precioFnc rara vez cubre exactamente los mismos meses
// que cada cosecha, así que un promedio general es más honesto que
// aparentar precisión mes a mes que no se tiene) — valorado al mismo
// factor 88 que se usa para comprarle a terceros (Completar pago), por
// consistencia: es "cuánto habría costado esta cosecha si la hubiéramos
// comprado en vez de cultivarla".
function precioPromedioPergaminoPropio() {
  const hist = state.precioFnc || [];
  if (!hist.length) return 0;
  const promedioCarga = hist.reduce((s, p) => s + (Number(p.precioCarga) || 0), 0) / hist.length;
  return promedioCarga * (FACTOR_BASE_REFERENCIA / FACTOR_COMPRA_CEREZA) / 125;
}
const CLAVE_COSTO_BOLSA = { 'Media lb': 'costoBolsaMediaLb', 'Libra': 'costoBolsaLibra', 'Kilo': 'costoBolsaKilo', 'Cuarterón': 'costoBolsaCuarteron' };
function calcularMargenPorLote() {
  const cm = state.costosMargen || {};
  const ingresoPorLote = {};
  const bolsaPorLote = {};
  state.ventas.forEach(v => itemsNormalizados(v).filter(it => it.tipo === 'cafe' && it.lote).forEach(it => {
    ingresoPorLote[it.lote] = (ingresoPorLote[it.lote] || 0) + (Number(it.valor) || 0);
    const clave = CLAVE_COSTO_BOLSA[it.presentacion];
    if (clave) bolsaPorLote[it.lote] = (bolsaPorLote[it.lote] || 0) + (Number(cm[clave]) || 0) * (Number(it.cantidad) || 0);
  }));
  const kilosCosechaPorLote = {};
  let kilosCosechaTotal = 0;
  state.cosechas.forEach(c => {
    const k = Number(c.kilosCereza) || 0;
    kilosCosechaPorLote[c.proceso] = (kilosCosechaPorLote[c.proceso] || 0) + k;
    kilosCosechaTotal += k;
  });
  const costoCerezaPorLote = {};
  state.cerezaComprada.forEach(c => {
    costoCerezaPorLote[c.proceso] = (costoCerezaPorLote[c.proceso] || 0) + (Number(c.costo) || 0);
  });
  // Cosecha propia valorada "como si se hubiera comprado" — usa el
  // pergamino REAL si ya se pesó, si no la proyección genérica.
  const precioKiloPropio = precioPromedioPergaminoPropio();
  const costoCosechaPropiaPorLote = {};
  state.cosechas.forEach(c => {
    const kgPergamino = c.kilosPergaminoReal != null ? Number(c.kilosPergaminoReal) : proyectarDesdeCereza(c.kilosCereza).pergamino;
    costoCosechaPropiaPorLote[c.proceso] = (costoCosechaPropiaPorLote[c.proceso] || 0) + kgPergamino * precioKiloPropio;
  });
  const tostadoPorLote = {};
  state.tuestes.forEach(t => {
    tostadoPorLote[t.lote] = (tostadoPorLote[t.lote] || 0) + (Number(t.kilosTostado) || 0);
  });
  const totalFinca = state.finca.reduce((s, f) => s + (Number(f.monto) || 0), 0);
  return LOTES.map(lote => {
    const ingreso = ingresoPorLote[lote] || 0;
    const propKilos = kilosCosechaTotal > 0 ? (kilosCosechaPorLote[lote] || 0) / kilosCosechaTotal : 0;
    const costo = (costoCerezaPorLote[lote] || 0)
      + (costoCosechaPropiaPorLote[lote] || 0)
      + totalFinca * propKilos
      + (tostadoPorLote[lote] || 0) * (Number(cm.costoTostionKg) || 0)
      + (bolsaPorLote[lote] || 0);
    const margen = ingreso - costo;
    return { lote, ingreso, costo, margen, margenPct: ingreso > 0 ? (margen / ingreso) * 100 : null };
  }).filter(x => x.ingreso > 0 || x.costo > 0);
}

// Clientes de café con 3+ compras (ya no están "probando") que llevan
// DIAS_RIESGO_FUGA días o más sin volver a comprar — ordenados por cuánto
// le han comprado históricamente, para priorizar a quién vale más la pena
// contactar primero.
function clientesEnRiesgo() {
  const ahora = Date.now();
  return listaClientes()
    .filter(c => c.compras >= 3 && c.ultima)
    .map(c => ({ ...c, dias: Math.floor((ahora - c.ultima.ts) / 86400000) }))
    .filter(c => c.dias >= DIAS_RIESGO_FUGA)
    .sort((a, b) => b.total - a.total)
    .slice(0, 10);
}

// El lunes (00:00) de la semana a la que pertenece ts — así una "semana"
// siempre va de lunes a lunes, sin aproximaciones de semana ISO.
function inicioSemana(ts) {
  const d = new Date(Number(ts));
  d.setHours(0, 0, 0, 0);
  const diasDesdeLunes = (d.getDay() + 6) % 7; // lunes=0 … domingo=6
  d.setDate(d.getDate() - diasDesdeLunes);
  return d;
}

/* ---------- Balance de cuentas por persona (+ Efectivo) ----------
   Cuánto ha recibido cada quien (ventas + maquila ya pagadas) menos cuánto
   ha pagado (gastos, finca, café comprado) — de todo el histórico, para
   saber quién tiene plata del negocio en la mano y a quién se le debe.
   "Efectivo" es una cuenta más, la caja física: un gasto con categoría
   "Retiro de cuenta" saca plata de la cuenta bancaria de quien lo pagó
   (se descuenta de esa persona, como cualquier gasto) y esa misma plata
   entra como "recibido" a Efectivo — así un retiro no aparece como un
   gasto real del negocio, solo como un traslado entre cuentas.
   `inicial` (Configuración → "Saldo inicial de cada cuenta") se suma una
   sola vez, como punto de partida — sin eso, antes de que existiera esa
   pantalla, el balance arrancaba en $0 para todos y se veía como si el
   negocio le debiera a todo el mundo, aunque en la vida real cada uno ya
   tenía su propia plata guardada antes de usar la app. */
// Cuánto de una venta ya está efectivamente pagado. Para la mayoría de
// ventas es el valor completo (si quedó "Pagado") o $0 (si no) — pero un
// Distribuidor puede ir pagando paquete por paquete (ver ✎ Editar,
// pagado-stepper) sin que el pedido entero pase a "Pagado" todavía, así
// que ahí se cuenta solo la parte de cada línea que ya tiene
// cantidadPagada, aunque el pedido como un todo siga "Pendiente".
function valorPagadoVenta(v) {
  if (v.estado === 'Pagado') return Number(v.valor) || 0;
  return (v.items || []).reduce((s, it) => {
    if (it.tipo !== 'cafe') return s;
    const cantidad = Number(it.cantidad) || 0;
    const pagadas = Math.min(Number(it.cantidadPagada) || 0, cantidad);
    if (!cantidad || !pagadas) return s;
    return s + (Number(it.valor) || 0) * (pagadas / cantidad);
  }, 0);
}

function calcularBalancePersonas() {
  const totalRetiros = state.gastos
    .filter(g => g.categoria === CATEGORIA_RETIRO && g.estado === 'Pagado')
    .reduce((s, g) => s + (Number(g.monto) || 0), 0);
  const transferencias = state.gastos.filter(g => g.categoria === CATEGORIA_TRANSFERENCIA && g.estado === 'Pagado');

  return CUENTAS_BALANCE.map(persona => {
    const recibidoVentas = state.ventas.filter(v => v.recibidoPor === persona).reduce((s, v) => s + valorPagadoVenta(v), 0);
    const recibidoMaquila = state.ordenesMaquila.filter(o => o.recibidoPor === persona && o.estado === 'Pagado').reduce((s, o) => s + (Number(o.valor) || 0), 0);
    const recibidoRetiros = persona === 'Efectivo' ? totalRetiros : 0;
    const recibidoTransferencias = transferencias.filter(g => g.transferidoA === persona).reduce((s, g) => s + (Number(g.monto) || 0), 0);
    const gastadoGastos = state.gastos.filter(g => g.pagadoPor === persona && g.estado === 'Pagado').reduce((s, g) => s + (Number(g.monto) || 0), 0);
    const gastadoFinca = state.finca.filter(f => f.pagadoPor === persona && f.estado === 'Pagado').reduce((s, f) => s + (Number(f.monto) || 0), 0);
    const gastadoCereza = state.cerezaComprada.filter(c => c.pagadoPor === persona).reduce((s, c) => s + (Number(c.costo) || 0), 0);
    const recibido = recibidoVentas + recibidoMaquila + recibidoRetiros + recibidoTransferencias;
    const gastado = gastadoGastos + gastadoFinca + gastadoCereza;
    const inicial = (state.saldosIniciales.find(s => s.persona === persona) || {}).monto || 0;
    return { persona, recibido, gastado, inicial, balance: inicial + recibido - gastado };
  });
}

// Registros "Pagado" (o cereza con costo) sin quién recibió/pagó — no
// cuadran en el balance de nadie. El formulario y los botones de estado ya
// no dejan crear más de estos, pero esto avisa si queda alguno viejo (o
// alguno que se coló por otro camino) para que se corrija a mano.
function listaHuerfanos() {
  return {
    ventas: state.ventas.filter(v => valorPagadoVenta(v) > 0 && !v.recibidoPor),
    maquila: state.ordenesMaquila.filter(o => o.estado === 'Pagado' && !o.recibidoPor),
    gastos: state.gastos.filter(g => g.estado === 'Pagado' && !g.pagadoPor),
    finca: state.finca.filter(f => f.estado === 'Pagado' && !f.pagadoPor),
    cereza: state.cerezaComprada.filter(c => (Number(c.costo) || 0) > 0 && !c.pagadoPor),
  };
}
function contarHuerfanos() {
  const l = listaHuerfanos();
  return { ventas: l.ventas.length, maquila: l.maquila.length, gastos: l.gastos.length, finca: l.finca.length, cereza: l.cereza.length };
}

// Lista clicable de todo lo que quedó "Pagado" sin dueño, con un botón
// para corregir cada uno ahí mismo (en vez de tener que ir a buscarlos a
// mano por las pestañas y las páginas del listado).
function abrirHuerfanos() {
  const h = listaHuerfanos();
  const secciones = [
    { label: 'Ventas', lista: h.ventas, fila: v => `${escapeHtml(v.cliente || 'Venta directa')} — ${fmt(v.valor)} — ${new Date(Number(v.ts)).toLocaleDateString('es-CO')}`, editar: v => `cerrarModal();abrirEdicionVenta(${v.id})` },
    { label: 'Maquila', lista: h.maquila, fila: o => `${escapeHtml(o.cliente)} — ${fmt(o.valor)} — ${new Date(Number(o.ts)).toLocaleDateString('es-CO')}`, editar: o => `cerrarModal();abrirEdicionMaquila(${o.id})` },
    { label: 'Gastos', lista: h.gastos, fila: g => `${escapeHtml(g.concepto)} — ${fmt(g.monto)} — ${new Date(Number(g.ts)).toLocaleDateString('es-CO')}`, editar: g => `cerrarModal();abrirEdicionGasto(${g.id})` },
    { label: 'Finca', lista: h.finca, fila: f => `${escapeHtml(f.concepto)} — ${fmt(f.monto)} — ${new Date(Number(f.ts)).toLocaleDateString('es-CO')}`, editar: f => `cerrarModal();abrirEdicionFinca(${f.id})` },
    { label: 'Cereza comprada', lista: h.cereza, fila: c => `${escapeHtml(c.proveedor || 'Sin proveedor')} — ${fmt(c.costo)} — ${new Date(Number(c.fecha)).toLocaleDateString('es-CO')}`, editar: null },
  ].filter(s => s.lista.length);

  if (!secciones.length) return toast('No queda ningún pago sin dueño.');

  abrirModal(`
    <h3>Pagos sin dueño</h3>
    <p style="font-size:12.5px;color:var(--cafe-soft);margin-top:-6px">No cuadran en el balance de nadie hasta que elijas quién recibió/pagó cada uno.</p>
    ${secciones.map(s => `
      <div style="margin-top:14px">
        <div style="font-weight:700;font-size:13px;margin-bottom:6px">${s.label} (${s.lista.length})</div>
        ${s.lista.map(item => `
          <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--linea)">
            <span style="font-size:13px">${s.fila(item)}</span>
            ${s.editar ? `<button class="sec-btn" onclick="${s.editar(item)}">✎ Corregir</button>` : `<span style="font-size:11.5px;color:var(--cafe-soft)">Sin edición — bórrala y vuelve a anotarla</span>`}
          </div>
        `).join('')}
      </div>
    `).join('')}
    <div class="modal-actions"><button class="sec-btn" onclick="cerrarModal()">Cerrar</button></div>
  `);
}

// Cuánta plata (ya pagada) quedó en cada modalidad/cuenta — Efectivo,
// Transferencia a Joaquín, Juan Nequi, etc. — sin importar quién la recibió.
function calcularBalancePorModalidad() {
  const mapa = {};
  const sumar = (metodo, valor) => { if (!metodo) return; mapa[metodo] = (mapa[metodo] || 0) + valor; };
  state.ventas.filter(v => v.estado === 'Pagado').forEach(v => sumar(v.metodo, Number(v.valor) || 0));
  state.ordenesMaquila.filter(o => o.estado === 'Pagado').forEach(o => sumar(o.metodo, Number(o.valor) || 0));
  return Object.entries(mapa).map(([metodo, total]) => ({ metodo, total })).sort((a, b) => b.total - a.total);
}

let limiteMejoresClientes = 8;
function renderMejoresClientes() {
  const cont = document.getElementById('bloqueMejoresClientes');
  if (!cont) return;

  const mes = document.getElementById('filtroMes').value || hoyMes();
  const anoActual = new Date().getFullYear();
  const inicioSemanaActual = inicioSemana(Date.now()).getTime();
  const finSemanaActual = inicioSemanaActual + 7 * 86400000;

  const ordenados = listaClientes()
    .filter(c => c.compras > 0)
    .map(c => {
      const todas = state.ventas.filter(v => normalizar(v.cliente) === normalizar(c.nombre));
      let ventasPeriodo, divisor, mesesDistintos = 0;
      if (periodoClientes === 'semana') {
        ventasPeriodo = todas.filter(v => v.ts >= inicioSemanaActual && v.ts < finSemanaActual);
        divisor = 1;
      } else if (periodoClientes === 'mes') {
        ventasPeriodo = todas.filter(v => mesDe(v.ts) === mes);
        divisor = 1;
      } else { // ano — promedio mensual de lo que va del año, no un total suelto
        ventasPeriodo = todas.filter(v => new Date(v.ts).getFullYear() === anoActual);
        mesesDistintos = new Set(ventasPeriodo.map(v => mesDe(v.ts))).size;
        divisor = mesesDistintos || 1;
      }
      const dinero = ventasPeriodo.reduce((s, v) => s + (Number(v.valor) || 0), 0);
      const kilos = ventasPeriodo.reduce((s, v) => s + kilosDeVenta(v), 0);
      return {
        nombre: c.nombre, mesesDistintos, compras: ventasPeriodo.length,
        dineroProm: dinero / divisor, kilosProm: kilos / divisor,
      };
    })
    .filter(c => c.compras > 0 && (periodoClientes !== 'ano' || c.mesesDistintos >= MIN_MESES_ANUAL))
    .sort((a, b) => b.dineroProm - a.dineroProm);

  // El gráfico se queda siempre en el top 8 (más de eso se vuelve ilegible);
  // la tabla de abajo sí se puede expandir a todo el ranking.
  const paraGrafico = ordenados.slice(0, 8);
  const candidatos = ordenados.slice(0, limiteMejoresClientes);

  if (!candidatos.length) {
    const vacio = periodoClientes === 'semana' ? 'Nadie ha comprado esta semana (de lunes a hoy) todavía.'
      : periodoClientes === 'mes' ? `Nadie compró en ${mes}.`
      : `Todavía no hay clientes con ${MIN_MESES_ANUAL} o más meses de compras en ${anoActual}.<br>Esta tabla se llena sola a medida que avanza el año.`;
    cont.innerHTML = `<div class="empty">${vacio}</div>`;
    graficos.clientes?.destroy();
    graficos.clientes = null;
    return;
  }

  // Solo "Anual" es de verdad un promedio (de los meses del año que ya
  // pasaron) — Semanal y Mensual muestran el total de ese período nada más,
  // así que la tabla/gráfica dicen "Total", no "Promedio", para no confundir.
  const esPromedio = periodoClientes === 'ano';
  const etiquetaCorta = periodoClientes === 'semana' ? 'esta semana' : periodoClientes === 'mes' ? mes : `mensual ${anoActual}`;
  const tituloGrafico = periodoClientes === 'semana' ? 'Total de esta semana (lunes a hoy)'
    : periodoClientes === 'mes' ? `Total de ${mes}`
    : `Promedio mensual en ${anoActual}`;
  cont.innerHTML = `
    <div class="chart-card">
      <h4>${tituloGrafico}</h4>
      <div class="chart-box"><canvas id="chartClientes"></canvas></div>
    </div>
    <div class="tabla-clientes">
      <div class="fila-cliente encabezado">
        <span>Cliente</span><span>Compras</span><span>${esPromedio ? 'Prom.' : 'Total'} ${etiquetaCorta}</span><span>Kg ${etiquetaCorta}</span>
      </div>
      ${candidatos.map(c => `
        <div class="fila-cliente" style="cursor:pointer" onclick="abrirFichaCliente('${escapeAttr(c.nombre).replace(/'/g,"\\'")}')">
          <span class="nombre">${escapeHtml(c.nombre)}</span>
          <span>${c.compras}</span>
          <span class="dinero">${fmt(c.dineroProm)}</span>
          <span>${c.kilosProm.toFixed(2)} kg</span>
        </div>`).join('')}
    </div>
    ${ordenados.length > candidatos.length
      ? `<button class="sec-btn" style="width:100%;margin-top:8px" onclick="limiteMejoresClientes=${ordenados.length};renderMejoresClientes();">Ver los ${ordenados.length - candidatos.length} clientes restantes</button>`
      : (limiteMejoresClientes > 8 ? `<button class="sec-btn" style="width:100%;margin-top:8px" onclick="limiteMejoresClientes=8;renderMejoresClientes();">Ver solo el top 8</button>` : '')}`;

  if (typeof Chart === 'undefined') return;
  const css = getComputedStyle(document.documentElement);
  graficos.clientes?.destroy();
  graficos.clientes = new Chart(document.getElementById('chartClientes'), {
    type: 'bar',
    data: {
      labels: paraGrafico.map(c => c.nombre),
      datasets: [{
        label: tituloGrafico,

        backgroundColor: css.getPropertyValue('--verde').trim(),
        borderRadius: 6, maxBarThickness: 34,
      }],

// Devuelve las claves de mes ('2026-09') hacia atrás desde el mes elegido.
function mesesDelRango(mesBase, cantidad) {
  const [a, m] = mesBase.split('-').map(Number);
  const out = [];
  for (let i = cantidad - 1; i >= 0; i--) {
    const d = new Date(a, m - 1 - i, 1);
    out.push(d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'));
  }
  return out;
}
const etiquetaMes = clave => {
  const [a, m] = clave.split('-').map(Number);
  return new Date(a, m - 1, 1).toLocaleDateString('es-CO', { month: 'short', year: '2-digit' });
};

function dibujarGraficos(mesBase) {
  if (typeof Chart === 'undefined') return; // si el CDN no cargó, la app sigue funcionando igual
  const meses = mesesDelRango(mesBase, rangoMeses);
  const css = getComputedStyle(document.documentElement);
  const verde = css.getPropertyValue('--verde').trim();
  const terracota = css.getPropertyValue('--terracota').trim();
  const cafe = css.getPropertyValue('--cafe').trim();
  const linea = css.getPropertyValue('--linea').trim();
  Chart.defaults.font.family = "'Outfit', sans-serif";
  Chart.defaults.font.size = 13;
  Chart.defaults.color = css.getPropertyValue('--cafe-soft').trim();

  const dinero = v => '$' + Math.round(v).toLocaleString('es-CO');
  const ejeDinero = {
    grid: { color: linea }, border: { display: false },
    ticks: { callback: v => v >= 1000000 ? (v/1000000).toFixed(1)+'M' : (v/1000).toFixed(0)+'k' }
  };

  // --- 1. Ingresos cobrados vs egresos, mes a mes ---
  // Ingresos junta café + maquila (igual que el "Cobrado" de arriba); los
  // egresos NO cuentan retiros/transferencias, esos no salen del negocio.
  const ingresos = meses.map(mm =>
    state.ventas.filter(v => mesDe(v.ts) === mm && v.estado === 'Pagado').reduce((s, v) => s + (Number(v.valor) || 0), 0) +
    state.ordenesMaquila.filter(o => mesDe(o.ts) === mm && o.estado === 'Pagado').reduce((s, o) => s + (Number(o.valor) || 0), 0));
  const egresos = meses.map(mm =>
    state.gastos.filter(g => mesDe(g.ts) === mm && esGastoOperativo(g)).reduce((s, g) => s + (Number(g.monto) || 0), 0) +
    state.finca.filter(f => mesDe(f.ts) === mm).reduce((s, f) => s + (Number(f.monto) || 0), 0));

  graficos.flujo?.destroy();
  graficos.flujo = new Chart(document.getElementById('chartFlujo'), {
    type: 'bar',
    data: {
      labels: meses.map(etiquetaMes),
      datasets: [
        { label: 'Cobrado', data: ingresos, backgroundColor: verde, borderRadius: 6, maxBarThickness: 34 },
        { label: 'Egresos', data: egresos, backgroundColor: terracota, borderRadius: 6, maxBarThickness: 34 },
      ],
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { position: 'bottom', labels: { boxWidth: 12, usePointStyle: true, pointStyle: 'circle', padding: 16 } },
        tooltip: { callbacks: { label: c => c.dataset.label + ': ' + dinero(c.parsed.y) } },
      },
      scales: { x: { grid: { display: false }, border: { display: false } }, y: ejeDinero },
    },
  });

  // --- 2. Egresos por categoría (gastos + finca juntos) en todo el rango ---
  // Retiros/transferencias no son categorías de gasto real, no entran aquí
  // (ya tienen su propia gráfica en "Balance de cuentas").
  const porCategoria = {};
  state.gastos.filter(g => meses.includes(mesDe(g.ts)) && esGastoOperativo(g))
    .forEach(g => { porCategoria[g.categoria || 'Otro'] = (porCategoria[g.categoria || 'Otro'] || 0) + (Number(g.monto) || 0); });
  state.finca.filter(f => meses.includes(mesDe(f.ts)))
    .forEach(f => { const k = 'Finca: ' + (f.categoria || 'Otro'); porCategoria[k] = (porCategoria[k] || 0) + (Number(f.monto) || 0); });
  const catOrdenadas = Object.entries(porCategoria).sort((a, b) => b[1] - a[1]);
  const paleta = ['#AD4B31', '#4A6B48', '#8A6A1F', '#3E2723', '#8A7A70', '#C97B5A', '#6E8B6B', '#B99C5B', '#5A4038', '#A8998E'];

  graficos.categorias?.destroy();
  graficos.categorias = new Chart(document.getElementById('chartCategorias'), {
    type: 'doughnut',
    data: {
      labels: catOrdenadas.map(([k]) => k),
      datasets: [{ data: catOrdenadas.map(([, v]) => v), backgroundColor: catOrdenadas.map((_, i) => paleta[i % paleta.length]), borderWidth: 0 }],
    },
    options: {
      responsive: true, maintainAspectRatio: false, cutout: '58%',
      plugins: {
        legend: { position: 'right', labels: { boxWidth: 10, usePointStyle: true, pointStyle: 'circle', padding: 10, font: { size: 12 } } },
        tooltip: { callbacks: { label: c => c.label + ': ' + dinero(c.parsed) } },
      },
    },
  });

  // --- 3. Ventas por lote de café en todo el rango ---
  const porLoteRango = {};
  state.ventas.filter(v => meses.includes(mesDe(v.ts)))
    .forEach(v => lotesDeVenta(v).forEach(([lote, val]) => { porLoteRango[lote] = (porLoteRango[lote] || 0) + (Number(val) || 0); }));
  const lotesOrdenados = Object.entries(porLoteRango).sort((a, b) => b[1] - a[1]);

  graficos.lotes?.destroy();
  graficos.lotes = new Chart(document.getElementById('chartLotes'), {
    type: 'bar',
    data: {
      labels: lotesOrdenados.map(([k]) => k),
      datasets: [{ label: 'Ventas', data: lotesOrdenados.map(([, v]) => v), backgroundColor: cafe, borderRadius: 6, maxBarThickness: 40 }],
    },
    options: {
      indexAxis: 'y',
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => dinero(c.parsed.x) } } },
      scales: { x: ejeDinero, y: { grid: { display: false }, border: { display: false } } },
    },
  });

  // --- 4. Rendimiento de cosecha (cereza→pergamino, pergamino→verde), mes a mes ---
  const rendMes = tendenciaRendimientosPorMes(meses);
  graficos.rendimiento?.destroy();
  graficos.rendimiento = new Chart(document.getElementById('chartRendimiento'), {
    type: 'line',
    data: {
      labels: meses.map(etiquetaMes),
      datasets: [
        { label: 'Cereza → pergamino', data: rendMes.map(r => r.cerezaAPergaminoPct), borderColor: verde, backgroundColor: verde, spanGaps: true, tension: 0.3 },
        { label: 'Pergamino → verde', data: rendMes.map(r => r.pergaminoAVerdePct), borderColor: cafe, backgroundColor: cafe, spanGaps: true, tension: 0.3 },
      ],
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { position: 'bottom', labels: { boxWidth: 12, usePointStyle: true, pointStyle: 'circle', padding: 16 } },
        tooltip: { callbacks: { label: c => c.dataset.label + ': ' + (c.parsed.y == null ? 'sin datos' : c.parsed.y.toFixed(1) + '%') } },
      },
      scales: {
        x: { grid: { display: false }, border: { display: false } },
        y: { grid: { color: linea }, border: { display: false }, ticks: { callback: v => v + '%' } },
      },
    },
  });
}

/* ================================================================
   CONFIGURACIÓN / MAQUILA
================================================================ */
/* ================================================================
   CONCILIACIÓN BANCARIA — sube el extracto que descargas de tu banco
   (CSV) y lo compara contra lo ya registrado en la app, para encontrar
   transferencias que falten por anotar o que no cuadren. Todo pasa en el
   navegador: no se guarda nada en Supabase, no hay migración ni endpoint
   nuevo — es un reporte de una sola vez, cada vez que se sube un archivo.
================================================================ */
let extractoCSV = null; // { headers, filas } del último archivo leído

// Separador por comas o por punto y coma (varía según el banco) — se
// detecta contando cuál aparece más veces en el encabezado. Comillas se
// usan para poder tener el separador dentro de un campo (ej. una
// descripción con comas).
function parsearCSV(texto) {
  const lineas = texto.split(/\r?\n/).filter(l => l.trim() !== '');
  if (!lineas.length) return [];
  const delim = (lineas[0].split(';').length > lineas[0].split(',').length) ? ';' : ',';
  return lineas.map(linea => {
    const out = []; let actual = ''; let enComillas = false;
    for (let i = 0; i < linea.length; i++) {
      const ch = linea[i];
      if (ch === '"') { enComillas = !enComillas; continue; }
      if (ch === delim && !enComillas) { out.push(actual.trim()); actual = ''; continue; }
      actual += ch;
    }
    out.push(actual.trim());
    return out;
  });
}
// Adivina cuál columna es cuál por el nombre del encabezado, para
// preseleccionar los desplegables — el usuario los puede corregir si
// adivinó mal (bancos distintos usan nombres distintos).
function adivinarColumna(headers, palabras) {
  const idx = headers.findIndex(h => palabras.some(p => normalizar(h).includes(normalizar(p))));
  return idx === -1 ? 0 : idx;
}
function parsearFechaExtracto(s) {
  s = String(s || '').trim();
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3])).getTime();
  m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
  if (m) return new Date(Number(m[3]), Number(m[2]) - 1, Number(m[1])).getTime();
  return null;
}
// Formato colombiano (punto de miles, coma decimal) igual que numeroCO()
// del precio FNC — aquí aparte porque este vive en el frontend, no en
// functions/. Siempre devuelve el valor absoluto: no tratamos de adivinar
// si el banco representa gastos con signo negativo o con una columna
// aparte, eso varía demasiado de un banco a otro.
function parsearValorExtracto(s) {
  const limpio = String(s || '').replace(/[^\d,.-]/g, '').replace(/\./g, '').replace(',', '.');
  return Math.abs(Number(limpio)) || 0;
}

async function cargarExtractoBanco(event) {
  const file = event.target.files[0];
  if (!file) return;
  const texto = await file.text();
  const filas = parsearCSV(texto);
  if (filas.length < 2) { toast('El archivo está vacío o no se pudo leer.'); return; }
  extractoCSV = { headers: filas[0], filas: filas.slice(1) };
  renderConfig();
}

// Todo lo que ya está marcado Pagado en el mes elegido y con un método
// que SÍ pasa por el banco (no Efectivo — eso nunca va a aparecer en un
// extracto). Se compara por valor absoluto: no importa si es un ingreso
// (venta/maquila) o un egreso (gasto/finca), el extracto trae ambos
// mezclados y los bancos no siempre marcan el signo del mismo modo.
function registrosBancariosDelMes(mes) {
  const out = [];
  state.ventas.filter(v => v.estado === 'Pagado' && mesDe(v.ts) === mes && v.metodo !== 'Efectivo')
    .forEach(v => out.push({ tipo: 'Venta', nombre: v.cliente || 'Venta', valor: Number(v.valor) || 0, ts: v.ts }));
  state.ordenesMaquila.filter(o => o.estado === 'Pagado' && mesDe(o.ts) === mes && o.metodo !== 'Efectivo')
    .forEach(o => out.push({ tipo: 'Maquila', nombre: o.cliente || 'Maquila', valor: Number(o.valor) || 0, ts: o.ts }));
  state.gastos.filter(g => g.estado === 'Pagado' && mesDe(g.ts) === mes && g.pagadoPor !== 'Efectivo' && esGastoOperativo(g))
    .forEach(g => out.push({ tipo: 'Gasto', nombre: g.concepto || 'Gasto', valor: Number(g.monto) || 0, ts: g.ts }));
  state.finca.filter(f => f.estado === 'Pagado' && mesDe(f.ts) === mes)
    .forEach(f => out.push({ tipo: 'Finca', nombre: f.concepto || 'Finca', valor: Number(f.monto) || 0, ts: f.ts }));
  return out;
}

// Empareja cada fila del extracto con el registro más cercano de la app
// por VALOR (exacto, tolerancia de $1 por redondeo) y FECHA (±3 días, el
// banco a veces consigna un día después de lo registrado) — el primero
// que calce se marca usado y no vuelve a competir por otra fila.
function conciliarExtracto(idxFecha, idxDesc, idxValor, mes) {
  const registros = registrosBancariosDelMes(mes);
  const usados = new Set();
  const coincidencias = [];
  const sinApp = [];
  extractoCSV.filas.forEach(fila => {
    const ts = parsearFechaExtracto(fila[idxFecha]);
    const valor = parsearValorExtracto(fila[idxValor]);
    if (!valor) return; // fila sin valor (ej. línea de saldo/encabezado repetido) — se ignora
    const idx = registros.findIndex((r, i) =>
      !usados.has(i) && Math.abs(r.valor - valor) < 1 && (ts == null || Math.abs(r.ts - ts) <= 3 * 86400000));
    if (idx !== -1) { usados.add(idx); coincidencias.push({ fila, desc: fila[idxDesc], registro: registros[idx] }); }
    else sinApp.push({ fila, desc: fila[idxDesc], ts, valor });
  });
  const sinExtracto = registros.filter((r, i) => !usados.has(i));
  return { coincidencias, sinApp, sinExtracto };
}

  const total = ventas.reduce((s, v) => s + (Number(v.valor) || 0), 0);
  const cobrado = ventas.filter(v => v.estado === 'Pagado').reduce((s, v) => s + (Number(v.valor) || 0), 0);
  const porCobrar = total - cobrado;
  const meses = new Set(ventas.map(v => mesDe(v.ts))).size;
  const pref = ultimaPreferenciaCafe(nombre);

  abrirModal(`
    <h3>${escapeHtml(nombre)}</h3>
    <div class="stat-grid" style="margin-bottom:14px">
      <div class="stat"><div class="n">${ventas.length}</div><div class="l">Compras (${meses} mes${meses===1?'':'es'} distintos)</div></div>
      <div class="stat"><div class="n">${fmt(total)}</div><div class="l">Total histórico</div></div>
      <div class="stat"><div class="n pos">${fmt(cobrado)}</div><div class="l">Cobrado</div></div>
      <div class="stat"><div class="n ${porCobrar>0?'neg':''}">${fmt(porCobrar)}</div><div class="l">Por cobrar</div></div>
    </div>
    ${pref ? `<p style="font-size:13px;color:var(--cafe-soft);margin-top:-6px">Suele pedir: <b>${escapeHtml(pref.lote)}</b>${pref.molienda ? ', ' + escapeHtml(pref.molienda) : ''}${pref.tueste ? ', Tostión ' + escapeHtml(pref.tueste) : ''}</p>` : ''}

    <h3 class="section-title">Historial de compras</h3>
    <div class="ledger">
      ${ventas.length ? ventas.slice(0, limite).map(v => `
        <div class="ledger-row">
          <div class="main">
            <div class="title">${new Date(Number(v.ts)).toLocaleDateString('es-CO')} ${v.origenWeb ? '<span class="badge-web">🌐</span>' : ''}</div>
            <div class="details">${escapeHtml(detalleVenta(v))}</div>

async function guardarRenombreCliente(nombreActual, btn) {
  const nuevo = document.getElementById('rc-nombre').value.trim();
  if (!nuevo) return toast('Escribe un nombre.', 'error');
  btn.disabled = true;
  const variantes = variantesDeCliente(nombreActual);
  try {
    const res = await apiFetch('/api/clientes-unificar', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ valoresViejos: variantes, nombreNuevo: nuevo }),
    });
    if (!res.ok) throw new Error();
    cerrarModal();
    toast('Cliente actualizado');
    await sincronizar();
  } catch {
    toast('No se pudo renombrar. Intenta de nuevo.', 'error');
  } finally {
    btn.disabled = false;
  }
}

}
async function guardarSaldoInicial(persona) {
  const monto = Number(document.getElementById('si-' + idPersona(persona)).value) || 0;
  const s = state.saldosIniciales.find(x => x.persona === persona);
  if (s) s.monto = monto; else state.saldosIniciales.push({ persona, monto });
  guardarCacheLocal('saldosIniciales');
  renderTodo();
  await apiFetch('/api/saldos-iniciales', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ persona, monto }) });
  toast('Saldo inicial guardado');
}

async function guardarCostosMargen(btn) {
  btn.disabled = true;
  const payload = {
    costoTostionKg: Number(document.getElementById('cmg-tostion').value) || 0,
    costoBolsaMediaLb: Number(document.getElementById('cmg-bolsa-media').value) || 0,
    costoBolsaLibra: Number(document.getElementById('cmg-bolsa-libra').value) || 0,
    costoBolsaKilo: Number(document.getElementById('cmg-bolsa-kilo').value) || 0,
    costoBolsaCuarteron: Number(document.getElementById('cmg-bolsa-cuarteron').value) || 0,
  };
  try {
    const res = await apiFetch('/api/costos-margen', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    if (!res.ok) throw new Error(await res.text());
    state.costosMargen = await res.json();
    guardarCacheLocal('costosMargen');
    toast('Costos de margen guardados');
  } catch (err) {
    toast('No se pudo guardar: ' + err.message, 'error');
  } finally { btn.disabled = false; }
}

/* ================================================================

================================================================ */
function abrirModal(html) { document.getElementById('modalBox').innerHTML = html; document.getElementById('modalOverlay').classList.add('show'); }
function cerrarModal() { document.getElementById('modalOverlay').classList.remove('show'); }
document.getElementById('modalOverlay').addEventListener('click', e => { if (e.target.id === 'modalOverlay') cerrarModal(); });

/* ================================================================
   TOASTS (avisos suaves en vez de alert)
================================================================ */
function toast(mensaje, tipo) {
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast' + (tipo === 'error' ? ' error' : '');
  el.textContent = mensaje;
  wrap.appendChild(el);
  setTimeout(() => el.remove(), 4200);
}

/* ================================================================
   UTILIDADES
================================================================ */
function escapeHtml(s) { return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s) { return escapeHtml(s); }

/* ================================================================
   EXPORTAR A EXCEL
================================================================ */
function exportarExcel() {
  const HEAD = v => ({ v, s: 'head' });
  const MONEY = v => ({ v: Number(v) || 0, s: 'money' });
  const MONEY_B = v => ({ v: Number(v) || 0, s: 'money-b' });
  const BOLD = v => ({ v, s: 'b' });
  const NUM2 = v => ({ v: Math.round((Number(v) || 0) * 100) / 100, s: 'num2' });
  const FECHA = ts => ({ v: new Date(Number(ts)), s: 'date' });
  const PCT = v => (Number(v) * 100).toFixed(1) + '%';

  /* ---------- 1) Resumen mensual: todo el negocio, mes a mes ---------- */
  const meses = [...new Set([
    ...state.ventas.map(v => mesDe(v.ts)),
    ...state.gastos.map(g => mesDe(g.ts)),
    ...state.finca.map(f => mesDe(f.ts)),
    ...state.ordenesMaquila.map(o => mesDe(o.ts)),
  ])].sort();

  const hojaResumen = {
    name: 'Resumen mensual',
    cols: [10, 16, 16, 16, 16, 14, 16, 14, 16, 14],
    rows: [
      [HEAD('Mes'), HEAD('Ventas café'), HEAD('Maquila'), HEAD('Total facturado'), HEAD('Cobrado'), HEAD('Por cobrar'), HEAD('Gastos'), HEAD('Finca'), HEAD('Balance'), HEAD('Libras vendidas')],
      ...meses.map(mm => {
        const vMes = state.ventas.filter(v => mesDe(v.ts) === mm);
        const oMes = state.ordenesMaquila.filter(o => mesDe(o.ts) === mm);
        const gMes = state.gastos.filter(g => mesDe(g.ts) === mm);
        const fMes = state.finca.filter(f => mesDe(f.ts) === mm);
        const factVentas = vMes.reduce((s,v)=>s+(Number(v.valor)||0),0);
        const factMaquila = oMes.reduce((s,o)=>s+(Number(o.valor)||0),0);
        const cobrado = vMes.filter(v=>v.estado==='Pagado').reduce((s,v)=>s+(Number(v.valor)||0),0)
                       + oMes.filter(o=>o.estado==='Pagado').reduce((s,o)=>s+(Number(o.valor)||0),0);
        const totalGastos = gMes.filter(esGastoOperativo).reduce((s,g)=>s+(Number(g.monto)||0),0);
        const totalFinca = fMes.reduce((s,f)=>s+(Number(f.monto)||0),0);
        const facturado = factVentas + factMaquila;
        const libras = vMes.reduce((s,v)=>s+kilosDeVenta(v),0) / KG_POR_LIBRA_VENTA;
        return [mm, MONEY(factVentas), MONEY(factMaquila), MONEY_B(facturado), MONEY(cobrado), MONEY(facturado-cobrado), MONEY(totalGastos), MONEY(totalFinca), MONEY_B(cobrado-totalGastos-totalFinca), NUM2(libras)];
      }),
    ],
  };

  /* ---------- 2) Ventas ---------- */
  const hojaVentas = {
    name: 'Ventas',
    cols: [22, 24, 34, 16, 14, 16, 20, 14],
    rows: [
      [HEAD('Fecha'), HEAD('Cliente'), HEAD('Detalle'), HEAD('Valor'), HEAD('Estado pago'), HEAD('Estado envío'), HEAD('Método'), HEAD('Anotado por')],
      ...state.ventas.slice().sort((a,b)=>b.ts-a.ts).map(v => [FECHA(v.ts), v.cliente || '', detalleVenta(v), MONEY(v.valor), v.estado, v.estadoEnvio === 'Enviado' ? 'Enviado' : 'Pendiente', v.metodo || '', v.usuario || '']),
      [],
      [BOLD('TOTAL'), null, null, MONEY_B(state.ventas.reduce((s,v)=>s+(Number(v.valor)||0),0))],
    ],
  };

  /* ---------- 3) Maquila ---------- */
  const hojaMaquila = {
    name: 'Maquila',
    cols: [22, 24, 34, 16, 14, 16, 20],
    rows: [
      [HEAD('Fecha'), HEAD('Cliente'), HEAD('Detalle'), HEAD('Valor'), HEAD('Estado'), HEAD('Entrega'), HEAD('Método')],
      ...state.ordenesMaquila.slice().sort((a,b)=>b.ts-a.ts).map(o => [FECHA(o.ts), o.cliente || '', detalleOrdenMaquila(o), MONEY(o.valor), o.estado, o.estadoEntrega === 'Entregado' ? 'Entregado' : 'Pendiente', o.metodo || '']),
      [],
      [BOLD('TOTAL'), null, null, MONEY_B(state.ordenesMaquila.reduce((s,o)=>s+(Number(o.valor)||0),0))],
    ],
  };

  /* ---------- 4) Gastos ---------- */
  const hojaGastos = {
    name: 'Gastos',
    cols: [22, 30, 18, 14, 14, 16],
    rows: [
      [HEAD('Fecha'), HEAD('Concepto'), HEAD('Categoría'), HEAD('Monto'), HEAD('Estado'), HEAD('Anotado por')],
      ...state.gastos.slice().sort((a,b)=>b.ts-a.ts).map(g => [FECHA(g.ts), g.concepto, g.categoria, MONEY(g.monto), g.estado, g.usuario || '']),
      [],
      [BOLD('TOTAL gastos operativos'), null, null, MONEY_B(state.gastos.filter(esGastoOperativo).reduce((s,g)=>s+(Number(g.monto)||0),0))],
      [BOLD('TOTAL retiros/transferencias'), null, null, MONEY_B(state.gastos.filter(g=>!esGastoOperativo(g)).reduce((s,g)=>s+(Number(g.monto)||0),0))],
    ],
  };

  /* ---------- 5) Finca (gastos de finca) ---------- */
  const hojaFinca = {
    name: 'Finca',
    cols: [22, 30, 18, 14, 14],
    rows: [
      [HEAD('Fecha'), HEAD('Concepto'), HEAD('Categoría'), HEAD('Monto'), HEAD('Estado')],
      ...state.finca.slice().sort((a,b)=>b.ts-a.ts).map(f => [FECHA(f.ts), f.concepto, f.categoria, MONEY(f.monto), f.estado]),
      [],
      [BOLD('TOTAL'), null, null, MONEY_B(state.finca.reduce((s,f)=>s+(Number(f.monto)||0),0))],
    ],
  };

  /* ---------- 6) Café disponible (inventario actual) ---------- */
  const hojaInventario = {
    name: 'Café disponible',
    cols: [16, 16, 16],
    rows: [
      [HEAD('Lote'), HEAD('Stock (kg)'), HEAD('Alerta')],
      ...state.inventario.map(i => [i.lote, NUM2(i.stockLb), Number(i.stockLb) < 5 ? 'Bajo (<5 kg)' : 'Normal']),
    ],
  };

  /* ---------- 7) Rendimientos y mermas reales ---------- */
  const r = rendimientosReales();
  const hojaMermas = {
    name: 'Mermas y rendimientos',
    cols: [26, 16, 16, 16, 30],
    rows: [
      [HEAD('Etapa'), HEAD('Tu rendimiento'), HEAD('Genérico'), HEAD('Muestras'), HEAD('Estado')],
      ['Cereza → pergamino', PCT(r.cerezaAPergamino.valor), PCT(r.cerezaAPergamino.generico), r.cerezaAPergamino.muestras, r.cerezaAPergamino.real!=null ? 'Calculado con tus datos' : `Genérico (faltan ${r.cerezaAPergamino.faltan})`],
      ['Pergamino → verde', PCT(r.pergaminoAVerde.valor), PCT(r.pergaminoAVerde.generico), r.pergaminoAVerde.muestras, r.pergaminoAVerde.real!=null ? 'Calculado con tus datos' : `Genérico (faltan ${r.pergaminoAVerde.faltan})`],
      ['Merma de tueste', PCT(r.mermaTueste.valor), PCT(r.mermaTueste.generico), r.mermaTueste.muestras, r.mermaTueste.real!=null ? 'Calculado con tus datos' : `Genérico (faltan ${r.mermaTueste.faltan})`],
    ],
  };

  /* ---------- 8) Cosechas ---------- */
  const hojaCosechas = {
    name: 'Cosechas',
    cols: [16, 14, 14, 18, 16, 14, 30],
    rows: [
      [HEAD('Fecha'), HEAD('Kg cereza'), HEAD('Proceso'), HEAD('Kg pergamino real'), HEAD('Kg pergamino esperado'), HEAD('Kg pasilla'), HEAD('Notas')],
      ...state.cosechas.slice().sort((a,b)=>b.fecha-a.fecha).map(c => {
        const p = proyectarDesdeCereza(c.kilosCereza);
        return [FECHA(c.fecha), NUM2(c.kilosCereza), c.proceso, c.kilosPergaminoReal!=null ? NUM2(c.kilosPergaminoReal) : '', NUM2(p.pergamino), c.kilosPasilla!=null ? NUM2(c.kilosPasilla) : '', c.notas || ''];
      }),
    ],
  };

  /* ---------- 8b) Cereza comprada a terceros ---------- */
  const hojaCerezaComprada = {
    name: 'Cereza comprada',
    cols: [16, 20, 14, 14, 16, 16, 16, 14],
    rows: [
      [HEAD('Fecha'), HEAD('Proveedor'), HEAD('Kg cereza'), HEAD('Proceso'), HEAD('Kg pergamino real'), HEAD('Kg verde real'), HEAD('Costo'), HEAD('Pagó')],
      ...state.cerezaComprada.slice().sort((a,b)=>b.fecha-a.fecha).map(c => [
        FECHA(c.fecha), c.proveedor || '', NUM2(c.kilosCereza), c.proceso,
        c.kilosPergaminoReal!=null ? NUM2(c.kilosPergaminoReal) : '',
        c.kilosVerdeReal!=null ? NUM2(c.kilosVerdeReal) : '',
        MONEY(c.costo), c.pagadoPor || '',
      ]),
      [],
      [BOLD('TOTAL'), null, null, null, null, null, MONEY_B(state.cerezaComprada.reduce((s,c)=>s+(Number(c.costo)||0),0))],
    ],
  };

  /* ---------- 9) Pergamino comprado ---------- */
  const hojaPergamino = {
    name: 'Pergamino comprado',
    cols: [16, 22, 14, 14, 16, 14],
    rows: [
      [HEAD('Fecha'), HEAD('Proveedor'), HEAD('Kg pergamino'), HEAD('Proceso'), HEAD('Kg verde real'), HEAD('Costo')],
      ...state.pergamino.slice().sort((a,b)=>b.fecha-a.fecha).map(p => [FECHA(p.fecha), p.proveedor || '', NUM2(p.kilosPergamino), p.proceso, p.kilosVerdeReal!=null ? NUM2(p.kilosVerdeReal) : '', MONEY(p.costo)]),
      [],
      [BOLD('TOTAL'), null, null, null, null, MONEY_B(state.pergamino.reduce((s,p)=>s+(Number(p.costo)||0),0))],
    ],
  };

  /* ---------- 10) Tuestes ---------- */
  const hojaTuestes = {
    name: 'Tuestes',
    cols: [16, 14, 14, 14, 14, 14, 14, 14, 30],
    rows: [
      [HEAD('Fecha'), HEAD('Lote'), HEAD('Kg verde'), HEAD('Kg tostado'), HEAD('Media'), HEAD('Media alta'), HEAD('Merma'), HEAD('Origen'), HEAD('Notas de cata')],
      ...state.tuestes.slice().sort((a,b)=>b.fecha-a.fecha).map(t => {
        const tieneSalida = t.kilosTostado != null;
        const merma = tieneSalida && t.kilosVerde > 0 ? 1 - t.kilosTostado / t.kilosVerde : null;
        return [FECHA(t.fecha), t.lote, NUM2(t.kilosVerde), tieneSalida ? NUM2(t.kilosTostado) : 'pendiente',
          t.kilosTostadoMedia != null ? NUM2(t.kilosTostadoMedia) : '', t.kilosTostadoMediaAlta != null ? NUM2(t.kilosTostadoMediaAlta) : '',
          merma != null ? PCT(merma) : '', t.origen || '', t.notasCata || ''];
      }),
      [],
      [BOLD('TOTAL'), null, NUM2(state.tuestes.reduce((s,t)=>s+(Number(t.kilosVerde)||0),0)), NUM2(state.tuestes.reduce((s,t)=>s+(Number(t.kilosTostado)||0),0))],
    ],
  };

  /* ---------- 11) Mejores clientes ---------- */
  const clientesConDatos = listaClientes().filter(c => c.compras > 0).sort((a,b) => b.total - a.total);
  const hojaClientes = {
    name: 'Clientes',
    cols: [26, 12, 16, 16, 22],
    rows: [
      [HEAD('Cliente'), HEAD('Compras'), HEAD('Total comprado'), HEAD('Promedio por compra'), HEAD('Última compra')],
      ...clientesConDatos.map(c => [c.nombre, c.compras, MONEY(c.total), MONEY(c.promedio), c.ultima ? new Date(Number(c.ultima.ts)).toLocaleDateString('es-CO') : '']),
    ],
  };

  /* ---------- 12) Precios de café vigentes ---------- */
  const ordenPres = ['Media lb', 'Libra', 'Kilo', 'Cuarterón'];
  const hojaPrecios = {
    name: 'Precios de café',
    cols: [14, 16, 16, 16],
    rows: [
      [HEAD('Lote'), HEAD('Presentación'), HEAD('Precio normal'), HEAD('Precio distribuidor')],
      ...LOTES_VENTA.map(lote => ordenPres.map(p => {
        const n = state.preciosCafe.find(x => x.lote === lote && x.presentacion === p && x.tipoCliente === 'normal');
        const d = state.preciosCafe.find(x => x.lote === lote && x.presentacion === p && x.tipoCliente === 'distribuidor');
        return [lote, p, MONEY(n ? n.precio : 0), MONEY(d ? d.precio : 0)];
      })).flat(),
    ],
  };

  /* ---------- 13) Tarifas de maquila vigentes ---------- */
  const hojaTarifasMaquila = {
    name: 'Tarifas maquila',
    cols: [20, 16, 16],
    rows: [
      [HEAD('Servicio'), HEAD('Presentación')  , HEAD('Precio')],
      ...state.maquila.slice().sort((a,b)=>ordenServicioMaquila(a.servicio)-ordenServicioMaquila(b.servicio)).map(t => [t.servicio, t.presentacion || 'por kg', MONEY(t.precio)]),
    ],
  };

  /* ---------- 14) Balance de cuentas por persona ---------- */
  const balancesPersonas = calcularBalancePersonas();
  const modalidadesBalance = calcularBalancePorModalidad();
  const hojaBalance = {
    name: 'Balance de cuentas',
    cols: [18, 18, 18, 18, 18],
    rows: [
      [HEAD('Persona'), HEAD('Saldo inicial'), HEAD('Recibió'), HEAD('Gastó'), HEAD('Balance (+ tiene / − le deben)')],
      ...balancesPersonas.map(b => [b.persona, MONEY(b.inicial), MONEY(b.recibido), MONEY(b.gastado), MONEY(b.balance)]),
      [],
      [HEAD('Modalidad / cuenta'), HEAD('Total recibido'), null, null, null],
      ...modalidadesBalance.map(m => [m.metodo, MONEY(m.total), null, null, null]),
    ],
  };

  const nombre = 'CafePandora_' + new Date().toISOString().split('T')[0] + '.xlsx';
  try {
    XLSXLite.download([
      hojaResumen, hojaVentas, hojaMaquila, hojaGastos, hojaFinca, hojaInventario,
      hojaMermas, hojaCosechas, hojaCerezaComprada, hojaPergamino, hojaTuestes, hojaClientes,
      hojaPrecios, hojaTarifasMaquila, hojaBalance,
    ], nombre);
    localStorage.setItem('cp_ultimo_export', String(Date.now()));
    renderRecordatorioExport();
    toast('Respaldo completo exportado');
  } catch (err) {
    toast('No se pudo generar el Excel: ' + err.message, 'error');
  }
}
