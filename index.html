<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Café Pandora">
<meta name="theme-color" content="#FCFBF9">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,400;9..144,600&display=swap" rel="stylesheet">
<style>
  :root {
    /* crema/cafe ajustados (2026-09-21) para quedar en el mismo sistema
       de marca que pedidos/index.html (paleta real de la carta 2026) —
       cafe pasa de un café rojizo genérico a la tinta casi negra real;
       crema es prácticamente el mismo tono, ajuste mínimo. NO se tocó
       verde/terracota/azul: son colores de ESTADO (pagado/pendiente/
       envío) en decenas de lugares, cambiarlos rompería ese significado
       sin ganar nada — el usuario pidió explícitamente no tocarlos. */
    --crema: #FCFAF3;
    --crema-alt: #F1EAE0;
    --cafe: #201B14;
    /* Oscurecido de #8A7A70 — el original daba ~4:1 de contraste contra
       --crema (falla el 4.5:1 mínimo de WCAG AA para texto normal), muy
       poco para texto secundario/meta que se lee todo el día — Juan e
       Inés (65 años) lo usan a diario. */
    --cafe-soft: #6E5D52;
    --verde: #4A6B48;
    --verde-bg: #E7EDE3;
    --terracota: #AD4B31;
    --terracota-bg: #F6E3DA;
    --azul: #3E6B8A;
    --azul-bg: #E2ECF2;
    --linea: #E3D9CC;
    --blanco: #FFFFFF;
    /* Acentos de marca nuevos (de pedidos/index.html) — solo para
       momentos de marca (títulos de sección, login, checkboxes), nunca
       para nada que ya signifique un estado (eso sigue en verde/
       terracota/azul de arriba). */
    --teal: #274652;
    --teal-bg: #E7EDEE;
    --dorado: #D6A23A;
    --dorado-bg: #FBF0DA;
    /* Serif de exhibición — SOLO para el login (una vez por sesión, no
       texto denso) — igual disciplina que en pedidos/index.html. */
    --serif: 'Fraunces', Georgia, serif;
  }
  * { box-sizing: border-box; }
  /* Nada de movimiento lateral en celular (2026-09-23, Juan lo reportó
     probando en su teléfono) — sin esto, el "rebote" que hacen iOS/Android
     al llegar al borde de la pantalla (overscroll) se sentía como que la
     app entera se corría hacia el lado. overflow-x:hidden es la red de
     seguridad (nunca aparece una barra de scroll horizontal aunque algo se
     desborde por error); overscroll-behavior-x:none apaga puntual el
     rebote lateral. Las tiras que SÍ se deslizan a propósito de lado a
     lado (el clima de 5 días, las pestañas de Maquila) siguen funcionando
     igual — tienen su propio overflow-x:auto, esto solo aplica al documento.
     */
  html, body { overflow-x: hidden; overscroll-behavior-x: none; }
  body {
    margin: 0;
    background: var(--crema);
    color: var(--cafe);
    font-family: 'Outfit', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    font-size: 17px; line-height: 1.55;
  }
  .app-shell { display: grid; grid-template-columns: 250px 1fr; min-height: 100vh; }

  .sidebar {
    background: var(--blanco); border-right: 1px solid var(--linea);
    display: flex; flex-direction: column; padding: 18px 14px;
    position: sticky; top: 0; height: 100vh; overflow-y: auto;
    transition: width .18s ease;
  }
  .sidebar-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-bottom: 18px; }
  .sidebar-quick-actions { display: flex; gap: 8px; justify-content: flex-end; margin-bottom: 12px; }
  .sidebar-brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .mark {
    display: inline-flex; align-items: center; background: var(--blanco); flex-shrink: 0;
    border-radius: 50%; border: 1px solid var(--linea); overflow: hidden; width: 40px; height: 40px;
  }
  .mark img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .brand-text { min-width: 0; overflow: hidden; }
  .brand-name { font-weight: 800; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sub { font-size: 11px; color: var(--cafe-soft); white-space: nowrap; }
  .sidebar-toggle {
    background: none; border: 1px solid var(--linea); border-radius: 8px; width: 26px; height: 26px;
    cursor: pointer; color: var(--cafe-soft); flex-shrink: 0; font-size: 14px;
  }

  .sidebar-links { display: flex; flex-direction: column; gap: 3px; flex: 1; }
  .sidebar-links button {
    display: flex; align-items: center; gap: 11px; text-align: left; width: 100%;
    background: none; border: none; font-family: 'Outfit', sans-serif;
    font-size: 15.5px; font-weight: 600; color: var(--cafe-soft);
    padding: 11px 12px; border-radius: 10px; cursor: pointer; white-space: nowrap;
    transition: background .15s, color .15s;
  }
  .sidebar-links button:hover { background: var(--crema-alt); }
  .sidebar-links button.active { color: #fff; background: var(--cafe); }
  .sidebar-links button .ico { font-size: 18px; width: 20px; text-align: center; flex-shrink: 0; }

  .sidebar-footer { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--linea); }
  .sync-indicator {
    display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; font-weight: 600;
    color: var(--verde); background: var(--verde-bg); padding: 5px 8px; border-radius: 12px; white-space: nowrap;
  }
  .sync-dot { width: 6px; height: 6px; background: var(--verde); border-radius: 50%; flex-shrink: 0; }
  .sync-retry { font-family: 'Outfit', sans-serif; font-size: 10px; font-weight: 700; color: inherit; background: rgba(255,255,255,.6); border: none; border-radius: 8px; padding: 2px 6px; margin-left: 2px; cursor: pointer; }
  .pasos-cosecha { display: inline-flex; gap: 3px; vertical-align: middle; margin-left: 6px; }
  .pasos-cosecha .paso { width: 6px; height: 6px; border-radius: 50%; background: var(--linea); display: inline-block; }
  .pasos-cosecha .paso.activo { background: var(--verde); }
  .btn-campana {
    position: relative; background: var(--blanco); border: 1px solid var(--linea); font-size: 15px;
    padding: 6px 9px; border-radius: 8px; cursor: pointer;
  }
  .campana-badge {
    position: absolute; top: -6px; right: -6px; background: var(--terracota); color: #fff;
    font-size: 10px; font-weight: 800; min-width: 17px; height: 17px; border-radius: 9px;
    display: flex; align-items: center; justify-content: center; padding: 0 4px;
  }

  /* Sidebar colapsado (escritorio): queda como riel de íconos */
  .sidebar.collapsed { width: 68px; }
  .sidebar.collapsed .txt, .sidebar.collapsed .brand-text, .sidebar.collapsed .sync-indicator .txt { display: none; }
  .sidebar.collapsed .sidebar-top { justify-content: center; }
  .sidebar.collapsed .sidebar-toggle { transform: rotate(180deg); }
  .sidebar.collapsed .sidebar-links button { justify-content: center; padding: 11px 4px; }
  .sidebar.collapsed .sidebar-quick-actions { flex-direction: column; align-items: center; }
  .sidebar.collapsed .sync-indicator { justify-content: center; padding: 5px; }

  .app-main { padding: 22px 28px 80px; max-width: 1400px; }

  .mobile-menu-btn, .sidebar-overlay, .bottom-nav-movil { display: none; }

  @media (max-width: 860px) {
    .app-shell { display: block; }
    .sidebar {
      position: fixed; top: 0; left: 0; height: 100vh; width: 270px; z-index: 60;
      transform: translateX(-100%); transition: transform .25s ease; box-shadow: 6px 0 24px rgba(0,0,0,.18);
    }
    .sidebar.open { transform: translateX(0); }
    .sidebar.collapsed { width: 270px; }
    .sidebar.collapsed .txt, .sidebar.collapsed .sync-indicator .txt { display: inline; }
    .sidebar.collapsed .brand-text { display: block; }
    .sidebar.collapsed .sidebar-links button { justify-content: flex-start; padding: 11px 12px; }
    .sidebar.collapsed .sidebar-quick-actions { flex-direction: row; justify-content: flex-end; }
    .sidebar-toggle { display: none; }
    .mobile-menu-btn {
      display: flex; align-items: center; justify-content: center; position: sticky;
      top: calc(66px + env(safe-area-inset-top)); left: 12px;
      width: 44px; height: 44px; border-radius: 10px; background: var(--blanco); border: 1px solid var(--linea);
      font-size: 19px; cursor: pointer; z-index: 40; margin: 12px 0 0 12px;
    }
    .sidebar-overlay.show {
      display: block; position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 55;
    }
    .app-main { padding: calc(66px + env(safe-area-inset-top)) 14px 24px; }
    .controles-globales input[type="month"] { flex-basis: 128px; }

    /* Accesos directos a lo que más se usa en celular, para no tener que
       abrir el cajón lateral cada vez que se cambia de sección. Arriba en
       vez de abajo para no chocar con la barra de gestos/menú del celular. */
    .bottom-nav-movil {
      display: flex; position: fixed; left: 0; right: 0; top: 0; z-index: 56;
      background: var(--blanco); border-bottom: 1px solid var(--linea);
      box-shadow: 0 4px 16px rgba(0,0,0,.08);
      padding: calc(4px + env(safe-area-inset-top)) 4px 4px;
    }
    .bottom-nav-movil button {
      flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 2px;
      background: none; border: none; font-family: 'Outfit', sans-serif;
      font-size: 11.5px; font-weight: 600; color: var(--cafe-soft); padding: 7px 1px; border-radius: 10px;
      position: relative; overflow: hidden;
    }
    .bottom-nav-movil button span:last-child {
      display: block; width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .bottom-nav-movil button.active { color: var(--cafe); background: var(--crema-alt); }
    .bottom-nav-movil button .ico { font-size: 20px; position: relative; }
    .bottom-nav-movil .campana-badge { top: -4px; right: -10px; }
  }

  /* En pantallas angostas, .main (nombre/fecha/detalle de una fila) podía
     terminar compartiendo su línea de flex-wrap con la etiqueta de
     Pagado/Pendiente (porque las dos juntas SÍ alcanzaban a caber, según
     el ancho "hipotético" que usa flexbox para decidir el salto de línea)
     — eso lo aplastaba a ~230px de ancho aunque la fila completa tuviera
     347px, y un detalle largo (varios ítems en un mismo pedido) quedaba
     partido en una palabra por línea, larguísimo y difícil de leer.
     flex-basis: 100% obliga a que .main SIEMPRE ocupe su propia línea
     completa aquí — la etiqueta/monto/botones bajan juntos a la línea de
     abajo. Solo en pantallas angostas: en escritorio (fila más ancha) todo
     cabe cómodo en una sola línea y no hace falta forzar el salto. */
  @media (max-width: 600px) {
    .ledger-row .main { flex-basis: 100%; }
  }

  /* ---------- Alertas ---------- */

  /* ---------- Pantalla de acceso ---------- */
  #lockScreen {
    position: fixed; inset: 0; background: var(--cafe);
    display: flex; align-items: center; justify-content: center;
    z-index: 100; padding: 20px;
  }
  #lockScreen .box {
    background: var(--crema); border-radius: 14px; padding: 32px 26px;
    max-width: 320px; width: 100%; text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,.35);
  }
  /* Serif solo acá — se ve UNA vez por sesión (login), no es texto denso
     que alguien lea rápido 200 veces al día como .section-title. */
  #lockScreen h1 { font-family: var(--serif); font-weight: 600; font-size: 28px; margin: 10px 0 4px; color: var(--cafe); }
  #lockScreen p { font-size: 13px; color: var(--cafe-soft); margin: 0 0 18px; }
  #lockScreen input {
    width: 100%; padding: 12px 14px; border-radius: 8px; border: 1px solid var(--linea);
    font-family: 'Outfit', sans-serif; font-size: 15px; margin-bottom: 10px; text-align: center;
  }
  #lockScreen button {
    width: 100%; padding: 12px; border: none; border-radius: 8px; background: var(--cafe);
    color: #fff; font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 14px; cursor: pointer;
  }
  #lockScreen .err { color: var(--terracota); font-size: 12.5px; min-height: 16px; margin-top: 8px; }

  #app { display: none; }

  /* ---------- Alerta de stock ---------- */
  #stockAlert {
    display: none; background: var(--terracota-bg); border: 1px solid var(--terracota);
    color: var(--terracota); border-radius: 8px; padding: 10px 12px; font-size: 12.5px;
    font-weight: 600; margin-bottom: 14px;
  }
  #exportReminder {
    display: none; background: var(--crema-alt); border: 1px solid var(--linea);
    color: var(--cafe-soft); border-radius: 8px; padding: 10px 12px; font-size: 12.5px;
    font-weight: 600; margin-bottom: 14px; display: none; align-items: center; justify-content: space-between; gap: 8px;
  }
  #exportReminder button { font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 11.5px; background: var(--cafe); color: #fff; border: none; border-radius: 20px; padding: 6px 12px; cursor: pointer; flex: 0 0 auto; }
  #envioAlert {
    display: none; background: var(--azul-bg); border: 1px solid var(--azul);
    color: var(--azul); border-radius: 8px; padding: 10px 12px; font-size: 12.5px;
    font-weight: 600; margin-bottom: 14px; cursor: pointer;
  }

  /* ---------- Controles globales ----------
     Se probó fijo arriba al hacer scroll (sticky) para no tener que subir
     hasta el principio para buscar, pero Juan no quería que la barra
     quedara "moviéndose" todo el tiempo en cada pestaña — se volvió a la
     posición normal, y en cambio buscar abre un modal aparte (ver
     abrirBusquedaModal) que no toca el scroll de la página de atrás. */
  .controles-globales { display: flex; gap: 8px; margin-bottom: 14px; }
  .controles-globales input[type="month"] {
    flex: 0 0 160px; padding: 12px 12px; border: 1px solid var(--linea); border-radius: 10px;
    font-family: 'Outfit', sans-serif; font-size: 15px; background: var(--blanco); color: var(--cafe);
  }
  .busqueda-wrap { position: relative; flex: 1; min-width: 0; display: flex; align-items: center; }
  .busqueda-wrap .icono-lupa {
    position: absolute; left: 12px; font-size: 15px; opacity: .55; pointer-events: none;
  }
  .controles-globales input[type="search"] {
    width: 100%; padding: 12px 12px 12px 36px; border: 1px solid var(--linea); border-radius: 10px;
    font-family: 'Outfit', sans-serif; font-size: 15px; background: var(--blanco); cursor: pointer;
  }

  /* Vuelve al look de rectángulos parejos de siempre (2026-09-24, Juan
     lo prefería — la versión en pills se sentía "menos visual, más
     perdida") pero CONSERVA flex-wrap: el bug real era que, sin wrap,
     con 5 pestañas y textos largos ("Cereza comprada (1)") al lado de
     uno corto ("Café verde"), flexbox no dejaba encoger los botones más
     allá del ancho mínimo de su texto (min-width:auto por defecto en un
     flex item, mismo gotcha ya documentado para .ledger-row) y el
     último quedaba fuera de la pantalla en celular. Con flex-wrap
     puesto, mientras quepan en una fila se siguen repartiendo parejo
     (flex:1 sigue estirando los de cada línea) — solo cuando de verdad
     no caben bajan a una segunda fila, en vez de desbordar. */
  .subtabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .subtabs button {
    flex: 1; background: var(--crema-alt); border: 1px solid var(--linea); color: var(--cafe-soft);
    font-family: 'Outfit', sans-serif; font-size: 14px; font-weight: 700; padding: 12px 6px;
    border-radius: 8px; cursor: pointer;
  }
  .subtabs button.active { background: var(--cafe); color: #fff; border-color: var(--cafe); }

  section.view { display: none; }
  section.view.active { display: block; }

  /* ---------- Tarjetas / formularios ---------- */
  .card {
    background: var(--blanco); border: 1px solid var(--linea); border-radius: 18px;
    padding: 20px; margin-bottom: 22px; box-shadow: 0 3px 14px rgba(62,39,35,.05);
  }
  .row { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .row:last-child { margin-bottom: 0; }
  .field { flex: 1; min-width: 120px; display: flex; flex-direction: column; gap: 3px; }
  .field label { font-size: 14px; color: var(--cafe-soft); font-weight: 600; letter-spacing: .01em; }
  .field input, .field select {
    font-family: 'Outfit', sans-serif; font-size: 16px; padding: 11px 12px; border: 1px solid var(--linea);
    border-radius: 6px; background: var(--blanco); color: var(--cafe); width: 100%;
  }
  .field input:focus, .field select:focus { outline: 2px solid var(--cafe); outline-offset: -1px; }
  /* Subtarjeta dentro de una .card — agrupa visualmente un paso del
     formulario (ej. "agregar café" vs. "cerrar la venta") para que no se
     vea como una sola lista larga de campos sin separación. Mismo fondo
     que ya se usa en el resto de la app para resaltar bloques (--crema-alt),
     nada nuevo. 2026-09-23, primer pase en Ventas. */
  .subcard { background: var(--crema-alt); border: 1px solid var(--linea); border-radius: 14px; padding: 16px; margin-bottom: 16px; }
  .subcard-titulo { font-size: 12px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; color: var(--teal); margin: 0 0 12px; }
  .campo-ayuda { font-size: 12px; color: var(--cafe-soft); margin: -4px 0 10px; line-height: 1.4; }
  /* Los checkboxes sin estilo del navegador salen ~13px — muy chicos para
     tocar con precisión; se agrandan y se les pone el color de la marca. */
  input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--dorado); cursor: pointer; }

  .servicios-maquila { display: flex; flex-direction: column; gap: 0; margin: 8px 0; }
  .servicios-maquila .srow {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    font-size: 13.5px; font-weight: 600; padding: 9px 2px; border-bottom: 1px solid var(--linea);
  }
  .servicios-maquila .srow input[type="number"] { width: 100px; flex: 0 0 auto; }
  .servicios-maquila .srow-pres select { flex: 1; min-width: 0; padding: 7px 8px; border: 1px solid var(--linea); border-radius: 6px; font-family: 'Outfit', sans-serif; font-size: 13px; }
  .servicios-maquila .srow-pres input[type="number"] { width: 70px; }

  button.add-btn {
    font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 16px; background: var(--terracota);
    color: #fff; border: none; border-radius: 30px; padding: 16px 18px; cursor: pointer; width: 100%;
    box-shadow: 0 4px 14px rgba(173,75,49,.28);
    transition: transform .12s ease, background .15s ease;
  }
  button.add-btn:hover { background: #93402a; }
  /* Feedback de toque (2026-09-21, mismo patrón que pedidos/index.html) —
     confirma que el toque registró, sobre todo útil para Juan/Inés (65
     años) en celular. 100-150ms: es respuesta a un toque, tiene que
     sentirse inmediata, no una animación decorativa lenta. */
  button.add-btn:active { transform: scale(.97); }
  button.add-btn:disabled { opacity: .55; cursor: not-allowed; box-shadow: none; }
  button.sec-btn {
    font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 14px; background: var(--blanco);
    border: 1px solid var(--cafe); color: var(--cafe); padding: 10px 16px; border-radius: 30px; cursor: pointer;
    transition: transform .12s ease, background .15s ease, color .15s ease;
  }
  button.sec-btn:hover { background: var(--cafe); color: #fff; }
  button.sec-btn:active { transform: scale(.97); }

  /* ---------- Listas tipo libro ---------- */
  .ledger { border-top: 1px solid var(--linea); }
  .ledger-row {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 15px 4px; border-bottom: 1px solid var(--linea);
    font-size: 16.5px;
  }
  .ledger-row.deuda-anterior { background: var(--terracota-bg); border-radius: 6px; padding: 11px 8px; margin-bottom: 4px; border-bottom: none; }
  .ledger-row .main { flex: 1 1 180px; min-width: 0; }
  .ledger-row .main .title { font-weight: 700; }
  .ledger-row .main .meta { font-size: 14px; color: var(--cafe-soft); margin-top: 3px; }
  .ledger-row .main .details { font-size: 14px; color: var(--cafe); margin-top: 2px; font-style: italic; opacity: .8; }
  /* Pagos parciales por paquete (solo Distribuidor) — dentro de .main
     para no sumarse como otro hijo flex de .ledger-row (mismo tipo de
     problema de ancho que ya pasó con .tag/.amount/.acciones). */
  .pagado-stepper { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 13px; color: var(--cafe-soft); }
  .pagado-stepper button {
    background: var(--crema-alt); border: 1px solid var(--linea); color: var(--cafe);
    font-size: 16px; font-weight: 700; cursor: pointer; border-radius: 8px;
    min-width: 32px; min-height: 32px; display: inline-flex; align-items: center; justify-content: center;
  }
  .pagado-stepper button:disabled { opacity: .4; cursor: not-allowed; }
  .ledger-row .amount { font-weight: 700; font-size: 17.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .ledger-row .amount.pos { color: var(--verde); }
  .ledger-row .amount.neg { color: var(--terracota); }
  /* Botones de acción (✎✕⚖️🌾⏱️📋) — mínimo 44px, el tamaño de tap
     recomendado para dedos menos precisos; más separación entre ellos
     para no tocar el de al lado por error. */
  .ledger-row .acciones { display: flex; gap: 8px; align-items: center; }
  .ledger-row .acciones button {
    background: var(--crema-alt); border: 1px solid var(--linea); color: var(--cafe);
    font-size: 19px; cursor: pointer; padding: 8px 10px; border-radius: 8px; gap: 5px;
    min-width: 44px; min-height: 44px; display: inline-flex; align-items: center; justify-content: center;
  }
  .ledger-row .acciones button:hover, .ledger-row .acciones button:active { background: var(--terracota); color: #fff; border-color: var(--terracota); }
  /* Texto visible junto al ícono, SOLO desde 700px — bajo eso queda el
     mismo ícono-solo de siempre. En celular (donde ya se documentó que
     4 botones con etiqueta completa se desbordan) nada cambia; en
     escritorio/tablet, donde sí hay espacio, ayuda a no tener que
     recordar qué hace cada ícono (pedido de la auditoría CRO, pensado
     sobre todo para Juan/Inés, 65+ años). Empieza solo en la fila de
     Cosecha (⏱️⚖️🌾✕, la más cargada) — el mismo `.accion-texto` sirve
     para sumar las demás filas después, sin riesgo nuevo de layout. */
  .ledger-row .acciones .accion-texto { display: none; }
  @media (min-width: 700px) {
    .ledger-row .acciones .accion-texto { display: inline; font-size: 13px; font-weight: 600; }
    .ledger-row .acciones button { padding: 8px 14px; }
  }

  .tag { display: inline-block; font-size: 14px; font-weight: 700; padding: 7px 14px; border-radius: 20px; cursor: pointer; border: none; transition: transform .12s ease; }
  .tag:active { transform: scale(.95); }
  .tag.pendiente { background: #F2E2C4; color: #8A6A1F; }
  .tag.pagado { background: var(--verde-bg); color: var(--verde); }
  .tag.envio-pendiente { background: var(--azul-bg); color: var(--azul); }
  .tag.envio-enviado { background: var(--verde-bg); color: var(--verde); }
  .badge-web {
    display: inline-block; background: var(--azul-bg); color: var(--azul);
    font-size: 10.5px; font-weight: 800; padding: 2px 8px; border-radius: 10px; vertical-align: middle;
  }
  .badge-origen {
    display: inline-block; font-size: 12px; padding: 1px 6px; border-radius: 10px; vertical-align: middle;
  }
  .badge-origen.casa { background: var(--verde-bg); }
  .badge-origen.comprado { background: var(--azul-bg); }
  .ledger-row.envio-pendiente:not(.deuda-anterior) { background: var(--azul-bg); border-radius: 6px; padding: 11px 8px; margin-bottom: 4px; border-bottom: none; }

  .empty { text-align: center; color: var(--cafe-soft); font-size: 15px; padding: 32px 12px; }

  h3.section-title { font-size: 18px; font-weight: 700; margin: 22px 0 10px; color: var(--teal); }

  /* ---------- Inventario ---------- */
  .lote-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 18px; }
  .lote-card {
    background: var(--blanco); border: 1px solid var(--linea); border-radius: 18px; padding: 16px;
    box-shadow: 0 3px 14px rgba(62,39,35,.05); text-align: center;
  }
  .lote-card .icono {
    width: 46px; height: 46px; border-radius: 50%; background: var(--verde-bg); color: var(--verde);
    display: flex; align-items: center; justify-content: center; font-size: 20px; margin: 0 auto 8px;
  }
  .lote-card.bajo { background: var(--terracota-bg); border-color: var(--terracota); }
  .lote-card.bajo .icono { background: var(--terracota); color: #fff; }
  .lote-card .nombre { font-weight: 700; font-size: 14px; }
  .lote-card .stock { font-size: 20px; font-weight: 800; margin-top: 2px; }
  .lote-card.bajo .stock { color: var(--terracota); }
  .lote-card button.sec-btn { margin-top: 10px; width: 100%; }

  /* ---------- Clima de la finca (Trazabilidad) ---------- */
  .clima-dias { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 14px; }
  .clima-dia {
    flex: 1 0 76px; background: var(--blanco); border: 1px solid var(--linea); border-radius: 14px;
    padding: 10px 6px; text-align: center; box-shadow: 0 3px 14px rgba(62,39,35,.05);
  }
  .clima-dia .clima-fecha { font-size: 12px; font-weight: 700; text-transform: capitalize; }
  .clima-dia .clima-icono { font-size: 22px; margin: 4px 0; }
  .clima-dia .clima-lluvia { font-size: 12px; color: var(--cafe-soft); }
  .clima-dia .clima-temp { font-size: 13px; font-weight: 600; margin-top: 2px; }

  /* ---------- Resumen ---------- */
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 18px; }
  .stat { background: var(--blanco); border: 1px solid var(--linea); border-radius: 14px; padding: 16px 18px; box-shadow: 0 3px 14px rgba(62,39,35,.05); }
  .stat .n { font-weight: 800; font-size: 23px; }
  .stat .n.pos { color: var(--verde); } .stat .n.neg { color: var(--terracota); }
  .stat .l { font-size: 13px; color: var(--cafe-soft); margin-top: 4px; }
  .bar-row { display: flex; align-items: center; gap: 8px; font-size: 12.5px; margin-bottom: 6px; }
  .bar-row .lbl { flex: 0 0 90px; }
  .bar-track { flex: 1; background: var(--crema-alt); border-radius: 6px; height: 14px; overflow: hidden; }
  .bar-fill { background: var(--terracota); height: 100%; border-radius: 6px; }
  .bar-row .val { flex: 0 0 90px; text-align: right; font-weight: 600; }

  /* ---------- Config / Maquila ---------- */
  .tarifa-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--linea); }
  .tarifa-row .nombre { flex: 1; font-weight: 600; font-size: 14px; }
  .tarifa-row input { width: 110px; padding: 7px 9px; border: 1px solid var(--linea); border-radius: 6px; font-family: 'Outfit', sans-serif; }
  .tarifa-row button { flex: 0 0 auto; }







  /* ---------- Panel de rendimientos aprendidos ---------- */
  .rend-card {
    background: var(--blanco); border: 1px solid var(--linea); border-radius: 14px;
    padding: 18px; margin-bottom: 18px; box-shadow: 0 3px 14px rgba(62,39,35,.05);
  }
  .rend-card h4 { margin: 0 0 4px; font-size: 16px; font-weight: 700; }
  .rend-intro { font-size: 13px; color: var(--cafe-soft); margin: 0 0 14px; }
  .rend-fila { padding: 11px 0; border-top: 1px solid var(--linea); }
  .rend-nombre { font-size: 14.5px; font-weight: 700; }
  .rend-valor { font-size: 21px; font-weight: 800; color: var(--cafe-soft); margin: 2px 0; }
  .rend-valor.aprendido { color: var(--verde); }
  .rend-estado { font-size: 12.5px; color: var(--cafe-soft); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .badge-real { background: var(--verde); color: #fff; font-size: 11px; font-weight: 800; padding: 3px 9px; border-radius: 20px; }
  .badge-gen { background: var(--crema-alt); color: var(--cafe-soft); font-size: 11px; font-weight: 800; padding: 3px 9px; border-radius: 20px; }

  /* ---------- Cadena de proyección del café ---------- */
  .preview-cadena:not(:empty) {
    background: var(--verde-bg); border: 1px solid var(--verde); border-radius: 12px;
    padding: 12px 14px; margin: 4px 0 12px;
  }
  .cadena { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 14px; color: var(--verde); }
  .cadena b { font-size: 16px; }
  .cadena i { font-style: normal; opacity: .5; font-weight: 700; }
  .cadena .destacado { background: var(--verde); color: #fff; padding: 3px 12px; border-radius: 20px; }
  .cadena-nota { font-size: 12.5px; color: var(--verde); margin-top: 8px; font-weight: 600; opacity: .85; }
  .cadena-nota.alerta { color: var(--terracota); opacity: 1; }

  /* ---------- Tabla de mejores clientes ---------- */
  .tabla-clientes { background: var(--blanco); border: 1px solid var(--linea); border-radius: 14px; overflow: hidden; margin-bottom: 16px; }
  .fila-cliente {
    display: grid; grid-template-columns: 1.6fr .7fr 1.1fr .9fr; gap: 8px;
    padding: 12px 14px; border-bottom: 1px solid var(--linea); font-size: 14px; align-items: center;
  }
  .fila-cliente:last-child { border-bottom: none; }
  .fila-cliente.encabezado { background: var(--crema-alt); font-size: 12.5px; font-weight: 700; color: var(--cafe-soft); }
  .fila-cliente .nombre { font-weight: 700; overflow: hidden; text-overflow: ellipsis; }
  .fila-cliente .dinero { font-weight: 700; color: var(--verde); font-variant-numeric: tabular-nums; }
  /* "Por modalidad / cuenta" solo tiene 2 columnas reales (a diferencia de
     las otras tablas de .tabla-clientes, que tienen 4) — sin esto hereda
     el grid de 4 columnas y deja la mitad derecha de la fila vacía. */
  .fila-cliente.fila-modalidad { grid-template-columns: 2fr 1fr; }

  /* ---------- Autocompletado de clientes ---------- */
  .autocomplete-wrap { position: relative; }
  .sugerencias {
    position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 40;
    background: var(--blanco); border: 1px solid var(--linea); border-radius: 12px;
    box-shadow: 0 10px 30px rgba(62,39,35,.16); max-height: 280px; overflow-y: auto;
  }
  .sugerencias button {
    display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
    width: 100%; text-align: left; background: none; border: none;
    border-bottom: 1px solid var(--linea); padding: 11px 14px; cursor: pointer;
    font-family: 'Outfit', sans-serif;
  }
  .sugerencias button:last-child { border-bottom: none; }
  .sugerencias button:hover { background: var(--crema-alt); }
  .sugerencias .sug-nombre { font-size: 15px; font-weight: 700; color: var(--cafe); }
  .sugerencias .sug-detalle { font-size: 12.5px; color: var(--cafe-soft); font-weight: 600; }

  /* ---------- Órdenes en paralelo ---------- */
  .orden-card { margin-bottom: 22px; }
  .orden-tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 12px; margin-bottom: 12px; border-bottom: 1px solid var(--linea); -webkit-overflow-scrolling: touch; }
  .orden-tabs button {
    flex: 0 0 auto; position: relative; background: var(--crema-alt); border: 1px solid var(--linea); color: var(--cafe-soft);
    font-family: 'Outfit', sans-serif; font-size: 13px; font-weight: 700; cursor: pointer;
    padding: 9px 14px; border-radius: 20px; white-space: nowrap;
  }
  .orden-tabs button.active { background: var(--cafe); color: #fff; border-color: var(--cafe); }
  .orden-tabs button.add-orden { background: var(--verde-bg); color: var(--verde); border-color: var(--verde); font-size: 18px; font-weight: 800; padding: 9px 16px; }
  .orden-tabs .badge {
    display: inline-flex; align-items: center; justify-content: center; margin-left: 6px;
    background: var(--terracota); color: #fff; font-size: 10.5px; font-weight: 800;
    min-width: 17px; height: 17px; border-radius: 9px; padding: 0 4px;
  }
  .orden-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
  .cerrar-orden {
    flex: 0 0 auto; background: none; border: 1px solid var(--linea); color: var(--cafe-soft);
    font-family: 'Outfit', sans-serif; font-size: 13px; font-weight: 600;
    padding: 7px 14px; border-radius: 20px; cursor: pointer;
  }
  .cerrar-orden:hover { background: var(--terracota-bg); color: var(--terracota); border-color: var(--terracota); }

  .cliente-hint {
    font-size: 12.5px; font-weight: 600; color: var(--verde);
    background: var(--verde-bg); border-radius: 8px; padding: 6px 10px; margin-top: 5px;
  }

  /* ---------- Toasts ---------- */
  #toastWrap {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: 22px;
    z-index: 200; display: flex; flex-direction: column; gap: 8px; align-items: center;
    pointer-events: none; width: calc(100% - 28px); max-width: 420px;
  }
  .toast {
    background: var(--cafe); color: #fff; padding: 14px 18px; border-radius: 12px;
    font-size: 15px; font-weight: 600; box-shadow: 0 8px 28px rgba(62,39,35,.28);
    width: 100%; text-align: center; animation: toastIn .18s ease-out;
  }
  .toast.error { background: var(--terracota); }
  @keyframes toastIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  /* ---------- Gráficos ---------- */
  .chart-card {
    background: var(--blanco); border: 1px solid var(--linea); border-radius: 14px;
    padding: 16px 14px; margin-bottom: 16px; box-shadow: 0 3px 14px rgba(62,39,35,.05);
  }
  .chart-card h4 { margin: 0 0 12px; font-size: 15px; font-weight: 700; }
  .chart-box { position: relative; height: 240px; }

  /* ---------- Selector de rango ---------- */
  .rangos { display: flex; gap: 6px; margin-bottom: 16px; }
  .rangos button {
    flex: 1; background: var(--blanco); border: 1px solid var(--linea); color: var(--cafe-soft);
    font-family: 'Outfit', sans-serif; font-size: 13.5px; font-weight: 700; padding: 11px 4px;
    border-radius: 10px; cursor: pointer;
  }
  .rangos button.active { background: var(--verde); color: #fff; border-color: var(--verde); }

  /* ---------- Paginación ---------- */
  .paginacion { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 14px 0 4px; flex-wrap: wrap; }
  .paginacion button {
    background: var(--blanco); border: 1px solid var(--linea); color: var(--cafe);
    font-family: 'Outfit', sans-serif; font-size: 14px; font-weight: 700;
    padding: 9px 16px; border-radius: 20px; cursor: pointer;
  }
  .paginacion button:disabled { opacity: .4; cursor: not-allowed; }
  .paginacion .pag-info { font-size: 13.5px; color: var(--cafe-soft); font-weight: 600; }
  .paginacion .pag-select {
    background: var(--blanco); border: 1px solid var(--linea); color: var(--cafe);
    font-family: 'Outfit', sans-serif; font-size: 13.5px; font-weight: 600;
    padding: 9px 10px; border-radius: 20px; cursor: pointer; max-width: 45vw;
  }
  .pag-total { text-align: center; font-size: 12px; color: var(--cafe-soft); font-weight: 600; padding-bottom: 8px; }

  /* ---------- Modal edición ---------- */
  #modalOverlay {
    display: none; position: fixed; inset: 0; background: rgba(62,39,35,.45); z-index: 90;
    align-items: flex-end; justify-content: center;
  }
  #modalOverlay.show { display: flex; }
  #modalBox {
    background: var(--crema); width: 100%; max-width: 480px; border-radius: 16px 16px 0 0;
    padding: 20px 16px 24px; max-height: 85vh; overflow-y: auto;
  }
  #modalBox h3 { margin: 0 0 12px; font-size: 16px; }
  .modal-actions { display: flex; gap: 8px; margin-top: 14px; }
  .modal-actions button.add-btn { flex: 1; }

  @media (min-width: 480px) {
    #modalOverlay { align-items: center; }
    #modalBox { border-radius: 16px; }
  }
</style>
</head>

/* ---------- Cadena del café: cereza -> pergamino -> verde -> tostado ----------
   Factores aproximados de Café Pandora. Si con el tiempo ves que tu finca
   rinde distinto, se cambian aquí (o pídeme que los haga editables desde
   Configuración). */
const RENDIMIENTO = {
  cerezaAPergamino: 12.5 / 60,  // 60 kg de cereza dan ~12,5 kg de pergamino seco
  pergaminoAVerde: 10.4 / 12.5, // al trillar, de 12,5 kg salen ~10,4 kg de verde
  mermaTueste: 0.13,            // el tueste pierde ~13% del peso
};
const KG_POR_LIBRA_VENTA = 0.5; // la "libra" de Café Pandora son 500 g exactos

// Días aproximados de secado desde la cosecha, según el proceso.
const DIAS_SECADO = { Lavado: 7, Honey: 21, Natural: 35, Exotico: 35 };

// Un cliente que ya compró 3+ veces (no es alguien probando) y lleva este
// número de días o más sin volver a comprar café, se marca como "en riesgo
// de fuga" en Resumen — ver clientesEnRiesgo().
const DIAS_RIESGO_FUGA = 60;
// Ventana de días hacia atrás para calcular qué tan rápido se está
// vendiendo cada lote, y así proyectar cuánto dura el stock — ver
// velocidadVentaLote().
const DIAS_VELOCIDAD_INVENTARIO = 30;

/* ---------- Rendimientos aprendidos de tus propios datos ----------
   Los factores de arriba son el punto de partida genérico. A medida que
   pesas pergamino real, verde real tras trillar, y registras tuestes, la app
   calcula el rendimiento VERDADERO de Café Pandora y lo usa para proyectar.
   Hace falta un mínimo de registros para que el promedio signifique algo. */
const MIN_MUESTRAS = { cerezaAPergamino: 2, pergaminoAVerde: 2, mermaTueste: 3 };

function rendimientosReales() {
  // 1) Cereza -> pergamino: cosechas propias y cereza comprada donde ya
  // pesaste el pergamino — el secado es el mismo proceso sin importar de
  // dónde vino la cereza.
  const conPergamino = [...state.cosechas, ...state.cerezaComprada]
    .filter(c => c.kilosPergaminoReal > 0 && c.kilosCereza > 0);
  const cerezaTotal = conPergamino.reduce((s, c) => s + Number(c.kilosCereza), 0);
  const pergaminoTotal = conPergamino.reduce((s, c) => s + Number(c.kilosPergaminoReal), 0);

  // 2) Pergamino -> verde: cosechas, cereza comprada y pergamino comprado
  // donde anotaste el verde tras trillar.
  const trilladas = [
    ...state.cosechas.filter(c => c.kilosVerdeReal > 0 && c.kilosPergaminoReal > 0)
      .map(c => ({ entra: Number(c.kilosPergaminoReal), sale: Number(c.kilosVerdeReal) })),
    ...state.cerezaComprada.filter(c => c.kilosVerdeReal > 0 && c.kilosPergaminoReal > 0)
      .map(c => ({ entra: Number(c.kilosPergaminoReal), sale: Number(c.kilosVerdeReal) })),
    ...state.pergamino.filter(p => p.kilosVerdeReal > 0 && p.kilosPergamino > 0)
      .map(p => ({ entra: Number(p.kilosPergamino), sale: Number(p.kilosVerdeReal) })),
  ];
  const pergEntra = trilladas.reduce((s, t) => s + t.entra, 0);
  const verdeSale = trilladas.reduce((s, t) => s + t.sale, 0);

  // 3) Merma de tueste: de los tuestes ya registrados.
  const tuestesValidos = state.tuestes.filter(t => t.kilosVerde > 0 && t.kilosTostado > 0);
  const verdeEntra = tuestesValidos.reduce((s, t) => s + Number(t.kilosVerde), 0);
  const tostadoSale = tuestesValidos.reduce((s, t) => s + Number(t.kilosTostado), 0);

  const armar = (clave, n, valor, generico) => ({
    valor: n >= MIN_MUESTRAS[clave] && valor > 0 ? valor : generico,
    generico,
    real: n >= MIN_MUESTRAS[clave] && valor > 0 ? valor : null,
    muestras: n,
    faltan: Math.max(0, MIN_MUESTRAS[clave] - n),
  });

  return {
    cerezaAPergamino: armar('cerezaAPergamino', conPergamino.length,
      cerezaTotal > 0 ? pergaminoTotal / cerezaTotal : 0, RENDIMIENTO.cerezaAPergamino),
    pergaminoAVerde: armar('pergaminoAVerde', trilladas.length,
      pergEntra > 0 ? verdeSale / pergEntra : 0, RENDIMIENTO.pergaminoAVerde),
    mermaTueste: armar('mermaTueste', tuestesValidos.length,
      verdeEntra > 0 ? 1 - tostadoSale / verdeEntra : 0, RENDIMIENTO.mermaTueste),
  };
}

// Proyecta toda la cadena a partir de kilos de cereza recién cosechada.
function proyectarDesdeCereza(kilosCereza) {
  const r = rendimientosReales();
  const pergamino = (Number(kilosCereza) || 0) * r.cerezaAPergamino.valor;
  return { pergamino, ...proyectarDesdePergamino(pergamino) };
}
// Proyecta desde pergamino (sirve igual para el café comprado).
function proyectarDesdePergamino(kilosPergamino) {
  const r = rendimientosReales();
  const verde = (Number(kilosPergamino) || 0) * r.pergaminoAVerde.valor;
  const tostado = verde * (1 - r.mermaTueste.valor);
  return { verde, tostado, libras: tostado / KG_POR_LIBRA_VENTA };
}
// Rendimiento real mes a mes (no un solo promedio de todo el histórico
// como rendimientosReales()) — para ver si el proceso mejora o empeora en
// el tiempo. Agrupa por el mes de la FECHA DE COSECHA/COMPRA (no hay un
// campo separado de "cuándo se pesó"), así que es una aproximación: un
// registro pesado varias semanas después de cosechado igual cuenta en el
// mes de la cosecha, no en el del pesaje.
function tendenciaRendimientosPorMes(meses) {
  const porMes = {};
  meses.forEach(mm => { porMes[mm] = { cereza: 0, pergamino: 0, pergEntra: 0, verdeSale: 0 }; });
  [...state.cosechas, ...state.cerezaComprada].forEach(c => {
    const mm = mesDe(c.fecha);
    if (!porMes[mm]) return;
    if (Number(c.kilosPergaminoReal) > 0 && Number(c.kilosCereza) > 0) {
      porMes[mm].cereza += Number(c.kilosCereza);
      porMes[mm].pergamino += Number(c.kilosPergaminoReal);
    }
    if (Number(c.kilosVerdeReal) > 0 && Number(c.kilosPergaminoReal) > 0) {
      porMes[mm].pergEntra += Number(c.kilosPergaminoReal);
      porMes[mm].verdeSale += Number(c.kilosVerdeReal);
    }
  });
  state.pergamino.forEach(p => {
    const mm = mesDe(p.fecha);
    if (!porMes[mm]) return;
    if (Number(p.kilosVerdeReal) > 0 && Number(p.kilosPergamino) > 0) {
      porMes[mm].pergEntra += Number(p.kilosPergamino);
      porMes[mm].verdeSale += Number(p.kilosVerdeReal);
    }
  });
  return meses.map(mm => ({
    mes: mm,
    cerezaAPergaminoPct: porMes[mm].cereza > 0 ? (porMes[mm].pergamino / porMes[mm].cereza) * 100 : null,
    pergaminoAVerdePct: porMes[mm].pergEntra > 0 ? (porMes[mm].verdeSale / porMes[mm].pergEntra) * 100 : null,
  }));
}

// Un año contra otro: facturado, egresos, balance, kilos cosechados y
// libras vendidas. Solo muestra los años donde de verdad hay algo
// registrado (ventas o cosechas) — con un negocio que apenas empieza a
// usar la app, puede salir un solo año, y está bien así.
function comparacionAnual() {
  const anios = new Set();
  state.ventas.forEach(v => anios.add(new Date(Number(v.ts)).getFullYear()));
  state.cosechas.forEach(c => anios.add(new Date(Number(c.fecha)).getFullYear()));
  state.cerezaComprada.forEach(c => anios.add(new Date(Number(c.fecha)).getFullYear()));
  return [...anios].sort().map(anio => {
    const ventasAnio = state.ventas.filter(v => new Date(Number(v.ts)).getFullYear() === anio);
    const maquilaAnio = state.ordenesMaquila.filter(o => new Date(Number(o.ts)).getFullYear() === anio);
    const gastosAnio = state.gastos.filter(g => new Date(Number(g.ts)).getFullYear() === anio && esGastoOperativo(g));
    const fincaAnio = state.finca.filter(f => new Date(Number(f.ts)).getFullYear() === anio);
    const cosechasAnio = state.cosechas.filter(c => new Date(Number(c.fecha)).getFullYear() === anio);
    const facturado = ventasAnio.reduce((s, v) => s + (Number(v.valor) || 0), 0) + maquilaAnio.reduce((s, o) => s + (Number(o.valor) || 0), 0);
    const egresos = gastosAnio.reduce((s, g) => s + (Number(g.monto) || 0), 0) + fincaAnio.reduce((s, f) => s + (Number(f.monto) || 0), 0);
    const kilosCosechados = cosechasAnio.reduce((s, c) => s + (Number(c.kilosCereza) || 0), 0);
    const librasVendidas = ventasAnio.reduce((s, v) => s + kilosDeVenta(v), 0) / KG_POR_LIBRA_VENTA;
    return { anio, facturado, egresos, balance: facturado - egresos, kilosCosechados, librasVendidas };
  });
}

function fechaSecadoEstimada(fechaCosecha, proceso) {
  const dias = DIAS_SECADO[proceso] ?? 21;
  return new Date(Number(fechaCosecha) + dias * 86400000);
}

function convertirPedidoWebAVenta(id) {

/* ---------- Directorio de clientes ----------
   Los nombres NO salen solo de la tabla "clientes" (que se llena al registrar
   ventas nuevas): se arman también con todos los nombres que aparecen en el
   historial de ventas, para que salga absolutamente todo el que ya compró. */
function listaClientes() {
  const mapa = new Map(); // clave normalizada -> { nombre, ventas: [] }
  const meter = (nombre) => {
    const clave = normalizar(nombre);
    if (!clave || GENERICOS_CLIENTE.includes(clave)) return null;
    if (!mapa.has(clave)) mapa.set(clave, { nombre: String(nombre).trim(), ventas: [] });
    return mapa.get(clave);
  };
  // El nombre "oficial" lo manda la tabla clientes; las ventas aportan el resto.
  state.clientes.forEach(c => meter(c.nombre));
  state.ventas.forEach(v => { const e = meter(v.cliente); if (e) e.ventas.push(v); });

  return [...mapa.values()].map(e => {
    const ordenadas = e.ventas.slice().sort((a, b) => b.ts - a.ts);
    const total = ordenadas.reduce((s, v) => s + (Number(v.valor) || 0), 0);
    return {
      nombre: e.nombre,
      compras: ordenadas.length,
      total,
      promedio: ordenadas.length ? total / ordenadas.length : 0,
      ultima: ordenadas[0] || null,
    };
  }).sort((a, b) => b.compras - a.compras || a.nombre.localeCompare(b.nombre));
}

// Directorio SEPARADO para maquila: solo mira las órdenes de maquila, nunca
// las ventas de café ni la tabla "clientes" — son audiencias distintas
// (quien trae su propio café a maquilar no tiene por qué mezclarse con
// quien te compra café ya tostado).
function listaClientesMaquila() {
  const mapa = new Map();
  const meter = (nombre) => {
    const clave = normalizar(nombre);
    if (!clave || GENERICOS_CLIENTE.includes(clave)) return null;
    if (!mapa.has(clave)) mapa.set(clave, { nombre: String(nombre).trim(), ordenes: [] });
    return mapa.get(clave);
  };
  state.ordenesMaquila.forEach(o => { const e = meter(o.cliente); if (e) e.ordenes.push(o); });
  return [...mapa.values()].map(e => ({
    nombre: e.nombre,
    compras: e.ordenes.length,
  })).sort((a, b) => b.compras - a.compras || a.nombre.localeCompare(b.nombre));
}
function nombreCanonicoMaquila(nombre) {
  const clave = normalizar(nombre);
  if (!clave) return String(nombre || '').trim();
  const existente = listaClientesMaquila().find(c => normalizar(c.nombre) === clave);
  return existente ? existente.nombre : String(nombre || '').trim();
}

// Todas las variantes literales (distinta mayúscula/tilde) guardadas para un
// mismo cliente — se necesitan TODAS para poder actualizarlas de una vez.
function variantesDeCliente(nombre) {
  const clave = normalizar(nombre);
  const set = new Set();
  state.clientes.forEach(c => { if (normalizar(c.nombre) === clave) set.add(c.nombre); });
  state.ventas.forEach(v => { if (normalizar(v.cliente) === clave) set.add(v.cliente); });
  return [...set];
}

const GENERICOS_CLIENTE = ['', 'venta directa', 'n/a', '-'];

function filtrarSugerenciasCliente() {
  const input = document.getElementById('v-cliente');
  const caja = document.getElementById('clienteSugerencias');
  if (!input || !caja) return;
  const q = normalizar(input.value);
  const todos = listaClientes();
  const coinciden = (q ? todos.filter(c => normalizar(c.nombre).includes(q)) : todos).slice(0, 10);

  if (!coinciden.length) { caja.style.display = 'none'; return; }
  caja.innerHTML = coinciden.map(c => {
    const metodo = c.ultima && c.ultima.metodo ? c.ultima.metodo : '';
    const detalle = c.compras
      ? `${c.compras} compra${c.compras === 1 ? '' : 's'}${metodo ? ' · ' + escapeHtml(metodo) : ''}`
      : 'sin compras registradas';
    return `<button type="button" onmousedown="elegirCliente('${escapeAttr(c.nombre).replace(/'/g, "\\'")}')">
      <span class="sug-nombre">${escapeHtml(c.nombre)}</span>
      <span class="sug-detalle">${detalle}</span>
    </button>`;
  }).join('');
  caja.style.display = 'block';
}

function elegirCliente(nombre) {
  const input = document.getElementById('v-cliente');

    orden = ordenVacia();
    orden.cliente = nombre;

/* ---------- Memoria por cliente ----------
   Si un cliente ya compró antes, casi siempre le vuelve a pagar a la misma
   persona. Buscamos su compra más reciente y proponemos ese mismo método. */
const normalizar = s => String(s || '').trim().toLowerCase()
  .normalize('NFD').replace(/[\u0300-\u036f]/g, '');

function ultimaVentaDeCliente(nombre) {
  const clave = normalizar(nombre);
  if (!clave) return null;
  return state.ventas
    .filter(v => normalizar(v.cliente) === clave)
    .sort((a, b) => b.ts - a.ts)[0] || null;
}

// Busca, entre TODAS las compras de café de ese cliente (no solo la venta
// más reciente, que puede haber sido solo maquila), la última línea de café
// que pidió — para sugerir sola su molienda y tostión habituales.
function ultimaPreferenciaCafe(nombre) {
  const clave = normalizar(nombre);
  if (!clave) return null;
  const candidatos = [];
  state.ventas.filter(v => normalizar(v.cliente) === clave).forEach(v => {
    if (v.items && v.items.length && v.items[0] && v.items[0].tipo) {
      v.items.filter(it => it.tipo === 'cafe').forEach(it => candidatos.push({ ...it, ts: v.ts }));
    } else if (v.lote) {
      candidatos.push({ lote: v.lote, molienda: null, tueste: null, ts: v.ts });
    }
  });
  candidatos.sort((a, b) => b.ts - a.ts);
  return candidatos[0] || null;
}

// Devuelve el nombre tal como quedó guardado la primera vez, para que
// "juan perez", "Juan Perez" y "JUAN PÉREZ" no se conviertan en 3 clientes.
function nombreCanonico(nombre) {
  const clave = normalizar(nombre);
  if (!clave) return String(nombre || '').trim();
  const existente = listaClientes().find(c => normalizar(c.nombre) === clave);
  return existente ? existente.nombre : String(nombre || '').trim();
}

// Se dispara al salir del campo de cliente: normaliza el nombre y precarga
// el método de pago, el tipo de cliente, y su molienda/tostión habituales.
function autocompletarDesdeCliente() {
  const input = document.getElementById('v-cliente');
  if (!input || !input.value.trim()) return;
  const canonico = nombreCanonico(input.value);
  if (canonico !== input.value) input.value = canonico;

  const ultima = ultimaVentaDeCliente(canonico);
  const prefCafe = ultimaPreferenciaCafe(canonico);
  if (!ultima && !prefCafe) return;

  if (ultima) {
    const selMetodo = document.getElementById('v-metodo');
    if (selMetodo && ultima.metodo && METODOS_PAGO.includes(ultima.metodo)) selMetodo.value = ultima.metodo;

    const selTipo = document.getElementById('v-tipoCliente');
    if (selTipo && ultima.tipoCliente && TIPOS_CLIENTE.includes(ultima.tipoCliente)) {
      const cambio = selTipo.value !== ultima.tipoCliente;
      selTipo.value = ultima.tipoCliente;
      if (cambio) recalcularLinea();
    }
  }

  const detallesHint = [];
  if (ultima) detallesHint.push('pagó con ' + (ultima.metodo || 'método sin registrar'));
  if (prefCafe) {
    const selMolienda = document.getElementById('ln-molienda');
    if (selMolienda && prefCafe.molienda && MOLIENDAS.includes(prefCafe.molienda)) selMolienda.value = prefCafe.molienda;
    const selTueste = document.getElementById('ln-tueste');
    if (selTueste && prefCafe.tueste && TUESTES_LAVADO.includes(prefCafe.tueste)) selTueste.value = prefCafe.tueste;
    const gustos = [prefCafe.molienda, prefCafe.tueste ? 'Tostión ' + prefCafe.tueste : null].filter(Boolean).join(', ');
    if (gustos) detallesHint.push('suele pedir ' + gustos);
  }

  const aviso = document.getElementById('clienteHint');
  if (aviso && detallesHint.length) {
    aviso.style.display = 'block';
    aviso.textContent = 'Cliente conocido · ' + detallesHint.join(' · ');
  }
}

// Corta una lista ya ordenada a la página actual y devuelve el HTML de las
// filas visibles más los controles de "Anterior / Siguiente".
function paginar(lista, clave, pintarFila, textoVacio) {
  if (!lista.length) return '<div class="empty">' + textoVacio + '</div>';
  const totalPaginas = Math.max(1, Math.ceil(lista.length / POR_PAGINA));
  if (paginas[clave] > totalPaginas) paginas[clave] = totalPaginas;
  const pag = paginas[clave];
  const visibles = lista.slice((pag - 1) * POR_PAGINA, pag * POR_PAGINA);
  const controles = totalPaginas > 1 ? `
    <div class="paginacion">
      <button onclick="cambiarPagina('${clave}', -1)" ${pag === 1 ? 'disabled' : ''}>‹ Anterior</button>
      <select class="pag-select" onchange="irAPagina('${clave}', this.value)">
        ${Array.from({ length: totalPaginas }, (_, i) => i + 1)
          .map(n => `<option value="${n}" ${n === pag ? 'selected' : ''}>Página ${n} de ${totalPaginas}</option>`).join('')}
      </select>
      <button onclick="cambiarPagina('${clave}', 1)" ${pag === totalPaginas ? 'disabled' : ''}>Siguiente ›</button>
    </div>
    <div class="pag-total">${lista.length} registros</div>` : '';
  return visibles.map(pintarFila).join('') + controles;
}

// Cambia de página sin saltar al inicio de la pantalla — recuerda dónde
// estabas parado y te deja ahí mismo después de repintar la lista.
function conservarScroll(cb) {
  const y = window.scrollY;
  cb();
  requestAnimationFrame(() => window.scrollTo(0, y));
}
function cambiarPagina(clave, delta) {
  conservarScroll(() => {
    paginas[clave] = Math.max(1, paginas[clave] + delta);
    renderActiva();
  });
}
function irAPagina(clave, numero) {
  conservarScroll(() => {
    paginas[clave] = Math.max(1, Number(numero) || 1);
    renderActiva();
  });
}

const fmt = n => '$' + Math.round(Number(n) || 0).toLocaleString('es-CO');
const mesDe = ts => { const d = new Date(Number(ts)); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); };
const coincide = (texto, q) => !q || String(texto || '').toLowerCase().includes(q.toLowerCase());
const hoyMes = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); };

// El tipo de cliente decide qué tarifa aplica: 'Distribuidor' usa precios de

const tierDeCliente = tipoCliente => tipoCliente === 'Distribuidor' ? 'distribuidor' : 'normal';

function precioSugerido(lote, presentacion, tipoCliente) {

  const fila = state.preciosCafe.find(p => p.lote === lote && p.presentacion === presentacion && p.tipoCliente === tier);

}

================================================================ */
const CACHE_KEYS = { ventas: 'cp_c_ventas', gastos: 'cp_c_gastos', clientes: 'cp_c_clientes', inventario: 'cp_c_inventario', maquila: 'cp_c_maquila', finca: 'cp_c_finca', preciosCafe: 'cp_c_preciosCafe', cosechas: 'cp_c_cosechas', pergamino: 'cp_c_pergamino', tuestes: 'cp_c_tuestes', ordenesMaquila: 'cp_c_ordenesMaquila', pedidosWeb: 'cp_c_pedidosWeb', cuentasCobro: 'cp_c_cuentasCobro', cerezaComprada: 'cp_c_cerezaComprada', saldosIniciales: 'cp_c_saldosIniciales', precioFnc: 'cp_c_precioFnc', costosMargen: 'cp_c_costosMargen', inventarioPergamino: 'cp_c_inventarioPergamino', inventarioVerde: 'cp_c_inventarioVerde', movimientosInventario: 'cp_c_movimientosInventario' };

function cargarCacheLocal() {
  for (const k in CACHE_KEYS) {
    try {
      const raw = localStorage.getItem(CACHE_KEYS[k]);
      if (raw) state[k] = JSON.parse(raw);
    } catch {}
  }
}
function guardarCacheLocal(k) {
  try { localStorage.setItem(CACHE_KEYS[k], JSON.stringify(state[k])); } catch {}
}

async function sincronizar() {
  const ind = document.getElementById('syncIndicator');
  ind.innerHTML = '<span class="sync-dot"></span> Sincronizando…';
  const endpoints = ['/api/ventas', '/api/gastos', '/api/clientes', '/api/inventario', '/api/maquila', '/api/finca', '/api/precios-cafe', '/api/cosechas', '/api/pergamino', '/api/tuestes', '/api/ordenes-maquila', '/api/pedidos-web', '/api/cuentas-cobro', '/api/cereza-comprada', '/api/saldos-iniciales', '/api/precio-fnc', '/api/costos-margen', '/api/salud-esquema', '/api/inventario-pergamino', '/api/inventario-verde', '/api/movimientos-inventario'];

  let respuestas;
  try {
    respuestas = await Promise.all(endpoints.map(u => apiFetch(u)));
  } catch (err) {
    // El fetch() en sí falló — esto sí es "no hay red de verdad" (el
    // servidor ni siquiera contestó).
    ind.innerHTML = '<span class="sync-dot"></span> Sin conexión (viendo caché) <button class="sync-retry" onclick="sincronizar()">Reintentar</button>';
    return;
  }

  // Un 401 (sesión vencida) no es "sin conexión" — el servidor sí
  // respondió, solo que el token ya no sirve.
  if (respuestas.some(r => r.status === 401)) {
    ind.innerHTML = '<span class="sync-dot"></span> Tu sesión expiró <button class="sync-retry" onclick="sesionExpirada()">Iniciar sesión de nuevo</button>';
    return;
  }

  // Cualquier otro error del servidor (ej. falta correr una migración y
  // una columna no existe) — se muestra CUÁL endpoint falló y el mensaje
  // real, en vez de un "sin conexión" genérico que no dice nada.
  const falloIdx = respuestas.findIndex(r => !r.ok);
  if (falloIdx !== -1) {
    const detalle = await respuestas[falloIdx].text().catch(() => '');
    ind.innerHTML = `<span class="sync-dot"></span> Error en ${endpoints[falloIdx]} (${respuestas[falloIdx].status}): ${escapeHtml(detalle).slice(0, 140)} <button class="sync-retry" onclick="sincronizar()">Reintentar</button>`;
    return;
  }

  try {
    const [v, g, c, i, m, f, pc, co, pe, tu, om, pw, cc, cz, si, pf, cm, se, ip, iv, mi] = await Promise.all(respuestas.map(r => r.json()));
    state.ventas = v; state.gastos = g; state.clientes = c;
    state.inventario = i; state.maquila = m; state.finca = f; state.preciosCafe = pc;
    state.cosechas = co; state.pergamino = pe; state.tuestes = tu; state.ordenesMaquila = om; state.pedidosWeb = pw;
    state.cuentasCobro = cc; state.cerezaComprada = cz; state.saldosIniciales = si; state.precioFnc = pf; state.costosMargen = cm;
    state.saludEsquema = se;
    state.inventarioPergamino = ip; state.inventarioVerde = iv; state.movimientosInventario = mi;
    Object.keys(CACHE_KEYS).forEach(guardarCacheLocal);
    ind.innerHTML = '<span class="sync-dot"></span> Sincronizado';
    renderTodo();
  } catch (err) {
    ind.innerHTML = '<span class="sync-dot"></span> Respuesta inesperada del servidor <button class="sync-retry" onclick="sincronizar()">Reintentar</button>';
  }
}

// son globales) en vez de las 9 secciones enteras — se usa en cambios
// frecuentes (cambiar de pestaña, escribir en el buscador, paginar).

// donde sí puede haber cambiado el dato de varias secciones a la vez.
function renderActiva() {
  renderAlertaStock();

function renderAlertaStock() {
  const bajos = state.inventario.filter(i => i.lote === 'Lavado' && Number(i.stockLb) < 5);
  const el = document.getElementById('stockAlert');
  if (bajos.length) {
    el.style.display = 'block';
    el.textContent = '⚠️ Stock bajo de Lavado (menos de 5 kg): ' + bajos.map(b => Number(b.stockLb).toFixed(2) + ' kg').join(' · ');
  } else {
    el.style.display = 'none';
  }
}

function renderAlertaEnvios() {
  const el = document.getElementById('envioAlert');
  if (!el) return;
  const pendientes = state.ventas.filter(v => v.estadoEnvio !== 'Enviado');
  if (pendientes.length) {
    el.style.display = 'block';
    el.onclick = () => { ventasSubTab = 'porEnviar'; document.querySelector('.sidebar-links button[data-tab="ventas"]').click(); };
    el.textContent = `📦 ${pendientes.length} venta${pendientes.length === 1 ? '' : 's'} pendiente${pendientes.length === 1 ? '' : 's'} de envío`;
  } else {
    el.style.display = 'none';
  }
}

/* ================================================================
   PEDIDOS WEB — bandeja de entrada de la página pública de clientes
================================================================ */
function renderCampanaPedidosWeb() {
  const nuevos = state.pedidosWeb.filter(p => p.estado === 'nuevo').length;
  ['campanaBadge', 'campanaBadgeMovil'].forEach(id => {
    const badge = document.getElementById(id);
    if (!badge) return;
    badge.style.display = nuevos ? 'flex' : 'none';
    badge.textContent = nuevos > 9 ? '9+' : nuevos;
  });
}

function detallePedidoWeb(p) {
  return (p.items || []).map(it => {
    const metodos = (it.metodos || []).filter(Boolean);
    let sufijo = '';
    if (metodos.length) {
      const todosIguales = metodos.every(m => m === metodos[0]);
      sufijo = todosIguales ? ` [${metodos[0]}]` : ` [${metodos.map((m, i) => `u${i + 1}: ${m}`).join(', ')}]`;
    }
    return `${it.cantidad} ${it.presentacion} de ${it.lote}${it.molienda ? ' (' + it.molienda + ')' : ''}${sufijo}`;
  }).join(' · ');
}

function abrirPedidosWeb() {
  abrirModal(`
    <h3>Pedidos desde la página de clientes</h3>
    <div id="pw-lista">${pintarListaPedidosWeb(ordenarPedidosWeb(state.pedidosWeb))}</div>
    <div class="modal-actions"><button class="sec-btn" style="flex:1" onclick="cerrarModal()">Cerrar</button></div>
  `);
}

// Los nuevos sin revisar siempre quedan arriba, sin importar la fecha —
// para que con cientos de pedidos acumulados no toque buscar entre los
// ya convertidos o descartados para encontrar el que falta atender.
function ordenarPedidosWeb(lista) {
  const prioridad = e => e === 'nuevo' ? 0 : 1;
  return lista.slice().sort((a, b) => prioridad(a.estado) - prioridad(b.estado) || b.ts - a.ts);
}

// Números guardados desde pedidos/index.html vienen sin indicativo (ej.
// "300 000 0000", como dice el placeholder de ese campo) — wa.me sí lo
// necesita, así que si quedan 10 dígitos les anteponemos 57 (Colombia).
// Si el número ya viene con indicativo (más de 10 dígitos), se deja igual.
function numeroWhatsapp(tel) {
  let d = String(tel || '').replace(/\D/g, '');
  if (d.length === 10) d = '57' + d;
  return d;
}
function mensajePedidoListo(p) {
  return `¡Hola ${p.nombreCliente}! 😊 Tu pedido en Café Pandora ya quedó listo. ¡Te esperamos!`;
}
// Un clic, sin escribir nada: abre WhatsApp con el número del pedido y el
// mensaje de "ya quedó listo" ya escrito — solo falta darle Enviar.
function avisarPedidoWebListo(id) {
  const p = state.pedidosWeb.find(x => x.id === id); if (!p || !p.telefono) return;
  window.open(`https://wa.me/${numeroWhatsapp(p.telefono)}?text=${encodeURIComponent(mensajePedidoListo(p))}`, '_blank');
}
// Igual pero con el cuadro de texto vacío, para cuando se quiere escribir
// algo personalizado en vez del aviso genérico.
function avisarPedidoWebPersonalizado(id) {
  const p = state.pedidosWeb.find(x => x.id === id); if (!p || !p.telefono) return;
  window.open(`https://wa.me/${numeroWhatsapp(p.telefono)}`, '_blank');
}

function pintarListaPedidosWeb(lista) {
  if (!lista.length) return '<div class="empty">Todavía no ha llegado ningún pedido.</div>';
  return lista.map(p => `
    <div class="ledger-row" style="${p.estado === 'nuevo' ? 'background:var(--terracota-bg);border-radius:8px;padding:11px 8px' : ''}">
      <div class="main">
        <div class="title">${escapeHtml(p.nombreCliente)} ${p.telefono ? '· ' + escapeHtml(p.telefono) : ''}</div>
        <div class="meta">${new Date(Number(p.ts)).toLocaleString('es-CO')} · ${p.estado}</div>
        <div class="details">${escapeHtml(detallePedidoWeb(p))}${p.notas ? ' — ' + escapeHtml(p.notas) : ''}</div>
      </div>
      <div class="amount pos">${fmt(p.valorTotal)}</div>
      <div class="acciones">
        ${p.telefono ? `<button onclick="avisarPedidoWebListo(${p.id})" title="Avisar por WhatsApp que ya quedó listo (mensaje ya escrito)">✅💬</button>
        <button onclick="avisarPedidoWebPersonalizado(${p.id})" title="Escribir un mensaje personalizado por WhatsApp">✏️💬</button>` : ''}
        ${p.estado !== 'convertido' ? `<button onclick="convertirPedidoWebAVenta(${p.id})" title="Convertir en venta">🛒</button>` : ''}
        <button onclick="eliminarPedidoWeb(${p.id})" title="Descartar">✕</button>
      </div>
    </div>`).join('');
}


async function eliminarPedidoWeb(id) {
  if (!confirm('¿Descartar este pedido de la bandeja?')) return;
  state.pedidosWeb = state.pedidosWeb.filter(x => x.id !== id);
  guardarCacheLocal('pedidosWeb'); renderCampanaPedidosWeb();
  const cont = document.getElementById('pw-lista');
  if (cont) cont.innerHTML = pintarListaPedidosWeb(ordenarPedidosWeb(state.pedidosWeb));
  await apiFetch('/api/pedidos-web/' + id, { method: 'DELETE' });
}

   CUENTAS DE COBRO — documento formal con tu membrete, para clientes
   de café Y de maquila. Cada una queda numerada y guardada en un
   historial; el NIT/cédula se recuerda por cliente para la próxima vez.
================================================================ */
let carritoCuentaCobro = [];

// Convierte un valor en pesos a su forma escrita, como pide el formato
// legal de la cuenta de cobro ("QUINIENTOS CINCUENTA Y DOS MIL PESOS MCTE").
function numeroALetras(n) {
  n = Math.max(0, Math.round(Number(n) || 0));
  if (n === 0) return 'CERO PESOS MCTE';
  const UNIDADES = ['', 'UN', 'DOS', 'TRES', 'CUATRO', 'CINCO', 'SEIS', 'SIETE', 'OCHO', 'NUEVE'];
  const DIECIS = ['DIEZ', 'ONCE', 'DOCE', 'TRECE', 'CATORCE', 'QUINCE', 'DIECISÉIS', 'DIECISIETE', 'DIECIOCHO', 'DIECINUEVE'];
  const VEINTIS = ['VEINTE', 'VEINTIÚN', 'VEINTIDÓS', 'VEINTITRÉS', 'VEINTICUATRO', 'VEINTICINCO', 'VEINTISÉIS', 'VEINTISIETE', 'VEINTIOCHO', 'VEINTINUEVE'];
  const DECENAS = ['', '', '', 'TREINTA', 'CUARENTA', 'CINCUENTA', 'SESENTA', 'SETENTA', 'OCHENTA', 'NOVENTA'];
  const CENTENAS = ['', 'CIENTO', 'DOSCIENTOS', 'TRESCIENTOS', 'CUATROCIENTOS', 'QUINIENTOS', 'SEISCIENTOS', 'SETECIENTOS', 'OCHOCIENTOS', 'NOVECIENTOS'];

  function tresDigitos(num) {
    if (num === 100) return 'CIEN';
    const c = Math.floor(num / 100), resto = num % 100;
    let partes = [];
    if (c > 0) partes.push(CENTENAS[c]);
    if (resto >= 10 && resto < 20) partes.push(DIECIS[resto - 10]);
    else if (resto >= 20 && resto < 30) partes.push(VEINTIS[resto - 20]);
    else {
      const d = Math.floor(resto / 10), u = resto % 10;
      if (d >= 3) partes.push(DECENAS[d] + (u > 0 ? ' Y ' + UNIDADES[u] : ''));
      else if (u > 0) partes.push(UNIDADES[u]);
    }
    return partes.join(' ');
  }

  const millones = Math.floor(n / 1000000);
  const miles = Math.floor((n % 1000000) / 1000);
  const cientos = n % 1000;
  let partes = [];
  if (millones > 0) partes.push(millones === 1 ? 'UN MILLÓN' : tresDigitos(millones) + ' MILLONES');
  if (miles > 0) partes.push(miles === 1 ? 'MIL' : tresDigitos(miles) + ' MIL');
  if (cientos > 0) partes.push(tresDigitos(cientos));
  return partes.join(' ') + ' PESOS MCTE';
}

// Directorio combinado (café + maquila) solo para sugerir nombres al
// escribir el cliente de una cuenta de cobro — no altera los directorios
// independientes de cada uno.
function listaClientesTodos() {
  const mapa = new Map();
  listaClientes().forEach(c => mapa.set(normalizar(c.nombre), c.nombre));
  listaClientesMaquila().forEach(c => { if (!mapa.has(normalizar(c.nombre))) mapa.set(normalizar(c.nombre), c.nombre); });
  return [...mapa.values()];
}
function nitDeCliente(nombre) {
  const clave = normalizar(nombre);
  const c = state.clientes.find(x => normalizar(x.nombre) === clave);
  return c ? (c.nitCedula || '') : '';
}
