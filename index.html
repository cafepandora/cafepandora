function filaCuentaCobro(cc) {
  const detalle = (cc.items || []).map(it => `${it.cantidad} ${it.descripcion}`).join(' · ');
  return `
    <div class="ledger-row">
      <div class="main">
        <div class="title">No. ${cc.id} — ${escapeHtml(cc.cliente)}</div>
        <div class="meta">${new Date(Number(cc.ts)).toLocaleDateString('es-CO')}${cc.clienteNit ? ' · ' + escapeHtml(cc.clienteNit) : ''} · a nombre de ${escapeHtml(datosTitularCC(cc.titular).label)}${cc.transporte > 0 ? ' · + envío ' + fmt(cc.transporte) : ''}</div>
        <div class="details">${escapeHtml(detalle)}</div>
      </div>
      <div class="amount pos">${fmt(cc.total)}</div>
      <div class="acciones">
        <button onclick="redescargarCuentaCobro(${cc.id})" title="Descargar de nuevo">⬇️</button>
        <button onclick="eliminarCuentaCobro(${cc.id})" title="Eliminar">✕</button>
      </div>
    </div>`;
}

function filtrarSugerenciasCC() {
  const input = document.getElementById('cc-cliente');
  const caja = document.getElementById('ccSugerencias');
  if (!input || !caja) return;
  const q = normalizar(input.value);
  const todos = listaClientesTodos();
  const coinciden = (q ? todos.filter(n => normalizar(n).includes(q)) : todos).slice(0, 10);
  if (!coinciden.length) { caja.style.display = 'none'; return; }
  caja.innerHTML = coinciden.map(n => `<button type="button" onmousedown="elegirClienteCC('${escapeAttr(n).replace(/'/g, "\\'")}')">${escapeHtml(n)}</button>`).join('');
  caja.style.display = 'block';
}
function elegirClienteCC(nombre) {
  document.getElementById('cc-cliente').value = nombre;
  const nit = nitDeCliente(nombre);
  if (nit) document.getElementById('cc-nit').value = nit;
  const caja = document.getElementById('ccSugerencias');
  if (caja) caja.style.display = 'none';
}

function recalcularLineaCC() {
  const cant = Number(document.getElementById('cc-ln-cant').value) || 0;
  const valor = Number(document.getElementById('cc-ln-valor').value) || 0;
  document.getElementById('cc-ln-total').value = Math.round(cant * valor);
}
function agregarLineaCC() {
  const descripcion = document.getElementById('cc-ln-desc').value.trim();
  if (!descripcion) return toast('Escribe una descripción.', 'error');
  const item = {
    descripcion,
    presentacion: document.getElementById('cc-ln-pres').value.trim(),
    cantidad: Number(document.getElementById('cc-ln-cant').value) || 0,
    valorUnitario: Number(document.getElementById('cc-ln-valor').value) || 0,
    valorTotal: Number(document.getElementById('cc-ln-total').value) || 0,
  };
  carritoCuentaCobro.push(item);
  document.getElementById('cc-ln-desc').value = '';
  document.getElementById('cc-ln-pres').value = '';
  document.getElementById('cc-ln-cant').value = '1';
  document.getElementById('cc-ln-valor').value = '';
  document.getElementById('cc-ln-total').value = '';
  pintarCarritoCC();
}
function quitarLineaCC(i) {
  carritoCuentaCobro.splice(i, 1);
  pintarCarritoCC();
}
function pintarCarritoCC() {
  const cont = document.getElementById('cc-lista');
  if (!cont) return;
  cont.innerHTML = carritoCuentaCobro.length
    ? carritoCuentaCobro.map((it, i) => `
      <div class="ledger-row">
        <div class="main"><div class="title">${escapeHtml(it.descripcion)}${it.presentacion ? ' · ' + escapeHtml(it.presentacion) : ''}</div>
          <div class="meta">${it.cantidad} × ${fmt(it.valorUnitario)}</div></div>
        <div class="amount pos">${fmt(it.valorTotal)}</div>
        <div class="acciones"><button onclick="quitarLineaCC(${i})" title="Quitar">✕</button></div>
      </div>`).join('')
    : '<div class="empty">Aún no has agregado ninguna línea.</div>';
  const otros = Number(document.getElementById('cc-otros')?.value) || 0;
  const transporte = document.getElementById('cc-incluye-transporte')?.checked ? (Number(document.getElementById('cc-transporte')?.value) || 0) : 0;
  const subtotal = carritoCuentaCobro.reduce((s, it) => s + (Number(it.valorTotal) || 0), 0);
  const totalEl = document.getElementById('cc-total');
  if (totalEl) totalEl.textContent = fmt(subtotal + otros + transporte);
}
// Muestra/oculta el campo de costo cuando se marca "Incluir transporte" —
// se factura aparte porque es un servicio distinto (no lleva retención).
function actualizarTransporteVisible() {
  const fila = document.getElementById('cc-transporte-fila');
  if (!fila) return;
  fila.style.display = document.getElementById('cc-incluye-transporte').checked ? 'flex' : 'none';
  pintarCarritoCC();
}

async function guardarCuentaCobro(btn) {
  const cliente = document.getElementById('cc-cliente').value.trim();
  if (!cliente) return toast('Escribe el nombre del cliente.', 'error');
  if (!carritoCuentaCobro.length) return toast('Agrega al menos una línea.', 'error');
  btn.disabled = true;
  try {
    const titular = document.getElementById('cc-titular').value;
    const transporte = document.getElementById('cc-incluye-transporte').checked ? (Number(document.getElementById('cc-transporte').value) || 0) : 0;
    const payload = {
      cliente,
      clienteNit: document.getElementById('cc-nit').value.trim() || null,
      items: carritoCuentaCobro,
      otros: Number(document.getElementById('cc-otros').value) || 0,
      transporte,
      titular,
      usuario: localStorage.getItem('cp_usuario') || 'Equipo',
    };
    const res = await apiFetch('/api/cuentas-cobro', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    if (!res.ok) throw new Error();
    const cc = await res.json();
    state.cuentasCobro.unshift(cc);
    guardarCacheLocal('cuentasCobro');
    localStorage.setItem('cp_titular_cc', titular);

    generarPdfCuentaCobro(cc, document.getElementById('cc-ciudad').value.trim());

    carritoCuentaCobro = [];
    borradorCuentaCobro = { cliente: '', clienteNit: '', clienteCiudad: '' };
    toast('Cuenta de cobro No. ' + cc.id + ' generada');
    renderTodo();
  } catch {
    toast('No se pudo generar la cuenta de cobro. Intenta de nuevo.', 'error');
  } finally {
    btn.disabled = false;
  }
}

function redescargarCuentaCobro(id) {
  const cc = state.cuentasCobro.find(x => x.id === id);
  if (cc) generarPdfCuentaCobro(cc, '');
}

async function eliminarCuentaCobro(id) {
  if (!confirm('¿Eliminar esta cuenta de cobro del historial?')) return;
  state.cuentasCobro = state.cuentasCobro.filter(x => x.id !== id);
  guardarCacheLocal('cuentasCobro'); renderTodo();
  await apiFetch('/api/cuentas-cobro/' + id, { method: 'DELETE' });
}

// Reproduce el mismo formato de tu membrete: logo gris arriba, datos de
// contacto a la derecha, cliente que debe / a quién le debe, la suma en
// letras y en número, la tabla de conceptos, y los datos bancarios abajo.
function generarPdfCuentaCobro(cc, ciudad) {
  if (typeof jspdf === 'undefined') return toast('No se pudo cargar el generador de PDF. Revisa tu conexión.', 'error');
  const titular = datosTitularCC(cc.titular);
  const { jsPDF } = jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a4' });
  const ancho = doc.internal.pageSize.getWidth();
  let y = 18;

  try { doc.addImage('data:image/png;base64,' + LOGO_CUENTA_COBRO_B64, 'PNG', 18, y, 50, 16.1); } catch {}
  doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(90);
  doc.text(EMISOR_DIRECCION, ancho - 18, y + 4, { align: 'right' });
  doc.text(EMISOR_CIUDAD, ancho - 18, y + 8.5, { align: 'right' });
  doc.text(EMISOR_TELEFONO, ancho - 18, y + 13, { align: 'right' });
  doc.setTextColor(70, 90, 200);
  doc.text(EMISOR_EMAIL, ancho - 18, y + 17.5, { align: 'right' });
  y += 32;

  doc.setTextColor(30); doc.setFont('helvetica', 'normal'); doc.setFontSize(13);
  doc.text('CUENTA DE COBRO', ancho / 2, y, { align: 'center' }); y += 14;

  doc.setFontSize(11);
  doc.text(cc.cliente.toUpperCase(), ancho / 2, y, { align: 'center' }); y += 5.5;
  if (cc.clienteNit) { doc.text('NIT. ' + cc.clienteNit, ancho / 2, y, { align: 'center' }); y += 5.5; }
  if (ciudad) { doc.text(ciudad.toUpperCase(), ancho / 2, y, { align: 'center' }); y += 5.5; }
  y += 8;

  doc.text('DEBE A:', ancho / 2, y, { align: 'center' }); y += 10;
  doc.text(titular.nombre.toUpperCase(), ancho / 2, y, { align: 'center' }); y += 5.5;
  doc.text(titular.cedula, ancho / 2, y, { align: 'center' }); y += 11;

  doc.text('LA SUMA DE:', ancho / 2, y, { align: 'center' }); y += 6;
  doc.setFont('helvetica', 'bold');
  const letras = doc.splitTextToSize(numeroALetras(cc.total), ancho - 50);
  letras.forEach(linea => { doc.text(linea, ancho / 2, y, { align: 'center' }); y += 5.5; });
  doc.text('(' + fmt(cc.total) + ')', ancho / 2, y, { align: 'center' }); y += 11;

  doc.setFont('helvetica', 'normal');
  doc.text('POR CONCEPTO DE:', ancho / 2, y, { align: 'center' }); y += 6;

  doc.setDrawColor(200); doc.line(18, y, ancho - 18, y); y += 8;

  // Tabla de conceptos — 5 columnas bien separadas para que los encabezados
  // (sobre todo "Valor unitario") no se encimen con "Cantidad".
  const colX = { desc: 18, pres: 88, cant: 122, unit: 155, tot: ancho - 18 };
  doc.setFont('helvetica', 'bold'); doc.setFontSize(9);
  doc.text('Descripción', colX.desc, y);
  doc.text('Presentación', colX.pres, y);
  doc.text('Cantidad', colX.cant, y, { align: 'right' });
  doc.text('Valor unitario', colX.unit, y, { align: 'right' });
  doc.text('Valor total', colX.tot, y, { align: 'right' });
  y += 5;
  doc.setDrawColor(220); doc.line(18, y, ancho - 18, y); y += 5;

  doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5);
  (cc.items || []).forEach(it => {
    doc.text(String(it.descripcion), colX.desc, y, { maxWidth: 66 });
    doc.text(String(it.presentacion || ''), colX.pres, y, { maxWidth: 30 });
    doc.text(String(it.cantidad), colX.cant, y, { align: 'right' });
    doc.text(fmt(it.valorUnitario), colX.unit, y, { align: 'right' });
    doc.text(fmt(it.valorTotal), colX.tot, y, { align: 'right' });
    y += 6;
  });
  y += 2;
  doc.setDrawColor(220); doc.line(ancho * 0.55, y, ancho - 18, y); y += 6;

  const subtotal = (cc.items || []).reduce((s, it) => s + (Number(it.valorTotal) || 0), 0);
  const yTotales = y;
  doc.setFontSize(9.5);
  doc.text('Subtotal', colX.unit, y, { align: 'right' }); doc.setFont('helvetica', 'bold'); doc.text(fmt(subtotal), colX.tot, y, { align: 'right' }); doc.setFont('helvetica', 'normal'); y += 5.5;
  if (cc.transporte > 0) {
    doc.text('Envío', colX.unit, y, { align: 'right' }); doc.text(fmt(cc.transporte), colX.tot, y, { align: 'right' }); y += 5.5;
  }
  if (cc.otros > 0) {
    doc.text('Otros', colX.unit, y, { align: 'right' }); doc.text(fmt(cc.otros), colX.tot, y, { align: 'right' }); y += 5.5;
  }
  y += 1;
  doc.setFont('helvetica', 'bold'); doc.setFontSize(12);
  doc.text('TOTAL', colX.unit, y, { align: 'right' }); doc.text(fmt(cc.total), colX.tot, y, { align: 'right' }); y += 10;

  if (cc.transporte > 0) {
    // El envío lo presta otra empresa (mensajería), no es un servicio de
    // Café Pandora — por eso no entra en la base de retención del cliente.
    // Va a la izquierda, a la misma altura que el Subtotal.
    doc.setFont('helvetica', 'italic'); doc.setFontSize(8); doc.setTextColor(120);
    const notaEnvio = doc.splitTextToSize('NOTA: El envío es un servicio prestado por otra empresa, no tener en cuenta para retención.', colX.unit - 30);
    notaEnvio.forEach((linea, i) => doc.text(linea, 18, yTotales + i * 4));
    doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5); doc.setTextColor(30);
  }

  doc.setDrawColor(200); doc.line(18, y, ancho - 18, y); y += 6;
  doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(90);
  doc.text(EMISOR_BANCO, 18, y); y += 4.5;
  doc.text(titular.cuentaBancaria, 18, y); y += 14;

  doc.setFontSize(10); doc.setTextColor(30);
  const fechaTexto = new Date(Number(cc.ts)).toLocaleDateString('es-CO', { day: 'numeric', month: 'long', year: 'numeric' });
  doc.text('PARA CONSTANCIA SE FIRMA A LOS ' + fechaTexto.toUpperCase(), ancho / 2, y, { align: 'center' }); y += 12;

  if (titular.firma) {
    // Firma real de cada titular, recortada de una foto/membrete
    try { doc.addImage('data:image/png;base64,' + titular.firma.b64, 'PNG', 18, y, titular.firma.ancho, titular.firma.alto); } catch {}
    if (!titular.firma.incluyeNombre) {
      // Esta firma es solo el trazo — el nombre y cédula se escriben
      // debajo, igual que ya vienen incluidos en la firma de Juan.
      doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5); doc.setTextColor(30);
      doc.text(titular.nombre, 18, y + titular.firma.alto + 5);
      doc.text(titular.cedula, 18, y + titular.firma.alto + 9.5);
    }
  } else {
    // Sin firma escaneada — se deja el nombre y cédula escritos en el
    // espacio de la firma para que el documento quede completo.
    doc.setDrawColor(120); doc.line(18, y + 12, 78, y + 12);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5); doc.setTextColor(30);
    doc.text(titular.nombre, 18, y + 17);
    doc.text(titular.cedula, 18, y + 21.5);
  }

  doc.save('CuentaCobro_' + cc.id + '_' + cc.cliente.replace(/[^a-zA-Z0-9]/g, '_') + '.pdf');
}

// Prellenar desde una venta (botón 📋 en el recibo) o desde una orden de
// maquila — en ambos casos solo se arma el borrador, el usuario revisa el
// NIT/ciudad y le da "Generar" desde la pestaña.
function prellenarCuentaCobroDesdeVenta(id) {
  const v = state.ventas.find(x => x.id === id); if (!v) return;
  borradorCuentaCobro = { cliente: v.cliente || '', clienteNit: nitDeCliente(v.cliente), clienteCiudad: '' };
  carritoCuentaCobro = (v.items && v.items.length && v.items[0].tipo === 'cafe')
    ? v.items.filter(it => it.tipo === 'cafe').map(it => ({
        descripcion: `CAFÉ ${it.lote}`, presentacion: it.presentacion,
        cantidad: it.cantidad, valorUnitario: Math.round(it.valor / it.cantidad), valorTotal: it.valor,
      }))
    : [{ descripcion: detalleVenta(v), presentacion: '', cantidad: 1, valorUnitario: v.valor, valorTotal: v.valor }];
  cerrarModal();
  irATab('cuentas-cobro');
}
function prellenarCuentaCobroDesdeMaquila(id) {
  const o = state.ordenesMaquila.find(x => x.id === id); if (!o) return;
  borradorCuentaCobro = { cliente: o.cliente || '', clienteNit: '', clienteCiudad: '' };
  carritoCuentaCobro = (o.items || []).map(it => ({
    descripcion: it.servicio, presentacion: it.presentacion || (it.nota || ''),
    cantidad: it.cantidad, valorUnitario: it.cantidad ? Math.round(it.valor / it.cantidad) : it.valor, valorTotal: it.valor,
  }));
  irATab('cuentas-cobro');
}

// El respaldo se pone al día solo, sin que nadie tenga que acordarse de
// darle a "Exportar" — pero los navegadores bloquean descargas que no
// vengan de un clic real, así que se dispara en el primer toque que hagas
// en la app (cuenta como gesto real), no apenas se abre.
let autoBackupPendiente = false;
let autoBackupDisparadoEnEstaSesion = false;

function renderRecordatorioExport() {
  const el = document.getElementById('exportReminder');
  const ultimo = Number(localStorage.getItem('cp_ultimo_export') || 0);
  const dias = ultimo ? Math.floor((Date.now() - ultimo) / 86400000) : null;
  const necesitaBackup = dias === null || dias >= DIAS_AVISO_EXPORT;
  autoBackupPendiente = necesitaBackup && !autoBackupDisparadoEnEstaSesion;

  if (necesitaBackup) {
    el.style.display = 'flex';
    el.innerHTML = autoBackupPendiente
      ? `<span>🗂️ ${dias === null ? 'Nunca has exportado' : 'Van ' + dias + ' días sin exportar'} — se va a descargar un respaldo automático con tu próximo toque.</span><button onclick="exportarExcel()">Exportar ya</button>`
      : `<span>🗂️ Respaldo automático descargado esta sesión.</span><button onclick="exportarExcel()">Exportar de nuevo</button>`;
  } else {
    el.style.display = 'none';
  }
}

document.addEventListener('click', () => {
  if (!autoBackupPendiente || autoBackupDisparadoEnEstaSesion) return;
  autoBackupDisparadoEnEstaSesion = true;
  autoBackupPendiente = false;
  exportarExcel();
  toast('Respaldo automático descargado — llevabas mucho sin exportar');
}, { capture: true });

/* ---------- Línea nueva (café o un servicio de maquila) ---------- */
function onLnLoteChange() {
  const lote = document.getElementById('ln-lote').value;
  document.getElementById('ln-campo-tueste').style.display = lote === 'Lavado' ? 'flex' : 'none';
  document.getElementById('ln-presentacion').innerHTML = presentacionesDeLote(lote).map(p => `<option>${p}</option>`).join('');
  recalcularLinea();
}

function recalcularLinea() {
  const lote = document.getElementById('ln-lote').value;
  const presentacion = document.getElementById('ln-presentacion').value;
  const cantidad = Number(document.getElementById('ln-cantidad-cafe').value) || 1;
  const tipoCliente = document.getElementById('v-tipoCliente').value;
  document.getElementById('ln-valor').value = precioSugerido(lote, presentacion, tipoCliente) * cantidad;
}

function agregarLineaAlCarrito() {
  const lote = document.getElementById('ln-lote').value;
  const item = {
    tipo: 'cafe',
    lote,
    presentacion: document.getElementById('ln-presentacion').value,
    cantidad: Number(document.getElementById('ln-cantidad-cafe').value) || 1,
    valor: Number(document.getElementById('ln-valor').value) || 0,
    molienda: document.getElementById('ln-molienda').value,
    tueste: lote === 'Lavado' ? document.getElementById('ln-tueste').value : null,
  };
  if (!item.cantidad) return toast('Pon una cantidad mayor a cero.', 'error');
  carritoActual.push(item);
  pintarCarrito();
}

function quitarDelCarrito(i) {
  carritoActual.splice(i, 1);
  pintarCarrito();
}

function pintarCarrito() {
  const lista = document.getElementById('carrito-lista');
  if (!lista) return;
  lista.innerHTML = carritoActual.length
    ? carritoActual.map((it, i) => `
      <div class="ledger-row">
        <div class="main"><div class="title">${it.tipo === 'cafe' ? `${escapeHtml(it.lote)} · ${escapeHtml(it.presentacion)} × ${it.cantidad}` : `${escapeHtml(it.servicio)} ${it.presentacion ? it.cantidad + ' ' + escapeHtml(it.presentacion) : it.cantidad + 'kg'}`}</div></div>
        <div class="amount pos">${fmt(it.valor)}</div>
        <div class="acciones"><button onclick="quitarDelCarrito(${i})" title="Quitar">✕</button></div>
      </div>`).join('')
    : '<div class="empty">Aún no has agregado nada.</div>';
  const total = carritoActual.reduce((s, it) => s + (Number(it.valor) || 0), 0);
  document.getElementById('carrito-total').textContent = fmt(total);
  const valorInput = document.getElementById('v-valor');
  if (valorInput) valorInput.value = total;
}

function lotesDeVenta(v) {
  if (v.items && v.items.length && v.items[0] && v.items[0].tipo) {
    return v.items.filter(it => it.tipo === 'cafe' && it.lote).map(it => [it.lote, it.valor]);
  }
  if (v.tipoVenta !== 'maquila' && v.lote) return [[v.lote, v.valor]];
  return [];
}

function detalleItemCafe(it) {
  const extras = [it.molienda, it.tueste ? 'Tostión ' + it.tueste : null].filter(Boolean).join(', ');
  return `${it.lote} ${it.presentacion} x${it.cantidad}` + (extras ? ` (${extras})` : '');
}

function detalleVenta(v) {
  if (v.items && v.items.length && v.items[0] && v.items[0].tipo) {
    return v.items.map(it => it.tipo === 'maquila'
      ? (it.presentacion ? `${it.servicio} ${it.cantidad} ${it.presentacion}` : `${it.servicio} ${it.cantidad}kg`)
      : detalleItemCafe(it)
    ).join(' · ');
  }
  if (v.tipoVenta === 'maquila') {
    return (v.servicios || []).map(s => s.presentacion ? `${s.servicio} ${s.cantidad} ${s.presentacion}` : `${s.servicio} ${s.cantidad}kg`).join(' · ');
  }
  if (v.lote) return `${v.lote} · ${v.presentacion || ''} × ${v.cantidad || 1}`;
  if (v.items && v.items.length) return v.items.map(it => `${it.cantidad}x ${it.proceso || ''} ${it.presentacion || ''}`).join(' · ');
  return '';
}

// Para un Distribuidor que va pagando paquete por paquete: si ya pagó
// ALGO pero no TODO, muestra cuánto lleva — null si no aplica (no es
// Distribuidor, no tiene líneas de café, o está en 0 o en el 100%, casos
// donde el tag de Pagado/Pendiente de siempre ya cuenta la historia solita).
function resumenPaquetesDistribuidor(v) {
  if (v.tipoCliente !== 'Distribuidor' || v.estado === 'Pagado') return null;
  const items = (v.items || []).filter(it => it.tipo === 'cafe');
  if (!items.length) return null;
  const total = items.reduce((s, it) => s + (Number(it.cantidad) || 0), 0);
  const pagadas = items.reduce((s, it) => s + Math.min(Number(it.cantidadPagada) || 0, Number(it.cantidad) || 0), 0);
  if (!total || pagadas <= 0) return null;
  return { pagadas, total };
}

function filaVenta(v, esDeuda) {
  const envioPendiente = v.estadoEnvio !== 'Enviado';
  const paquetes = resumenPaquetesDistribuidor(v);
  return `
    <div class="ledger-row ${esDeuda ? 'deuda-anterior' : ''} ${envioPendiente ? 'envio-pendiente' : ''}">
      <div class="main">
        <div class="title">${escapeHtml(v.cliente || 'Venta directa')} ${v.origenWeb ? '<span class="badge-web">🌐 Pedido web</span>' : ''}</div>

        <div class="details">${escapeHtml(detalleVenta(v))}</div>

        <div style="margin-top:5px"><button class="tag ${envioPendiente ? 'envio-pendiente' : 'envio-enviado'}" onclick="toggleEstadoEnvio(${v.id})">${envioPendiente ? '📦 Pendiente de envío' : '✅ Enviado'}</button></div>
      </div>
      <button class="tag ${v.estado === 'Pagado' ? 'pagado' : 'pendiente'}" onclick="toggleEstadoVenta(${v.id})">${v.estado}</button>
      <div class="amount pos">${fmt(v.valor)}</div>
      <div class="acciones">
        <button onclick="abrirRecibo(${v.id})" title="Recibo">🧾</button>
        <button onclick="abrirEdicionVenta(${v.id})" title="Editar">✎</button>
        <button onclick="eliminarVenta(${v.id})" title="Eliminar">✕</button>
      </div>
    </div>`;
}

async function toggleEstadoEnvio(id) {
  const v = state.ventas.find(x => x.id === id); if (!v) return;
  const nuevo = v.estadoEnvio === 'Enviado' ? 'Pendiente' : 'Enviado';
  v.estadoEnvio = nuevo; guardarCacheLocal('ventas'); renderTodo();
  await apiFetch('/api/ventas/' + id, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ estadoEnvio: nuevo }) });
}

async function registrarVenta(btn) {
  if (!carritoActual.length) return toast('Agrega al menos un producto o servicio al pedido.', 'error');
  // El método de pago ya dice quién recibió en los 4 casos con nombre
  // propio (Transferencia a X, X Nequi, X Bancolombia) — solo Efectivo
  // pide elegirlo aparte, porque ese sí lo puede tener cualquiera.
  const metodo = document.getElementById('v-metodo').value;
  const recibidoPor = personaDeMetodo(metodo) || document.getElementById('v-recibio').value || null;
  const estado = document.getElementById('v-estado').value;
  // Si queda Pagado sin dueño, no cuadra en el balance de nadie — mejor
  // pedirlo ahora que dejar la venta huérfana en silencio.
  if (estado === 'Pagado' && !recibidoPor) return toast('Elige quién recibió el pago.', 'error');
  if (btn) btn.disabled = true;
  try {
    const usuario = recibidoPor || 'Equipo';
    localStorage.setItem('cp_usuario', usuario);
    const ordenEnCurso = orden;

    const payload = {
      usuario,
      cliente: nombreCanonico(document.getElementById('v-cliente').value) || 'Venta directa',
      tipoCliente: document.getElementById('v-tipoCliente').value,
      items: carritoActual,
      valor: Math.max(0, Number(document.getElementById('v-valor').value) || carritoActual.reduce((s, it) => s + (Number(it.valor) || 0), 0)),
      metodo,
      recibidoPor,
      estado,
      origenWeb: !!ordenEnCurso.origenWeb,
      ts: Date.now(),
    };
    if (payload.recibidoPor) localStorage.setItem('cp_recibio', payload.recibidoPor);

    const res = await apiFetch('/api/ventas', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    if (!res.ok) throw new Error(await res.text());
    const row = await res.json();
    state.ventas.push(row);
    guardarCacheLocal('ventas');

    // Si esta orden venía de un pedido de la página web, ese pedido queda
    // marcado como convertido — ya no se queda suelto en la campanita.
    if (ordenEnCurso.pedidoWebId) {
      const p = state.pedidosWeb.find(x => x.id === ordenEnCurso.pedidoWebId);
      if (p) p.estado = 'convertido';
      guardarCacheLocal('pedidosWeb');
      apiFetch('/api/pedidos-web/' + ordenEnCurso.pedidoWebId, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ estado: 'convertido' }) });
    }

    finalizarOrdenActiva();
    toast('Venta registrada');
    renderTodo(); // esto reconstruye el botón, ya no hace falta rehabilitarlo a mano
    sincronizar(); // trae de vuelta el descuento de inventario / nuevo cliente calculados en el servidor
  } catch (err) {
    toast('No se pudo registrar la venta: ' + err.message, 'error');
  } finally {
    if (btn) btn.disabled = false;
  }
}

async function toggleEstadoVenta(id) {
  const v = state.ventas.find(x => x.id === id); if (!v) return;
  const nuevo = v.estado === 'Pagado' ? 'Pendiente' : 'Pagado';
  if (nuevo === 'Pagado' && !personaDeMetodo(v.metodo) && !v.recibidoPor) {
    toast('Antes de marcar como pagada, elige quién recibió el pago.', 'error');
    return abrirEdicionVenta(id);
  }
  v.estado = nuevo; guardarCacheLocal('ventas'); renderTodo();
  await apiFetch('/api/ventas/' + id, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ estado: nuevo }) });
}
async function eliminarVenta(id) {
  if (!confirm('¿Anular esta venta? El café que traiga vuelve al inventario automáticamente.')) return;
  state.ventas = state.ventas.filter(x => x.id !== id); guardarCacheLocal('ventas'); renderTodo();
  await apiFetch('/api/ventas/' + id, { method: 'DELETE' });
  sincronizar(); // refleja el inventario devuelto
}

function pintarGuiaPreview(v) {
  if (!v.guiaEnvio) return '<div class="empty">Sin guía de envío subida.</div>';
  return `
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
      <img src="${v.guiaEnvio}" style="width:64px;height:64px;object-fit:cover;border-radius:10px;border:1px solid var(--linea)">
      <div style="flex:1">
        <div style="font-weight:700;font-size:13.5px">Guía cargada</div>
        <a href="${v.guiaEnvio}" download="guia-envio.jpg" style="font-size:12.5px;color:var(--verde);font-weight:700">Descargar imagen</a>
      </div>
      <button class="sec-btn" onclick="quitarGuiaEnvio(${v.id})">Quitar</button>
    </div>`;
}

async function subirGuiaEnvio(id, file) {
  if (!file) return;
  if (file.size > 4 * 1024 * 1024) return toast('La imagen pesa mucho — usa una de menos de 4 MB.', 'error');
  const dataUrl = await new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(file); });
  const v = state.ventas.find(x => x.id === id); if (v) v.guiaEnvio = dataUrl;
  guardarCacheLocal('ventas');
  const cont = document.getElementById('guia-preview');
  if (cont) cont.innerHTML = pintarGuiaPreview(v);
  toast('Subiendo guía…');
  await apiFetch('/api/ventas/' + id, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ guiaEnvio: dataUrl }) });
  toast('Guía de envío guardada');
}

async function quitarGuiaEnvio(id) {
  const v = state.ventas.find(x => x.id === id); if (v) v.guiaEnvio = null;
  guardarCacheLocal('ventas');
  const cont = document.getElementById('guia-preview');
  if (cont) cont.innerHTML = pintarGuiaPreview(v || {});
  await apiFetch('/api/ventas/' + id, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ guiaEnvio: null }) });
}

function descargarRecibo(id) {
  const v = state.ventas.find(x => x.id === id); if (!v) return;
  const pagado = v.estado === 'Pagado';
  if (typeof jspdf === 'undefined') return toast('No se pudo cargar el generador de PDF. Revisa tu conexión.', 'error');
  const { jsPDF } = jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a5' });
  const anchoPag = doc.internal.pageSize.getWidth();
  let y = 16;

  try { doc.addImage('data:image/png;base64,' + LOGO_RECIBO_B64, 'PNG', anchoPag/2 - 30, y, 60, 19.2); } catch {}
  y += 26;
  doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.setTextColor(120);
  doc.text(pagado ? 'Recibo de pago' : 'Recibo de pedido', anchoPag/2, y, { align: 'center' }); y += 10;

  doc.setDrawColor(220); doc.line(12, y, anchoPag - 12, y); y += 8;

  doc.setTextColor(40); doc.setFontSize(11);
  doc.text('Cliente: ' + (v.cliente || 'Venta directa'), 14, y); y += 6;
  doc.text('Fecha: ' + new Date(Number(v.ts)).toLocaleDateString('es-CO'), 14, y); y += 6;
  if (pagado && v.metodo) { doc.text('Método de pago: ' + v.metodo, 14, y); y += 6; }
  y += 2;

  doc.setFont('helvetica', 'bold'); doc.text('Detalle', 14, y); y += 6;
  doc.setFont('helvetica', 'normal'); doc.setFontSize(10);
  const detalle = detalleVenta(v).split(' · ');
  detalle.forEach(linea => { doc.text('• ' + linea, 16, y); y += 6; });
  y += 4;

  doc.setDrawColor(220); doc.line(12, y, anchoPag - 12, y); y += 10;
  doc.setFont('helvetica', 'bold'); doc.setFontSize(15);
  doc.text('TOTAL: ' + fmt(v.valor), 14, y);
  if (pagado) {
    doc.setTextColor(74, 107, 72); doc.setFontSize(12);
    doc.text('✓ PAGADO', anchoPag - 14, y, { align: 'right' });
  } else {
    doc.setTextColor(173, 75, 49); doc.setFontSize(12);
    doc.text('PENDIENTE DE PAGO', anchoPag - 14, y, { align: 'right' });
  }
  y += 14;

  // Los datos de pago solo se muestran si TODAVÍA no ha pagado — si ya
  // pagó, no hacen falta y el recibo queda más limpio.
  if (!pagado) {
    doc.setTextColor(120); doc.setFontSize(9);
    doc.text('Puedes pagar a:', 14, y); y += 5;
    doc.setFont('helvetica', 'bold'); doc.setTextColor(60);
    doc.text(DATOS_PAGO, 14, y); y += 10;
  }

  doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(150);
  doc.text('¡Gracias por tu compra!', anchoPag/2, y, { align: 'center' });

  doc.save('Recibo_CafePandora_' + (v.cliente || 'cliente').replace(/[^a-zA-Z0-9]/g,'_') + '_' + v.id + '.pdf');
}

function enviarReciboWhatsApp(id) {
  const v = state.ventas.find(x => x.id === id); if (!v) return;
  const pagado = v.estado === 'Pagado';
  const telefono = prompt('¿A qué número le mandamos el recibo? (con indicativo, ej. 57...)', '');
  if (!telefono) return;
  const mensaje = pagado
    ? `¡Hola ${v.cliente || ''}! 😊 Te confirmamos tu compra en Café Pandora:\n\n${detalleVenta(v)}\n\nTotal: ${fmt(v.valor)}\nEstado: Pagado ✅\n\nTe adjunto el recibo${v.guiaEnvio ? ' y la guía de envío' : ''}. ¡Gracias por tu compra!`
    : `¡Hola ${v.cliente || ''}! 👋 Este es tu pedido en Café Pandora:\n\n${detalleVenta(v)}\n\nTotal: ${fmt(v.valor)}\n\nPuedes pagar a:\n${DATOS_PAGO}\n\nTe adjunto el recibo. ¡Gracias!`;
  window.open('https://wa.me/' + telefono.replace(/\D/g,'') + '?text=' + encodeURIComponent(mensaje), '_blank');

/* ---------- Editar un pedido: agregar más líneas días después ---------- */
let editCarrito = [];
let editItemsNuevos = [];
let editItemsRemovidos = []; // líneas ORIGINALES que se quitaron en esta sesión (para devolver su inventario)
let editTipoCliente = 'Cliente normal';

function itemsNormalizados(v) {
  if (v.items && v.items.length && v.items[0] && v.items[0].tipo) return v.items.map(it => ({ ...it }));
  if (v.tipoVenta === 'maquila' && Array.isArray(v.servicios) && v.servicios.length) {
    return v.servicios.map(s => ({ tipo: 'maquila', servicio: s.servicio, presentacion: s.presentacion || null, cantidad: s.cantidad, valor: 0 }));
  }
  if (v.lote) return [{ tipo: 'cafe', lote: v.lote, presentacion: v.presentacion, cantidad: v.cantidad || 1, valor: v.valor }];
  return [];
}

function abrirEdicionVenta(id) {
  const v = state.ventas.find(x => x.id === id); if (!v) return;
  editCarrito = itemsNormalizados(v);
  editItemsNuevos = [];
  editItemsRemovidos = [];
  editTipoCliente = v.tipoCliente || 'Cliente normal';

  abrirModal(`
    <h3>Editar pedido — ${escapeHtml(v.cliente || 'Venta directa')}</h3>
    <p style="font-size:12px;color:var(--cafe-soft);margin-top:-6px">Puedes agregarle más café ahora si el pedido sigue en curso.</p>

    <div id="em-lista"></div>
    <div style="text-align:right;font-weight:700;margin:6px 0 10px">Total: <span id="em-total">$0</span></div>

    <h3 class="section-title" style="margin-top:4px">Agregar línea</h3>
    <div class="row">
      <div class="field"><label>Lote</label><select id="em-ln-lote" onchange="onEmLnLoteChange()">${LOTES_VENTA.map(l => `<option>${l}</option>`).join('')}</select></div>
      <div class="field"><label>Presentación</label><select id="em-ln-presentacion" onchange="recalcularEmLinea()">${PRESENTACIONES.map(p => `<option>${p}</option>`).join('')}</select></div>
      <div class="field"><label>Cantidad</label><input id="em-ln-cantidad-cafe" type="number" value="1" min="1" onchange="recalcularEmLinea()"></div>
    </div>
    <div class="row">
      <div class="field"><label>Molienda</label><select id="em-ln-molienda">${MOLIENDAS.map(m => `<option>${m}</option>`).join('')}</select></div>
      <div class="field" id="em-ln-campo-tueste"><label>Tostión</label><select id="em-ln-tueste">${TUESTES_LAVADO.map(t => `<option>${t}</option>`).join('')}</select></div>
    </div>
    <div class="row">
      <div class="field"><label>Valor de esta línea</label><input id="em-ln-valor" type="number" placeholder="0" min="0"></div>
    </div>
    <button class="sec-btn" style="width:100%" onclick="agregarLineaAEdicion()">+ Agregar línea</button>

    <div class="row" style="margin-top:14px">
      <div class="field"><label>Estado</label><select id="m-estado"><option ${v.estado==='Pagado'?'selected':''}>Pagado</option><option ${v.estado==='Pendiente'?'selected':''}>Pendiente</option></select></div>
      <div class="field"><label>Método de pago</label><select id="m-metodo" onchange="actualizarRecibioVisible('m')">${METODOS_PAGO.map(m => `<option ${m===v.metodo?'selected':''}>${m}</option>`).join('')}</select></div>
    </div>
    <div class="row" id="m-recibio-fila" style="display:${personaDeMetodo(v.metodo) ? 'none' : 'flex'}">
      <div class="field"><label>Quién recibió</label><select id="m-recibio"><option value="">—</option>${CUENTAS_BALANCE.map(p => `<option ${p===v.recibidoPor?'selected':''}>${p}</option>`).join('')}</select></div>
    </div>
    <div class="modal-actions">
      <button class="add-btn" onclick="guardarEdicionVenta(${id}, this)">Guardar</button>
      <button class="sec-btn" onclick="cerrarModal()">Cancelar</button>
    </div>
  `);
  onEmLnLoteChange();
  pintarEdicionCarrito();
}

function onEmLnLoteChange() {
  const lote = document.getElementById('em-ln-lote').value;
  document.getElementById('em-ln-campo-tueste').style.display = lote === 'Lavado' ? 'flex' : 'none';
  document.getElementById('em-ln-presentacion').innerHTML = presentacionesDeLote(lote).map(p => `<option>${p}</option>`).join('');
  recalcularEmLinea();
}

function recalcularEmLinea() {
  const lote = document.getElementById('em-ln-lote').value;
  const presentacion = document.getElementById('em-ln-presentacion').value;
  const cantidad = Number(document.getElementById('em-ln-cantidad-cafe').value) || 1;
  document.getElementById('em-ln-valor').value = precioSugerido(lote, presentacion, editTipoCliente) * cantidad;
}

function agregarLineaAEdicion() {
  const lote = document.getElementById('em-ln-lote').value;
  const item = {
    tipo: 'cafe',
    lote,
    presentacion: document.getElementById('em-ln-presentacion').value,
    cantidad: Number(document.getElementById('em-ln-cantidad-cafe').value) || 1,
    valor: Number(document.getElementById('em-ln-valor').value) || 0,
    molienda: document.getElementById('em-ln-molienda').value,
    tueste: lote === 'Lavado' ? document.getElementById('em-ln-tueste').value : null,
  };
  if (!item.cantidad) return toast('Pon una cantidad mayor a cero.', 'error');
  editCarrito.push(item);
  editItemsNuevos.push(item); // mismo objeto: así sabemos que es nuevo de esta sesión
  pintarEdicionCarrito();
}

function quitarDeEdicion(i) {
  const [removido] = editCarrito.splice(i, 1);
  const j = editItemsNuevos.indexOf(removido);
  if (j !== -1) {
    editItemsNuevos.splice(j, 1); // se agregó y se quitó en la misma sesión: se cancela, no hay que devolver nada
  } else {
    editItemsRemovidos.push(removido); // era una línea original: hay que devolverle su inventario
  }
  pintarEdicionCarrito();
}

// Distribuidores a veces van pagando paquete por paquete a medida que
// venden, en vez de pagar el pedido completo de una — esto solo aplica a
// líneas de café (no tiene sentido para maquila) y solo se ofrece cuando
// el pedido es de un Distribuidor.
function pintarEdicionCarrito() {
  const lista = document.getElementById('em-lista');
  if (!lista) return;
  const esDistribuidor = editTipoCliente === 'Distribuidor';
  lista.innerHTML = editCarrito.length
    ? editCarrito.map((it, i) => {
        const pagadas = Math.min(Number(it.cantidadPagada) || 0, Number(it.cantidad) || 0);
        return `
      <div class="ledger-row">
        <div class="main">
          <div class="title">${it.tipo === 'cafe' ? `${escapeHtml(it.lote)} · ${escapeHtml(it.presentacion)} × ${it.cantidad}` : `${escapeHtml(it.servicio)} ${it.presentacion ? it.cantidad + ' ' + escapeHtml(it.presentacion) : it.cantidad + 'kg'}`}</div>
          ${esDistribuidor && it.tipo === 'cafe' ? `
            <div class="pagado-stepper">
              <span>Pagado ${pagadas} de ${it.cantidad}</span>
              <button type="button" onclick="cambiarPagadoItem(${i},-1)" ${pagadas <= 0 ? 'disabled' : ''}>−</button>
              <button type="button" onclick="cambiarPagadoItem(${i},1)" ${pagadas >= it.cantidad ? 'disabled' : ''}>+</button>
            </div>` : ''}
        </div>
        <div class="amount pos">${fmt(it.valor)}</div>
        <div class="acciones"><button onclick="quitarDeEdicion(${i})" title="Quitar">✕</button></div>
      </div>`;
      }).join('')
    : '<div class="empty">Sin líneas — agrega la primera abajo.</div>';
  document.getElementById('em-total').textContent = fmt(editCarrito.reduce((s, it) => s + (Number(it.valor) || 0), 0));
}

function cambiarPagadoItem(i, delta) {
  const it = editCarrito[i]; if (!it) return;
  const actual = Number(it.cantidadPagada) || 0;
  it.cantidadPagada = Math.max(0, Math.min(Number(it.cantidad) || 0, actual + delta));
  pintarEdicionCarrito();
  // Si con este cambio quedó todo pagado, sugiere pasar el pedido a
  // Pagado (sin forzarlo — el equipo puede corregir Quién recibió ahí
  // mismo antes de guardar).
  const itemsCafe = editCarrito.filter(x => x.tipo === 'cafe');
  const todoPagado = itemsCafe.length && itemsCafe.every(x => (Number(x.cantidadPagada) || 0) >= (Number(x.cantidad) || 0));
  const estadoSel = document.getElementById('m-estado');
  if (todoPagado && estadoSel && estadoSel.value !== 'Pagado') {
    estadoSel.value = 'Pagado';
    toast('Ya quedaron pagados todos los paquetes — se pasó el pedido a Pagado, revisa Quién recibió antes de guardar.');
  }
}

async function guardarEdicionVenta(id, btn) {
  const estado = document.getElementById('m-estado').value;
  const recibidoPor = personaDeMetodo(document.getElementById('m-metodo').value) || document.getElementById('m-recibio').value || null;
  if (estado === 'Pagado' && !recibidoPor) return toast('Elige quién recibió el pago.', 'error');
  if (btn) btn.disabled = true;
  const cambios = {
    items: editCarrito,
    valor: editCarrito.reduce((s, it) => s + (Number(it.valor) || 0), 0),
    estado,
    metodo: document.getElementById('m-metodo').value,
    recibidoPor,
    nuevosItems: editItemsNuevos, // el backend descuenta inventario por estas líneas nuevas
    itemsRemovidos: editItemsRemovidos, // y le devuelve inventario a las líneas originales que quitaste
  };
  const v = state.ventas.find(x => x.id === id); Object.assign(v, cambios);
  guardarCacheLocal('ventas'); cerrarModal(); renderTodo();
  await apiFetch('/api/ventas/' + id, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(cambios) });
  sincronizar();
}

/* ================================================================
   INVENTARIO TOSTADO
================================================================ */
const ICONOS_LOTE = { Lavado: '💧', Honey: '🍯', Natural: '🌿', Exotico: '✨' };
/* ================================================================
   MAQUILA — pestaña propia, aparte de Ventas.
   Es un servicio sobre el café del cliente, no toca inventario. Cada
   orden se puede ir completando en varios días (hoy solo trillado,
   mañana tueste, luego empaque) igual que hicimos con ventas.
================================================================ */
// Varias órdenes de maquila abiertas a la vez, igual que en Ventas — para
// poder atender dos clientes en paralelo (ej. Adrián y Alejandro) sin perder
// lo que lleva cada uno.
const ordenMaquilaVacia = () => ({ items: [], cliente: '', estado: 'Pendiente', metodo: '', recibidoPor: localStorage.getItem('cp_recibio') || '' });
let ordenesMaquilaAbiertas = [ordenMaquilaVacia()];
let ordenMaquilaActiva = 0;
// carritoMaquila siempre apunta a los items de la orden que estás viendo.
let carritoMaquila = ordenesMaquilaAbiertas[0].items;
const SERVICIO_TRANSPORTE = 'Transporte';
// Orden en el que Juan quiere ver los servicios siempre (en vez del orden
// alfabético que devuelve la base de datos) — cualquier servicio que no
// esté en esta lista se va al final, sin romper nada.
const ORDEN_SERVICIOS_MAQUILA = ['Trilla', 'Tostión', 'Molienda', 'Empaque', 'Bolsas Negras', 'Bolsas Ziploc', SERVICIO_TRANSPORTE];
const ordenServicioMaquila = s => { const i = ORDEN_SERVICIOS_MAQUILA.indexOf(s); return i === -1 ? 999 : i; };
const ordenarServiciosMaquila = lista => lista.slice().sort((a, b) => ordenServicioMaquila(a) - ordenServicioMaquila(b));

// Lee los campos del formulario y los guarda en la orden activa (para no
// perderlos al cambiar de orden).
function guardarOrdenMaquilaEnMemoria() {
  const o = ordenesMaquilaAbiertas[ordenMaquilaActiva];
  if (!o) return;
  const g = id => document.getElementById(id);
  if (g('mq-cliente')) o.cliente = g('mq-cliente').value;
  if (g('mq-estado')) o.estado = g('mq-estado').value;
  if (g('mq-metodo')) o.metodo = g('mq-metodo').value;
  if (g('mq-recibio')) o.recibidoPor = g('mq-recibio').value;
}

function cambiarOrdenMaquila(i) {
  guardarOrdenMaquilaEnMemoria();
  ordenMaquilaActiva = i;
  carritoMaquila = ordenesMaquilaAbiertas[i].items;
  renderMaquila();
}

function nuevaOrdenMaquila() {
  guardarOrdenMaquilaEnMemoria();
  ordenesMaquilaAbiertas.push(ordenMaquilaVacia());
  ordenMaquilaActiva = ordenesMaquilaAbiertas.length - 1;
  carritoMaquila = ordenesMaquilaAbiertas[ordenMaquilaActiva].items;
  renderMaquila();
  toast('Orden ' + ordenesMaquilaAbiertas.length + ' abierta');
}

function cerrarOrdenMaquila(i) {
  const o = ordenesMaquilaAbiertas[i];
  const tieneAlgo = o.items.length || (o.cliente || '').trim();
  if (tieneAlgo && !confirm('¿Descartar esta orden con lo que lleva dentro?')) return;
  guardarOrdenMaquilaEnMemoria();
  ordenesMaquilaAbiertas.splice(i, 1);
  if (!ordenesMaquilaAbiertas.length) ordenesMaquilaAbiertas.push(ordenMaquilaVacia());
  ordenMaquilaActiva = Math.min(ordenMaquilaActiva, ordenesMaquilaAbiertas.length - 1);
  carritoMaquila = ordenesMaquilaAbiertas[ordenMaquilaActiva].items;
  renderMaquila();
}

// Al registrar una orden, cierra esa pestaña y deja abiertas las demás.
function finalizarOrdenMaquilaActiva() {
  ordenesMaquilaAbiertas.splice(ordenMaquilaActiva, 1);
  if (!ordenesMaquilaAbiertas.length) ordenesMaquilaAbiertas.push(ordenMaquilaVacia());
  ordenMaquilaActiva = Math.min(ordenMaquilaActiva, ordenesMaquilaAbiertas.length - 1);
  carritoMaquila = ordenesMaquilaAbiertas[ordenMaquilaActiva].items;
}

function renderMaquila() {
  const mes = document.getElementById('filtroMes').value || hoyMes();
  const q = document.getElementById('filtroBusqueda').value;
  const orden = ordenesMaquilaAbiertas[ordenMaquilaActiva];

  const gruposMaquila = {};
  state.maquila.forEach(t => { (gruposMaquila[t.servicio] ||= []).push(t); });
  const servicios = ordenarServiciosMaquila([...Object.keys(gruposMaquila), SERVICIO_TRANSPORTE]);

  const delMes = state.ordenesMaquila.filter(o => mesDe(o.ts) === mes &&
    (coincide(o.cliente, q) || coincide(detalleOrdenMaquila(o), q)));
  const anteriores = state.ordenesMaquila.filter(o => (o.estado === 'Pendiente' || o.estadoEntrega !== 'Entregado') && mesDe(o.ts) < mes &&
    (coincide(o.cliente, q) || coincide(detalleOrdenMaquila(o), q)));

  document.getElementById('view-maquila').innerHTML = `
    <div class="card orden-card">
      <div class="orden-tabs">
        ${ordenesMaquilaAbiertas.map((o, i) => `
          <button class="${i === ordenMaquilaActiva ? 'active' : ''}" onclick="cambiarOrdenMaquila(${i})" title="${escapeAttr(o.cliente || 'Sin cliente')}">
            Orden ${i + 1}${o.items.length ? `<span class="badge">${o.items.length}</span>` : ''}
          </button>`).join('')}
        <button class="add-orden" onclick="nuevaOrdenMaquila()" title="Abrir otra orden">+</button>
      </div>
      <div class="orden-head">
        <h3 class="section-title" style="margin:0">${orden.cliente ? escapeHtml(orden.cliente) : 'Nueva orden de maquila'}</h3>
        ${ordenesMaquilaAbiertas.length > 1 ? `<button class="cerrar-orden" onclick="cerrarOrdenMaquila(${ordenMaquilaActiva})">Descartar</button>` : ''}
      </div>
      <div class="row">
        <div class="field"><label>Cliente</label>
          <div class="autocomplete-wrap">
            <input id="mq-cliente" placeholder="Escribe el nombre del cliente" autocomplete="off"
                   value="${escapeAttr(orden.cliente)}"
                   oninput="filtrarSugerenciasClienteMaquila()" onfocus="filtrarSugerenciasClienteMaquila()"
                   onblur="setTimeout(()=>{const c=document.getElementById('mqSugerencias'); if(c) c.style.display='none';},150)">
            <div id="mqSugerencias" class="sugerencias" style="display:none"></div>
          </div>
        </div>
      </div>

      <div class="subcard">
        <p class="subcard-titulo">① Agregar servicio a la orden</p>
        <div class="row">
          <div class="field"><label>Servicio</label>
            <select id="mq-servicio" onchange="onMaquilaServicioChange()">
              ${servicios.map(s => `<option>${escapeHtml(s)}</option>`).join('') || '<option value="">Configura tarifas primero</option>'}
            </select>
          </div>
        </div>
        <div class="row" id="mq-campos-kg" style="display:none">
          <div class="field"><label>Kilos</label>
            <input id="mq-kg" type="number" min="0" step="0.1" placeholder="0" onchange="recalcularLineaMaquila()">
          </div>
        </div>
        <div class="row" id="mq-campos-pres" style="display:none">
          <div class="field"><label>Presentación</label>
            <select id="mq-presentacion" onchange="recalcularLineaMaquila()">${PRESENTACIONES.map(p => `<option>${p}</option>`).join('')}</select>
          </div>
          <div class="field"><label>Cantidad</label>
            <input id="mq-cantidad" type="number" value="1" min="1" onchange="recalcularLineaMaquila()">
          </div>
        </div>
        <div class="row" id="mq-campos-transporte" style="display:none">
          <div class="field"><label>Trayecto / distancia (opcional)</label>
            <input id="mq-nota-transporte" placeholder="Ej. Ida y vuelta a la finca en Combia">
          </div>
        </div>
        <div class="row">
          <div class="field"><label>Valor de esta línea</label>
            <input id="mq-valor" type="number" placeholder="0" min="0">
          </div>
        </div>
        <p class="campo-ayuda">Precio sugerido según la tarifa configurada — puedes ajustarlo a mano si hace falta.</p>
        <button class="sec-btn" style="width:100%" onclick="agregarLineaMaquila()">+ Agregar a la orden</button>
      </div>

      <h3 class="section-title">Orden actual</h3>
      <div id="mq-carrito-lista"></div>
      <div style="text-align:right;font-weight:700;margin:6px 0 4px">Total: <span id="mq-carrito-total">$0</span></div>

      <div class="subcard">
        <p class="subcard-titulo">② Cerrar la orden</p>
        <div class="row">
          <div class="field"><label>Estado</label>
            <select id="mq-estado"><option ${orden.estado === 'Pendiente' ? 'selected' : ''}>Pendiente</option><option ${orden.estado === 'Pagado' ? 'selected' : ''}>Pagado</option></select>
          </div>
          <div class="field"><label>Método de pago</label>
            <select id="mq-metodo" onchange="actualizarRecibioVisible('mq')"><option value="">—</option>${METODOS_PAGO.map(m => `<option ${m === orden.metodo ? 'selected' : ''}>${m}</option>`).join('')}</select>
          </div>
        </div>
        <p class="campo-ayuda">Es de la orden completa, no de la última línea que agregaste — el total ya se suma solo arriba.</p>
        <div class="row" id="mq-recibio-fila" style="display:${personaDeMetodo(orden.metodo) ? 'none' : 'flex'}">
          <div class="field"><label>Quién recibió</label>
            <select id="mq-recibio"><option value="">—</option>${CUENTAS_BALANCE.map(p => `<option ${p === orden.recibidoPor ? 'selected' : ''}>${p}</option>`).join('')}</select>
          </div>
        </div>
        <button class="add-btn" onclick="registrarOrdenMaquila(this)">Registrar orden</button>
      </div>
    </div>

    ${anteriores.length ? `
      <h3 class="section-title" style="color:var(--terracota)">Pendientes de meses anteriores</h3>
      <p style="font-size:12px;color:var(--cafe-soft);margin-top:-6px">Lo que sigue sin pagar o sin entregar de otros meses — el resto de esos meses ya quedó resuelto y no aparece aquí, solo si cambias el mes de arriba.</p>
      <div>${anteriores.slice().sort((a,b)=>b.ts-a.ts).map(o => filaOrdenMaquila(o, true)).join('')}</div>
    ` : ''}

    <h3 class="section-title">Órdenes de ${mes}</h3>
    <div class="ledger">
      ${paginar(delMes.slice().sort((a,b)=>b.ts-a.ts), 'maquila', o => filaOrdenMaquila(o), 'Sin órdenes de maquila este mes.')}
    </div>
  `;
  onMaquilaServicioChange();
  pintarCarritoMaquila();
}

function detalleOrdenMaquila(o) {
  return (o.items || []).map(it => {
    if (it.servicio === SERVICIO_TRANSPORTE) return 'Transporte' + (it.nota ? ' (' + it.nota + ')' : '');
    return it.presentacion ? `${it.servicio} ${it.cantidad} ${it.presentacion}` : `${it.servicio} ${it.cantidad}kg`;
  }).join(' · ');
}

function filaOrdenMaquila(o, esDeuda) {
  const entregaPendiente = o.estadoEntrega !== 'Entregado';
  return `
    <div class="ledger-row ${esDeuda ? 'deuda-anterior' : ''} ${entregaPendiente ? 'envio-pendiente' : ''}">
      <div class="main">
        <div class="title">${escapeHtml(o.cliente)}</div>
        <div class="meta">${new Date(Number(o.ts)).toLocaleDateString('es-CO')}${o.metodo ? ' · ' + escapeHtml(o.metodo) : ''}${o.recibidoPor ? ' · recibió ' + escapeHtml(o.recibidoPor) : ''} ${esDeuda ? '· desde ' + mesDe(o.ts) : ''}</div>
        <div class="details">${escapeHtml(detalleOrdenMaquila(o))}</div>
        <div style="margin-top:5px"><button class="tag ${entregaPendiente ? 'envio-pendiente' : 'envio-enviado'}" onclick="toggleEstadoEntregaMaquila(${o.id})">${entregaPendiente ? '📦 Pendiente de entrega' : '✅ Entregado'}</button></div>
      </div>
      <button class="tag ${o.estado === 'Pagado' ? 'pagado' : 'pendiente'}" onclick="toggleEstadoOrdenMaquila(${o.id})">${o.estado}</button>
      <div class="amount pos">${fmt(o.valor)}</div>
      <div class="acciones">
        <button onclick="prellenarCuentaCobroDesdeMaquila(${o.id})" title="Cuenta de cobro">📋</button>
        <button onclick="abrirEdicionMaquila(${o.id})" title="Agregar / editar">✎</button>
        <button onclick="eliminarOrdenMaquila(${o.id})" title="Eliminar">✕</button>
      </div>
    </div>`;
}

async function toggleEstadoEntregaMaquila(id) {
  const o = state.ordenesMaquila.find(x => x.id === id); if (!o) return;
  const nuevo = o.estadoEntrega === 'Entregado' ? 'Pendiente' : 'Entregado';
  o.estadoEntrega = nuevo; guardarCacheLocal('ordenesMaquila'); renderTodo();
  await apiFetch('/api/ordenes-maquila/' + id, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ estadoEntrega: nuevo }) });
}

/* ---------- Autocompletado de cliente (reutiliza el mismo directorio) ---------- */
function filtrarSugerenciasClienteMaquila() {
  const input = document.getElementById('mq-cliente');
  const caja = document.getElementById('mqSugerencias');
  if (!input || !caja) return;
  const q = normalizar(input.value);
  const todos = listaClientesMaquila();
  const coinciden = (q ? todos.filter(c => normalizar(c.nombre).includes(q)) : todos).slice(0, 10);
  if (!coinciden.length) { caja.style.display = 'none'; return; }
  caja.innerHTML = coinciden.map(c => `
    <button type="button" onmousedown="elegirClienteMaquila('${escapeAttr(c.nombre).replace(/'/g, "\\'")}')">
      <span class="sug-nombre">${escapeHtml(c.nombre)}</span>
      <span class="sug-detalle">${c.compras ? c.compras + ' orden' + (c.compras===1?'':'es') : 'cliente nuevo'}</span>
    </button>`).join('');
  caja.style.display = 'block';
}
function elegirClienteMaquila(nombre) {
  document.getElementById('mq-cliente').value = nombre;
  const caja = document.getElementById('mqSugerencias');
  if (caja) caja.style.display = 'none';
}

/* ---------- Línea de servicio ---------- */
function onMaquilaServicioChange() {
  const servicio = document.getElementById('mq-servicio').value;
  const esTransporte = servicio === SERVICIO_TRANSPORTE;
  const filas = esTransporte ? [] : gruposDeServicio(servicio);
  const esKg = !esTransporte && filas.length === 1 && !filas[0].presentacion;
  document.getElementById('mq-campos-kg').style.display = esKg ? 'flex' : 'none';
  document.getElementById('mq-campos-pres').style.display = (!esTransporte && !esKg && filas.length) ? 'flex' : 'none';
  document.getElementById('mq-campos-transporte').style.display = esTransporte ? 'flex' : 'none';
  if (esTransporte) document.getElementById('mq-valor').value = ''; // el transporte siempre se escribe a mano
  else recalcularLineaMaquila();
}
function recalcularLineaMaquila() {
  const servicio = document.getElementById('mq-servicio').value;
  if (servicio === SERVICIO_TRANSPORTE) return; // valor manual, no se recalcula solo
  const filas = gruposDeServicio(servicio);
  if (!filas.length) return;
  const esKg = filas.length === 1 && !filas[0].presentacion;
  let valor = 0;
  if (esKg) {
    const kg = Number(document.getElementById('mq-kg').value) || 0;
    valor = kg * filas[0].precio;
  } else {
    const presentacion = document.getElementById('mq-presentacion').value;
    const cantidad = Number(document.getElementById('mq-cantidad').value) || 1;
    const tarifa = filas.find(f => f.presentacion === presentacion);
    valor = cantidad * (tarifa ? tarifa.precio : 0);
  }
  document.getElementById('mq-valor').value = valor;
}
function agregarLineaMaquila() {
  const servicio = document.getElementById('mq-servicio').value;
  if (!servicio) return toast('Configura al menos una tarifa de maquila primero.', 'error');
  const valor = Math.max(0, Number(document.getElementById('mq-valor').value) || 0);

  let item;
  if (servicio === SERVICIO_TRANSPORTE) {
    if (!valor) return toast('Escribe el valor del transporte.', 'error');
    const nota = document.getElementById('mq-nota-transporte').value.trim();
    item = { servicio: SERVICIO_TRANSPORTE, presentacion: null, cantidad: 1, valor, nota: nota || null };
  } else {
    const filas = gruposDeServicio(servicio);
    const esKg = filas.length === 1 && !filas[0].presentacion;
    item = esKg
      ? { servicio, presentacion: null, cantidad: Number(document.getElementById('mq-kg').value) || 0, valor }
      : { servicio, presentacion: document.getElementById('mq-presentacion').value, cantidad: Number(document.getElementById('mq-cantidad').value) || 1, valor };
    if (!item.cantidad) return toast('Pon una cantidad mayor a cero.', 'error');
  }
  carritoMaquila.push(item);
  pintarCarritoMaquila();
}
function quitarDeCarritoMaquila(i) {
  carritoMaquila.splice(i, 1);
  pintarCarritoMaquila();
}
function tituloItemMaquila(it) {
  if (it.servicio === SERVICIO_TRANSPORTE) return 'Transporte' + (it.nota ? ' · ' + escapeHtml(it.nota) : '');
  return it.presentacion ? `${escapeHtml(it.servicio)} · ${it.cantidad} ${escapeHtml(it.presentacion)}` : `${escapeHtml(it.servicio)} · ${it.cantidad}kg`;
}
function pintarCarritoMaquila() {
  const lista = document.getElementById('mq-carrito-lista');
  if (!lista) return;
  lista.innerHTML = carritoMaquila.length
    ? carritoMaquila.map((it, i) => `
      <div class="ledger-row">
        <div class="main"><div class="title">${tituloItemMaquila(it)}</div></div>
        <div class="amount pos">${fmt(it.valor)}</div>
        <div class="acciones"><button onclick="quitarDeCarritoMaquila(${i})" title="Quitar">✕</button></div>
      </div>`).join('')
    : '<div class="empty">Aún no has agregado nada.</div>';
  document.getElementById('mq-carrito-total').textContent = fmt(carritoMaquila.reduce((s, it) => s + (Number(it.valor) || 0), 0));
}

async function registrarOrdenMaquila(btn) {
  const cliente = nombreCanonicoMaquila(document.getElementById('mq-cliente').value) || '';
  if (!cliente) return toast('Escribe el nombre del cliente.', 'error');
  if (!carritoMaquila.length) return toast('Agrega al menos un servicio.', 'error');
  const metodo = document.getElementById('mq-metodo').value;
  const recibidoPor = personaDeMetodo(metodo) || document.getElementById('mq-recibio').value || null;
  const estado = document.getElementById('mq-estado').value;
  if (estado === 'Pagado' && !recibidoPor) return toast('Elige quién recibió el pago.', 'error');
  btn.disabled = true;
  try {
    const payload = {
      cliente,
      usuario: recibidoPor || localStorage.getItem('cp_usuario') || 'Equipo',
      items: carritoMaquila,
      valor: carritoMaquila.reduce((s, it) => s + (Number(it.valor) || 0), 0),
      estado,
      metodo,
      recibidoPor,
      ts: Date.now(),
    };
    if (recibidoPor) { localStorage.setItem('cp_recibio', recibidoPor); localStorage.setItem('cp_usuario', recibidoPor); }
    const res = await apiFetch('/api/ordenes-maquila', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    if (!res.ok) throw new Error(await res.text());
    state.ordenesMaquila.push(await res.json());
    guardarCacheLocal('ordenesMaquila');
    finalizarOrdenMaquilaActiva();
    toast('Orden de maquila registrada');
    renderTodo();
    sincronizar();
  } catch (err) {
    toast('No se pudo registrar: ' + err.message, 'error');
  } finally { btn.disabled = false; }
}

async function toggleEstadoOrdenMaquila(id) {
  const o = state.ordenesMaquila.find(x => x.id === id); if (!o) return;
  const nuevo = o.estado === 'Pagado' ? 'Pendiente' : 'Pagado';
  if (nuevo === 'Pagado' && !personaDeMetodo(o.metodo) && !o.recibidoPor) {
    toast('Antes de marcar como pagada, elige quién recibió el pago.', 'error');
    return abrirEdicionMaquila(id);
  }
  o.estado = nuevo; guardarCacheLocal('ordenesMaquila'); renderTodo();
  await apiFetch('/api/ordenes-maquila/' + id, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ estado: nuevo }) });
}

async function eliminarOrdenMaquila(id) {
  if (!confirm('¿Eliminar esta orden de maquila?')) return;
  state.ordenesMaquila = state.ordenesMaquila.filter(x => x.id !== id);
  guardarCacheLocal('ordenesMaquila'); renderTodo();
  await apiFetch('/api/ordenes-maquila/' + id, { method: 'DELETE' });
}

/* ---------- Editar una orden: irla completando en varios días ---------- */
let editCarritoMaquila = [];
let editOrdenMaquilaId = null;

function abrirEdicionMaquila(id) {
  const o = state.ordenesMaquila.find(x => x.id === id); if (!o) return;
  editOrdenMaquilaId = id;
  editCarritoMaquila = (o.items || []).map(it => ({ ...it }));

  const gruposMaquila = {};
  state.maquila.forEach(t => { (gruposMaquila[t.servicio] ||= []).push(t); });
  const servicios = ordenarServiciosMaquila([...Object.keys(gruposMaquila), SERVICIO_TRANSPORTE]);

  abrirModal(`
    <h3>Orden de maquila — ${escapeHtml(o.cliente)}</h3>
    <p style="font-size:12px;color:var(--cafe-soft);margin-top:-6px">Agrégale el siguiente paso (ej. hoy trillado, luego tueste, luego empaque).</p>

    <div id="emq-lista"></div>
    <div style="text-align:right;font-weight:700;margin:6px 0 10px">Total: <span id="emq-total">$0</span></div>

    <div class="row">
      <div class="field"><label>Servicio</label>
        <select id="emq-servicio" onchange="onEmqServicioChange()">${servicios.map(s => `<option>${escapeHtml(s)}</option>`).join('')}</select>
      </div>
    </div>
    <div class="row" id="emq-campos-kg" style="display:none">
      <div class="field"><label>Kilos</label><input id="emq-kg" type="number" min="0" step="0.1" placeholder="0" onchange="recalcularEmqLinea()"></div>
    </div>
    <div class="row" id="emq-campos-pres" style="display:none">
      <div class="field"><label>Presentación</label><select id="emq-presentacion" onchange="recalcularEmqLinea()">${PRESENTACIONES.map(p => `<option>${p}</option>`).join('')}</select></div>
      <div class="field"><label>Cantidad</label><input id="emq-cantidad" type="number" value="1" min="1" onchange="recalcularEmqLinea()"></div>
    </div>
    <div class="row" id="emq-campos-transporte" style="display:none">
      <div class="field"><label>Trayecto / distancia (opcional)</label><input id="emq-nota-transporte" placeholder="Ej. Ida y vuelta a la finca en Combia"></div>
    </div>
    <div class="row">
      <div class="field"><label>Valor de esta línea</label><input id="emq-valor" type="number" placeholder="0" min="0"></div>
    </div>

  `);
  onEmqServicioChange();
  pintarEmqCarrito();
}

function onEmqServicioChange() {
  const servicio = document.getElementById('emq-servicio').value;
  const esTransporte = servicio === SERVICIO_TRANSPORTE;
  const filas = esTransporte ? [] : gruposDeServicio(servicio);
  const esKg = !esTransporte && filas.length === 1 && !filas[0].presentacion;
  document.getElementById('emq-campos-kg').style.display = esKg ? 'flex' : 'none';
  document.getElementById('emq-campos-pres').style.display = (!esTransporte && !esKg && filas.length) ? 'flex' : 'none';
  document.getElementById('emq-campos-transporte').style.display = esTransporte ? 'flex' : 'none';
  if (esTransporte) document.getElementById('emq-valor').value = '';
  else recalcularEmqLinea();
}
function recalcularEmqLinea() {
  const servicio = document.getElementById('emq-servicio').value;
  if (servicio === SERVICIO_TRANSPORTE) return;
  const filas = gruposDeServicio(servicio);
  if (!filas.length) return;
  const esKg = filas.length === 1 && !filas[0].presentacion;
  let valor = 0;
  if (esKg) {
    valor = (Number(document.getElementById('emq-kg').value) || 0) * filas[0].precio;
  } else {
    const presentacion = document.getElementById('emq-presentacion').value;
    const cantidad = Number(document.getElementById('emq-cantidad').value) || 1;
    const tarifa = filas.find(f => f.presentacion === presentacion);
    valor = cantidad * (tarifa ? tarifa.precio : 0);
  }
  document.getElementById('emq-valor').value = valor;
}
function agregarLineaEmq() {
  const servicio = document.getElementById('emq-servicio').value;
  const valor = Math.max(0, Number(document.getElementById('emq-valor').value) || 0);

  let item;
  if (servicio === SERVICIO_TRANSPORTE) {
    if (!valor) return toast('Escribe el valor del transporte.', 'error');
    const nota = document.getElementById('emq-nota-transporte').value.trim();
    item = { servicio: SERVICIO_TRANSPORTE, presentacion: null, cantidad: 1, valor, nota: nota || null };
  } else {
    const filas = gruposDeServicio(servicio);
    const esKg = filas.length === 1 && !filas[0].presentacion;
    item = esKg
      ? { servicio, presentacion: null, cantidad: Number(document.getElementById('emq-kg').value) || 0, valor }
      : { servicio, presentacion: document.getElementById('emq-presentacion').value, cantidad: Number(document.getElementById('emq-cantidad').value) || 1, valor };
    if (!item.cantidad) return toast('Pon una cantidad mayor a cero.', 'error');
  }
  editCarritoMaquila.push(item);
  pintarEmqCarrito();
}
function quitarDeEmqCarrito(i) {
  editCarritoMaquila.splice(i, 1);
  pintarEmqCarrito();
}
function pintarEmqCarrito() {
  const lista = document.getElementById('emq-lista');
  if (!lista) return;
  lista.innerHTML = editCarritoMaquila.length
    ? editCarritoMaquila.map((it, i) => `
      <div class="ledger-row">
        <div class="main"><div class="title">${tituloItemMaquila(it)}</div></div>
        <div class="amount pos">${fmt(it.valor)}</div>
        <div class="acciones"><button onclick="quitarDeEmqCarrito(${i})" title="Quitar">✕</button></div>
      </div>`).join('')
    : '<div class="empty">Sin líneas — agrega la primera abajo.</div>';
  document.getElementById('emq-total').textContent = fmt(editCarritoMaquila.reduce((s, it) => s + (Number(it.valor) || 0), 0));
}

async function guardarEdicionMaquila(id, btn) {
  const estado = document.getElementById('m-estado').value;

  await apiFetch('/api/ordenes-maquila/' + id, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(cambios) });
}

// Texto de proyección de cuánto dura el stock actual, al ritmo de venta de
// los últimos DIAS_VELOCIDAD_INVENTARIO días — null si casi no se ha
// vendido nada de ese lote en la ventana (la proyección no diría nada útil).
function proyeccionInventario(lote, stockLb) {
  const vel = velocidadVentaLote(lote);
  if (vel < 0.05) return null;
  const dias = Number(stockLb) / vel;
  if (dias > 90) return `Alcanza para más de 3 meses al ritmo actual`;
  return `${dias < 1 ? '🔥 ' : ''}Se acaba en ~${Math.round(dias)} día${Math.round(dias) === 1 ? '' : 's'} al ritmo actual`;
}
function renderInventario() {
  document.getElementById('view-inventario').innerHTML = `

          <div class="nombre">${i.lote}</div>
          <div class="stock">${Number(i.stockLb).toFixed(2)} kg</div>
          ${proyeccionInventario(i.lote, i.stockLb) ? `<div style="font-size:12px;color:var(--cafe-soft);margin:2px 0 8px">${proyeccionInventario(i.lote, i.stockLb)}</div>` : ''}
          <button class="sec-btn" onclick="abrirEdicionInventario(${i.id})">Editar stock</button>

}

async function registrarGasto(btn) {
  // Quien paga es quien está registrando el gasto — un solo desplegable
  // en vez de pedirlo dos veces (nombre + quién pagó).
  const categoria = document.getElementById('g-categoria').value;
  const pagadoPor = document.getElementById('g-pago').value || null;
  const transferidoA = categoria === CATEGORIA_TRANSFERENCIA ? document.getElementById('g-transferencia-a').value : null;
  if (categoria === CATEGORIA_TRANSFERENCIA) {
    if (!pagadoPor) return toast('Elige quién transfiere.', 'error');
    if (!transferidoA) return toast('Elige a quién se transfiere.', 'error');
    if (pagadoPor === transferidoA) return toast('El origen y el destino de la transferencia no pueden ser la misma persona.', 'error');
  } else if (!pagadoPor) {
    // Sin esto, un gasto puede quedar Pagado sin dueño y no cuadra en el
    // balance de nadie — mismo problema que tuvimos con ventas viejas.
    return toast('Elige quién pagó.', 'error');
  }
  const payload = {
    usuario: pagadoPor || 'Equipo',
    concepto: document.getElementById('g-concepto').value.trim(),
    monto: Math.max(0, Number(document.getElementById('g-monto').value) || 0),
    categoria,
    estado: document.getElementById('g-estado').value,
    pagadoPor,
    transferidoA,
    ts: Date.now(),
  };
  if (!payload.concepto) return toast('Escribe el concepto del gasto.', 'error');
  localStorage.setItem('cp_usuario', payload.usuario);
  if (payload.pagadoPor) localStorage.setItem('cp_pago', payload.pagadoPor);
  if (btn) btn.disabled = true;
  try {
    const res = await apiFetch('/api/gastos', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    if (!res.ok) throw new Error(await res.text());
    state.gastos.push(await res.json()); guardarCacheLocal('gastos'); toast('Gasto registrado'); renderTodo();
  } catch (err) {
    toast('No se pudo registrar: ' + err.message, 'error');
  } finally {
    if (btn) btn.disabled = false;
  }
}
async function toggleEstadoGasto(id) {
  const g = state.gastos.find(x => x.id === id); if (!g) return;
  const nuevo = g.estado === 'Pagado' ? 'Pendiente' : 'Pagado';
  if (nuevo === 'Pagado' && !g.pagadoPor) {

  await apiFetch('/api/finca/' + id, { method: 'DELETE' });
}

/* ================================================================
   COSECHA & TUESTE (trazabilidad)
   Cierra el ciclo del inventario: todo lo demás resta stock,
   el tueste es lo único que suma.
================================================================ */
let trazaSubTab = 'cereza';
function cambiarTrazaSubTab(t) { trazaSubTab = t; renderTrazabilidad(); }

function renderTrazabilidad() {
  const cont = document.getElementById('view-trazabilidad');
  if (!cont) return;

  // --- Qué hay REALMENTE pendiente en el pipeline (2026-09-24, corregido
  // en la auditoría) --- Antes esto sumaba solo cosechas+cereza
  // comprada+pergamino comprado (un total DE POR VIDA, que nunca bajaba
  // aunque ya se hubiera trillado y tostado todo) y NO incluía el stock
  // que se siembra a mano con "+ Agregar pergamino/verde que ya tenías"
  // — así que este resumen de arriba podía decir una cosa mientras las
  // tarjetas de "Café verde" (que sí leen el inventario real) decían
  // otra. Ahora los 2 primeros stats usan LA MISMA fuente que esas
  // tarjetas (`state.inventarioPergamino`/`state.inventarioVerde`), así
  // que siempre van a coincidir con lo que se ve más abajo.
  const cosechasPend = state.cosechas.filter(c => c.kilosPergaminoReal == null);
  const pergaminoPendiente = state.inventarioPergamino.reduce((s, p) => s + Number(p.kilos || 0), 0);
  const verdePendiente = state.inventarioVerde.reduce((s, v) => s + Number(v.kilos || 0), 0);
  const r = rendimientosReales();
  const proyDesdePergamino = proyectarDesdePergamino(pergaminoPendiente);
  const tostadoDesdeVerde = verdePendiente * (1 - r.mermaTueste.valor);
  const verdeEsperado = verdePendiente + proyDesdePergamino.verde;
  const librasEsperadas = tostadoDesdeVerde / KG_POR_LIBRA_VENTA + proyDesdePergamino.libras;
  const yaTostado = state.tuestes.reduce((s, t) => s + Number(t.kilosTostado || 0), 0);
  const pasillaTotal = state.cosechas.reduce((s, c) => s + (Number(c.kilosPasilla) || 0), 0);

  cont.innerHTML = `
    <div class="stat-grid">
      <div class="stat"><div class="n">${pergaminoPendiente.toFixed(1)} kg</div><div class="l">Pergamino pendiente por trillar</div></div>
      <div class="stat"><div class="n">${verdeEsperado.toFixed(1)} kg</div><div class="l">Verde disponible + esperado al trillar</div></div>
      <div class="stat"><div class="n pos">${Math.round(librasEsperadas)}</div><div class="l">Libras de 500 g esperadas</div></div>
      <div class="stat"><div class="n">${yaTostado.toFixed(1)} kg</div><div class="l">Ya tostado a la fecha</div></div>
    </div>
    <p style="font-size:12px;color:var(--cafe-soft);margin:8px 0 0">Los dos primeros stats combinan lo que ya está listo (real) con una proyección de lo que falta por trillar, según tu rendimiento aprendido abajo — coinciden con "Café verde disponible" más abajo.</p>
    ${pasillaTotal > 0 ? `<p style="font-size:13px;color:var(--cafe-soft);margin:6px 0 0">🫘 ${pasillaTotal.toFixed(1)} kg de pasilla acumulada en pergamino — se tuesta y se vende aparte (lote "Pasilla" en Tueste y Ventas).</p>` : ''}

    <h4 style="margin:16px 0 6px">🌤️ Clima — ${UBICACION_FINCA.nombre}</h4>
    <div id="clima-finca"><p class="empty">Cargando clima…</p></div>

    ${panelRendimientos()}

    <div class="subtabs">
      <button class="${trazaSubTab==='cereza'?'active':''}" onclick="cambiarTrazaSubTab('cereza')">Cereza (${state.cosechas.length + state.cerezaComprada.length})</button>
      <button class="${trazaSubTab==='pergamino'?'active':''}" onclick="cambiarTrazaSubTab('pergamino')">Pergamino (${entradasPergamino().length})</button>
      <button class="${trazaSubTab==='verde'?'active':''}" onclick="cambiarTrazaSubTab('verde')">Café verde</button>
      <button class="${trazaSubTab==='tueste'?'active':''}" onclick="cambiarTrazaSubTab('tueste')">Tueste (${state.tuestes.length})</button>
    </div>

    ${trazaSubTab === 'cereza' ? `
      <h3 class="section-title" style="margin-top:0">🌱 Cosecha propia</h3>
      ${vistaCosechas(cosechasPend)}
      <h3 class="section-title">🚚 Cereza comprada a terceros</h3>
      ${vistaCerezaComprada()}
    ` : ''}
    ${trazaSubTab === 'pergamino' ? vistaPergamino() : ''}
    ${trazaSubTab === 'verde' ? vistaInventarioVerde() : ''}
    ${trazaSubTab === 'tueste' ? vistaTueste() : ''}
  `;
  cargarClimaFinca();
}

/* ---------- Panel de rendimientos ---------- */
/* ---------- Clima de la finca (Open-Meteo, gratis, sin llave) ----------
   La finca real es Finca Pitalito, Km 1 vía Los Mangos, Pital de Combia
   (Pereira, Risaralda) — confirmado por Juan el 2026-09-21 (antes esto
   usaba por error la dirección de EMISOR_DIRECCION/cuentas de cobro,
   "vía Marsella", que resultó ser otra dirección, no la de la finca).
   Las coordenadas siguen siendo las del centro de Pereira — no hay unas
   exactas de Pital de Combia todavía — así que esto sigue siendo una
   aproximación a nivel de municipio, no el punto GPS real de la finca.
   Sirve como apoyo para decidir si conviene sacar/tapar cereza en secado
   según la probabilidad de lluvia de los próximos días. */
const UBICACION_FINCA = { lat: 4.8133, lon: -75.6961, nombre: 'Pital de Combia, Pereira (aprox.)' };
const CLIMA_TTL_MS = 3 * 3600000;
let climaCache = null;

async function obtenerClima() {
  if (climaCache && Date.now() - climaCache.ts < CLIMA_TTL_MS) return climaCache;
  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${UBICACION_FINCA.lat}&longitude=${UBICACION_FINCA.lon}&daily=precipitation_probability_max,temperature_2m_max,temperature_2m_min&timezone=America%2FBogota&forecast_days=5`;
    const res = await fetch(url);
    if (!res.ok) return null;
    const data = await res.json();
    const dias = data.daily.time.map((f, i) => ({
      fecha: f,
      lluvia: data.daily.precipitation_probability_max[i],
      max: data.daily.temperature_2m_max[i],
      min: data.daily.temperature_2m_min[i],
    }));
    climaCache = { dias, ts: Date.now() };
    return climaCache;
  } catch {
    return null; // sin internet o la API no contestó — la sección se queda con su aviso, no rompe el resto de Trazabilidad
  }
}
function pintarClima(c) {
  if (!c) return '<p class="empty">No se pudo cargar el clima ahora mismo.</p>';
  return `
    <div class="clima-dias">
      ${c.dias.map(d => `
        <div class="clima-dia">
          <div class="clima-fecha">${new Date(d.fecha + 'T12:00:00').toLocaleDateString('es-CO', { weekday: 'short', day: 'numeric' })}</div>
          <div class="clima-icono">${d.lluvia >= 60 ? '🌧️' : (d.lluvia >= 30 ? '⛅' : '☀️')}</div>
          <div class="clima-lluvia">${d.lluvia}% lluvia</div>
          <div class="clima-temp">${Math.round(d.min)}°–${Math.round(d.max)}°</div>
        </div>`).join('')}
    </div>`;
}
// Pide el clima async y pinta el resultado cuando llegue, sin bloquear el
// resto de renderTrazabilidad() — si para cuando responde ya se cambió de
// pestaña, el contenedor ya no existe y simplemente no hace nada.
function cargarClimaFinca() {
  const el = document.getElementById('clima-finca');
  if (!el) return;
  obtenerClima().then(c => {
    const el2 = document.getElementById('clima-finca');
    if (el2) el2.innerHTML = pintarClima(c);
  });
}

function panelRendimientos() {
  const r = rendimientosReales();
  const fila = (titulo, d, formato) => {
    const aprendido = d.real != null;
    return `
      <div class="rend-fila">
        <div class="rend-nombre">${titulo}</div>
        <div class="rend-valor ${aprendido ? 'aprendido' : ''}">${formato(d.valor)}</div>
        <div class="rend-estado">${aprendido
          ? `<span class="badge-real">Tuyo</span> ${d.muestras} registro${d.muestras===1?'':'s'} · genérico era ${formato(d.generico)}`
          : `<span class="badge-gen">Genérico</span> faltan ${d.faltan} registro${d.faltan===1?'':'s'} para calcular el tuyo`}</div>
      </div>`;
  };
  const pct = v => (v * 100).toFixed(1) + '%';
  return `
    <div class="rend-card">
      <h4>Rendimientos de tu café</h4>
      <p class="rend-intro">Las proyecciones usan tus datos reales apenas hay suficientes registros. Mientras tanto, usan el estimado genérico.</p>
      ${fila('Cereza → pergamino', r.cerezaAPergamino, pct)}
      ${fila('Pergamino → verde', r.pergaminoAVerde, pct)}
      ${fila('Merma de tueste', r.mermaTueste, pct)}
    </div>`;
}

    ${listas.length ? `<div id="stockAlert" style="display:block;background:var(--verde-bg);border-color:var(--verde);color:var(--verde)">
      ✅ ${listas.length} cosecha${listas.length===1?'':'s'} ya deberían estar secas — pesa el pergamino y anótalo con el botón ⚖️
    </div>` : ''}

    <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">

    </div>
    <div class="ledger">

        const p = proyectarDesdeCereza(c.kilosCereza);

              : (yaSeco ? 'secado estimado listo' : 'seco aprox. ' + fechaCorta(seco.getTime()))}</div>
