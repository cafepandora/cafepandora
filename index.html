<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Café Pandora — Gestión Integral</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --crema: #FCFBF9;
    --crema-alt: #F1EAE0;
    --cafe: #3E2723;
    --cafe-soft: #8A7A70;
    --verde: #4A6B48;
    --verde-bg: #E7EDE3;
    --terracota: #AD4B31;
    --terracota-bg: #F6E3DA;
    --linea: #E3D9CC;
    --blanco: #FFFFFF;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--crema);
    color: var(--cafe);
    font-family: 'Outfit', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    font-size: 16px; line-height: 1.5;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 18px 14px 70px; }

  /* ---------- Pantalla de acceso ---------- */
  #lockScreen {
    position: fixed; inset: 0; background: var(--cafe);
    display: flex; align-items: center; justify-content: center;
    z-index: 100; padding: 20px;
  }
  #lockScreen .box {
    background: var(--crema); border-radius: 14px; padding: 32px 26px;
    max-width: 320px; width: 100%; text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,.35);
  }
  #lockScreen h1 { font-size: 22px; font-weight: 700; margin: 0 0 4px; }
  #lockScreen p { font-size: 13px; color: var(--cafe-soft); margin: 0 0 18px; }
  #lockScreen input {
    width: 100%; padding: 12px 14px; border-radius: 8px; border: 1px solid var(--linea);
    font-family: 'Outfit', sans-serif; font-size: 15px; margin-bottom: 10px; text-align: center;
  }
  #lockScreen button {
    width: 100%; padding: 12px; border: none; border-radius: 8px; background: var(--cafe);
    color: #fff; font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 14px; cursor: pointer;
  }
  #lockScreen .err { color: var(--terracota); font-size: 12.5px; min-height: 16px; margin-top: 8px; }

  #app { display: none; }

  /* ---------- Encabezado ---------- */
  header.top {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    position: sticky; top: 0; z-index: 20; background: var(--crema);
    padding: 12px 14px; margin: -18px -14px 14px; border-bottom: 1px solid var(--linea);
    box-shadow: 0 2px 10px rgba(62,39,35,.04);
  }
  header.top .mark {
    display: inline-flex; align-items: center; background: var(--blanco); padding: 6px 16px;
    border-radius: 30px; border: 1px solid var(--linea);
  }
  header.top .mark img { height: 30px; display: block; }
  header.top .sub { font-size: 11px; color: var(--cafe-soft); margin-top: 3px; }
  .top-actions { display: flex; gap: 8px; align-items: center; }
  .sync-indicator {
    display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; font-weight: 600;
    color: var(--verde); background: var(--verde-bg); padding: 4px 8px; border-radius: 12px;
  }
  .sync-dot { width: 6px; height: 6px; background: var(--verde); border-radius: 50%; }
  .btn-export {
    background: none; border: 1px solid var(--cafe); color: var(--cafe); font-size: 11px; font-weight: 600;
    padding: 6px 10px; border-radius: 6px; cursor: pointer; font-family: 'Outfit', sans-serif;
  }
  .btn-export:hover { background: var(--cafe); color: #fff; }

  /* ---------- Alerta de stock ---------- */
  #stockAlert {
    display: none; background: var(--terracota-bg); border: 1px solid var(--terracota);
    color: var(--terracota); border-radius: 8px; padding: 10px 12px; font-size: 12.5px;
    font-weight: 600; margin-bottom: 14px;
  }
  #exportReminder {
    display: none; background: var(--crema-alt); border: 1px solid var(--linea);
    color: var(--cafe-soft); border-radius: 8px; padding: 10px 12px; font-size: 12.5px;
    font-weight: 600; margin-bottom: 14px; display: none; align-items: center; justify-content: space-between; gap: 8px;
  }
  #exportReminder button { font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 11.5px; background: var(--cafe); color: #fff; border: none; border-radius: 20px; padding: 6px 12px; cursor: pointer; flex: 0 0 auto; }

  /* ---------- Controles globales ---------- */
  .controles-globales { display: flex; gap: 8px; margin-bottom: 14px; }
  .controles-globales input[type="month"] {
    flex: 0 0 160px; padding: 12px 12px; border: 1px solid var(--linea); border-radius: 10px;
    font-family: 'Outfit', sans-serif; font-size: 15px; background: var(--blanco); color: var(--cafe);
  }
  .controles-globales input[type="search"] {
    flex: 1; padding: 12px 12px; border: 1px solid var(--linea); border-radius: 10px;
    font-family: 'Outfit', sans-serif; font-size: 15px; background: var(--blanco);
  }

  /* ---------- Pestañas ---------- */
  nav.tabs {
    display: flex; overflow-x: auto; margin-bottom: 16px; gap: 6px; padding-bottom: 2px;
    -ms-overflow-style: none; scrollbar-width: none;
  }
  nav.tabs::-webkit-scrollbar { display: none; }
  nav.tabs button {
    flex: 0 0 auto; background: var(--blanco); border: 1px solid var(--linea); font-family: 'Outfit', sans-serif;
    font-size: 14.5px; font-weight: 600; color: var(--cafe-soft); padding: 11px 18px; cursor: pointer;
    border-radius: 30px; white-space: nowrap; transition: background .15s, color .15s;
  }
  nav.tabs button.active { color: #fff; background: var(--cafe); border-color: var(--cafe); }

  .subtabs { display: flex; gap: 6px; margin-bottom: 10px; }
  .subtabs button {
    flex: 1; background: var(--crema-alt); border: 1px solid var(--linea); color: var(--cafe-soft);
    font-family: 'Outfit', sans-serif; font-size: 14px; font-weight: 700; padding: 12px 6px;
    border-radius: 8px; cursor: pointer;
  }
  .subtabs button.active { background: var(--cafe); color: #fff; border-color: var(--cafe); }

  section.view { display: none; }
  section.view.active { display: block; }

  /* ---------- Tarjetas / formularios ---------- */
  .card {
    background: var(--blanco); border: 1px solid var(--linea); border-radius: 18px;
    padding: 20px; margin-bottom: 22px; box-shadow: 0 3px 14px rgba(62,39,35,.05);
  }
  .row { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .row:last-child { margin-bottom: 0; }
  .field { flex: 1; min-width: 120px; display: flex; flex-direction: column; gap: 3px; }
  .field label { font-size: 13px; color: var(--cafe-soft); font-weight: 600; letter-spacing: .01em; }
  .field input, .field select {
    font-family: 'Outfit', sans-serif; font-size: 16px; padding: 11px 12px; border: 1px solid var(--linea);
    border-radius: 6px; background: var(--blanco); color: var(--cafe); width: 100%;
  }
  .field input:focus, .field select:focus { outline: 2px solid var(--cafe); outline-offset: -1px; }

  .quick-add { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .quick-add button {
    font-family: 'Outfit', sans-serif; font-size: 14px; font-weight: 600; background: var(--verde-bg);
    color: var(--verde); border: 1px solid var(--verde); border-radius: 20px; padding: 10px 16px; cursor: pointer;
  }
  .quick-add button:hover { background: var(--verde); color: #fff; }

  .servicios-maquila { display: flex; flex-direction: column; gap: 0; margin: 8px 0; }
  .servicios-maquila .srow {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    font-size: 13.5px; font-weight: 600; padding: 9px 2px; border-bottom: 1px solid var(--linea);
  }
  .servicios-maquila .srow input[type="number"] { width: 100px; flex: 0 0 auto; }
  .servicios-maquila .srow-pres select { flex: 1; min-width: 0; padding: 7px 8px; border: 1px solid var(--linea); border-radius: 6px; font-family: 'Outfit', sans-serif; font-size: 13px; }
  .servicios-maquila .srow-pres input[type="number"] { width: 70px; }

  button.add-btn {
    font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 16px; background: var(--terracota);
    color: #fff; border: none; border-radius: 30px; padding: 16px 18px; cursor: pointer; width: 100%;
    box-shadow: 0 4px 14px rgba(173,75,49,.28);
  }
  button.add-btn:hover { background: #93402a; }
  button.add-btn:disabled { opacity: .55; cursor: not-allowed; box-shadow: none; }
  button.sec-btn {
    font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 14px; background: var(--blanco);
    border: 1px solid var(--cafe); color: var(--cafe); padding: 10px 16px; border-radius: 30px; cursor: pointer;
  }
  button.sec-btn:hover { background: var(--cafe); color: #fff; }

  /* ---------- Listas tipo libro ---------- */
  .ledger { border-top: 1px solid var(--linea); }
  .ledger-row {
    display: flex; align-items: center; gap: 12px; padding: 15px 4px; border-bottom: 1px solid var(--linea);
    font-size: 15.5px;
  }
  .ledger-row.deuda-anterior { background: var(--terracota-bg); border-radius: 6px; padding: 11px 8px; margin-bottom: 4px; border-bottom: none; }
  .ledger-row .main { flex: 1; min-width: 0; }
  .ledger-row .main .title { font-weight: 700; }
  .ledger-row .main .meta { font-size: 13px; color: var(--cafe-soft); margin-top: 3px; }
  .ledger-row .main .details { font-size: 13px; color: var(--cafe); margin-top: 2px; font-style: italic; opacity: .8; }
  .ledger-row .amount { font-weight: 700; font-size: 16.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .ledger-row .amount.pos { color: var(--verde); }
  .ledger-row .amount.neg { color: var(--terracota); }
  .ledger-row .acciones { display: flex; gap: 6px; align-items: center; }
  .ledger-row .acciones button {
    background: var(--crema-alt); border: 1px solid var(--linea); color: var(--cafe);
    font-size: 16px; cursor: pointer; padding: 7px 10px; border-radius: 8px;
    min-width: 38px; min-height: 38px; display: inline-flex; align-items: center; justify-content: center;
  }
  .ledger-row .acciones button:hover, .ledger-row .acciones button:active { background: var(--terracota); color: #fff; border-color: var(--terracota); }

  .tag { display: inline-block; font-size: 12.5px; font-weight: 700; padding: 5px 12px; border-radius: 20px; cursor: pointer; border: none; }
  .tag.pendiente { background: #F2E2C4; color: #8A6A1F; }
  .tag.pagado { background: var(--verde-bg); color: var(--verde); }

  .empty { text-align: center; color: var(--cafe-soft); font-size: 15px; padding: 32px 12px; }

  h3.section-title { font-size: 18px; font-weight: 700; margin: 22px 0 10px; }

  /* ---------- Inventario ---------- */
  .lote-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 18px; }
  .lote-card {
    background: var(--blanco); border: 1px solid var(--linea); border-radius: 18px; padding: 16px;
    box-shadow: 0 3px 14px rgba(62,39,35,.05); text-align: center;
  }
  .lote-card .icono {
    width: 46px; height: 46px; border-radius: 50%; background: var(--verde-bg); color: var(--verde);
    display: flex; align-items: center; justify-content: center; font-size: 20px; margin: 0 auto 8px;
  }
  .lote-card.bajo { background: var(--terracota-bg); border-color: var(--terracota); }
  .lote-card.bajo .icono { background: var(--terracota); color: #fff; }
  .lote-card .nombre { font-weight: 700; font-size: 14px; }
  .lote-card .stock { font-size: 20px; font-weight: 800; margin-top: 2px; }
  .lote-card.bajo .stock { color: var(--terracota); }
  .lote-card button.sec-btn { margin-top: 10px; width: 100%; }

  /* ---------- Resumen ---------- */
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 18px; }
  .stat { background: var(--blanco); border: 1px solid var(--linea); border-radius: 14px; padding: 16px 18px; box-shadow: 0 3px 14px rgba(62,39,35,.05); }
  .stat .n { font-weight: 800; font-size: 23px; }
  .stat .n.pos { color: var(--verde); } .stat .n.neg { color: var(--terracota); }
  .stat .l { font-size: 13px; color: var(--cafe-soft); margin-top: 4px; }
  .bar-row { display: flex; align-items: center; gap: 8px; font-size: 12.5px; margin-bottom: 6px; }
  .bar-row .lbl { flex: 0 0 90px; }
  .bar-track { flex: 1; background: var(--crema-alt); border-radius: 6px; height: 14px; overflow: hidden; }
  .bar-fill { background: var(--terracota); height: 100%; border-radius: 6px; }
  .bar-row .val { flex: 0 0 90px; text-align: right; font-weight: 600; }

  /* ---------- Config / Maquila ---------- */
  .tarifa-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--linea); }
  .tarifa-row .nombre { flex: 1; font-weight: 600; font-size: 14px; }
  .tarifa-row input { width: 110px; padding: 7px 9px; border: 1px solid var(--linea); border-radius: 6px; font-family: 'Outfit', sans-serif; }
  .tarifa-row button { flex: 0 0 auto; }


  /* ---------- Toasts ---------- */
  #toastWrap {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: 22px;
    z-index: 200; display: flex; flex-direction: column; gap: 8px; align-items: center;
    pointer-events: none; width: calc(100% - 28px); max-width: 420px;
  }
  .toast {
    background: var(--cafe); color: #fff; padding: 14px 18px; border-radius: 12px;
    font-size: 15px; font-weight: 600; box-shadow: 0 8px 28px rgba(62,39,35,.28);
    width: 100%; text-align: center; animation: toastIn .18s ease-out;
  }
  .toast.error { background: var(--terracota); }
  @keyframes toastIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  /* ---------- Gráficos ---------- */
  .chart-card {
    background: var(--blanco); border: 1px solid var(--linea); border-radius: 14px;
    padding: 16px 14px; margin-bottom: 16px; box-shadow: 0 3px 14px rgba(62,39,35,.05);
  }
  .chart-card h4 { margin: 0 0 12px; font-size: 15px; font-weight: 700; }
  .chart-box { position: relative; height: 240px; }

  /* ---------- Selector de rango ---------- */
  .rangos { display: flex; gap: 6px; margin-bottom: 16px; }
  .rangos button {
    flex: 1; background: var(--blanco); border: 1px solid var(--linea); color: var(--cafe-soft);
    font-family: 'Outfit', sans-serif; font-size: 13.5px; font-weight: 700; padding: 11px 4px;
    border-radius: 10px; cursor: pointer;
  }
  .rangos button.active { background: var(--verde); color: #fff; border-color: var(--verde); }

  /* ---------- Paginación ---------- */
  .paginacion { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 14px 0 4px; }
  .paginacion button {
    background: var(--blanco); border: 1px solid var(--linea); color: var(--cafe);
    font-family: 'Outfit', sans-serif; font-size: 14px; font-weight: 700;
    padding: 9px 16px; border-radius: 20px; cursor: pointer;
  }
  .paginacion button:disabled { opacity: .4; cursor: not-allowed; }
  .paginacion .pag-info { font-size: 13.5px; color: var(--cafe-soft); font-weight: 600; }

  /* ---------- Modal edición ---------- */
  #modalOverlay {
    display: none; position: fixed; inset: 0; background: rgba(62,39,35,.45); z-index: 90;
    align-items: flex-end; justify-content: center;
  }
  #modalOverlay.show { display: flex; }
  #modalBox {
    background: var(--crema); width: 100%; max-width: 480px; border-radius: 16px 16px 0 0;
    padding: 20px 16px 24px; max-height: 85vh; overflow-y: auto;
  }
  #modalBox h3 { margin: 0 0 12px; font-size: 16px; }
  .modal-actions { display: flex; gap: 8px; margin-top: 14px; }
  .modal-actions button.add-btn { flex: 1; }

  @media (min-width: 480px) {
    #modalOverlay { align-items: center; }
    #modalBox { border-radius: 16px; }
  }
</style>
</head>

const POR_PAGINA = 8;
const paginas = { ventas: 1, gastos: 1, finca: 1, resumen: 1 };

// Corta una lista ya ordenada a la página actual y devuelve el HTML de las
// filas visibles más los controles de "Anterior / Siguiente".
function paginar(lista, clave, pintarFila, textoVacio) {
  if (!lista.length) return '<div class="empty">' + textoVacio + '</div>';
  const totalPaginas = Math.max(1, Math.ceil(lista.length / POR_PAGINA));
  if (paginas[clave] > totalPaginas) paginas[clave] = totalPaginas;
  const pag = paginas[clave];
  const visibles = lista.slice((pag - 1) * POR_PAGINA, pag * POR_PAGINA);
  const controles = totalPaginas > 1 ? `
    <div class="paginacion">
      <button onclick="cambiarPagina('${clave}', -1)" ${pag === 1 ? 'disabled' : ''}>‹ Anterior</button>
      <span class="pag-info">${pag} de ${totalPaginas} · ${lista.length} registros</span>
      <button onclick="cambiarPagina('${clave}', 1)" ${pag === totalPaginas ? 'disabled' : ''}>Siguiente ›</button>
    </div>` : '';
  return visibles.map(pintarFila).join('') + controles;
}
function cambiarPagina(clave, delta) {
  paginas[clave] = Math.max(1, paginas[clave] + delta);
  renderTodo();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

const fmt = n => '$' + Math.round(Number(n) || 0).toLocaleString('es-CO');
const mesDe = ts => { const d = new Date(Number(ts)); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); };
const coincide = (texto, q) => !q || String(texto || '').toLowerCase().includes(q.toLowerCase());
const hoyMes = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); };

// El tipo de cliente decide qué tarifa aplica: 'Distribuidor' usa precios de
// distribuidor; cualquier otro tipo (Cliente normal, Mayorista, Interno) usa
// la tarifa normal.
const tierDeCliente = tipoCliente => tipoCliente === 'Distribuidor' ? 'distribuidor' : 'normal';

function precioSugerido(lote, presentacion, tipoCliente) {
  const tier = tierDeCliente(tipoCliente);
  const fila = state.preciosCafe.find(p => p.lote === lote && p.presentacion === presentacion && p.tipoCliente === tier);
  return fila ? fila.precio : 0;
}

/* ================================================================
   CARGA DE CACHÉ LOCAL + SINCRONIZACIÓN CON EL SERVIDOR
================================================================ */
const CACHE_KEYS = { ventas: 'cp_c_ventas', gastos: 'cp_c_gastos', clientes: 'cp_c_clientes', inventario: 'cp_c_inventario', maquila: 'cp_c_maquila', finca: 'cp_c_finca', preciosCafe: 'cp_c_preciosCafe' };

function cargarCacheLocal() {
  for (const k in CACHE_KEYS) {
    try {
      const raw = localStorage.getItem(CACHE_KEYS[k]);
      if (raw) state[k] = JSON.parse(raw);
    } catch {}
  }
}
function guardarCacheLocal(k) {
  try { localStorage.setItem(CACHE_KEYS[k], JSON.stringify(state[k])); } catch {}
}

async function sincronizar() {
  const ind = document.getElementById('syncIndicator');
  ind.innerHTML = '<span class="sync-dot"></span> Sincronizando…';
  try {
    const [v, g, c, i, m, f, pc] = await Promise.all([
      fetch('/api/ventas').then(r => r.json()),
      fetch('/api/gastos').then(r => r.json()),
      fetch('/api/clientes').then(r => r.json()),
      fetch('/api/inventario').then(r => r.json()),
      fetch('/api/maquila').then(r => r.json()),
      fetch('/api/finca').then(r => r.json()),
      fetch('/api/precios-cafe').then(r => r.json()),
    ]);
    state.ventas = v; state.gastos = g; state.clientes = c;
    state.inventario = i; state.maquila = m; state.finca = f; state.preciosCafe = pc;
    Object.keys(CACHE_KEYS).forEach(guardarCacheLocal);
    ind.innerHTML = '<span class="sync-dot"></span> Sincronizado';
    renderTodo();
  } catch (err) {
    ind.innerHTML = '<span class="sync-dot"></span> Sin conexión (viendo caché)';
  }
}

function renderRecordatorioExport() {
  const el = document.getElementById('exportReminder');
  const ultimo = Number(localStorage.getItem('cp_ultimo_export') || 0);

    el.style.display = 'flex';
    el.innerHTML = '<span>🗂️ Nunca has exportado un respaldo en Excel de esta cuenta.</span><button onclick="exportarExcel()">Exportar ahora</button>';

    el.style.display = 'flex';
    el.innerHTML = `<span>🗂️ Van ${dias} días sin exportar un respaldo en Excel.</span><button onclick="exportarExcel()">Exportar ahora</button>`;

    el.style.display = 'none';
  }
}

/* ---------- Línea nueva (café o un servicio de maquila) ---------- */
function onLineaTipoChange() {
  const tipo = document.getElementById('ln-tipo').value;
  const esCafe = tipo === 'cafe';
  const filas = esCafe ? [] : gruposDeServicio(tipo);
  const esKg = !esCafe && filas.length === 1 && !filas[0].presentacion;
  document.getElementById('ln-campos-cafe').style.display = esCafe ? 'flex' : 'none';
  document.getElementById('ln-campos-maquila-kg').style.display = (!esCafe && esKg) ? 'flex' : 'none';
  document.getElementById('ln-campos-maquila-pres').style.display = (!esCafe && !esKg) ? 'flex' : 'none';
  recalcularLinea();
}

function recalcularLinea() {
  const tipo = document.getElementById('ln-tipo').value;
  let valor = 0;
  if (tipo === 'cafe') {
    const lote = document.getElementById('ln-lote').value;
    const presentacion = document.getElementById('ln-presentacion').value;
    const cantidad = Number(document.getElementById('ln-cantidad-cafe').value) || 1;
    const tipoCliente = document.getElementById('v-tipoCliente').value;
    valor = precioSugerido(lote, presentacion, tipoCliente) * cantidad;
  } else {
    const filas = gruposDeServicio(tipo);
    const esKg = filas.length === 1 && !filas[0].presentacion;
    if (esKg) {
      const kg = Number(document.getElementById('ln-kg').value) || 0;
      valor = kg * (filas[0] ? filas[0].precio : 0);
    } else {
      const presentacion = document.getElementById('ln-presentacion-mq').value;
      const cantidad = Number(document.getElementById('ln-cantidad-mq').value) || 1;
      const tarifa = filas.find(f => f.presentacion === presentacion);
      valor = cantidad * (tarifa ? tarifa.precio : 0);
    }
  }
  document.getElementById('ln-valor').value = valor;
}

function agregarLineaAlCarrito() {
  const tipo = document.getElementById('ln-tipo').value;
  const valor = Number(document.getElementById('ln-valor').value) || 0;
  let item;
  if (tipo === 'cafe') {
    item = {
      tipo: 'cafe',
      lote: document.getElementById('ln-lote').value,
      presentacion: document.getElementById('ln-presentacion').value,
      cantidad: Number(document.getElementById('ln-cantidad-cafe').value) || 1,
      valor,
    };
  } else {
    const filas = gruposDeServicio(tipo);
    const esKg = filas.length === 1 && !filas[0].presentacion;
    item = esKg
      ? { tipo: 'maquila', servicio: tipo, presentacion: null, cantidad: Number(document.getElementById('ln-kg').value) || 0, valor }
      : { tipo: 'maquila', servicio: tipo, presentacion: document.getElementById('ln-presentacion-mq').value, cantidad: Number(document.getElementById('ln-cantidad-mq').value) || 1, valor };
  }
  if (!item.cantidad) return toast('Pon una cantidad mayor a cero.', 'error');
  carritoActual.push(item);
  pintarCarrito();
}

function quitarDelCarrito(i) {
  carritoActual.splice(i, 1);
  pintarCarrito();
}

function pintarCarrito() {
  const lista = document.getElementById('carrito-lista');
  if (!lista) return;
  lista.innerHTML = carritoActual.length
    ? carritoActual.map((it, i) => `
      <div class="ledger-row">
        <div class="main"><div class="title">${it.tipo === 'cafe' ? `${escapeHtml(it.lote)} · ${escapeHtml(it.presentacion)} × ${it.cantidad}` : `${escapeHtml(it.servicio)} ${it.presentacion ? it.cantidad + ' ' + escapeHtml(it.presentacion) : it.cantidad + 'kg'}`}</div></div>
        <div class="amount pos">${fmt(it.valor)}</div>
        <div class="acciones"><button onclick="quitarDelCarrito(${i})" title="Quitar">✕</button></div>
      </div>`).join('')
    : '<div class="empty">Aún no has agregado nada.</div>';
  const total = carritoActual.reduce((s, it) => s + (Number(it.valor) || 0), 0);
  document.getElementById('carrito-total').textContent = fmt(total);
  const valorInput = document.getElementById('v-valor');
  if (valorInput) valorInput.value = total;
}

function aplicarQuickAdd(idx) {
  const qa = QUICK_ADD[idx];
  const tipoClienteSelect = document.getElementById('v-tipoCliente');
  if (qa.tipoCliente) tipoClienteSelect.value = qa.tipoCliente; // este botón siempre agrega con la tarifa de distribuidor, ajusta el pedido completo
  const tipoCliente = tipoClienteSelect.value;
  carritoActual.push({ tipo: 'cafe', lote: qa.lote, presentacion: qa.presentacion, cantidad: 1, valor: precioSugerido(qa.lote, qa.presentacion, tipoCliente) });
  pintarCarrito();
  document.getElementById('v-cliente').focus();
}

function lotesDeVenta(v) {
  if (v.items && v.items.length && v.items[0] && v.items[0].tipo) {
    return v.items.filter(it => it.tipo === 'cafe' && it.lote).map(it => [it.lote, it.valor]);
  }
  if (v.tipoVenta !== 'maquila' && v.lote) return [[v.lote, v.valor]];
  return [];
}

function detalleVenta(v) {
  if (v.items && v.items.length && v.items[0] && v.items[0].tipo) {
    return v.items.map(it => it.tipo === 'maquila'
      ? (it.presentacion ? `${it.servicio} ${it.cantidad} ${it.presentacion}` : `${it.servicio} ${it.cantidad}kg`)
      : `${it.lote} ${it.presentacion} x${it.cantidad}`
    ).join(' · ');
  }
  if (v.tipoVenta === 'maquila') {
    return (v.servicios || []).map(s => s.presentacion ? `${s.servicio} ${s.cantidad} ${s.presentacion}` : `${s.servicio} ${s.cantidad}kg`).join(' · ');
  }
  if (v.lote) return `${v.lote} · ${v.presentacion || ''} × ${v.cantidad || 1}`;
  if (v.items && v.items.length) return v.items.map(it => `${it.cantidad}x ${it.proceso || ''} ${it.presentacion || ''}`).join(' · ');
  return '';
}

function filaVenta(v, esDeuda) {
  return `
    <div class="ledger-row ${esDeuda ? 'deuda-anterior' : ''}">
      <div class="main">
        <div class="title">${escapeHtml(v.cliente || 'Venta directa')}</div>
        <div class="meta">${new Date(Number(v.ts)).toLocaleDateString('es-CO')} · ${escapeHtml(v.usuario || '')} ${esDeuda ? '· desde ' + mesDe(v.ts) : ''}</div>
        <div class="details">${escapeHtml(detalleVenta(v))}</div>
      </div>
      <button class="tag ${v.estado === 'Pagado' ? 'pagado' : 'pendiente'}" onclick="toggleEstadoVenta(${v.id})">${v.estado}</button>
      <div class="amount pos">${fmt(v.valor)}</div>
      <div class="acciones">
        <button onclick="abrirEdicionVenta(${v.id})" title="Editar">✎</button>
        <button onclick="eliminarVenta(${v.id})" title="Eliminar">✕</button>
      </div>
    </div>`;
}

async function registrarVenta(btn) {
  if (!carritoActual.length) return toast('Agrega al menos un producto o servicio al pedido.', 'error');
  if (btn) btn.disabled = true;
  try {
    const usuario = document.getElementById('v-usuario').value.trim() || 'Equipo';
    localStorage.setItem('cp_usuario', usuario);

    const payload = {
      usuario,
      cliente: document.getElementById('v-cliente').value.trim() || 'Venta directa',
      tipoCliente: document.getElementById('v-tipoCliente').value,
      items: carritoActual,
      valor: Math.max(0, Number(document.getElementById('v-valor').value) || carritoActual.reduce((s, it) => s + (Number(it.valor) || 0), 0)),
      metodo: document.getElementById('v-metodo').value,
      estado: document.getElementById('v-estado').value,
      ts: Date.now(),
    };

    const res = await fetch('/api/ventas', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    const row = await res.json();
    state.ventas.push(row);
    guardarCacheLocal('ventas');
    carritoActual = [];
    toast('Venta registrada');
    renderTodo(); // esto reconstruye el botón, ya no hace falta rehabilitarlo a mano
    sincronizar(); // trae de vuelta el descuento de inventario / nuevo cliente calculados en el servidor
  } finally {
    if (btn) btn.disabled = false;
  }
}

async function toggleEstadoVenta(id) {
  const v = state.ventas.find(x => x.id === id); if (!v) return;
  const nuevo = v.estado === 'Pagado' ? 'Pendiente' : 'Pagado';
  v.estado = nuevo; guardarCacheLocal('ventas'); renderTodo();
  await fetch('/api/ventas/' + id, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ estado: nuevo }) });
}
async function eliminarVenta(id) {
  if (!confirm('¿Anular esta venta? El café que traiga vuelve al inventario automáticamente.')) return;
  state.ventas = state.ventas.filter(x => x.id !== id); guardarCacheLocal('ventas'); renderTodo();
  await fetch('/api/ventas/' + id, { method: 'DELETE' });
  sincronizar(); // refleja el inventario devuelto
}
/* ---------- Editar un pedido: agregar más líneas días después ---------- */
let editCarrito = [];
let editItemsNuevos = [];
let editItemsRemovidos = []; // líneas ORIGINALES que se quitaron en esta sesión (para devolver su inventario)
let editTipoCliente = 'Cliente normal';

function itemsNormalizados(v) {
  if (v.items && v.items.length && v.items[0] && v.items[0].tipo) return v.items.map(it => ({ ...it }));
  if (v.tipoVenta === 'maquila' && Array.isArray(v.servicios) && v.servicios.length) {
    return v.servicios.map(s => ({ tipo: 'maquila', servicio: s.servicio, presentacion: s.presentacion || null, cantidad: s.cantidad, valor: 0 }));
  }
  if (v.lote) return [{ tipo: 'cafe', lote: v.lote, presentacion: v.presentacion, cantidad: v.cantidad || 1, valor: v.valor }];
  return [];
}

function abrirEdicionVenta(id) {
  const v = state.ventas.find(x => x.id === id); if (!v) return;
  editCarrito = itemsNormalizados(v);
  editItemsNuevos = [];
  editItemsRemovidos = [];
  editTipoCliente = v.tipoCliente || 'Cliente normal';

  const gruposMaquila = {};
  state.maquila.forEach(t => { (gruposMaquila[t.servicio] ||= []).push(t); });

    <div style="text-align:right;font-weight:700;margin:6px 0 10px">Total: <span id="em-total">$0</span></div>

    <div class="row">
      <div class="field"><label>¿Qué se agrega?</label>
        <select id="em-ln-tipo" onchange="onEmLineaTipoChange()">
          <option value="cafe">Café</option>
          ${Object.keys(gruposMaquila).map(s => `<option value="${escapeAttr(s)}">${escapeHtml(s)} (maquila)</option>`).join('')}

      <div class="field"><label>Cantidad</label><input id="em-ln-cantidad-cafe" type="number" value="1" min="1" onchange="recalcularEmLinea()"></div>
    </div>
    <div class="row" id="em-campos-maquila-kg" style="display:none">
      <div class="field"><label>Kilos</label><input id="em-ln-kg" type="number" min="0" step="0.1" placeholder="0" onchange="recalcularEmLinea()"></div>
    </div>
    <div class="row" id="em-campos-maquila-pres" style="display:none">
      <div class="field"><label>Presentación</label><select id="em-ln-presentacion-mq" onchange="recalcularEmLinea()">${PRESENTACIONES.map(p => `<option>${p}</option>`).join('')}</select></div>
      <div class="field"><label>Cantidad</label><input id="em-ln-cantidad-mq" type="number" value="1" min="1" onchange="recalcularEmLinea()"></div>
    </div>
    <div class="row">
      <div class="field"><label>Valor de esta línea</label><input id="em-ln-valor" type="number" placeholder="0" min="0"></div>
    </div>

      <div class="field"><label>Estado</label><select id="m-estado"><option ${v.estado==='Pagado'?'selected':''}>Pagado</option><option ${v.estado==='Pendiente'?'selected':''}>Pendiente</option></select></div>
      <div class="field"><label>Método de pago</label><select id="m-metodo">${METODOS_PAGO.map(m => `<option ${m===v.metodo?'selected':''}>${m}</option>`).join('')}</select></div>
    </div>

      <button class="sec-btn" onclick="cerrarModal()">Cancelar</button>

  `);
  onEmLineaTipoChange();
  pintarEdicionCarrito();

function onEmLineaTipoChange() {
  const tipo = document.getElementById('em-ln-tipo').value;
  const esCafe = tipo === 'cafe';
  const filas = esCafe ? [] : gruposDeServicio(tipo);
  const esKg = !esCafe && filas.length === 1 && !filas[0].presentacion;
  document.getElementById('em-campos-cafe').style.display = esCafe ? 'flex' : 'none';
  document.getElementById('em-campos-maquila-kg').style.display = (!esCafe && esKg) ? 'flex' : 'none';
  document.getElementById('em-campos-maquila-pres').style.display = (!esCafe && !esKg) ? 'flex' : 'none';
  recalcularEmLinea();
}

function recalcularEmLinea() {
  const tipo = document.getElementById('em-ln-tipo').value;
  let valor = 0;
  if (tipo === 'cafe') {
    const lote = document.getElementById('em-ln-lote').value;
    const presentacion = document.getElementById('em-ln-presentacion').value;
    const cantidad = Number(document.getElementById('em-ln-cantidad-cafe').value) || 1;
    valor = precioSugerido(lote, presentacion, editTipoCliente) * cantidad;
  } else {
    const filas = gruposDeServicio(tipo);
    const esKg = filas.length === 1 && !filas[0].presentacion;
    if (esKg) {
      const kg = Number(document.getElementById('em-ln-kg').value) || 0;
      valor = kg * (filas[0] ? filas[0].precio : 0);
    } else {
      const presentacion = document.getElementById('em-ln-presentacion-mq').value;
      const cantidad = Number(document.getElementById('em-ln-cantidad-mq').value) || 1;
      const tarifa = filas.find(f => f.presentacion === presentacion);
      valor = cantidad * (tarifa ? tarifa.precio : 0);
    }
  }
  document.getElementById('em-ln-valor').value = valor;
}

function agregarLineaAEdicion() {
  const tipo = document.getElementById('em-ln-tipo').value;
  const valor = Number(document.getElementById('em-ln-valor').value) || 0;
  let item;
  if (tipo === 'cafe') {
    item = {
      tipo: 'cafe',
      lote: document.getElementById('em-ln-lote').value,
      presentacion: document.getElementById('em-ln-presentacion').value,
      cantidad: Number(document.getElementById('em-ln-cantidad-cafe').value) || 1,
      valor,
    };
  } else {
    const filas = gruposDeServicio(tipo);
    const esKg = filas.length === 1 && !filas[0].presentacion;
    item = esKg
      ? { tipo: 'maquila', servicio: tipo, presentacion: null, cantidad: Number(document.getElementById('em-ln-kg').value) || 0, valor }
      : { tipo: 'maquila', servicio: tipo, presentacion: document.getElementById('em-ln-presentacion-mq').value, cantidad: Number(document.getElementById('em-ln-cantidad-mq').value) || 1, valor };
  }
  if (!item.cantidad) return toast('Pon una cantidad mayor a cero.', 'error');
  editCarrito.push(item);
  editItemsNuevos.push(item); // mismo objeto: así sabemos que es nuevo de esta sesión
  pintarEdicionCarrito();
}

function quitarDeEdicion(i) {
  const [removido] = editCarrito.splice(i, 1);
  const j = editItemsNuevos.indexOf(removido);
  if (j !== -1) {
    editItemsNuevos.splice(j, 1); // se agregó y se quitó en la misma sesión: se cancela, no hay que devolver nada
  } else {
    editItemsRemovidos.push(removido); // era una línea original: hay que devolverle su inventario
  }
  pintarEdicionCarrito();
}

function pintarEdicionCarrito() {
  const lista = document.getElementById('em-lista');
  if (!lista) return;
  lista.innerHTML = editCarrito.length
    ? editCarrito.map((it, i) => `
      <div class="ledger-row">
        <div class="main"><div class="title">${it.tipo === 'cafe' ? `${escapeHtml(it.lote)} · ${escapeHtml(it.presentacion)} × ${it.cantidad}` : `${escapeHtml(it.servicio)} ${it.presentacion ? it.cantidad + ' ' + escapeHtml(it.presentacion) : it.cantidad + 'kg'}`}</div></div>
        <div class="amount pos">${fmt(it.valor)}</div>
        <div class="acciones"><button onclick="quitarDeEdicion(${i})" title="Quitar">✕</button></div>
      </div>`).join('')
    : '<div class="empty">Sin líneas — agrega la primera abajo.</div>';
  document.getElementById('em-total').textContent = fmt(editCarrito.reduce((s, it) => s + (Number(it.valor) || 0), 0));
}

async function guardarEdicionVenta(id, btn) {
  if (btn) btn.disabled = true;
  const cambios = {
    items: editCarrito,
    valor: editCarrito.reduce((s, it) => s + (Number(it.valor) || 0), 0),
    estado: document.getElementById('m-estado').value,
    metodo: document.getElementById('m-metodo').value,
    nuevosItems: editItemsNuevos, // el backend descuenta inventario por estas líneas nuevas
    itemsRemovidos: editItemsRemovidos, // y le devuelve inventario a las líneas originales que quitaste
  };
  const v = state.ventas.find(x => x.id === id); Object.assign(v, cambios);
  guardarCacheLocal('ventas'); cerrarModal(); renderTodo();
  await fetch('/api/ventas/' + id, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(cambios) });
  sincronizar();
}

    <h3 class="section-title">Detalle de ${mes}</h3>
    <div class="subtabs">
      <button class="${resumenSubTab==='pagadas'?'active':''}" onclick="cambiarResumenSubTab('pagadas')">Pagadas (${pagadas.length})</button>
      <button class="${resumenSubTab==='pendientes'?'active':''}" onclick="cambiarResumenSubTab('pendientes')">Por pagar (${pendientes.length})</button>
      <button class="${resumenSubTab==='gastos'?'active':''}" onclick="cambiarResumenSubTab('gastos')">Gastos (${gastosMes.length})</button>
    </div>
    <div class="ledger">
      ${resumenSubTab === 'pagadas' ? paginar(pagadas, 'resumen', filaResumenVenta, 'Sin ventas pagadas este mes.') : ''}
      ${resumenSubTab === 'pendientes' ? paginar(pendientes, 'resumen', filaResumenVenta, 'Sin ventas pendientes este mes.') : ''}
      ${resumenSubTab === 'gastos' ? paginar(gastosMes.slice().sort((a,b)=>b.ts-a.ts), 'resumen', filaResumenGasto, 'Sin gastos este mes.') : ''}
    </div>
  `;
  dibujarGraficos(mes);
}
function cambiarResumenSubTab(tab) { resumenSubTab = tab; paginas.resumen = 1; renderResumen(); }

/* ================================================================
   GRÁFICOS DEL RESUMEN (Chart.js)
================================================================ */
let rangoMeses = 6;
const graficos = {};
function cambiarRango(n) { rangoMeses = n; renderResumen(); }

// Devuelve las claves de mes ('2026-09') hacia atrás desde el mes elegido.
function mesesDelRango(mesBase, cantidad) {
  const [a, m] = mesBase.split('-').map(Number);
  const out = [];
  for (let i = cantidad - 1; i >= 0; i--) {
    const d = new Date(a, m - 1 - i, 1);
    out.push(d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'));
  }
  return out;
}
const etiquetaMes = clave => {
  const [a, m] = clave.split('-').map(Number);
  return new Date(a, m - 1, 1).toLocaleDateString('es-CO', { month: 'short', year: '2-digit' });
};

function dibujarGraficos(mesBase) {
  if (typeof Chart === 'undefined') return; // si el CDN no cargó, la app sigue funcionando igual
  const meses = mesesDelRango(mesBase, rangoMeses);
  const css = getComputedStyle(document.documentElement);
  const verde = css.getPropertyValue('--verde').trim();
  const terracota = css.getPropertyValue('--terracota').trim();
  const cafe = css.getPropertyValue('--cafe').trim();
  const linea = css.getPropertyValue('--linea').trim();
  Chart.defaults.font.family = "'Outfit', sans-serif";
  Chart.defaults.font.size = 13;
  Chart.defaults.color = css.getPropertyValue('--cafe-soft').trim();

  const dinero = v => '$' + Math.round(v).toLocaleString('es-CO');
  const ejeDinero = {
    grid: { color: linea }, border: { display: false },
    ticks: { callback: v => v >= 1000000 ? (v/1000000).toFixed(1)+'M' : (v/1000).toFixed(0)+'k' }
  };

  // --- 1. Ingresos cobrados vs egresos, mes a mes ---
  const ingresos = meses.map(mm => state.ventas
    .filter(v => mesDe(v.ts) === mm && v.estado === 'Pagado')
    .reduce((s, v) => s + (Number(v.valor) || 0), 0));
  const egresos = meses.map(mm =>
    state.gastos.filter(g => mesDe(g.ts) === mm).reduce((s, g) => s + (Number(g.monto) || 0), 0) +
    state.finca.filter(f => mesDe(f.ts) === mm).reduce((s, f) => s + (Number(f.monto) || 0), 0));

  graficos.flujo?.destroy();
  graficos.flujo = new Chart(document.getElementById('chartFlujo'), {
    type: 'bar',
    data: {
      labels: meses.map(etiquetaMes),
      datasets: [
        { label: 'Cobrado', data: ingresos, backgroundColor: verde, borderRadius: 6, maxBarThickness: 34 },
        { label: 'Egresos', data: egresos, backgroundColor: terracota, borderRadius: 6, maxBarThickness: 34 },
      ],
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { position: 'bottom', labels: { boxWidth: 12, usePointStyle: true, pointStyle: 'circle', padding: 16 } },
        tooltip: { callbacks: { label: c => c.dataset.label + ': ' + dinero(c.parsed.y) } },
      },
      scales: { x: { grid: { display: false }, border: { display: false } }, y: ejeDinero },
    },
  });

  // --- 2. Egresos por categoría (gastos + finca juntos) en todo el rango ---
  const porCategoria = {};
  state.gastos.filter(g => meses.includes(mesDe(g.ts)))
    .forEach(g => { porCategoria[g.categoria || 'Otro'] = (porCategoria[g.categoria || 'Otro'] || 0) + (Number(g.monto) || 0); });
  state.finca.filter(f => meses.includes(mesDe(f.ts)))
    .forEach(f => { const k = 'Finca: ' + (f.categoria || 'Otro'); porCategoria[k] = (porCategoria[k] || 0) + (Number(f.monto) || 0); });
  const catOrdenadas = Object.entries(porCategoria).sort((a, b) => b[1] - a[1]);
  const paleta = ['#AD4B31', '#4A6B48', '#8A6A1F', '#3E2723', '#8A7A70', '#C97B5A', '#6E8B6B', '#B99C5B', '#5A4038', '#A8998E'];

  graficos.categorias?.destroy();
  graficos.categorias = new Chart(document.getElementById('chartCategorias'), {
    type: 'doughnut',
    data: {
      labels: catOrdenadas.map(([k]) => k),
      datasets: [{ data: catOrdenadas.map(([, v]) => v), backgroundColor: catOrdenadas.map((_, i) => paleta[i % paleta.length]), borderWidth: 0 }],
    },
    options: {
      responsive: true, maintainAspectRatio: false, cutout: '58%',
      plugins: {
        legend: { position: 'right', labels: { boxWidth: 10, usePointStyle: true, pointStyle: 'circle', padding: 10, font: { size: 12 } } },
        tooltip: { callbacks: { label: c => c.label + ': ' + dinero(c.parsed) } },
      },
    },
  });

  // --- 3. Ventas por lote de café en todo el rango ---
  const porLoteRango = {};
  state.ventas.filter(v => meses.includes(mesDe(v.ts)))
    .forEach(v => lotesDeVenta(v).forEach(([lote, val]) => { porLoteRango[lote] = (porLoteRango[lote] || 0) + (Number(val) || 0); }));
  const lotesOrdenados = Object.entries(porLoteRango).sort((a, b) => b[1] - a[1]);

  graficos.lotes?.destroy();
  graficos.lotes = new Chart(document.getElementById('chartLotes'), {
    type: 'bar',
    data: {
      labels: lotesOrdenados.map(([k]) => k),
      datasets: [{ label: 'Ventas', data: lotesOrdenados.map(([, v]) => v), backgroundColor: cafe, borderRadius: 6, maxBarThickness: 40 }],
    },
    options: {
      indexAxis: 'y',
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => dinero(c.parsed.x) } } },
      scales: { x: ejeDinero, y: { grid: { display: false }, border: { display: false } } },
    },
  });
}

/* ================================================================
   CONFIGURACIÓN / MAQUILA
================================================================ */
function renderConfig() {
  const orden = ['Media lb', 'Libra', 'Kilo', 'Cuarterón'];

  const gruposCafe = {};
  state.preciosCafe.forEach(p => { (gruposCafe[p.lote] ||= { normal: [], distribuidor: [] })[p.tipoCliente].push(p); });
  const filasCafe = Object.entries(gruposCafe).map(([lote, tiers]) => {
    const filaTier = (label, filas) => `
      <div style="padding-top:4px"><div class="nombre" style="font-weight:600;font-size:12.5px;color:var(--cafe-soft)">${label}</div></div>
      ${[...filas].sort((a, b) => orden.indexOf(a.presentacion) - orden.indexOf(b.presentacion)).map(p => `
        <div class="tarifa-row" style="padding-left:16px">
          <div class="nombre" style="font-weight:400;font-size:13px">${p.presentacion}</div>
          <input type="number" id="pc-${p.id}" value="${p.precio}">
          <button class="sec-btn" onclick="guardarPrecioCafe(${p.id})">Guardar</button>
        </div>`).join('')}`;
    return `<div style="padding-top:10px"><div class="nombre" style="font-weight:700;font-size:14.5px">${lote}</div>
      ${filaTier('Precio normal', tiers.normal)}
      ${filaTier('Precio distribuidor', tiers.distribuidor)}
    </div>`;
  }).join('');

  const grupos = {};
  state.maquila.forEach(t => { (grupos[t.servicio] ||= []).push(t); });

  const filas = Object.entries(grupos).map(([servicio, tarifas]) => {
    if (tarifas.length === 1 && !tarifas[0].presentacion) {
      const t = tarifas[0];
      return `<div class="tarifa-row">
        <div class="nombre">${servicio} (por kg)</div>
        <input type="number" id="tar-${t.id}" value="${t.precio}">
        <button class="sec-btn" onclick="guardarTarifa(${t.id})">Guardar</button>
      </div>`;
    }
    const filasPres = [...tarifas].sort((a, b) => orden.indexOf(a.presentacion) - orden.indexOf(b.presentacion)).map(t => `
      <div class="tarifa-row" style="padding-left:16px">
        <div class="nombre" style="font-weight:400;font-size:13px;color:var(--cafe-soft)">${t.presentacion}</div>
        <input type="number" id="tar-${t.id}" value="${t.precio}">
        <button class="sec-btn" onclick="guardarTarifa(${t.id})">Guardar</button>
      </div>`).join('');
    return `<div style="padding-top:8px"><div class="nombre" style="font-weight:700;font-size:14px">${servicio}</div>${filasPres}</div>`;
  }).join('');

  document.getElementById('view-config').innerHTML = `
    <h3 class="section-title" style="margin-top:0">Precios de café</h3>
    ${filasCafe || '<div class="empty">Sin precios configurados.</div>'}
    <p style="font-size:12px;color:var(--cafe-soft);margin-top:10px">Estos precios se usan para calcular el valor sugerido de cada línea de café, según el tipo de cliente del pedido (Distribuidor usa la tarifa de distribuidor; los demás, la normal). Siempre puedes corregir el valor a mano al registrar.</p>

    <h3 class="section-title">Tarifas de maquila</h3>
    ${filas || '<div class="empty">Sin tarifas configuradas.</div>'}
    <p style="font-size:12px;color:var(--cafe-soft);margin-top:14px">Trilla y Tostión se cobran por kilo. Empaque, Molienda y Bolsas tienen un precio distinto según la presentación.</p>
  `;
}
async function guardarPrecioCafe(id) {
  const precio = Number(document.getElementById('pc-' + id).value) || 0;
  const p = state.preciosCafe.find(x => x.id === id); if (p) p.precio = precio;
  guardarCacheLocal('preciosCafe');
  await fetch('/api/precios-cafe/' + id, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ precio }) });
}
async function guardarTarifa(id) {
  const precio = Number(document.getElementById('tar-' + id).value) || 0;
  const m = state.maquila.find(x => x.id === id); m.precio = precio;
  guardarCacheLocal('maquila');
  await fetch('/api/maquila/' + id, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ precio }) });
}

/* ================================================================
   MODAL GENÉRICO
================================================================ */
function abrirModal(html) { document.getElementById('modalBox').innerHTML = html; document.getElementById('modalOverlay').classList.add('show'); }
function cerrarModal() { document.getElementById('modalOverlay').classList.remove('show'); }
document.getElementById('modalOverlay').addEventListener('click', e => { if (e.target.id === 'modalOverlay') cerrarModal(); });

/* ================================================================
   TOASTS (avisos suaves en vez de alert)
================================================================ */
function toast(mensaje, tipo) {
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast' + (tipo === 'error' ? ' error' : '');
  el.textContent = mensaje;
  wrap.appendChild(el);
  setTimeout(() => el.remove(), 3200);
}

/* ================================================================
   UTILIDADES
================================================================ */
function escapeHtml(s) { return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s) { return escapeHtml(s); }

/* ================================================================
   EXPORTAR A EXCEL
================================================================ */
function exportarExcel() {
  const HEAD = v => ({ v, s: 'head' });
  const MONEY = v => ({ v: Number(v) || 0, s: 'money' });
  const MONEY_B = v => ({ v: Number(v) || 0, s: 'money-b' });
  const BOLD = v => ({ v, s: 'b' });

  const hojaVentas = {
    name: 'Ventas',
    cols: [22, 24, 30, 16, 14, 14],
    rows: [
      [HEAD('Fecha'), HEAD('Cliente'), HEAD('Detalle'), HEAD('Valor'), HEAD('Estado'), HEAD('Anotado por')],
      ...state.ventas.sort((a,b)=>b.ts-a.ts).map(v => [
        { v: new Date(Number(v.ts)), s: 'date' },
        v.cliente || '',
        detalleVenta(v),
        MONEY(v.valor), v.estado, v.usuario || '',
      ]),
      [],
      [BOLD('TOTAL'), null, null, MONEY_B(state.ventas.reduce((s,v)=>s+(Number(v.valor)||0),0))],
    ],
  };
  const hojaGastos = {
    name: 'Gastos',
    cols: [22, 30, 18, 14, 14],
    rows: [
      [HEAD('Fecha'), HEAD('Concepto'), HEAD('Categoría'), HEAD('Monto'), HEAD('Estado')],
      ...state.gastos.sort((a,b)=>b.ts-a.ts).map(g => [{ v: new Date(Number(g.ts)), s: 'date' }, g.concepto, g.categoria, MONEY(g.monto), g.estado]),
      [],
      [BOLD('TOTAL'), null, null, MONEY_B(state.gastos.reduce((s,g)=>s+(Number(g.monto)||0),0))],
    ],
  };
  const hojaFinca = {
    name: 'Finca',
    cols: [22, 30, 18, 14, 14],
    rows: [
      [HEAD('Fecha'), HEAD('Concepto'), HEAD('Categoría'), HEAD('Monto'), HEAD('Estado')],
      ...state.finca.sort((a,b)=>b.ts-a.ts).map(f => [{ v: new Date(Number(f.ts)), s: 'date' }, f.concepto, f.categoria, MONEY(f.monto), f.estado]),
      [],
      [BOLD('TOTAL'), null, null, MONEY_B(state.finca.reduce((s,f)=>s+(Number(f.monto)||0),0))],
    ],
  };
  const hojaInventario = {
    name: 'Inventario',
    cols: [22, 16],
    rows: [[HEAD('Lote'), HEAD('Stock (kg)')], ...state.inventario.map(i => [i.lote, { v: Number(i.stockLb).toFixed(2), s: 'num2' }])],
  };

  const nombre = 'CafePandora_' + new Date().toISOString().split('T')[0] + '.xlsx';
  try {
    XLSXLite.download([hojaVentas, hojaGastos, hojaFinca, hojaInventario], nombre);
    localStorage.setItem('cp_ultimo_export', String(Date.now()));
    renderRecordatorioExport();
    toast('Respaldo exportado');
  } catch (err) {
    toast('No se pudo generar el Excel: ' + err.message, 'error');
  }
}
