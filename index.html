// Muestra/oculta los campos de fermentación en el formulario de registrar
// cosecha — solo Honey y Natural fermentan en caneca antes de secarse.
function actualizarCamposFermentacion() {
  const proceso = document.getElementById('co-proceso').value;
  const esFermentable = proceso === 'Honey' || proceso === 'Natural';
  const campos = document.getElementById('co-fermentacion-campos');
  if (!campos) return;
  campos.style.display = esFermentable ? 'flex' : 'none';
  const inicio = document.getElementById('co-ferm-inicio');
  if (esFermentable && inicio && !inicio.value) inicio.value = fechaLocalInput(Date.now());
}
// datetime-local necesita "YYYY-MM-DDTHH:mm" en hora local, no UTC.
function fechaLocalInput(ts) {
  return new Date(Number(ts) - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 16);
}

// Cuánto falta para que se cumpla la fermentación de esta cosecha (o null
// si no se le puso fecha de fin todavía). El cron de WhatsApp usa el mismo
// dato — esto es solo lo que se ve en la app.
function estadoFermentacion(c) {
  if (!c.fermentacionFin) return null;
  const fin = Number(c.fermentacionFin);
  const restanteMs = fin - Date.now();
  if (restanteMs <= 0) return { texto: '✅ Fermentación cumplida — revisa la caneca', vencida: true };
  const horas = Math.floor(restanteMs / 3600000);
  const min = Math.round((restanteMs % 3600000) / 60000);
  return { texto: `🧪 Fermentando · termina en ${horas}h ${min}min`, vencida: false };
}

function abrirFermentacion(id) {
  const c = state.cosechas.find(x => x.id === id); if (!c) return;
  const inicioValor = fechaLocalInput(c.fermentacionInicio || Date.now());
  const finValor = c.fermentacionFin ? fechaLocalInput(c.fermentacionFin) : '';
  abrirModal(`
    <h3>Fermentación en caneca</h3>
    <p style="font-size:13px;color:var(--cafe-soft);margin-top:-6px">${escapeHtml(c.proceso)} · cosecha del ${fechaCorta(c.fecha)}</p>
    <div class="row">
      <div class="field"><label>Kilos en cereza</label>
        <input id="fm-kilos" type="number" min="0" step="0.1" value="${c.kilosCereza}" oninput="actualizarSobranteFermentacion(${id})"></div>
    </div>
    <div class="row">
      <div class="field"><label>Inicio de fermentación</label>
        <input id="fm-inicio" type="datetime-local" value="${inicioValor}"></div>
      <div class="field"><label>Fin de fermentación</label>
        <input id="fm-fin" type="datetime-local" value="${finValor}"></div>
    </div>
    <div id="fm-sobrante-fila" style="display:none;margin:4px 0 8px">
      <label style="display:flex;align-items:center;gap:7px;font-size:13px;cursor:pointer">
        <input id="fm-sobrante-lavado" type="checkbox" checked>
        Pasar el sobrante (<b><span id="fm-sobrante-kg">0</span> kg</b>) a una cosecha nueva de Lavado
      </label>
    </div>
    <p style="font-size:12.5px;color:var(--cafe-soft)">Cuando falten 2 horas para cumplirse, llega un WhatsApp avisando.</p>
    <div class="modal-actions">
      <button class="add-btn" onclick="guardarFermentacion(${id}, this)">Guardar</button>
      <button class="sec-btn" onclick="cerrarModal()">Cancelar</button>
    </div>`);
}

// Cuando pesan todo pero solo una parte se queda fermentando en caneca
// (el resto se pasa a Lavado) — esto se ve mientras se escribe el nuevo
// peso, antes de guardar.
function actualizarSobranteFermentacion(id) {
  const c = state.cosechas.find(x => x.id === id); if (!c) return;
  const nuevo = Number(document.getElementById('fm-kilos').value) || 0;
  const sobrante = Math.max(0, Number(c.kilosCereza) - nuevo);
  const fila = document.getElementById('fm-sobrante-fila');
  if (sobrante > 0) {
    document.getElementById('fm-sobrante-kg').textContent = sobrante.toFixed(1);
    fila.style.display = 'block';
  } else {
    fila.style.display = 'none';
  }
}

async function guardarFermentacion(id, btn) {
  const c = state.cosechas.find(x => x.id === id); if (!c) return;
  btn.disabled = true;
  const kilosCereza = Number(document.getElementById('fm-kilos').value) || 0;
  const inicioVal = document.getElementById('fm-inicio').value;
  const finVal = document.getElementById('fm-fin').value;
  const fermentacionInicio = inicioVal ? new Date(inicioVal).getTime() : null;
  const fermentacionFin = finVal ? new Date(finVal).getTime() : null;
  const sobrante = Math.max(0, Number(c.kilosCereza) - kilosCereza);
  const pasarSobranteALavado = sobrante > 0 && document.getElementById('fm-sobrante-lavado')?.checked;
  try {
    const res = await apiFetch('/api/cosechas/' + id, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ kilosCereza, fermentacionInicio, fermentacionFin }) });
    if (!res.ok) throw new Error(await res.text());
    Object.assign(c, { kilosCereza, fermentacionInicio, fermentacionFin, fermentacionAlertado: false });
    guardarCacheLocal('cosechas');

    if (pasarSobranteALavado) {
      const resLavado = await apiFetch('/api/cosechas', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          fecha: c.fecha,
          kilosCereza: sobrante,
          proceso: 'Lavado',
          notas: `Sobrante repartido de la cosecha #${id} (${c.proceso})`,
          usuario: localStorage.getItem('cp_usuario') || 'Equipo',
        }),
      });
      if (resLavado.ok) state.cosechas.push(await resLavado.json());
      guardarCacheLocal('cosechas');
    }

    cerrarModal();
    renderTrazabilidad();
    toast(pasarSobranteALavado ? `Fermentación actualizada — ${sobrante.toFixed(1)} kg pasaron a Lavado` : 'Fermentación actualizada');
  } catch (err) {
    toast('No se pudo guardar: ' + err.message, 'error');
    btn.disabled = false;
  }
}

function previsualizarCosecha() {
  const el = document.getElementById('co-preview');
  if (!el) return;
  const kg = Number(document.getElementById('co-kilos').value) || 0;
  const proceso = document.getElementById('co-proceso').value;

  const p = proyectarDesdeCereza(kg);
  const seco = fechaSecadoEstimada(Date.now(), proceso);
  el.innerHTML = `
    <div class="cadena">
      <span><b>${kg.toFixed(1)}</b> kg cereza</span><i>→</i>
      <span><b>${p.pergamino.toFixed(1)}</b> kg pergamino</span><i>→</i>
      <span><b>${p.verde.toFixed(1)}</b> kg verde</span><i>→</i>
      <span><b>${p.tostado.toFixed(1)}</b> kg tostado</span><i>=</i>
      <span class="destacado"><b>${Math.round(p.libras)}</b> libras</span>
    </div>
    <div class="cadena-nota">Secado estimado para el ${seco.toLocaleDateString('es-CO', { day:'2-digit', month:'long' })} (${DIAS_SECADO[proceso]} días de ${proceso})</div>`;
}

async function registrarCosecha(btn) {
  const kilosCereza = Number(document.getElementById('co-kilos').value) || 0;
  if (!kilosCereza) return toast('Escribe cuántos kilos de cereza se cosecharon.', 'error');
  const proceso = document.getElementById('co-proceso').value;
  const esFermentable = proceso === 'Honey' || proceso === 'Natural';
  const fermInicioVal = document.getElementById('co-ferm-inicio')?.value;
  const fermFinVal = document.getElementById('co-ferm-fin')?.value;
  btn.disabled = true;
  try {
    const payload = {
      fecha: new Date(document.getElementById('co-fecha').value + 'T12:00:00').getTime(),
      kilosCereza,
      proceso,
      notas: document.getElementById('co-notas').value.trim() || null,
      usuario: localStorage.getItem('cp_usuario') || 'Equipo',
      fermentacionInicio: (esFermentable && fermInicioVal) ? new Date(fermInicioVal).getTime() : null,
      fermentacionFin: (esFermentable && fermFinVal) ? new Date(fermFinVal).getTime() : null,
    };
    const res = await apiFetch('/api/cosechas', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
    if (!res.ok) throw new Error(await res.text());
    state.cosechas.push(await res.json());
    guardarCacheLocal('cosechas');
    toast('Cosecha registrada');
    renderTrazabilidad();
  } catch (err) {
    toast('No se pudo registrar: ' + err.message, 'error');
  } finally { btn.disabled = false; }
}

// A veces lo que se despulpa un día es una MEZCLA de cosecha propia y
// cereza comprada a terceros (ej. Don Leo) del mismo día — o cosecha
// propia de varios días que se despulpó junta. El pergamino que se pesa
// es UNO SOLO para todo eso, no se puede separar físicamente. Este único
// modal sirve para pesar cualquier entrada (cosecha O cereza comprada) —
// si no hay nada más sin pesar del mismo proceso, se ve igual de simple
// que antes; si sí hay, deja marcar cuáles se despulparon juntas y
// reparte el peso real proporcional a los kilos de cereza que aportó
// cada una. Cada registro se queda SEPARADO (no se fusionan ni se
// borran, a diferencia de unirCosechas()) — así no se pierde a quién
// hay que pagarle (cereza comprada) ni se descuadra cuánto cosechó la
// finca realmente (cosechas propias); solo se reparte el peso medido.
function entradasSinPesar() {
  return [
    ...state.cosechas.filter(c => c.kilosPergaminoReal == null).map(c => ({ tipo: 'cosecha', ...c })),
    ...state.cerezaComprada.filter(c => c.kilosPergaminoReal == null).map(c => ({ tipo: 'cerezaComprada', ...c })),
  ];
}
function abrirPesarConjunto(tipoOrigen, idOrigen) {
  const listaOrigen = tipoOrigen === 'cosecha' ? state.cosechas : state.cerezaComprada;
  const origen = listaOrigen.find(x => x.id === idOrigen); if (!origen) return;
  const otras = entradasSinPesar().filter(e => !(e.tipo === tipoOrigen && e.id === idOrigen) && e.proceso === origen.proceso);
  const p = proyectarDesdeCereza(origen.kilosCereza);
  const etiqueta = e => `${fechaCorta(e.fecha)} · ${e.tipo === 'cerezaComprada' ? escapeHtml(e.proveedor || 'comprada') : 'cosecha propia'} · ${Number(e.kilosCereza).toFixed(1)} kg`;
  abrirModal(`
    <h3>Pergamino real</h3>
    <p style="font-size:13px;color:var(--cafe-soft);margin-top:-6px">${etiqueta({ ...origen, tipo: tipoOrigen })} · estimado ${p.pergamino.toFixed(1)} kg</p>
    ${otras.length ? `
    <p style="font-size:12.5px;color:var(--cafe-soft);margin:10px 0 4px"><b>¿Se despulpó junto con alguna de estas?</b> Marca las que sí — el pergamino que peses se reparte proporcional a los kilos de cereza de cada una.</p>
    <div id="pc-otras" style="max-height:200px;overflow-y:auto">
      ${otras.map(e => `<label style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--linea);font-size:13px">
        <input type="checkbox" value="${e.tipo}|${e.id}" onchange="actualizarPesarConjuntoPreview('${tipoOrigen}',${idOrigen})">
        ${etiqueta(e)}
      </label>`).join('')}
    </div>` : ''}
    <div class="row" style="margin-top:10px"><div class="field"><label>Kilos de pergamino seco (pesados — TOTAL de lo despulpado junto)</label>
      <input id="pp-kilos" type="number" min="0" step="0.1" value="${origen.kilosPergaminoReal ?? p.pergamino.toFixed(1)}" oninput="actualizarPesarConjuntoPreview('${tipoOrigen}',${idOrigen})"></div></div>
    ${tipoOrigen === 'cosecha' ? `<div class="row"><div class="field"><label>Kilos de pasilla (opcional, de esta cosecha)</label>
      <input id="pp-pasilla" type="number" min="0" step="0.1" placeholder="0" value="${origen.kilosPasilla ?? ''}"></div></div>
      <p style="font-size:12px;color:var(--cafe-soft);margin-top:-6px">La pasilla que salga — se tuesta y se vende aparte, como lote "Pasilla".</p>` : ''}
    <div id="pc-preview" style="font-size:12.5px;color:var(--cafe-soft);margin-top:8px"></div>
    <div class="modal-actions">
      <button class="add-btn" onclick="guardarPesarConjunto('${tipoOrigen}',${idOrigen}, this)">Guardar</button>
      <button class="sec-btn" onclick="cerrarModal()">Cancelar</button>
    </div>`);
  actualizarPesarConjuntoPreview(tipoOrigen, idOrigen);
}
function marcadasPesarConjunto() {
  return Array.from(document.querySelectorAll('#pc-otras input:checked')).map(el => {
    const [tipo, id] = el.value.split('|');
    return { tipo, id: Number(id) };
  });
}
function combinadasPesarConjunto(tipoOrigen, idOrigen) {
  const marcadas = [{ tipo: tipoOrigen, id: idOrigen }, ...marcadasPesarConjunto()];
  return marcadas.map(c => {
    const e = (c.tipo === 'cosecha' ? state.cosechas : state.cerezaComprada).find(x => x.id === c.id);
    return { ...c, kilosCereza: Number(e.kilosCereza) || 0 };
  });
}
function actualizarPesarConjuntoPreview(tipoOrigen, idOrigen) {
  const cont = document.getElementById('pc-preview');
  if (!cont) return;
  const combinadas = combinadasPesarConjunto(tipoOrigen, idOrigen);
  const kilosPergaminoReal = Math.max(0, Number(document.getElementById('pp-kilos').value) || 0);
  const kilosCerezaTotal = combinadas.reduce((s, c) => s + c.kilosCereza, 0);
  if (combinadas.length === 1 || !kilosPergaminoReal || !kilosCerezaTotal) { cont.innerHTML = ''; return; }
  cont.innerHTML = 'Se reparte proporcional: ' + combinadas.map(c =>
    `${c.kilosCereza.toFixed(1)} kg → ${(kilosPergaminoReal * (c.kilosCereza / kilosCerezaTotal)).toFixed(1)} kg pergamino`
  ).join(' · ');
}
async function guardarPesarConjunto(tipoOrigen, idOrigen, btn) {
  btn.disabled = true;
  const kilosPergaminoReal = Math.max(0, Number(document.getElementById('pp-kilos').value) || 0);
  const pasillaInput = document.getElementById('pp-pasilla');
  const kilosPasilla = pasillaInput && pasillaInput.value !== '' ? Math.max(0, Number(pasillaInput.value) || 0) : null;
  const combinadas = combinadasPesarConjunto(tipoOrigen, idOrigen);
  const kilosCerezaTotal = combinadas.reduce((s, c) => s + c.kilosCereza, 0);
  const partes = [];
  try {
    for (const c of combinadas) {
      const share = kilosCerezaTotal > 0 ? kilosPergaminoReal * (c.kilosCereza / kilosCerezaTotal) : 0;
      const lista = c.tipo === 'cosecha' ? state.cosechas : state.cerezaComprada;
      const registro = lista.find(x => x.id === c.id);
      const body = { kilosPergaminoReal: share };
      if (c.tipo === 'cosecha' && c.id === idOrigen && kilosPasilla != null) body.kilosPasilla = kilosPasilla;
      const endpoint = (c.tipo === 'cosecha' ? '/api/cosechas/' : '/api/cereza-comprada/') + c.id;
      const res = await apiFetch(endpoint, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      if (!res.ok) throw new Error(await res.text());
      registro.kilosPergaminoReal = share;
      if (body.kilosPasilla !== undefined) registro.kilosPasilla = body.kilosPasilla;
      partes.push(`${c.tipo === 'cerezaComprada' ? (registro.proveedor || 'comprada') : 'propia'} ${fechaCorta(registro.fecha)}: ${share.toFixed(1)}kg`);
    }
    guardarCacheLocal('cosechas'); guardarCacheLocal('cerezaComprada');
    cerrarModal();
    renderTrazabilidad();
    // Resumen post-guardado con el reparto real, no solo un conteo — la
    // auditoría CRO encontró que esta pantalla es exactamente donde
    // menos tiempo hay para pensar (pesando en la finca), así que vale
    // más confirmar el número que un "listo" genérico.
    toast(combinadas.length > 1 ? `Pergamino repartido — ${partes.join(' · ')}` : 'Pergamino real anotado: ' + partes[0]);
  } catch (err) {
    toast('No se pudo guardar: ' + err.message, 'error');
  } finally { btn.disabled = false; }
}

async function eliminarCosecha(id) {
  if (!confirm('¿Eliminar este registro de cosecha?')) return;
  state.cosechas = state.cosechas.filter(x => x.id !== id);
  guardarCacheLocal('cosechas'); renderTrazabilidad();
  await apiFetch('/api/cosechas/' + id, { method:'DELETE' });
}

// A veces se recoge y anota café en días distintos (ej. 15 y 17) pero
// después se lava todo junto — esto deja marcar varias cosechas SIN pesar
// todavía (mismo proceso) y combinarlas en una sola, sumando los kilos,
// para que al pesar el pergamino real quede claro que salió de esos días.
function abrirUnirCosechas() {
  const candidatas = state.cosechas.filter(c => c.kilosPergaminoReal == null).slice().sort((a,b) => b.fecha - a.fecha);
  if (candidatas.length < 2) return toast('No hay al menos 2 cosechas sin pesar para unir.', 'error');
  abrirModal(`
    <h3>Unir cosechas</h3>
    <p style="font-size:12.5px;color:var(--cafe-soft);margin-top:-6px">Marca 2 o más cosechas del mismo proceso que en realidad se lavaron juntas — se combinan en una sola (sumando los kilos) antes de pesar el pergamino.</p>
    <div id="unir-lista" style="max-height:320px;overflow-y:auto">
      ${candidatas.map(c => `
        <label style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--linea);font-size:13.5px">
          <input type="checkbox" value="${c.id}">
          ${fechaCorta(c.fecha)} · ${escapeHtml(c.proceso)} · ${Number(c.kilosCereza).toFixed(1)} kg
        </label>`).join('')}
    </div>
    <div class="modal-actions">
      <button class="add-btn" onclick="unirCosechas()">Unir seleccionadas</button>
      <button class="sec-btn" onclick="cerrarModal()">Cancelar</button>
    </div>
  `);
}

async function unirCosechas() {
  const marcadas = Array.from(document.querySelectorAll('#unir-lista input:checked')).map(el => Number(el.value));
  if (marcadas.length < 2) return toast('Marca al menos 2 cosechas para unir.', 'error');
  const seleccionadas = state.cosechas.filter(c => marcadas.includes(c.id));
  if (new Set(seleccionadas.map(c => c.proceso)).size > 1) return toast('Solo se pueden unir cosechas del mismo proceso.', 'error');

  // La más reciente sobrevive (es de cuando en realidad se lavó todo
  // junto); las demás se borran después de sumarles los kilos.
  const ordenadas = seleccionadas.slice().sort((a, b) => b.fecha - a.fecha);
  const principal = ordenadas[0];
  const otras = ordenadas.slice(1);
  const kilosTotal = seleccionadas.reduce((s, c) => s + Number(c.kilosCereza), 0);
  const detalle = seleccionadas.slice().sort((a, b) => a.fecha - b.fecha)
    .map(c => `${fechaCorta(c.fecha)} (${Number(c.kilosCereza).toFixed(1)} kg)`).join(' + ');
  const notaCombinada = `Cosecha combinada: ${detalle}`;
  const notasFinal = principal.notas ? principal.notas + ' · ' + notaCombinada : notaCombinada;

  try {
    const res = await apiFetch('/api/cosechas/' + principal.id, {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ kilosCereza: kilosTotal, notas: notasFinal }),
    });
    if (!res.ok) throw new Error(await res.text());
    Object.assign(principal, { kilosCereza: kilosTotal, notas: notasFinal });

    for (const c of otras) {
      await apiFetch('/api/cosechas/' + c.id, { method: 'DELETE' });
      state.cosechas = state.cosechas.filter(x => x.id !== c.id);
    }
    guardarCacheLocal('cosechas');
    cerrarModal();
    renderTrazabilidad();
    toast(`${seleccionadas.length} cosechas unidas en una sola de ${kilosTotal.toFixed(1)} kg`);
  } catch (err) {
    toast('No se pudo unir: ' + err.message, 'error');
  }
}

// Calculadora "¿cuánto pagar por cierta cantidad de cereza?" (2026-09-24,
// a pedido de Juan) — para estimar ANTES de comprar, sin registrar nada
// todavía. Reusa EXACTAMENTE el mismo cálculo que ya usa "Completar pago"
// (💰, más abajo): proyectarDesdeCereza() — que ya prefiere el rendimiento
// APRENDIDO de tus propios datos en vez de uno fijo, y solo cae al
// genérico mientras no hay suficientes muestras (ver rendimientosReales())
// — × precioPergaminoPorFactor() (precio de referencia de HOY, ajustado al
// factor). A propósito NO se inventa ningún número nuevo: Juan confirmó
// que no se debe perder el cálculo de rendimiento que la app ya aprende.
function bloqueCalculadoraCereza() {
  return `
    <div class="card" style="margin-top:12px">
      <h4 style="margin:0 0 4px">¿Cuánto pagar por cierta cantidad de cereza?</h4>
      <p style="font-size:12px;color:var(--cafe-soft);margin:0 0 10px">Para estimar antes de comprar, sin registrar nada todavía — usa el rendimiento cereza→pergamino que ya aprende la app (ver "Rendimientos de tu café" arriba) y el precio de referencia de hoy ajustado al factor.</p>
      <div class="row">
        <div class="field"><label>Kilos de cereza</label><input id="calc-cz-kilos" type="number" min="0" step="0.1" placeholder="0" oninput="calcularPrecioCereza()"></div>
        <div class="field"><label>Factor de rendimiento</label><input id="calc-cz-factor" type="number" min="1" step="0.1" value="${FACTOR_COMPRA_CEREZA}" oninput="calcularPrecioCereza()"></div>
      </div>
      <div id="resultado-calc-cereza"></div>
    </div>`;
}
function calcularPrecioCereza() {
  const cont = document.getElementById('resultado-calc-cereza');
  const kg = Number(document.getElementById('calc-cz-kilos').value);
  const factor = Number(document.getElementById('calc-cz-factor').value);
  if (!kg || kg <= 0) { cont.innerHTML = ''; return; }
  const r = precioPergaminoPorFactor(factor);
  if (!r) { cont.innerHTML = '<p class="empty">Todavía no hay ningún precio de referencia guardado.</p>'; return; }
  const rend = rendimientosReales().cerezaAPergamino;
  const p = proyectarDesdeCereza(kg);
  const costoTotal = p.pergamino * r.precioKilo;
  const precioKiloCereza = costoTotal / kg;
  cont.innerHTML = `
    <p style="font-size:12.5px;color:var(--cafe-soft);margin:8px 0">
      ${rend.real != null ? '<span class="badge-real">Tuyo</span>' : '<span class="badge-gen">Genérico</span>'}
      rendimiento ${(rend.valor * 100).toFixed(1)}% → ${kg.toFixed(1)} kg cereza ≈ ${p.pergamino.toFixed(1)} kg pergamino × ${fmt(r.precioKilo)}/kg (precio de hoy a factor ${factor}):
    </p>
    <div class="stat-grid">
      <div class="stat"><div class="n">${fmt(precioKiloCereza)}</div><div class="l">Por kilo de cereza</div></div>
      <div class="stat"><div class="n">${fmt(costoTotal)}</div><div class="l">Costo total estimado</div></div>
    </div>`;
}

function previsualizarCerezaComprada() {

}

async function registrarCerezaComprada(btn) {
  const kilosCereza = Number(document.getElementById('cz-kilos').value) || 0;
  if (!kilosCereza) return toast('Escribe cuántos kilos de cereza se compraron.', 'error');
  const costo = Math.max(0, Number(document.getElementById('cz-costo').value) || 0);
  const pagadoPor = document.getElementById('cz-pago').value || null;
  // Si tuvo costo, alguien lo pagó — sin dueño no cuadra en el balance de
  // nadie (no hay modal de edición aquí, así que mejor pedirlo ya).
  if (costo > 0 && !pagadoPor) return toast('Elige quién pagó.', 'error');
  btn.disabled = true;
  try {
    const fecha = new Date(document.getElementById('cz-fecha').value + 'T12:00:00').getTime();
    const payload = {
      fecha,
      proveedor: document.getElementById('cz-proveedor').value.trim() || null,
      kilosCereza,
      proceso: document.getElementById('cz-proceso').value,
      costo,
      pagadoPor,
      notas: document.getElementById('cz-notas').value.trim() || null,
      usuario: localStorage.getItem('cp_usuario') || 'Equipo',
      // Primer pesaje = este mismo registro — de acá en adelante, si el
      // mismo proveedor sigue trayendo cereza otros días (ej. Don Leo),
      // se le suman más con "📏 Agregar pesaje" en vez de crear una
      // compra nueva cada vez.
      pesajes: [{ fecha, kilos: kilosCereza }],
    };
    if (pagadoPor) { localStorage.setItem('cp_pago', pagadoPor); localStorage.setItem('cp_usuario', pagadoPor); }
    const res = await apiFetch('/api/cereza-comprada', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
    if (!res.ok) throw new Error(await res.text());
    state.cerezaComprada.push(await res.json());
    guardarCacheLocal('cerezaComprada');
    toast('Compra de cereza registrada');
    renderTrazabilidad();
  } catch (err) {
    toast('No se pudo registrar: ' + err.message, 'error');
  } finally { btn.disabled = false; }
}

// Cuando el mismo proveedor trae cereza varios días seguidos (ej. Don
// Leo) — en vez de crear una compra nueva cada día, se le suma un pesaje
// más a la MISMA compra. kilosCereza sigue siendo el TOTAL acumulado (la
// suma de pesajes), así que el resto de la app (rendimientos, margen por
// lote, Excel) sigue funcionando igual sin tocar nada más.
//
// Este modal deja VER, CORREGIR y AGREGAR pesajes en un solo lugar
// (2026-09-23, a pedido de Juan — antes solo se podían agregar, y si un
// día se anotaba mal no había forma de corregirlo sin borrar toda la
// compra). `pesajesEdit` es un buffer aparte mientras se edita — no se
// toca `state.cerezaComprada` hasta que se le da Guardar.
let pesajesEdit = [];
function abrirPesajes(id) {
  const c = state.cerezaComprada.find(x => x.id === id); if (!c) return;
  pesajesEdit = (c.pesajes && c.pesajes.length ? c.pesajes : [{ fecha: c.fecha, kilos: c.kilosCereza }]).map(p => ({ ...p }));
  abrirModal(`
    <h3>Pesajes — ${escapeHtml(c.proveedor || 'sin proveedor')}</h3>
    <p style="font-size:13px;color:var(--cafe-soft);margin-top:-6px">Corrige un día si hace falta, o agrega uno nuevo.</p>

}
function pintarFilasPesaje() {
  const cont = document.getElementById('pj-lista');
  if (!cont) return;
  cont.innerHTML = pesajesEdit.map((p, i) => `
    <div class="row">

function quitarFilaPesaje(i) {

function actualizarTotalPesaje() {

async function guardarPesajes(id, btn) {
  const pesajes = pesajesEdit.filter(p => p.kilos > 0);
  if (!pesajes.length) return toast('Agrega al menos un pesaje con kilos mayores a cero.', 'error');
  btn.disabled = true;
  const kilosCereza = pesajes.reduce((s, p) => s + (Number(p.kilos) || 0), 0);

async function guardarEdicionCerezaComprada(id, btn) {

// Cierre de una compra: cuánto pagar por TODO lo acumulado, usando el
// precio de referencia de HOY (el día que se completa el pago — no el de
// cada pesaje individual, así lo pidió Juan) al factor que siempre
// pagan (88 por defecto, editable por si algún día negocian otro).
// Reusa proyectarDesdeCereza() (mismo rendimiento aprendido de siempre)
// y precioPergaminoPorFactor() (misma fórmula de la calculadora de
// Resumen — un solo lugar con la cuenta, no duplicada).
const FACTOR_COMPRA_CEREZA = 88;
function abrirCompletarPagoCereza(id) {
  const c = state.cerezaComprada.find(x => x.id === id); if (!c) return;
  abrirModal(`
    <h3>Completar pago — ${escapeHtml(c.proveedor || 'sin proveedor')}</h3>
    <p style="font-size:13px;color:var(--cafe-soft);margin-top:-6px">${Number(c.kilosCereza).toFixed(1)} kg de cereza acumulados${(c.pesajes || []).length > 1 ? ' en ' + c.pesajes.length + ' pesajes' : ''}.</p>
    <div class="row"><div class="field"><label>Factor de rendimiento</label><input id="cp-factor" type="number" min="1" step="0.1" value="${FACTOR_COMPRA_CEREZA}" oninput="recalcularCompletarPago(${id})"></div></div>
    <div id="cp-resultado"></div>
    <div class="row" style="margin-top:10px">
      <div class="field"><label>Costo total a pagar</label><input id="cp-costo" type="number" min="0"></div>
      <div class="field"><label>Quién pagó</label><select id="cp-pago"><option value="">—</option>${CUENTAS_BALANCE.map(p => `<option ${p === localStorage.getItem('cp_pago') ? 'selected' : ''}>${p}</option>`).join('')}</select></div>
    </div>
    <div class="modal-actions">
      <button class="add-btn" onclick="guardarCompletarPagoCereza(${id}, this)">Completar pago</button>
      <button class="sec-btn" onclick="cerrarModal()">Cancelar</button>
    </div>`);
  recalcularCompletarPago(id);
}
function recalcularCompletarPago(id) {
  const c = state.cerezaComprada.find(x => x.id === id); if (!c) return;
  const cont = document.getElementById('cp-resultado');
  const factor = Number(document.getElementById('cp-factor').value);
  const r = precioPergaminoPorFactor(factor);
  if (!r) { cont.innerHTML = '<p class="empty">Todavía no hay ningún precio de referencia guardado — anota el costo a mano.</p>'; return; }
  // Si ya se pesó pergamino real (aunque sea repartido proporcional desde
  // un despulpado conjunto con cosecha propia u otra compra, ver ⚖️ →
  // abrirPesarConjunto()), se usa ESE peso real — es más preciso que la
  // proyección genérica, que solo aplica mientras no se ha pesado nada.
  const real = c.kilosPergaminoReal != null;
  const pergaminoKg = real ? Number(c.kilosPergaminoReal) : proyectarDesdeCereza(c.kilosCereza).pergamino;
  const costoCalculado = pergaminoKg * r.precioKilo;
  const precioKiloCereza = c.kilosCereza > 0 ? costoCalculado / c.kilosCereza : 0;
  cont.innerHTML = `
    <p style="font-size:12.5px;color:var(--cafe-soft);margin:8px 0">${Number(c.kilosCereza).toFixed(1)} kg cereza → ${real ? '' : '≈ '}${pergaminoKg.toFixed(1)} kg pergamino${real ? ' (pesado real)' : ' (estimado)'} × ${fmt(r.precioKilo)}/kg (precio de hoy a factor ${factor}):</p>
    <div class="stat-grid">
      <div class="stat"><div class="n">${fmt(precioKiloCereza)}</div><div class="l">Por kilo de cereza</div></div>
      <div class="stat"><div class="n">${fmt(costoCalculado)}</div><div class="l">Costo calculado — puedes ajustarlo abajo</div></div>
    </div>`;
  const costoInput = document.getElementById('cp-costo');
  if (costoInput) costoInput.value = Math.round(costoCalculado);
}
async function guardarCompletarPagoCereza(id, btn) {
  const costo = Math.max(0, Number(document.getElementById('cp-costo').value) || 0);
  const pagadoPor = document.getElementById('cp-pago').value || null;
  if (!pagadoPor) return toast('Elige quién pagó.', 'error');
  btn.disabled = true;
  const c = state.cerezaComprada.find(x => x.id === id); if (!c) return;
  c.costo = costo; c.pagadoPor = pagadoPor;
  localStorage.setItem('cp_pago', pagadoPor); localStorage.setItem('cp_usuario', pagadoPor);
  guardarCacheLocal('cerezaComprada');
  cerrarModal();
  renderTrazabilidad();
  await apiFetch('/api/cereza-comprada/' + id, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ costo, pagadoPor }) });
  toast('Pago completado — ' + fmt(costo));
}

async function eliminarCerezaComprada(id) {
  if (!confirm('¿Eliminar este registro de compra?')) return;
  state.cerezaComprada = state.cerezaComprada.filter(x => x.id !== id);
  guardarCacheLocal('cerezaComprada'); renderTrazabilidad();
  await apiFetch('/api/cereza-comprada/' + id, { method:'DELETE' });
}

/* ---------- Anotar el verde real tras trillar ---------- */
// Los 3 orígenes de pergamino (cosecha propia, comprado ya seco, cereza
// comprada) llegan al mismo paso de trilla — esta tabla les da a los tres
// la misma lista/endpoint/campo de kilos de entrada.
const FUENTES_TRILLA = {
  cosecha: { lista: () => state.cosechas, endpoint: 'cosechas', cache: 'cosechas', entra: r => Number(r.kilosPergaminoReal) },
  pergamino: { lista: () => state.pergamino, endpoint: 'pergamino', cache: 'pergamino', entra: r => Number(r.kilosPergamino) },
  cerezaComprada: { lista: () => state.cerezaComprada, endpoint: 'cereza-comprada', cache: 'cerezaComprada', entra: r => Number(r.kilosPergaminoReal) },
};

// Reparte el verde pesado por malla (2026-09-23) en vez de un solo
// número — cada malla se suma al inventario de "Café verde" del lote de
// este registro, y se descuenta la misma cantidad del inventario de
// "Pergamino disponible" (ver migracion_inventario_verde.sql). El id de
// cada campo le quita los espacios al nombre de la malla ("Malla 18" ->
// "tr-grado-Malla18"), no hace falta un idSeguro() genérico para esto.
const idGrado = g => 'tr-grado-' + g.replace(/\s+/g, '');

const GRADOS_MALLA = GRADOS_VERDE.filter(g => g !== 'Sin clasificar');

function abrirTrilla(tipo, id) {
  const fuente = FUENTES_TRILLA[tipo];
  const reg = fuente.lista().find(x => x.id === id);
  if (!reg) return;
  const pergamino = fuente.entra(reg);
  const r = rendimientosReales();
  const estimado = pergamino * r.pergaminoAVerde.valor;
  const grados = reg.verdeGrados || {};
  // Si ya tenía un desglose guardado sin usar "Sin clasificar", se abre
  // en modo desglosado; si el único grado que tenía era "Sin
  // clasificar" (o no tenía nada todavía), se abre en modo simple.
  const yaDesglosado = Object.keys(grados).some(g => g !== 'Sin clasificar');

  abrirModal(`
    <h3>Café verde después de trillar</h3>
    <p style="font-size:13px;color:var(--cafe-soft);margin-top:-6px">
      Entraron ${pergamino.toFixed(1)} kg de pergamino de ${escapeHtml(reg.proceso)} · estimado ${estimado.toFixed(1)} kg de verde en total</p>
    <label style="display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;margin:10px 0 6px;cursor:pointer">
      <input type="checkbox" id="tr-desglosar" ${yaDesglosado ? 'checked' : ''} onchange="alternarDesgloseTrilla()"> Desglosar por malla
    </label>
    <div id="tr-campos-malla" style="display:${yaDesglosado ? '' : 'none'}">
      <p style="font-size:12.5px;color:var(--cafe-soft);margin:0 0 4px">Reparte lo pesado por malla — se suma al inventario de café verde de ${escapeHtml(reg.proceso)}.</p>
      ${GRADOS_MALLA.map(g => `
        <div class="row"><div class="field"><label>${g}</label>
          <input type="number" min="0" step="0.1" id="${idGrado(g)}" value="${grados[g] || ''}" placeholder="0" oninput="actualizarTotalTrilla()"></div></div>`).join('')}
    </div>
    <div id="tr-campo-total" style="display:${yaDesglosado ? 'none' : ''}">
      <p style="font-size:12.5px;color:var(--cafe-soft);margin:0 0 4px">Sin separar por tamaño de grano todavía — se puede clasificar después.</p>
      <div class="row"><div class="field"><label>Total trillado</label>
        <input type="number" min="0" step="0.1" id="${idGrado('Sin clasificar')}" value="${grados['Sin clasificar'] || (yaDesglosado ? '' : (reg.kilosVerdeReal || ''))}" placeholder="0" oninput="actualizarTotalTrilla()"></div></div>
    </div>
    <div style="text-align:right;font-weight:700;margin:6px 0 4px">Total: <span id="tr-total">${(reg.kilosVerdeReal || 0).toFixed(1)}</span> kg</div>
    <div class="modal-actions">
      <button class="add-btn" onclick="guardarTrilla('${tipo}', ${id}, this)">Guardar</button>
      <button class="sec-btn" onclick="cerrarModal()">Cancelar</button>
    </div>`);
}

function alternarDesgloseTrilla() {
  const desglosar = document.getElementById('tr-desglosar').checked;
  document.getElementById('tr-campos-malla').style.display = desglosar ? '' : 'none';
  document.getElementById('tr-campo-total').style.display = desglosar ? 'none' : '';
  actualizarTotalTrilla();
}

function actualizarTotalTrilla() {
  const desglosar = document.getElementById('tr-desglosar')?.checked;
  const grados = desglosar ? GRADOS_MALLA : ['Sin clasificar'];
  const total = grados.reduce((s, g) => s + (Number(document.getElementById(idGrado(g))?.value) || 0), 0);
  const el = document.getElementById('tr-total');
  if (el) el.textContent = total.toFixed(1);
}

async function guardarTrilla(tipo, id, btn) {
  const desglosar = document.getElementById('tr-desglosar').checked;
  const verdeGrados = {};
  (desglosar ? GRADOS_MALLA : ['Sin clasificar']).forEach(g => {
    const v = Math.max(0, Number(document.getElementById(idGrado(g))?.value) || 0);
    if (v > 0) verdeGrados[g] = v;
  });
  if (!Object.keys(verdeGrados).length) return toast(desglosar ? 'Anota al menos un kilo en alguna malla.' : 'Escribe el total trillado.', 'error');
  btn.disabled = true;
  const kilosVerdeReal = Object.values(verdeGrados).reduce((s, v) => s + v, 0);
  const fuente = FUENTES_TRILLA[tipo];
  try {
    const res = await apiFetch('/api/' + fuente.endpoint + '/' + id, {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ verdeGrados, kilosVerdeReal }),
    });
    if (!res.ok) throw new Error(await res.text());
    const reg = fuente.lista().find(x => x.id === id);
    if (reg) { reg.kilosVerdeReal = kilosVerdeReal; reg.verdeGrados = verdeGrados; }
    guardarCacheLocal(fuente.cache);
    cerrarModal();
    renderTrazabilidad();
    toast('Verde real anotado — ' + kilosVerdeReal.toFixed(1) + (desglosar ? ' kg repartidos por malla' : ' kg (sin clasificar)'));
    sincronizar(); // trae los inventarios de pergamino/verde ya actualizados por el servidor
  } catch (err) {
    toast('No se pudo guardar: ' + err.message, 'error');
  } finally { btn.disabled = false; }
}

/* ---------- Pergamino comprado ---------- */
// Junta las 3 fuentes de pergamino (cosecha propia ya pesada, cereza
// comprada ya pesada, pergamino comprado) en una sola lista — a pedido
// de Juan (2026-09-24): "pergamino" es una sola etapa sin importar de
// dónde vino, y antes estaba repartido en 3 pestañas distintas, costaba
// entender cuál era cuál. Cosechas/Cereza comprada siguen siendo la
// pestaña para registrar y seguir la etapa de CEREZA (⚖️ para pesar el
// pergamino sigue ahí); una vez pesado, esa entrada aparece TAMBIÉN acá
// para trillar (🌾) — ya no hace falta ir a buscarla a su pestaña de
// origen para eso.
function entradasPergamino() {
  const deCosechas = state.cosechas.filter(c => c.kilosPergaminoReal != null).map(c => ({
    tipo: 'cosecha', id: c.id, fecha: c.fecha, proceso: c.proceso, costo: null,
    kilos: c.kilosPergaminoReal, kilosVerdeReal: c.kilosVerdeReal,
    origenLabel: 'Cosecha propia', esComprado: false,
  }));
  const deCereza = state.cerezaComprada.filter(c => c.kilosPergaminoReal != null).map(c => ({
    tipo: 'cerezaComprada', id: c.id, fecha: c.fecha, proceso: c.proceso, costo: null,
    kilos: c.kilosPergaminoReal, kilosVerdeReal: c.kilosVerdeReal,
    origenLabel: 'Cereza comprada' + (c.proveedor ? ' — ' + c.proveedor : ''), esComprado: true,
  }));
  const deComprado = state.pergamino.map(p => ({
    tipo: 'pergamino', id: p.id, fecha: p.fecha, proceso: p.proceso, costo: p.costo,
    kilos: p.kilosPergamino, kilosVerdeReal: p.kilosVerdeReal,
    origenLabel: 'Comprado' + (p.proveedor ? ' — ' + p.proveedor : ''), esComprado: true,
  }));
  return [...deCosechas, ...deCereza, ...deComprado];
}
function eliminarEntradaPergamino(tipo, id) {
  if (tipo === 'cosecha') return eliminarCosecha(id);
  if (tipo === 'cerezaComprada') return eliminarCerezaComprada(id);
  return eliminarPergamino(id);
}

function vistaPergamino() {
  // Pendientes primero (todavía no se trilló nada de esa entrada), y
  // ya trilladas después — así lo que de verdad hace falta atender
  // queda arriba, en vez de mezclado con historial ya resuelto.
  const entradas = entradasPergamino().sort((a, b) => {
    const aTrillada = a.kilosVerdeReal > 0, bTrillada = b.kilosVerdeReal > 0;
    if (aTrillada !== bTrillada) return aTrillada ? 1 : -1;
    return b.fecha - a.fecha;
  });
  // Mismo total que la tarjeta "Pergamino disponible" de la pestaña
  // Café verde (state.inventarioPergamino) — para que este número
  // SIEMPRE coincida con ese, en vez de sumar el kilaje de cada entrada
  // (que no baja al trillar, ver auditoría 2026-09-24).
  const pergaminoDisponibleReal = state.inventarioPergamino.reduce((s, p) => s + Number(p.kilos || 0), 0);
  return `
    <div class="card">
      <h3 class="section-title" style="margin-top:0">Registrar compra de pergamino</h3>
      <div class="row">
        <div class="field"><label>Fecha</label><input id="pg-fecha" type="date" value="${hoyISO()}"></div>
        <div class="field"><label>Proveedor</label><input id="pg-proveedor" placeholder="A quién se le compró"></div>
      </div>
      <div class="row">
        <div class="field"><label>Kilos de pergamino</label>
          <input id="pg-kilos" type="number" min="0" step="0.1" placeholder="0" oninput="previsualizarPergamino()"></div>
        <div class="field"><label>Proceso</label>
          <select id="pg-proceso">${LOTES.map(l => `<option>${l}</option>`).join('')}</select></div>
        <div class="field"><label>Costo total</label>
          <input id="pg-costo" type="number" min="0" placeholder="0"></div>
      </div>
      <div id="pg-preview" class="preview-cadena"></div>
      <div class="row"><div class="field"><label>Notas</label><input id="pg-notas" placeholder="Origen, finca, observaciones…"></div></div>
      <button class="add-btn" onclick="registrarPergamino(this)">Registrar compra</button>
    </div>

    <h3 class="section-title">Pergamino disponible</h3>
    <p style="font-size:12px;color:var(--cafe-soft);margin-top:-6px">De cosecha propia, cereza comprada y comprado directo — todo junto, listo para trillar (🌾). <b>${pergaminoDisponibleReal.toFixed(1)} kg pendientes por trillar</b> ahora mismo (lo ya trillado de la lista de abajo queda marcado ✅ y no cuenta acá).</p>
    <div class="ledger">
      ${paginar(entradas, 'pergamino', e => {
        const pr = proyectarDesdePergamino(e.kilos);
        const yaTrillada = e.kilosVerdeReal > 0;
        return `
        <div class="ledger-row" style="${yaTrillada ? 'opacity:.6' : ''}">
          <div class="main">
            <div class="title">${Number(e.kilos).toFixed(1)} kg <span class="badge-origen ${e.esComprado ? 'comprado' : 'casa'}" title="${e.esComprado ? 'Comprado a terceros' : 'De la finca propia'}">${e.esComprado ? '🚚' : '🏠'}</span> · ${escapeHtml(e.origenLabel)}${yaTrillada ? ' <span class="badge-web" style="background:var(--verde-bg);color:var(--verde)">✅ Ya trillado</span>' : ''}</div>

              ? `Verde real tras trillar: <b>${Number(e.kilosVerdeReal).toFixed(1)} kg</b>`

      }, 'Todavía no hay pergamino disponible — pesa una cosecha (⚖️) o compra pergamino arriba.')}
    </div>`;
}

function previsualizarPergamino() {

  if (!kg) { el.innerHTML = ''; return; }
  const p = proyectarDesdePergamino(kg);
  el.innerHTML = `
    <div class="cadena">
      <span><b>${kg.toFixed(1)}</b> kg pergamino</span><i>→</i>
      <span><b>${p.verde.toFixed(1)}</b> kg verde</span><i>→</i>

async function registrarPergamino(btn) {
  const kilosPergamino = Number(document.getElementById('pg-kilos').value) || 0;
  if (!kilosPergamino) return toast('Escribe cuántos kilos de pergamino se compraron.', 'error');
  btn.disabled = true;
  try {
    const payload = {
      fecha: new Date(document.getElementById('pg-fecha').value + 'T12:00:00').getTime(),
      proveedor: document.getElementById('pg-proveedor').value.trim() || 'Sin proveedor',
      kilosPergamino,
      proceso: document.getElementById('pg-proceso').value,
      costo: Math.max(0, Number(document.getElementById('pg-costo').value) || 0),
      notas: document.getElementById('pg-notas').value.trim() || null,
      usuario: localStorage.getItem('cp_usuario') || 'Equipo',
    };
    const res = await apiFetch('/api/pergamino', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
    state.pergamino.push(await res.json());
    guardarCacheLocal('pergamino');
    toast('Compra registrada');
    renderTrazabilidad();
  } finally { btn.disabled = false; }
}

async function eliminarPergamino(id) {
  if (!confirm('¿Eliminar esta compra de pergamino?')) return;
  state.pergamino = state.pergamino.filter(x => x.id !== id);
  guardarCacheLocal('pergamino'); renderTrazabilidad();
  await apiFetch('/api/pergamino/' + id, { method:'DELETE' });
}

/* ---------- Inventario de café verde (2026-09-23) ----------
   Dos etapas: "pergamino disponible" (ya seco, antes de trillar — se
   suma al pesar pergamino real o comprar pergamino, se resta al
   trillar) y "café verde disponible" (ya trillado, clasificado por
   malla — se suma al trillar, se resta al retirar para tostión). Nació
   porque al empezar a usar la app ya había pergamino de antes que no
   estaba contemplado en ningún lado — "Agregar pergamino que ya
   tenías" existe justo para sembrar ese stock viejo, una sola vez. */
function vistaInventarioVerde() {
  const filaPergamino = lote => {
    const kg = Number(state.inventarioPergamino.find(x => x.lote === lote)?.kilos) || 0;
    return `<div class="tarifa-row"><div class="nombre">${lote}</div><div style="font-weight:700">${kg.toFixed(1)} kg</div></div>`;
  };
  // Compacto a propósito (2026-09-24, pedido de Juan): antes esta tarjeta
  // listaba las 6 mallas de los 4 lotes SIEMPRE, 24 filas fijas — mucho
  // scroll para algo que casi siempre está en $0 en la mayoría de mallas.
  // Ahora solo muestra el LOTE (proceso) + su total + cuánto de eso está
  // "sin clasificar" (lo que sí importa ver de entrada, porque avisa que
  // falta separar por tamaño de grano) — el desglose completo por malla
  // se ve tocando la fila, en `abrirDetalleVerdeLote()`.
  const totalVerdeLote = lote => GRADOS_VERDE.reduce((s, g) =>
    s + (Number(state.inventarioVerde.find(x => x.lote === lote && x.grado === g)?.kilos) || 0), 0);
  const sinClasificarLote = lote => Number(state.inventarioVerde.find(x => x.lote === lote && x.grado === 'Sin clasificar')?.kilos) || 0;
  const filaVerdeLote = lote => {
    const total = totalVerdeLote(lote);
    const sinClasificar = sinClasificarLote(lote);
    return `
      <div class="tarifa-row" style="cursor:pointer" onclick="abrirDetalleVerdeLote('${lote}')">
        <div class="nombre">${lote}${sinClasificar > 0.01 ? `<br><span style="font-weight:400;font-size:11.5px;color:var(--cafe-soft)">${sinClasificar.toFixed(1)} kg sin clasificar</span>` : ''}</div>
        <div style="display:flex;align-items:center;gap:6px;white-space:nowrap">
          <span style="font-weight:700">${total.toFixed(1)} kg</span>
          <span style="color:var(--cafe-soft);font-size:12px">Ver mallas ›</span>
        </div>
      </div>`;
  };
  return `
    <div class="card">
      <h3 class="section-title" style="margin-top:0">Pergamino disponible</h3>
      <p style="font-size:12px;color:var(--cafe-soft);margin-top:-6px">Café ya seco, antes de trillar. Se suma solo (⚖️ pesar pergamino real, o comprar pergamino ya seco) y se resta solo (🌾 trillar).</p>
      ${LOTES.map(filaPergamino).join('')}
      <button class="sec-btn" style="width:100%;margin-top:10px" onclick="abrirAgregarPergaminoExistente()">+ Agregar pergamino que ya tenías</button>
      <button class="add-btn" style="width:100%;margin-top:8px" onclick="abrirTrillarPergaminoExistente()">🌾 Trillar pergamino disponible</button>
    </div>

    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap">
        <h3 class="section-title" style="margin:0">Café verde disponible</h3>
        <button class="add-btn" style="width:auto;padding:10px 16px" onclick="abrirRetiroTostion()">Retirar para tostión</button>
      </div>
      <p style="font-size:12px;color:var(--cafe-soft);margin:10px 0 0">Ya trillado. Se suma solo al trillar (🌾) y se resta solo al retirar para tostión — toca un lote para ver el detalle por malla.</p>
      ${LOTES.map(filaVerdeLote).join('')}
      <button class="sec-btn" style="width:100%;margin-top:14px" onclick="abrirAgregarVerdeExistente()">+ Agregar café verde que ya tenías</button>
    </div>

    <h3 class="section-title">Historial de movimientos</h3>
    <p style="font-size:12px;color:var(--cafe-soft);margin-top:-10px">De dónde vino (o hacia dónde fue) cada entrada/salida — el inventario de arriba es un solo total por lote, esto es para poder ver "cuánto es de quién".</p>
    <div class="ledger">
      ${paginar(state.movimientosInventario.slice().sort((a, b) => b.ts - a.ts), 'movimientosInventario', m => `
        <div class="ledger-row">
          <div class="main">
            <div class="title">${escapeHtml(m.origen)}${m.referencia ? ' — ' + escapeHtml(m.referencia) : ''}</div>
            <div class="meta">${fechaCorta(m.fecha)} · ${m.etapa === 'pergamino' ? 'Pergamino' : 'Verde'} · ${escapeHtml(m.lote)}${m.grado ? ' · ' + escapeHtml(m.grado) : ''}</div>
          </div>
          <div class="amount ${m.kilos > 0 ? 'pos' : 'neg'}">${m.kilos > 0 ? '+' : ''}${Number(m.kilos).toFixed(1)} kg</div>
        </div>`, 'Todavía no hay movimientos registrados.')}
    </div>`;
}

// "🌾 Trillar pergamino disponible" (2026-09-24, corrige un hueco real):
// el pergamino que se agrega con "+ Agregar pergamino que ya tenías" (o
// cualquier otro que ya esté en el POOL de inventario_pergamino sin
// pertenecer a una cosecha/cereza comprada/compra puntual todavía sin
// trillar) no tenía NINGÚN botón 🌾 en ningún lado — el 🌾 de "Pergamino
// disponible" (pestaña Pergamino) solo vive pegado a una entrada
// concreta de cosechas/cerezaComprada/pergamino. Juan reportó
// exactamente este caso: agregó pergamino existente y no encontraba
// dónde seguir con la trilla. Este botón trilla DIRECTO del pool por
// lote (mismo `aplicarTrilla()` de siempre, sin necesitar un registro
// de origen) — mismo patrón de desglosar-por-malla que ya usa
// `abrirTrilla()`, con sus propios ids (`tpe-*`) para no chocar si algún
// día los dos modales llegan a convivir.
function abrirTrillarPergaminoExistente() {
  const lotesConStock = LOTES.filter(l => Number(state.inventarioPergamino.find(x => x.lote === l)?.kilos) > 0.01);
  if (!lotesConStock.length) return toast('No hay pergamino disponible todavía.', 'error');
  abrirModal(`
    <h3>Trillar pergamino disponible</h3>
    <p style="font-size:13px;color:var(--cafe-soft);margin-top:-6px">Para pergamino que no viene de una cosecha o compra puntual en la app (ej. lo que agregaste con "+ Agregar pergamino que ya tenías") — resta del inventario de pergamino y suma al de café verde.</p>
    <div class="row"><div class="field"><label>Lote</label><select id="tpe-lote" onchange="actualizarDisponibleTrillarExistente()">${lotesConStock.map(l => `<option>${l}</option>`).join('')}</select></div></div>
    <p id="tpe-disponible" style="font-size:12.5px;color:var(--cafe-soft);margin-top:-6px"></p>
    <label style="display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;margin:10px 0 6px;cursor:pointer">
      <input type="checkbox" id="tpe-desglosar" onchange="alternarDesgloseTrillarExistente()"> Desglosar por malla
    </label>
    <div id="tpe-campos-malla" style="display:none">
      <p style="font-size:12.5px;color:var(--cafe-soft);margin:0 0 4px">Reparte lo pesado por malla.</p>
      ${GRADOS_MALLA.map(g => `
        <div class="row"><div class="field"><label>${g}</label>
          <input type="number" min="0" step="0.1" id="tpe-grado-${g.replace(/\s+/g, '')}" placeholder="0" oninput="actualizarTotalTrillarExistente()"></div></div>`).join('')}
    </div>
    <div id="tpe-campo-total">
      <p style="font-size:12.5px;color:var(--cafe-soft);margin:0 0 4px">Sin separar por tamaño de grano todavía — se puede clasificar después.</p>
      <div class="row"><div class="field"><label>Total trillado</label>
        <input type="number" min="0" step="0.1" id="tpe-grado-Sinclasificar" placeholder="0" oninput="actualizarTotalTrillarExistente()"></div></div>
    </div>
    <div style="text-align:right;font-weight:700;margin:6px 0 4px">Total: <span id="tpe-total">0.0</span> kg</div>
    <div class="row"><div class="field"><label>De quién (opcional)</label><input id="tpe-nota" placeholder="Ej. cosecha 2025, compra a Don Leo…"></div></div>
    <div class="modal-actions">
      <button class="add-btn" onclick="guardarTrillarPergaminoExistente(this)">Guardar</button>
      <button class="sec-btn" onclick="cerrarModal()">Cancelar</button>
    </div>`);
  actualizarDisponibleTrillarExistente();
}
function actualizarDisponibleTrillarExistente() {
  const lote = document.getElementById('tpe-lote')?.value;
  const el = document.getElementById('tpe-disponible');
  if (!el) return;
  const kg = Number(state.inventarioPergamino.find(x => x.lote === lote)?.kilos) || 0;
  el.textContent = `Disponible: ${kg.toFixed(1)} kg`;
}
function alternarDesgloseTrillarExistente() {
  const desglosar = document.getElementById('tpe-desglosar').checked;
  document.getElementById('tpe-campos-malla').style.display = desglosar ? '' : 'none';
  document.getElementById('tpe-campo-total').style.display = desglosar ? 'none' : '';
  actualizarTotalTrillarExistente();
}
function actualizarTotalTrillarExistente() {
  const desglosar = document.getElementById('tpe-desglosar')?.checked;
  const grados = desglosar ? GRADOS_MALLA : ['Sin clasificar'];
  const total = grados.reduce((s, g) => s + (Number(document.getElementById('tpe-grado-' + g.replace(/\s+/g, ''))?.value) || 0), 0);
  const el = document.getElementById('tpe-total');
  if (el) el.textContent = total.toFixed(1);
}
async function guardarTrillarPergaminoExistente(btn) {
  const lote = document.getElementById('tpe-lote').value;
  const desglosar = document.getElementById('tpe-desglosar').checked;
  const verdeGrados = {};
  (desglosar ? GRADOS_MALLA : ['Sin clasificar']).forEach(g => {
    const v = Math.max(0, Number(document.getElementById('tpe-grado-' + g.replace(/\s+/g, ''))?.value) || 0);
    if (v > 0) verdeGrados[g] = v;
  });
  if (!Object.keys(verdeGrados).length) return toast(desglosar ? 'Anota al menos un kilo en alguna malla.' : 'Escribe el total trillado.', 'error');
  const nota = document.getElementById('tpe-nota').value.trim() || null;
  btn.disabled = true;
  try {
    const res = await apiFetch('/api/inventario-pergamino/trillar', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ lote, verdeGrados, nota }) });
    if (!res.ok) throw new Error(await res.text());
    cerrarModal();
    const total = Object.values(verdeGrados).reduce((s, v) => s + v, 0);
    toast(`${total.toFixed(1)} kg de ${lote} trillados`);
    await sincronizar();
  } catch (err) {
    toast('No se pudo guardar: ' + err.message, 'error');
  } finally { btn.disabled = false; }
}

// Detalle por malla de un lote (2026-09-24) — la tarjeta "Café verde
// disponible" solo muestra el total + lo sin clasificar por lote para no

function abrirRetiroTostion() {
  const lotesConStock = LOTES.filter(l => state.inventarioVerde.some(x => x.lote === l && Number(x.kilos) > 0.01));
  if (!lotesConStock.length) return toast('No hay café verde disponible todavía — trilla algo primero (🌾).', 'error');
  abrirModal(`
    <h3>Retirar para tostión</h3>
    <p style="font-size:13px;color:var(--cafe-soft);margin-top:-6px">Se descuenta del inventario de café verde apenas lo registras — el tueste queda listo, anota lo que sale con 🔥 cuando lo sepas.</p>
    <div class="row">
      <div class="field"><label>Lote</label><select id="rt-lote" onchange="actualizarGradosRetiro()">${lotesConStock.map(l => `<option>${l}</option>`).join('')}</select></div>
      <div class="field"><label>Fecha</label><input id="rt-fecha" type="date" value="${hoyISO()}"></div>
    </div>
    <div class="row">
      <div class="field"><label>Malla</label><select id="rt-grado" onchange="actualizarDisponibleRetiro()"></select></div>
      <div class="field"><label>Kilos a retirar</label><input id="rt-kilos" type="number" min="0" step="0.1" placeholder="0" oninput="actualizarDisponibleRetiro()"></div>
    </div>
    <p id="rt-disponible" style="font-size:12.5px;color:var(--cafe-soft);margin-top:-6px"></p>
    <div class="modal-actions">
      <button class="add-btn" onclick="guardarRetiroTostion(this)">Retirar y enviar a tostión</button>
      <button class="sec-btn" onclick="cerrarModal()">Cancelar</button>
    </div>`);
  actualizarGradosRetiro();
}
function actualizarGradosRetiro() {
  const lote = document.getElementById('rt-lote')?.value;
  const sel = document.getElementById('rt-grado');
  if (!lote || !sel) return;
  const grados = GRADOS_VERDE.filter(g => Number(state.inventarioVerde.find(x => x.lote === lote && x.grado === g)?.kilos) > 0.01);
  sel.innerHTML = grados.length ? grados.map(g => `<option>${g}</option>`).join('') : '<option value="">Sin stock</option>';
  actualizarDisponibleRetiro();
}
function actualizarDisponibleRetiro() {
  const lote = document.getElementById('rt-lote')?.value;
  const grado = document.getElementById('rt-grado')?.value;
  const el = document.getElementById('rt-disponible');
  if (!el) return;
  if (!grado) { el.textContent = 'No hay ninguna malla con stock para ese lote.'; return; }
  const kg = Number(state.inventarioVerde.find(x => x.lote === lote && x.grado === grado)?.kilos) || 0;
  const pedido = Number(document.getElementById('rt-kilos')?.value) || 0;
  el.textContent = `Disponible: ${kg.toFixed(1)} kg` + (pedido > kg ? ' — no alcanza para lo que pusiste arriba' : '');
}
async function guardarRetiroTostion(btn) {
  const lote = document.getElementById('rt-lote').value;
  const grado = document.getElementById('rt-grado').value;
  const kilos = Math.max(0, Number(document.getElementById('rt-kilos').value) || 0);
  if (!grado) return toast('No hay ninguna malla con stock para ese lote.', 'error');
  if (!kilos) return toast('Escribe cuántos kilos vas a retirar.', 'error');
  btn.disabled = true;
  try {
    const payload = {
      fecha: new Date(document.getElementById('rt-fecha').value + 'T12:00:00').getTime(),
      lote, grado, kilosVerde: kilos, kilosTostado: null,
      origen: 'Inventario de verde',
      usuario: localStorage.getItem('cp_usuario') || 'Equipo',
    };
    const res = await apiFetch('/api/tuestes', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    if (!res.ok) throw new Error(await res.text());
    state.tuestes.push(await res.json());
    guardarCacheLocal('tuestes');
    cerrarModal();
    toast(`${kilos.toFixed(1)} kg de ${grado} (${lote}) retirados para tostión`);
    await sincronizar();
  } catch (err) {
    toast('No se pudo registrar: ' + err.message, 'error');
  } finally { btn.disabled = false; }
}

function previsualizarTueste(manual) {
  const el = document.getElementById('tu-preview');
  if (!el) return;
  const verde = Number(document.getElementById('tu-verde').value) || 0;
  const campoTostado = document.getElementById('tu-tostado');
  // Si no has escrito el peso real de salida, se propone el teórico (merma 13%).
  if (!manual && verde) campoTostado.value = (verde * (1 - RENDIMIENTO.mermaTueste)).toFixed(1);
  const tostado = Number(campoTostado.value) || 0;
  if (!verde && !tostado) { el.innerHTML = ''; return; }
  const merma = verde > 0 ? (1 - tostado / verde) * 100 : 0;
  const fueraDeRango = verde > 0 && (merma < 8 || merma > 22);
  el.innerHTML = `
    <div class="cadena">
      <span><b>${verde.toFixed(1)}</b> kg verde</span><i>→</i>
      <span><b>${tostado.toFixed(1)}</b> kg tostado</span><i>=</i>
      <span class="destacado"><b>${Math.round(tostado / KG_POR_LIBRA_VENTA)}</b> libras</span>
    </div>
    <div class="cadena-nota${fueraDeRango ? ' alerta' : ''}">Merma: ${merma.toFixed(1)}%${fueraDeRango ? ' — revisa los pesos, lo normal ronda el 13%' : ''}</div>`;
}

async function registrarTueste(btn) {
  const kilosVerde = Number(document.getElementById('tu-verde').value) || 0;
  if (!kilosVerde) return toast('Escribe cuántos kilos de verde entraron.', 'error');
  const tostadoTexto = document.getElementById('tu-tostado').value;
  const kilosTostado = tostadoTexto === '' ? null : Number(tostadoTexto) || 0;
  if (kilosTostado != null && kilosTostado > kilosVerde) return toast('El tostado no puede pesar más que el verde.', 'error');
  btn.disabled = true;
  try {
    const payload = {
      fecha: new Date(document.getElementById('tu-fecha').value + 'T12:00:00').getTime(),
      lote: document.getElementById('tu-lote').value,
      kilosVerde, kilosTostado,
      origen: document.getElementById('tu-origen').value,
      notasCata: document.getElementById('tu-notas').value.trim() || null,
      usuario: localStorage.getItem('cp_usuario') || 'Equipo',
    };
    const res = await apiFetch('/api/tuestes', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
    state.tuestes.push(await res.json());
    guardarCacheLocal('tuestes');
    toast(kilosTostado != null ? `Tueste registrado · +${kilosTostado.toFixed(1)} kg al inventario` : 'Entrada de verde registrada — anota la salida con 🔥 cuando la sepas');
    await sincronizar(); // trae el inventario ya actualizado
  } finally { btn.disabled = false; }
}

/* ---------- Anotar la salida del tueste (después, cuando se sepa) ---------- */
function abrirSalidaTueste(id) {
  const t = state.tuestes.find(x => x.id === id); if (!t) return;
  const esLavado = t.lote === 'Lavado';
  abrirModal(`
    <h3>Salida del tueste — ${escapeHtml(t.lote)}</h3>
    <p style="font-size:13px;color:var(--cafe-soft);margin-top:-6px">Entraron ${Number(t.kilosVerde).toFixed(1)} kg de verde el ${fechaCorta(t.fecha)}.</p>
    ${esLavado ? `
      <div class="row">
        <div class="field"><label>Tostión Media (kg)</label><input id="ts-media" type="number" min="0" step="0.1" value="${t.kilosTostadoMedia ?? ''}" oninput="previsualizarSalidaTueste(${id})"></div>
        <div class="field"><label>Tostión Media alta (kg)</label><input id="ts-media-alta" type="number" min="0" step="0.1" value="${t.kilosTostadoMediaAlta ?? ''}" oninput="previsualizarSalidaTueste(${id})"></div>
      </div>
    ` : `
      <div class="row"><div class="field"><label>Kilos tostados</label><input id="ts-total" type="number" min="0" step="0.1" value="${t.kilosTostado ?? ''}" oninput="previsualizarSalidaTueste(${id})"></div></div>
    `}
    <div id="ts-preview" class="preview-cadena"></div>
    <div class="modal-actions">
      <button class="add-btn" onclick="guardarSalidaTueste(${id}, this)">Guardar</button>
      <button class="sec-btn" onclick="cerrarModal()">Cancelar</button>
    </div>
  `);
  previsualizarSalidaTueste(id);
}

function previsualizarSalidaTueste(id) {
  const t = state.tuestes.find(x => x.id === id); if (!t) return;
  const esLavado = t.lote === 'Lavado';
  const total = esLavado
    ? (Number(document.getElementById('ts-media')?.value) || 0) + (Number(document.getElementById('ts-media-alta')?.value) || 0)
    : Number(document.getElementById('ts-total')?.value) || 0;
  const el = document.getElementById('ts-preview'); if (!el) return;
  if (!total) { el.innerHTML = ''; return; }
  const merma = t.kilosVerde > 0 ? (1 - total / t.kilosVerde) * 100 : 0;
  const fueraDeRango = merma < 8 || merma > 22;
  el.innerHTML = `
    <div class="cadena"><span><b>${total.toFixed(1)}</b> kg tostado</span><i>=</i><span class="destacado"><b>${Math.round(total / KG_POR_LIBRA_VENTA)}</b> libras</span></div>
    <div class="cadena-nota${fueraDeRango ? ' alerta' : ''}">Merma: ${merma.toFixed(1)}%${fueraDeRango ? ' — revisa los pesos, lo normal ronda el 13%' : ''}</div>`;
}

async function guardarSalidaTueste(id, btn) {
  const t = state.tuestes.find(x => x.id === id); if (!t) return;
  const esLavado = t.lote === 'Lavado';
  btn.disabled = true;
  try {
    let payload, nuevoTotal;
    if (esLavado) {
      const media = Math.max(0, Number(document.getElementById('ts-media').value) || 0);
      const mediaAlta = Math.max(0, Number(document.getElementById('ts-media-alta').value) || 0);
      nuevoTotal = media + mediaAlta;
      payload = { kilosTostadoMedia: media, kilosTostadoMediaAlta: mediaAlta };
    } else {
      nuevoTotal = Math.max(0, Number(document.getElementById('ts-total').value) || 0);
      payload = { kilosTostado: nuevoTotal };
    }
    if (!nuevoTotal) return toast('Escribe cuánto salió tostado.', 'error');
    if (nuevoTotal > t.kilosVerde) return toast('El tostado no puede pesar más que el verde.', 'error');

    const res = await apiFetch('/api/tuestes/' + id, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    const actualizado = await res.json();
    Object.assign(t, actualizado);
    guardarCacheLocal('tuestes');
    cerrarModal();
    toast('Salida anotada · inventario actualizado');
    await sincronizar();
  } finally { btn.disabled = false; }
}

async function eliminarTueste(id) {
  if (!confirm('¿Eliminar este tueste? Los kilos que sumó se descuentan del inventario.')) return;
  state.tuestes = state.tuestes.filter(x => x.id !== id);
  guardarCacheLocal('tuestes'); renderTrazabilidad();
  await apiFetch('/api/tuestes/' + id, { method:'DELETE' });
  sincronizar();
}

// Tarjeta con el último precio interno de referencia guardado por el cron
// (functions/api/cron/precio-fnc.ts) y cómo cambió frente al reporte
// anterior. state.precioFnc viene ordenado más reciente primero (lo pide
// así el GET /api/precio-fnc). No es el precio de venta de Café Pandora
// (que tuesta y vende, no vende pergamino) — es contexto de mercado, útil
// sobre todo para negociar cereza/pergamino comprado a terceros.
function bloquePrecioFnc() {
  const hist = state.precioFnc || [];
  if (!hist.length) return '<p class="empty">Todavía no hay ningún precio guardado — falta configurar el cron externo que lo trae (ver CLAUDE.md, sección "Precio de referencia del café").</p>';
  const ultimo = hist[0];
  const anterior = hist[1];
  const delta = anterior && anterior.precioCarga ? ultimo.precioCarga - anterior.precioCarga : null;
  const deltaPct = delta != null ? (delta / anterior.precioCarga) * 100 : null;
  const fechaFmt = f => new Date(f + 'T00:00:00').toLocaleDateString('es-CO', { day: '2-digit', month: 'short', year: 'numeric' });
  return `
    <div class="stat-grid" style="margin-bottom:8px">
      <div class="stat">
        <div class="n">${fmt(ultimo.precioCarga)}</div>
        <div class="l">Por carga de 125 kg de pergamino seco (${fechaFmt(ultimo.fecha)})</div>
      </div>
      ${delta != null ? `
      <div class="stat">
        <div class="n ${delta >= 0 ? 'pos' : 'neg'}">${delta >= 0 ? '▲' : '▼'} ${fmt(Math.abs(delta))} (${Math.abs(deltaPct).toFixed(1)}%)</div>
        <div class="l">Frente al reporte anterior (${fechaFmt(anterior.fecha)})</div>
      </div>` : ''}
    </div>
    <p style="font-size:12px;color:var(--cafe-soft);margin-top:-6px">Fuente: Federación Nacional de Cafeteros. Es el precio de referencia para pergamino seco, no el precio de venta de Café Pandora — sirve de contexto para negociar cereza/pergamino comprado y entender hacia dónde va el mercado.</p>
    ${bloqueCalculadoraFactor()}`;
}

// El precio que publica la Federación siempre es "a factor 94" (94 kg de
// pergamino = 70 kg de café exportable) — si el lote que se está
// comprando rinde distinto, se paga más o menos, proporcional:
//   precio_a_pagar = precio_referencia × (94 ÷ factor_real)
// Un factor MEJOR que 94 (ej. 88, hace falta menos pergamino para llegar
// a 70 kg) paga MÁS que el precio publicado; uno PEOR (ej. 100) paga
// MENOS. Confirmado con la Federación (federaciondecafeteros.org,
// "Aprenda a vender su café") antes de construir esto — es plata real,
// no se adivinó la fórmula.
const FACTOR_BASE_REFERENCIA = 94;
// Compartida entre la calculadora de Resumen y "Completar pago" de cereza
// comprada — un solo lugar con la fórmula, no duplicarla en dos partes.
// Devuelve null si todavía no hay ningún precio de referencia guardado.
function precioPergaminoPorFactor(factor) {
  const ultimo = state.precioFnc && state.precioFnc[0];
  if (!ultimo || !factor || factor <= 0) return null;
  const precioCarga = ultimo.precioCarga * (FACTOR_BASE_REFERENCIA / factor);
  return { precioCarga, precioKilo: precioCarga / 125, fecha: ultimo.fecha };
}
function bloqueCalculadoraFactor() {
  if (!state.precioFnc || !state.precioFnc.length) return '';
  return `
    <div class="card" style="margin-top:12px">
      <h4 style="margin:0 0 4px">¿A cuánto pagar según el factor del lote?</h4>
      <p style="font-size:12px;color:var(--cafe-soft);margin:0 0 10px">La Federación publica el precio a factor ${FACTOR_BASE_REFERENCIA}. Si el lote real rinde distinto, se paga proporcional — mejor factor (número más bajo) paga más; peor factor paga menos.</p>
      <div class="field"><label>Factor de rendimiento del lote</label><input id="factor-input" type="number" min="1" step="0.1" placeholder="Ej. 88" oninput="calcularPrecioFactor()"></div>
      <div id="resultado-factor"></div>
    </div>`;
}
function calcularPrecioFactor() {
  const cont = document.getElementById('resultado-factor');
  const factor = Number(document.getElementById('factor-input').value);
  const r = precioPergaminoPorFactor(factor);
  if (!r) { cont.innerHTML = ''; return; }
  cont.innerHTML = `
    <div class="stat-grid" style="margin-top:10px">
      <div class="stat"><div class="n">${fmt(r.precioCarga)}</div><div class="l">Por carga (125 kg) a factor ${factor}</div></div>
      <div class="stat"><div class="n">${fmt(r.precioKilo)}</div><div class="l">Por kilo de pergamino</div></div>
    </div>`;
}

function renderResumen() {
  const mes = document.getElementById('filtroMes').value || hoyMes();
  const ventasMes = state.ventas.filter(v => mesDe(v.ts) === mes);
  const gastosMes = state.gastos.filter(g => mesDe(g.ts) === mes);
  const fincaMes = state.finca.filter(f => mesDe(f.ts) === mes);
  const maquilaMes = state.ordenesMaquila.filter(o => mesDe(o.ts) === mes);

  const facturadoVentas = ventasMes.reduce((s, v) => s + (Number(v.valor) || 0), 0);
  const pagadas = ventasMes.filter(v => v.estado === 'Pagado').sort((a,b)=>b.ts-a.ts);
  const pendientes = ventasMes.filter(v => v.estado !== 'Pagado').sort((a,b)=>b.ts-a.ts);
  const cobradoVentas = pagadas.reduce((s, v) => s + (Number(v.valor) || 0), 0);

  const facturadoMaquila = maquilaMes.reduce((s, o) => s + (Number(o.valor) || 0), 0);
  const maquilaPagada = maquilaMes.filter(o => o.estado === 'Pagado');
  const cobradoMaquila = maquilaPagada.reduce((s, o) => s + (Number(o.valor) || 0), 0);

  // El total del negocio junta café + maquila; la tarjeta de maquila se ve
  // aparte para que sepas cuánto es cada cosa, pero sí entra en el total.
  const facturado = facturadoVentas + facturadoMaquila;
  const cobrado = cobradoVentas + cobradoMaquila;
  const porCobrar = facturado - cobrado;
  const totalGastos = gastosMes.filter(esGastoOperativo).reduce((s, g) => s + (Number(g.monto) || 0), 0);
  const totalMovimientosInternos = gastosMes.filter(g => !esGastoOperativo(g)).reduce((s, g) => s + (Number(g.monto) || 0), 0);
  const totalFinca = fincaMes.reduce((s, f) => s + (Number(f.monto) || 0), 0);
  const balance = cobrado - totalGastos - totalFinca;
  // Libras (de 500 g, la "libra" de Café Pandora) de café vendidas este
  // mes, sin importar la presentación de cada línea — Media lb/Libra/
  // Kilo/Cuarterón se convierten todas a la misma unidad para sumarlas.
  const librasVendidas = ventasMes.reduce((s, v) => s + kilosDeVenta(v), 0) / KG_POR_LIBRA_VENTA;

  const porLote = {};
  ventasMes.forEach(v => {
    lotesDeVenta(v).forEach(([lote, val]) => { porLote[lote] = (porLote[lote] || 0) + (Number(val) || 0); });
  });
  const maxLote = Math.max(1, ...Object.values(porLote));

  const filaResumenVenta = v => `
    <div class="ledger-row">
      <div class="main">
        <div class="title">${escapeHtml(v.cliente || 'Venta directa')}</div>
        <div class="meta">${new Date(Number(v.ts)).toLocaleDateString('es-CO')}</div>
      </div>
      <div class="amount pos">${fmt(v.valor)}</div>
    </div>`;
  const filaResumenGasto = g => `
    <div class="ledger-row">
      <div class="main">
        <div class="title">${escapeHtml(g.concepto)}</div>
        <div class="meta">${new Date(Number(g.ts)).toLocaleDateString('es-CO')} · ${escapeHtml(g.categoria)}</div>
      </div>
      <div class="amount neg">-${fmt(g.monto)}</div>
    </div>`;
  const filaResumenMaquila = o => `
    <div class="ledger-row">
      <div class="main">
        <div class="title">${escapeHtml(o.cliente)}</div>
        <div class="meta">${new Date(Number(o.ts)).toLocaleDateString('es-CO')} · ${escapeHtml(detalleOrdenMaquila(o))}</div>
      </div>
      <div class="amount pos">${fmt(o.valor)}</div>
    </div>`;

  document.getElementById('view-resumen').innerHTML = `
    <h3 class="section-title" style="margin-top:0">Resumen de ${mes}</h3>
    <div class="stat-grid">
      <div class="stat"><div class="n">${fmt(facturado)}</div><div class="l">Total facturado (café + maquila)</div></div>
      <div class="stat"><div class="n pos">${fmt(cobrado)}</div><div class="l">Cobrado</div></div>
      <div class="stat"><div class="n">${fmt(porCobrar)}</div><div class="l">Por cobrar</div></div>
      <div class="stat"><div class="n neg">${fmt(totalGastos + totalFinca)}</div><div class="l">Gastos + Finca${totalMovimientosInternos ? ` <span style="opacity:.65">(no incluye ${fmt(totalMovimientosInternos)} en retiros/transferencias — eso no sale del negocio)</span>` : ''}</div></div>
    </div>
    <div class="stat-grid" style="margin-bottom:18px">
      <div class="stat"><div class="n ${balance >= 0 ? 'pos' : 'neg'}">${fmt(balance)}</div><div class="l">Balance real del mes (cobrado − gastos − finca)</div></div>
      <div class="stat"><div class="n pos">${fmt(facturadoMaquila)}</div><div class="l">Dinero de maquila este mes (${maquilaMes.length} orden${maquilaMes.length===1?'':'es'}, ya incluido arriba)</div></div>
      <div class="stat"><div class="n">${librasVendidas.toFixed(1)}</div><div class="l">Libras de café vendidas este mes (todas las presentaciones)</div></div>
    </div>

    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px">
      <button class="sec-btn" style="padding:7px 14px;font-size:12.5px" onclick="document.getElementById('res-comportamiento').scrollIntoView({behavior:'smooth'})">↓ Comportamiento</button>
      <button class="sec-btn" style="padding:7px 14px;font-size:12.5px" onclick="document.getElementById('res-margen').scrollIntoView({behavior:'smooth'})">↓ Margen por lote</button>
      <button class="sec-btn" style="padding:7px 14px;font-size:12.5px" onclick="document.getElementById('res-clientes').scrollIntoView({behavior:'smooth'})">↓ Mejores clientes</button>
      <button class="sec-btn" style="padding:7px 14px;font-size:12.5px" onclick="document.getElementById('res-balance').scrollIntoView({behavior:'smooth'})">↓ Balance de cuentas</button>
      <button class="sec-btn" style="padding:7px 14px;font-size:12.5px" onclick="document.getElementById('res-detalle').scrollIntoView({behavior:'smooth'})">↓ Detalle del mes</button>
    </div>

    <h3 class="section-title" id="res-comportamiento" style="margin-top:0">Comportamiento en el tiempo</h3>
    <div class="rangos">
      ${[[1,'1 mes'],[3,'3 meses'],[6,'6 meses'],[12,'1 año']].map(([n,l]) =>
        `<button class="${rangoMeses===n?'active':''}" onclick="cambiarRango(${n})">${l}</button>`).join('')}
    </div>
    <div class="chart-card">
      <h4>Ingresos cobrados vs. egresos</h4>
      <div class="chart-box"><canvas id="chartFlujo"></canvas></div>
    </div>
    <div class="chart-card">
      <h4>Egresos por categoría</h4>

/* ================================================================

================================================================ */
let rangoMeses = 6;
const graficos = {};
