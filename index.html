<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<meta name="theme-color" content="#FCFBF9">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --crema: #FCFBF9;
    --crema-alt: #F1EAE0;
    --cafe: #3E2723;
    --cafe-soft: #8A7A70;
    --verde: #4A6B48;
    --verde-bg: #E7EDE3;
    --terracota: #AD4B31;
    --terracota-bg: #F6E3DA;
    --azul: #3E6B8A;
    --azul-bg: #E2ECF2;
    --linea: #E3D9CC;
    --blanco: #FFFFFF;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--crema);
    color: var(--cafe);
    font-family: 'Outfit', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    font-size: 16px; line-height: 1.5;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 18px 14px 70px; }

  /* ---------- Pantalla de acceso ---------- */
  #lockScreen {
    position: fixed; inset: 0; background: var(--cafe);
    display: flex; align-items: center; justify-content: center;
    z-index: 100; padding: 20px;
  }
  #lockScreen .box {
    background: var(--crema); border-radius: 14px; padding: 32px 26px;
    max-width: 320px; width: 100%; text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,.35);
  }
  #lockScreen h1 { font-size: 22px; font-weight: 700; margin: 0 0 4px; }
  #lockScreen p { font-size: 13px; color: var(--cafe-soft); margin: 0 0 18px; }
  #lockScreen input {
    width: 100%; padding: 12px 14px; border-radius: 8px; border: 1px solid var(--linea);
    font-family: 'Outfit', sans-serif; font-size: 15px; margin-bottom: 10px; text-align: center;
  }
  #lockScreen button {
    width: 100%; padding: 12px; border: none; border-radius: 8px; background: var(--cafe);
    color: #fff; font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 14px; cursor: pointer;
  }
  #lockScreen .err { color: var(--terracota); font-size: 12.5px; min-height: 16px; margin-top: 8px; }

  #app { display: none; }

  /* ---------- Encabezado ---------- */
  header.top {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    position: sticky; top: 0; z-index: 20; background: var(--crema);
    padding: 12px 14px; margin: -18px -14px 14px; border-bottom: 1px solid var(--linea);
    box-shadow: 0 2px 10px rgba(62,39,35,.04);
  }
  header.top .mark {
    display: inline-flex; align-items: center; background: var(--blanco);
    border-radius: 50%; border: 1px solid var(--linea); overflow: hidden;
    width: 44px; height: 44px;
  }
  header.top .mark img { width: 100%; height: 100%; object-fit: cover; display: block; }
  header.top .sub { font-size: 11px; color: var(--cafe-soft); margin-top: 3px; }
  .top-actions { display: flex; gap: 8px; align-items: center; }
  .sync-indicator {
    display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; font-weight: 600;
    color: var(--verde); background: var(--verde-bg); padding: 4px 8px; border-radius: 12px;
  }
  .sync-dot { width: 6px; height: 6px; background: var(--verde); border-radius: 50%; }
  .btn-export {
    background: none; border: 1px solid var(--cafe); color: var(--cafe); font-size: 11px; font-weight: 600;
    padding: 6px 10px; border-radius: 6px; cursor: pointer; font-family: 'Outfit', sans-serif;
  }
  .btn-export:hover { background: var(--cafe); color: #fff; }
  .btn-campana {
    position: relative; background: var(--blanco); border: 1px solid var(--linea); font-size: 15px;
    padding: 6px 9px; border-radius: 8px; cursor: pointer;
  }
  .campana-badge {
    position: absolute; top: -6px; right: -6px; background: var(--terracota); color: #fff;
    font-size: 10px; font-weight: 800; min-width: 17px; height: 17px; border-radius: 9px;
    display: flex; align-items: center; justify-content: center; padding: 0 4px;
  }

  /* ---------- Alerta de stock ---------- */
  #stockAlert {
    display: none; background: var(--terracota-bg); border: 1px solid var(--terracota);
    color: var(--terracota); border-radius: 8px; padding: 10px 12px; font-size: 12.5px;
    font-weight: 600; margin-bottom: 14px;
  }
  #exportReminder {
    display: none; background: var(--crema-alt); border: 1px solid var(--linea);
    color: var(--cafe-soft); border-radius: 8px; padding: 10px 12px; font-size: 12.5px;
    font-weight: 600; margin-bottom: 14px; display: none; align-items: center; justify-content: space-between; gap: 8px;
  }
  #exportReminder button { font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 11.5px; background: var(--cafe); color: #fff; border: none; border-radius: 20px; padding: 6px 12px; cursor: pointer; flex: 0 0 auto; }
  #envioAlert {
    display: none; background: var(--azul-bg); border: 1px solid var(--azul);
    color: var(--azul); border-radius: 8px; padding: 10px 12px; font-size: 12.5px;
    font-weight: 600; margin-bottom: 14px; cursor: pointer;
  }

  /* ---------- Controles globales ---------- */
  .controles-globales { display: flex; gap: 8px; margin-bottom: 14px; }
  .controles-globales input[type="month"] {
    flex: 0 0 160px; padding: 12px 12px; border: 1px solid var(--linea); border-radius: 10px;
    font-family: 'Outfit', sans-serif; font-size: 15px; background: var(--blanco); color: var(--cafe);
  }
  .controles-globales input[type="search"] {
    flex: 1; padding: 12px 12px; border: 1px solid var(--linea); border-radius: 10px;
    font-family: 'Outfit', sans-serif; font-size: 15px; background: var(--blanco);
  }

  /* ---------- Pestañas ---------- */
  nav.tabs {
    display: flex; overflow-x: auto; margin-bottom: 16px; gap: 6px; padding-bottom: 2px;
    -ms-overflow-style: none; scrollbar-width: none;
  }
  nav.tabs::-webkit-scrollbar { display: none; }
  nav.tabs button {
    flex: 0 0 auto; background: var(--blanco); border: 1px solid var(--linea); font-family: 'Outfit', sans-serif;
    font-size: 14.5px; font-weight: 600; color: var(--cafe-soft); padding: 11px 18px; cursor: pointer;
    border-radius: 30px; white-space: nowrap; transition: background .15s, color .15s;
  }
  nav.tabs button.active { color: #fff; background: var(--cafe); border-color: var(--cafe); }

  .subtabs { display: flex; gap: 6px; margin-bottom: 10px; }
  .subtabs button {
    flex: 1; background: var(--crema-alt); border: 1px solid var(--linea); color: var(--cafe-soft);
    font-family: 'Outfit', sans-serif; font-size: 14px; font-weight: 700; padding: 12px 6px;
    border-radius: 8px; cursor: pointer;
  }
  .subtabs button.active { background: var(--cafe); color: #fff; border-color: var(--cafe); }

  section.view { display: none; }
  section.view.active { display: block; }

  /* ---------- Tarjetas / formularios ---------- */
  .card {
    background: var(--blanco); border: 1px solid var(--linea); border-radius: 18px;
    padding: 20px; margin-bottom: 22px; box-shadow: 0 3px 14px rgba(62,39,35,.05);
  }
  .row { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .row:last-child { margin-bottom: 0; }
  .field { flex: 1; min-width: 120px; display: flex; flex-direction: column; gap: 3px; }
  .field label { font-size: 13px; color: var(--cafe-soft); font-weight: 600; letter-spacing: .01em; }
  .field input, .field select {
    font-family: 'Outfit', sans-serif; font-size: 16px; padding: 11px 12px; border: 1px solid var(--linea);
    border-radius: 6px; background: var(--blanco); color: var(--cafe); width: 100%;
  }
  .field input:focus, .field select:focus { outline: 2px solid var(--cafe); outline-offset: -1px; }

  .quick-add { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .quick-add button {
    font-family: 'Outfit', sans-serif; font-size: 14px; font-weight: 600; background: var(--verde-bg);
    color: var(--verde); border: 1px solid var(--verde); border-radius: 20px; padding: 10px 16px; cursor: pointer;
  }
  .quick-add button:hover { background: var(--verde); color: #fff; }

  .servicios-maquila { display: flex; flex-direction: column; gap: 0; margin: 8px 0; }
  .servicios-maquila .srow {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    font-size: 13.5px; font-weight: 600; padding: 9px 2px; border-bottom: 1px solid var(--linea);
  }
  .servicios-maquila .srow input[type="number"] { width: 100px; flex: 0 0 auto; }
  .servicios-maquila .srow-pres select { flex: 1; min-width: 0; padding: 7px 8px; border: 1px solid var(--linea); border-radius: 6px; font-family: 'Outfit', sans-serif; font-size: 13px; }
  .servicios-maquila .srow-pres input[type="number"] { width: 70px; }

  button.add-btn {
    font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 16px; background: var(--terracota);
    color: #fff; border: none; border-radius: 30px; padding: 16px 18px; cursor: pointer; width: 100%;
    box-shadow: 0 4px 14px rgba(173,75,49,.28);
  }
  button.add-btn:hover { background: #93402a; }
  button.add-btn:disabled { opacity: .55; cursor: not-allowed; box-shadow: none; }
  button.sec-btn {
    font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 14px; background: var(--blanco);
    border: 1px solid var(--cafe); color: var(--cafe); padding: 10px 16px; border-radius: 30px; cursor: pointer;
  }
  button.sec-btn:hover { background: var(--cafe); color: #fff; }

  /* ---------- Listas tipo libro ---------- */
  .ledger { border-top: 1px solid var(--linea); }
  .ledger-row {
    display: flex; align-items: center; gap: 12px; padding: 15px 4px; border-bottom: 1px solid var(--linea);
    font-size: 15.5px;
  }
  .ledger-row.deuda-anterior { background: var(--terracota-bg); border-radius: 6px; padding: 11px 8px; margin-bottom: 4px; border-bottom: none; }
  .ledger-row .main { flex: 1; min-width: 0; }
  .ledger-row .main .title { font-weight: 700; }
  .ledger-row .main .meta { font-size: 13px; color: var(--cafe-soft); margin-top: 3px; }
  .ledger-row .main .details { font-size: 13px; color: var(--cafe); margin-top: 2px; font-style: italic; opacity: .8; }
  .ledger-row .amount { font-weight: 700; font-size: 16.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .ledger-row .amount.pos { color: var(--verde); }
  .ledger-row .amount.neg { color: var(--terracota); }
  .ledger-row .acciones { display: flex; gap: 6px; align-items: center; }
  .ledger-row .acciones button {
    background: var(--crema-alt); border: 1px solid var(--linea); color: var(--cafe);
    font-size: 16px; cursor: pointer; padding: 7px 10px; border-radius: 8px;
    min-width: 38px; min-height: 38px; display: inline-flex; align-items: center; justify-content: center;
  }
  .ledger-row .acciones button:hover, .ledger-row .acciones button:active { background: var(--terracota); color: #fff; border-color: var(--terracota); }

  .tag { display: inline-block; font-size: 12.5px; font-weight: 700; padding: 5px 12px; border-radius: 20px; cursor: pointer; border: none; }
  .tag.pendiente { background: #F2E2C4; color: #8A6A1F; }
  .tag.pagado { background: var(--verde-bg); color: var(--verde); }
  .tag.envio-pendiente { background: var(--azul-bg); color: var(--azul); }
  .tag.envio-enviado { background: var(--verde-bg); color: var(--verde); }
  .badge-web {
    display: inline-block; background: var(--azul-bg); color: var(--azul);
    font-size: 10.5px; font-weight: 800; padding: 2px 8px; border-radius: 10px; vertical-align: middle;
  }
  .ledger-row.envio-pendiente:not(.deuda-anterior) { background: var(--azul-bg); border-radius: 6px; padding: 11px 8px; margin-bottom: 4px; border-bottom: none; }

  .empty { text-align: center; color: var(--cafe-soft); font-size: 15px; padding: 32px 12px; }

  h3.section-title { font-size: 18px; font-weight: 700; margin: 22px 0 10px; }

  /* ---------- Inventario ---------- */
  .lote-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 18px; }
  .lote-card {
    background: var(--blanco); border: 1px solid var(--linea); border-radius: 18px; padding: 16px;
    box-shadow: 0 3px 14px rgba(62,39,35,.05); text-align: center;
  }
  .lote-card .icono {
    width: 46px; height: 46px; border-radius: 50%; background: var(--verde-bg); color: var(--verde);
    display: flex; align-items: center; justify-content: center; font-size: 20px; margin: 0 auto 8px;
  }
  .lote-card.bajo { background: var(--terracota-bg); border-color: var(--terracota); }
  .lote-card.bajo .icono { background: var(--terracota); color: #fff; }
  .lote-card .nombre { font-weight: 700; font-size: 14px; }
  .lote-card .stock { font-size: 20px; font-weight: 800; margin-top: 2px; }
  .lote-card.bajo .stock { color: var(--terracota); }
  .lote-card button.sec-btn { margin-top: 10px; width: 100%; }

  /* ---------- Resumen ---------- */
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 18px; }
  .stat { background: var(--blanco); border: 1px solid var(--linea); border-radius: 14px; padding: 16px 18px; box-shadow: 0 3px 14px rgba(62,39,35,.05); }
  .stat .n { font-weight: 800; font-size: 23px; }
  .stat .n.pos { color: var(--verde); } .stat .n.neg { color: var(--terracota); }
  .stat .l { font-size: 13px; color: var(--cafe-soft); margin-top: 4px; }
  .bar-row { display: flex; align-items: center; gap: 8px; font-size: 12.5px; margin-bottom: 6px; }
  .bar-row .lbl { flex: 0 0 90px; }
  .bar-track { flex: 1; background: var(--crema-alt); border-radius: 6px; height: 14px; overflow: hidden; }
  .bar-fill { background: var(--terracota); height: 100%; border-radius: 6px; }
  .bar-row .val { flex: 0 0 90px; text-align: right; font-weight: 600; }

  /* ---------- Config / Maquila ---------- */
  .tarifa-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--linea); }
  .tarifa-row .nombre { flex: 1; font-weight: 600; font-size: 14px; }
  .tarifa-row input { width: 110px; padding: 7px 9px; border: 1px solid var(--linea); border-radius: 6px; font-family: 'Outfit', sans-serif; }
  .tarifa-row button { flex: 0 0 auto; }







  /* ---------- Panel de rendimientos aprendidos ---------- */
  .rend-card {
    background: var(--blanco); border: 1px solid var(--linea); border-radius: 14px;
    padding: 18px; margin-bottom: 18px; box-shadow: 0 3px 14px rgba(62,39,35,.05);
  }
  .rend-card h4 { margin: 0 0 4px; font-size: 16px; font-weight: 700; }
  .rend-intro { font-size: 13px; color: var(--cafe-soft); margin: 0 0 14px; }
  .rend-fila { padding: 11px 0; border-top: 1px solid var(--linea); }
  .rend-nombre { font-size: 14.5px; font-weight: 700; }
  .rend-valor { font-size: 21px; font-weight: 800; color: var(--cafe-soft); margin: 2px 0; }
  .rend-valor.aprendido { color: var(--verde); }
  .rend-estado { font-size: 12.5px; color: var(--cafe-soft); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .badge-real { background: var(--verde); color: #fff; font-size: 11px; font-weight: 800; padding: 3px 9px; border-radius: 20px; }
  .badge-gen { background: var(--crema-alt); color: var(--cafe-soft); font-size: 11px; font-weight: 800; padding: 3px 9px; border-radius: 20px; }

  /* ---------- Cadena de proyección del café ---------- */
  .preview-cadena:not(:empty) {
    background: var(--verde-bg); border: 1px solid var(--verde); border-radius: 12px;
    padding: 12px 14px; margin: 4px 0 12px;
  }
  .cadena { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 14px; color: var(--verde); }
  .cadena b { font-size: 16px; }
  .cadena i { font-style: normal; opacity: .5; font-weight: 700; }
  .cadena .destacado { background: var(--verde); color: #fff; padding: 3px 12px; border-radius: 20px; }
  .cadena-nota { font-size: 12.5px; color: var(--verde); margin-top: 8px; font-weight: 600; opacity: .85; }
  .cadena-nota.alerta { color: var(--terracota); opacity: 1; }

  /* ---------- Tabla de mejores clientes ---------- */
  .tabla-clientes { background: var(--blanco); border: 1px solid var(--linea); border-radius: 14px; overflow: hidden; margin-bottom: 16px; }
  .fila-cliente {
    display: grid; grid-template-columns: 1.6fr .7fr 1.1fr .9fr; gap: 8px;
    padding: 12px 14px; border-bottom: 1px solid var(--linea); font-size: 14px; align-items: center;
  }
  .fila-cliente:last-child { border-bottom: none; }
  .fila-cliente.encabezado { background: var(--crema-alt); font-size: 12.5px; font-weight: 700; color: var(--cafe-soft); }
  .fila-cliente .nombre { font-weight: 700; overflow: hidden; text-overflow: ellipsis; }
  .fila-cliente .dinero { font-weight: 700; color: var(--verde); font-variant-numeric: tabular-nums; }

  /* ---------- Autocompletado de clientes ---------- */
  .autocomplete-wrap { position: relative; }
  .sugerencias {
    position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 40;
    background: var(--blanco); border: 1px solid var(--linea); border-radius: 12px;
    box-shadow: 0 10px 30px rgba(62,39,35,.16); max-height: 280px; overflow-y: auto;
  }
  .sugerencias button {
    display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
    width: 100%; text-align: left; background: none; border: none;
    border-bottom: 1px solid var(--linea); padding: 11px 14px; cursor: pointer;
    font-family: 'Outfit', sans-serif;
  }
  .sugerencias button:last-child { border-bottom: none; }
  .sugerencias button:hover { background: var(--crema-alt); }
  .sugerencias .sug-nombre { font-size: 15px; font-weight: 700; color: var(--cafe); }
  .sugerencias .sug-detalle { font-size: 12.5px; color: var(--cafe-soft); font-weight: 600; }

  /* ---------- Órdenes en paralelo ---------- */
  .orden-card { margin-bottom: 22px; }
  .orden-tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 12px; margin-bottom: 12px; border-bottom: 1px solid var(--linea); -webkit-overflow-scrolling: touch; }
  .orden-tabs button {
    flex: 0 0 auto; position: relative; background: var(--crema-alt); border: 1px solid var(--linea); color: var(--cafe-soft);
    font-family: 'Outfit', sans-serif; font-size: 13px; font-weight: 700; cursor: pointer;
    padding: 9px 14px; border-radius: 20px; white-space: nowrap;
  }
  .orden-tabs button.active { background: var(--cafe); color: #fff; border-color: var(--cafe); }
  .orden-tabs button.add-orden { background: var(--verde-bg); color: var(--verde); border-color: var(--verde); font-size: 18px; font-weight: 800; padding: 9px 16px; }
  .orden-tabs .badge {
    display: inline-flex; align-items: center; justify-content: center; margin-left: 6px;
    background: var(--terracota); color: #fff; font-size: 10.5px; font-weight: 800;
    min-width: 17px; height: 17px; border-radius: 9px; padding: 0 4px;
  }
  .orden-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
  .cerrar-orden {
    flex: 0 0 auto; background: none; border: 1px solid var(--linea); color: var(--cafe-soft);
    font-family: 'Outfit', sans-serif; font-size: 13px; font-weight: 600;
    padding: 7px 14px; border-radius: 20px; cursor: pointer;
  }
  .cerrar-orden:hover { background: var(--terracota-bg); color: var(--terracota); border-color: var(--terracota); }

  .cliente-hint {
    font-size: 12.5px; font-weight: 600; color: var(--verde);
    background: var(--verde-bg); border-radius: 8px; padding: 6px 10px; margin-top: 5px;
  }

  /* ---------- Toasts ---------- */
  #toastWrap {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: 22px;
    z-index: 200; display: flex; flex-direction: column; gap: 8px; align-items: center;
    pointer-events: none; width: calc(100% - 28px); max-width: 420px;
  }
  .toast {
    background: var(--cafe); color: #fff; padding: 14px 18px; border-radius: 12px;
    font-size: 15px; font-weight: 600; box-shadow: 0 8px 28px rgba(62,39,35,.28);
    width: 100%; text-align: center; animation: toastIn .18s ease-out;
  }
  .toast.error { background: var(--terracota); }
  @keyframes toastIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  /* ---------- Gráficos ---------- */
  .chart-card {
    background: var(--blanco); border: 1px solid var(--linea); border-radius: 14px;
    padding: 16px 14px; margin-bottom: 16px; box-shadow: 0 3px 14px rgba(62,39,35,.05);
  }
  .chart-card h4 { margin: 0 0 12px; font-size: 15px; font-weight: 700; }
  .chart-box { position: relative; height: 240px; }

  /* ---------- Selector de rango ---------- */
  .rangos { display: flex; gap: 6px; margin-bottom: 16px; }
  .rangos button {
    flex: 1; background: var(--blanco); border: 1px solid var(--linea); color: var(--cafe-soft);
    font-family: 'Outfit', sans-serif; font-size: 13.5px; font-weight: 700; padding: 11px 4px;
    border-radius: 10px; cursor: pointer;
  }
  .rangos button.active { background: var(--verde); color: #fff; border-color: var(--verde); }

  /* ---------- Paginación ---------- */
  .paginacion { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 14px 0 4px; flex-wrap: wrap; }
  .paginacion button {
    background: var(--blanco); border: 1px solid var(--linea); color: var(--cafe);
    font-family: 'Outfit', sans-serif; font-size: 14px; font-weight: 700;
    padding: 9px 16px; border-radius: 20px; cursor: pointer;
  }
  .paginacion button:disabled { opacity: .4; cursor: not-allowed; }
  .paginacion .pag-info { font-size: 13.5px; color: var(--cafe-soft); font-weight: 600; }
  .paginacion .pag-select {
    background: var(--blanco); border: 1px solid var(--linea); color: var(--cafe);
    font-family: 'Outfit', sans-serif; font-size: 13.5px; font-weight: 600;
    padding: 9px 10px; border-radius: 20px; cursor: pointer; max-width: 45vw;
  }
  .pag-total { text-align: center; font-size: 12px; color: var(--cafe-soft); font-weight: 600; padding-bottom: 8px; }

  /* ---------- Modal edición ---------- */
  #modalOverlay {
    display: none; position: fixed; inset: 0; background: rgba(62,39,35,.45); z-index: 90;
    align-items: flex-end; justify-content: center;
  }
  #modalOverlay.show { display: flex; }
  #modalBox {
    background: var(--crema); width: 100%; max-width: 480px; border-radius: 16px 16px 0 0;
    padding: 20px 16px 24px; max-height: 85vh; overflow-y: auto;
  }
  #modalBox h3 { margin: 0 0 12px; font-size: 16px; }
  .modal-actions { display: flex; gap: 8px; margin-top: 14px; }
  .modal-actions button.add-btn { flex: 1; }

  @media (min-width: 480px) {
    #modalOverlay { align-items: center; }
    #modalBox { border-radius: 16px; }
  }
</style>
</head>

<div id="lockScreen">
  <div class="box">
    <img id="logoLock" src="">
    <p>Gestión integral — acceso del equipo</p>
    <input type="email" id="loginEmail" placeholder="Correo" autocomplete="username" autofocus>
    <input type="password" id="loginPassword" placeholder="Contraseña" autocomplete="current-password" style="margin-top:8px">
    <button onclick="iniciarSesion()" id="btnLogin">Entrar</button>
    <div class="err" id="lockErr"></div>
  </div>
</div>

<div id="app">
<div class="wrap">

  <header class="top">
    <div>
      <div class="mark"><img id="logoHeader" src="" alt="Café Pandora"></div>
      <div class="sub">Gestión integral</div>
    </div>
    <div class="top-actions" style="flex-direction:column;align-items:flex-end;gap:4px">
      <span class="sync-indicator" id="syncIndicator"><span class="sync-dot"></span> Sincronizado</span>
      <button class="btn-campana" onclick="abrirPedidosWeb()" id="btnCampana">🔔<span id="campanaBadge" class="campana-badge" style="display:none">0</span></button>
      <button class="btn-export" onclick="exportarExcel()">Exportar</button>
      <button class="btn-campana" onclick="cerrarSesion()" title="Cerrar sesión">🚪</button>
    </div>
  </header>

  <div id="stockAlert"></div>
  <div id="exportReminder"></div>
  <div id="envioAlert"></div>

  <div class="controles-globales">
    <input type="month" id="filtroMes">
    <input type="search" id="filtroBusqueda" placeholder="Buscar cliente, lote, concepto…">
  </div>

  <nav class="tabs">
    <button data-tab="ventas" class="active">Ventas</button>
    <button data-tab="maquila">Maquila</button>
    <button data-tab="inventario">Inventario Tostado</button>
    <button data-tab="gastos">Gastos</button>
    <button data-tab="resumen">Resumen</button>
    <button type="button" onclick="abrirMasTabs()">⋯ Más</button>
  </nav>

  <section class="view active" id="view-ventas"></section>
  <section class="view" id="view-maquila"></section>
  <section class="view" id="view-inventario"></section>
  <section class="view" id="view-gastos"></section>
  <section class="view" id="view-finca"></section>
  <section class="view" id="view-trazabilidad"></section>
  <section class="view" id="view-resumen"></section>
  <section class="view" id="view-config"></section>

</div>
</div>

<div id="toastWrap"></div>

<div id="modalOverlay">
  <div id="modalBox"></div>
</div>

/* ---------- Cadena del café: cereza -> pergamino -> verde -> tostado ----------
   Factores aproximados de Café Pandora. Si con el tiempo ves que tu finca
   rinde distinto, se cambian aquí (o pídeme que los haga editables desde
   Configuración). */
const RENDIMIENTO = {
  cerezaAPergamino: 12.5 / 60,  // 60 kg de cereza dan ~12,5 kg de pergamino seco
  pergaminoAVerde: 10.4 / 12.5, // al trillar, de 12,5 kg salen ~10,4 kg de verde
  mermaTueste: 0.13,            // el tueste pierde ~13% del peso
};
const KG_POR_LIBRA_VENTA = 0.5; // la "libra" de Café Pandora son 500 g exactos

// Días aproximados de secado desde la cosecha, según el proceso.
const DIAS_SECADO = { Lavado: 7, Honey: 21, Natural: 35, Exotico: 35 };

/* ---------- Rendimientos aprendidos de tus propios datos ----------
   Los factores de arriba son el punto de partida genérico. A medida que
   pesas pergamino real, verde real tras trillar, y registras tuestes, la app
   calcula el rendimiento VERDADERO de Café Pandora y lo usa para proyectar.
   Hace falta un mínimo de registros para que el promedio signifique algo. */
const MIN_MUESTRAS = { cerezaAPergamino: 2, pergaminoAVerde: 2, mermaTueste: 3 };

function rendimientosReales() {
  // 1) Cereza -> pergamino: cosechas donde ya pesaste el pergamino.
  const conPergamino = state.cosechas.filter(c => c.kilosPergaminoReal > 0 && c.kilosCereza > 0);
  const cerezaTotal = conPergamino.reduce((s, c) => s + Number(c.kilosCereza), 0);
  const pergaminoTotal = conPergamino.reduce((s, c) => s + Number(c.kilosPergaminoReal), 0);

  // 2) Pergamino -> verde: cosechas y compras donde anotaste el verde tras trillar.
  const trilladas = [
    ...state.cosechas.filter(c => c.kilosVerdeReal > 0 && c.kilosPergaminoReal > 0)
      .map(c => ({ entra: Number(c.kilosPergaminoReal), sale: Number(c.kilosVerdeReal) })),
    ...state.pergamino.filter(p => p.kilosVerdeReal > 0 && p.kilosPergamino > 0)
      .map(p => ({ entra: Number(p.kilosPergamino), sale: Number(p.kilosVerdeReal) })),
  ];
  const pergEntra = trilladas.reduce((s, t) => s + t.entra, 0);
  const verdeSale = trilladas.reduce((s, t) => s + t.sale, 0);

  // 3) Merma de tueste: de los tuestes ya registrados.
  const tuestesValidos = state.tuestes.filter(t => t.kilosVerde > 0 && t.kilosTostado > 0);
  const verdeEntra = tuestesValidos.reduce((s, t) => s + Number(t.kilosVerde), 0);
  const tostadoSale = tuestesValidos.reduce((s, t) => s + Number(t.kilosTostado), 0);

  const armar = (clave, n, valor, generico) => ({
    valor: n >= MIN_MUESTRAS[clave] && valor > 0 ? valor : generico,
    generico,
    real: n >= MIN_MUESTRAS[clave] && valor > 0 ? valor : null,
    muestras: n,
    faltan: Math.max(0, MIN_MUESTRAS[clave] - n),
  });

  return {
    cerezaAPergamino: armar('cerezaAPergamino', conPergamino.length,
      cerezaTotal > 0 ? pergaminoTotal / cerezaTotal : 0, RENDIMIENTO.cerezaAPergamino),
    pergaminoAVerde: armar('pergaminoAVerde', trilladas.length,
      pergEntra > 0 ? verdeSale / pergEntra : 0, RENDIMIENTO.pergaminoAVerde),
    mermaTueste: armar('mermaTueste', tuestesValidos.length,
      verdeEntra > 0 ? 1 - tostadoSale / verdeEntra : 0, RENDIMIENTO.mermaTueste),
  };
}

// Proyecta toda la cadena a partir de kilos de cereza recién cosechada.
function proyectarDesdeCereza(kilosCereza) {
  const r = rendimientosReales();
  const pergamino = (Number(kilosCereza) || 0) * r.cerezaAPergamino.valor;
  return { pergamino, ...proyectarDesdePergamino(pergamino) };
}
// Proyecta desde pergamino (sirve igual para el café comprado).
function proyectarDesdePergamino(kilosPergamino) {
  const r = rendimientosReales();
  const verde = (Number(kilosPergamino) || 0) * r.pergaminoAVerde.valor;
  const tostado = verde * (1 - r.mermaTueste.valor);
  return { verde, tostado, libras: tostado / KG_POR_LIBRA_VENTA };
}

/* ---------- Directorio de clientes ----------
   Los nombres NO salen solo de la tabla "clientes" (que se llena al registrar
   ventas nuevas): se arman también con todos los nombres que aparecen en el
   historial de ventas, para que salga absolutamente todo el que ya compró. */
function listaClientes() {
  const mapa = new Map(); // clave normalizada -> { nombre, ventas: [] }
  const meter = (nombre) => {
    const clave = normalizar(nombre);
    if (!clave || GENERICOS_CLIENTE.includes(clave)) return null;
    if (!mapa.has(clave)) mapa.set(clave, { nombre: String(nombre).trim(), ventas: [] });
    return mapa.get(clave);
  };
  // El nombre "oficial" lo manda la tabla clientes; las ventas aportan el resto.
  state.clientes.forEach(c => meter(c.nombre));
  state.ventas.forEach(v => { const e = meter(v.cliente); if (e) e.ventas.push(v); });

  return [...mapa.values()].map(e => {
    const ordenadas = e.ventas.slice().sort((a, b) => b.ts - a.ts);
    const total = ordenadas.reduce((s, v) => s + (Number(v.valor) || 0), 0);
    return {
      nombre: e.nombre,
      compras: ordenadas.length,
      total,
      promedio: ordenadas.length ? total / ordenadas.length : 0,
      ultima: ordenadas[0] || null,
    };
  }).sort((a, b) => b.compras - a.compras || a.nombre.localeCompare(b.nombre));
}

// Directorio SEPARADO para maquila: solo mira las órdenes de maquila, nunca
// las ventas de café ni la tabla "clientes" — son audiencias distintas
// (quien trae su propio café a maquilar no tiene por qué mezclarse con
// quien te compra café ya tostado).
function listaClientesMaquila() {
  const mapa = new Map();
  const meter = (nombre) => {
    const clave = normalizar(nombre);
    if (!clave || GENERICOS_CLIENTE.includes(clave)) return null;
    if (!mapa.has(clave)) mapa.set(clave, { nombre: String(nombre).trim(), ordenes: [] });
    return mapa.get(clave);
  };
  state.ordenesMaquila.forEach(o => { const e = meter(o.cliente); if (e) e.ordenes.push(o); });
  return [...mapa.values()].map(e => ({
    nombre: e.nombre,
    compras: e.ordenes.length,
  })).sort((a, b) => b.compras - a.compras || a.nombre.localeCompare(b.nombre));
}
function nombreCanonicoMaquila(nombre) {
  const clave = normalizar(nombre);
  if (!clave) return String(nombre || '').trim();
  const existente = listaClientesMaquila().find(c => normalizar(c.nombre) === clave);
  return existente ? existente.nombre : String(nombre || '').trim();
}

// Todas las variantes literales (distinta mayúscula/tilde) guardadas para un
// mismo cliente — se necesitan TODAS para poder actualizarlas de una vez.
function variantesDeCliente(nombre) {
  const clave = normalizar(nombre);
  const set = new Set();
  state.clientes.forEach(c => { if (normalizar(c.nombre) === clave) set.add(c.nombre); });
  state.ventas.forEach(v => { if (normalizar(v.cliente) === clave) set.add(v.cliente); });
  return [...set];
}

/* ---------- Memoria por cliente ----------
   Si un cliente ya compró antes, casi siempre le vuelve a pagar a la misma
   persona. Buscamos su compra más reciente y proponemos ese mismo método. */
const normalizar = s => String(s || '').trim().toLowerCase()
  .normalize('NFD').replace(/[\u0300-\u036f]/g, '');

function ultimaVentaDeCliente(nombre) {
  const clave = normalizar(nombre);
  if (!clave) return null;
  return state.ventas
    .filter(v => normalizar(v.cliente) === clave)
    .sort((a, b) => b.ts - a.ts)[0] || null;
}

// Busca, entre TODAS las compras de café de ese cliente (no solo la venta
// más reciente, que puede haber sido solo maquila), la última línea de café
// que pidió — para sugerir sola su molienda y tostión habituales.
function ultimaPreferenciaCafe(nombre) {
  const clave = normalizar(nombre);
  if (!clave) return null;
  const candidatos = [];
  state.ventas.filter(v => normalizar(v.cliente) === clave).forEach(v => {
    if (v.items && v.items.length && v.items[0] && v.items[0].tipo) {
      v.items.filter(it => it.tipo === 'cafe').forEach(it => candidatos.push({ ...it, ts: v.ts }));
    } else if (v.lote) {
      candidatos.push({ lote: v.lote, molienda: null, tueste: null, ts: v.ts });
    }
  });
  candidatos.sort((a, b) => b.ts - a.ts);
  return candidatos[0] || null;
}

// Devuelve el nombre tal como quedó guardado la primera vez, para que
// "juan perez", "Juan Perez" y "JUAN PÉREZ" no se conviertan en 3 clientes.
function nombreCanonico(nombre) {
  const clave = normalizar(nombre);
  if (!clave) return String(nombre || '').trim();
  const existente = listaClientes().find(c => normalizar(c.nombre) === clave);
  return existente ? existente.nombre : String(nombre || '').trim();
}

// Se dispara al salir del campo de cliente: normaliza el nombre y precarga
// el método de pago, el tipo de cliente, y su molienda/tostión habituales.
function autocompletarDesdeCliente() {
  const input = document.getElementById('v-cliente');
  if (!input || !input.value.trim()) return;
  const canonico = nombreCanonico(input.value);
  if (canonico !== input.value) input.value = canonico;

  const ultima = ultimaVentaDeCliente(canonico);
  const prefCafe = ultimaPreferenciaCafe(canonico);
  if (!ultima && !prefCafe) return;

  if (ultima) {
    const selMetodo = document.getElementById('v-metodo');
    if (selMetodo && ultima.metodo && METODOS_PAGO.includes(ultima.metodo)) selMetodo.value = ultima.metodo;

    const selTipo = document.getElementById('v-tipoCliente');
    if (selTipo && ultima.tipoCliente && TIPOS_CLIENTE.includes(ultima.tipoCliente)) {
      const cambio = selTipo.value !== ultima.tipoCliente;
      selTipo.value = ultima.tipoCliente;
      if (cambio) recalcularLinea();
    }
  }

  const detallesHint = [];
  if (ultima) detallesHint.push('pagó con ' + (ultima.metodo || 'método sin registrar'));
  if (prefCafe) {
    const selMolienda = document.getElementById('ln-molienda');
    if (selMolienda && prefCafe.molienda && MOLIENDAS.includes(prefCafe.molienda)) selMolienda.value = prefCafe.molienda;
    const selTueste = document.getElementById('ln-tueste');
    if (selTueste && prefCafe.tueste && TUESTES_LAVADO.includes(prefCafe.tueste)) selTueste.value = prefCafe.tueste;
    const gustos = [prefCafe.molienda, prefCafe.tueste ? 'Tostión ' + prefCafe.tueste : null].filter(Boolean).join(', ');
    if (gustos) detallesHint.push('suele pedir ' + gustos);
  }

  const aviso = document.getElementById('clienteHint');
  if (aviso && detallesHint.length) {
    aviso.style.display = 'block';
    aviso.textContent = 'Cliente conocido · ' + detallesHint.join(' · ');
  }
}

const POR_PAGINA = 8;
const paginas = { ventas: 1, gastos: 1, finca: 1, resumen: 1, cosechas: 1, pergamino: 1, tuestes: 1, maquila: 1, ventasPorEnviar: 1, ventasPagadas: 1, ventasPorPagar: 1 };

// Corta una lista ya ordenada a la página actual y devuelve el HTML de las
// filas visibles más los controles de "Anterior / Siguiente".
function paginar(lista, clave, pintarFila, textoVacio) {
  if (!lista.length) return '<div class="empty">' + textoVacio + '</div>';
  const totalPaginas = Math.max(1, Math.ceil(lista.length / POR_PAGINA));
  if (paginas[clave] > totalPaginas) paginas[clave] = totalPaginas;
  const pag = paginas[clave];
  const visibles = lista.slice((pag - 1) * POR_PAGINA, pag * POR_PAGINA);
  const controles = totalPaginas > 1 ? `
    <div class="paginacion">
      <button onclick="cambiarPagina('${clave}', -1)" ${pag === 1 ? 'disabled' : ''}>‹ Anterior</button>
      <select class="pag-select" onchange="irAPagina('${clave}', this.value)">
        ${Array.from({ length: totalPaginas }, (_, i) => i + 1)
          .map(n => `<option value="${n}" ${n === pag ? 'selected' : ''}>Página ${n} de ${totalPaginas}</option>`).join('')}
      </select>
      <button onclick="cambiarPagina('${clave}', 1)" ${pag === totalPaginas ? 'disabled' : ''}>Siguiente ›</button>
    </div>
    <div class="pag-total">${lista.length} registros</div>` : '';
  return visibles.map(pintarFila).join('') + controles;
}

// Cambia de página sin saltar al inicio de la pantalla — recuerda dónde
// estabas parado y te deja ahí mismo después de repintar la lista.
function conservarScroll(cb) {
  const y = window.scrollY;
  cb();
  requestAnimationFrame(() => window.scrollTo(0, y));
}
function cambiarPagina(clave, delta) {
  conservarScroll(() => {
    paginas[clave] = Math.max(1, paginas[clave] + delta);
    renderTodo();
  });
}
function irAPagina(clave, numero) {
  conservarScroll(() => {
    paginas[clave] = Math.max(1, Number(numero) || 1);
    renderTodo();
  });
}

================================================================ */
const CACHE_KEYS = { ventas: 'cp_c_ventas', gastos: 'cp_c_gastos', clientes: 'cp_c_clientes', inventario: 'cp_c_inventario', maquila: 'cp_c_maquila', finca: 'cp_c_finca', preciosCafe: 'cp_c_preciosCafe', cosechas: 'cp_c_cosechas', pergamino: 'cp_c_pergamino', tuestes: 'cp_c_tuestes', ordenesMaquila: 'cp_c_ordenesMaquila', pedidosWeb: 'cp_c_pedidosWeb' };

function cargarCacheLocal() {
  for (const k in CACHE_KEYS) {
    try {
      const raw = localStorage.getItem(CACHE_KEYS[k]);
      if (raw) state[k] = JSON.parse(raw);
    } catch {}
  }
}
function guardarCacheLocal(k) {
  try { localStorage.setItem(CACHE_KEYS[k], JSON.stringify(state[k])); } catch {}
}

async function sincronizar() {
  const ind = document.getElementById('syncIndicator');
  ind.innerHTML = '<span class="sync-dot"></span> Sincronizando…';
  try {
    const [v, g, c, i, m, f, pc, co, pe, tu, om, pw] = await Promise.all([
      apiFetch('/api/ventas').then(r => r.json()),
      apiFetch('/api/gastos').then(r => r.json()),
      apiFetch('/api/clientes').then(r => r.json()),
      apiFetch('/api/inventario').then(r => r.json()),
      apiFetch('/api/maquila').then(r => r.json()),
      apiFetch('/api/finca').then(r => r.json()),
      apiFetch('/api/precios-cafe').then(r => r.json()),
      apiFetch('/api/cosechas').then(r => r.json()),
      apiFetch('/api/pergamino').then(r => r.json()),
      apiFetch('/api/tuestes').then(r => r.json()),
      apiFetch('/api/ordenes-maquila').then(r => r.json()),
      apiFetch('/api/pedidos-web').then(r => r.json()),
    ]);
    state.ventas = v; state.gastos = g; state.clientes = c;
    state.inventario = i; state.maquila = m; state.finca = f; state.preciosCafe = pc;
    state.cosechas = co; state.pergamino = pe; state.tuestes = tu; state.ordenesMaquila = om; state.pedidosWeb = pw;
    Object.keys(CACHE_KEYS).forEach(guardarCacheLocal);
    ind.innerHTML = '<span class="sync-dot"></span> Sincronizado';
    renderTodo();
  } catch (err) {
    ind.innerHTML = '<span class="sync-dot"></span> Sin conexión (viendo caché)';
  }
}

// No es un respaldo automático real (eso necesita infraestructura aparte) —
// solo un recordatorio para que no se te pase exportar el Excel de vez en cuando.
const DIAS_AVISO_EXPORT = 21;
/* ================================================================
   PEDIDOS WEB — bandeja de entrada de la página pública de clientes
================================================================ */
function renderCampanaPedidosWeb() {
  const nuevos = state.pedidosWeb.filter(p => p.estado === 'nuevo').length;
  const badge = document.getElementById('campanaBadge');
  if (!badge) return;
  badge.style.display = nuevos ? 'flex' : 'none';
  badge.textContent = nuevos > 9 ? '9+' : nuevos;
}

function detallePedidoWeb(p) {
  return (p.items || []).map(it => `${it.cantidad} ${it.presentacion} de ${it.lote}${it.molienda ? ' (' + it.molienda + ')' : ''}`).join(' · ');
}

function abrirPedidosWeb() {
  abrirModal(`
    <h3>Pedidos desde la página de clientes</h3>
    <div id="pw-lista">${pintarListaPedidosWeb(ordenarPedidosWeb(state.pedidosWeb))}</div>
    <div class="modal-actions"><button class="sec-btn" style="flex:1" onclick="cerrarModal()">Cerrar</button></div>
  `);
}

// Los nuevos sin revisar siempre quedan arriba, sin importar la fecha —
// para que con cientos de pedidos acumulados no toque buscar entre los
// ya convertidos o descartados para encontrar el que falta atender.
function ordenarPedidosWeb(lista) {
  const prioridad = e => e === 'nuevo' ? 0 : 1;
  return lista.slice().sort((a, b) => prioridad(a.estado) - prioridad(b.estado) || b.ts - a.ts);
}

function pintarListaPedidosWeb(lista) {
  if (!lista.length) return '<div class="empty">Todavía no ha llegado ningún pedido.</div>';
  return lista.map(p => `
    <div class="ledger-row" style="${p.estado === 'nuevo' ? 'background:var(--terracota-bg);border-radius:8px;padding:11px 8px' : ''}">
      <div class="main">
        <div class="title">${escapeHtml(p.nombreCliente)} ${p.telefono ? '· ' + escapeHtml(p.telefono) : ''}</div>
        <div class="meta">${new Date(Number(p.ts)).toLocaleString('es-CO')} · ${p.estado}</div>
        <div class="details">${escapeHtml(detallePedidoWeb(p))}${p.notas ? ' — ' + escapeHtml(p.notas) : ''}</div>
      </div>
      <div class="amount pos">${fmt(p.valorTotal)}</div>
      <div class="acciones">
        ${p.estado !== 'convertido' ? `<button onclick="convertirPedidoWebAVenta(${p.id})" title="Convertir en venta">🛒</button>` : ''}
        <button onclick="eliminarPedidoWeb(${p.id})" title="Descartar">✕</button>
      </div>
    </div>`).join('');
}


async function eliminarPedidoWeb(id) {
  if (!confirm('¿Descartar este pedido de la bandeja?')) return;
  state.pedidosWeb = state.pedidosWeb.filter(x => x.id !== id);
  guardarCacheLocal('pedidosWeb'); renderCampanaPedidosWeb();
  const cont = document.getElementById('pw-lista');
  if (cont) cont.innerHTML = pintarListaPedidosWeb(ordenarPedidosWeb(state.pedidosWeb));
  await apiFetch('/api/pedidos-web/' + id, { method: 'DELETE' });
}

// El respaldo se pone al día solo, sin que nadie tenga que acordarse de
// darle a "Exportar" — pero los navegadores bloquean descargas que no
// vengan de un clic real, así que se dispara en el primer toque que hagas
// en la app (cuenta como gesto real), no apenas se abre.
let autoBackupPendiente = false;
let autoBackupDisparadoEnEstaSesion = false;

function renderRecordatorioExport() {
  const el = document.getElementById('exportReminder');
  const ultimo = Number(localStorage.getItem('cp_ultimo_export') || 0);
  const dias = ultimo ? Math.floor((Date.now() - ultimo) / 86400000) : null;
  const necesitaBackup = dias === null || dias >= DIAS_AVISO_EXPORT;
  autoBackupPendiente = necesitaBackup && !autoBackupDisparadoEnEstaSesion;

  if (necesitaBackup) {
    el.style.display = 'flex';
    el.innerHTML = autoBackupPendiente
      ? `<span>🗂️ ${dias === null ? 'Nunca has exportado' : 'Van ' + dias + ' días sin exportar'} — se va a descargar un respaldo automático con tu próximo toque.</span><button onclick="exportarExcel()">Exportar ya</button>`
      : `<span>🗂️ Respaldo automático descargado esta sesión.</span><button onclick="exportarExcel()">Exportar de nuevo</button>`;
  } else {
    el.style.display = 'none';
  }
}

document.addEventListener('click', () => {
  if (!autoBackupPendiente || autoBackupDisparadoEnEstaSesion) return;
  autoBackupDisparadoEnEstaSesion = true;
  autoBackupPendiente = false;
  exportarExcel();
  toast('Respaldo automático descargado — llevabas mucho sin exportar');
}, { capture: true });

/* ---------- Línea nueva (café o un servicio de maquila) ---------- */
function onLnLoteChange() {
  const esLavado = document.getElementById('ln-lote').value === 'Lavado';
  document.getElementById('ln-campo-tueste').style.display = esLavado ? 'flex' : 'none';
  recalcularLinea();
}

function recalcularLinea() {
  const lote = document.getElementById('ln-lote').value;
  const presentacion = document.getElementById('ln-presentacion').value;
  const cantidad = Number(document.getElementById('ln-cantidad-cafe').value) || 1;
  const tipoCliente = document.getElementById('v-tipoCliente').value;
  document.getElementById('ln-valor').value = precioSugerido(lote, presentacion, tipoCliente) * cantidad;
}

function agregarLineaAlCarrito() {
  const lote = document.getElementById('ln-lote').value;
  const item = {
    tipo: 'cafe',
    lote,
    presentacion: document.getElementById('ln-presentacion').value,
    cantidad: Number(document.getElementById('ln-cantidad-cafe').value) || 1,
    valor: Number(document.getElementById('ln-valor').value) || 0,
    molienda: document.getElementById('ln-molienda').value,
    tueste: lote === 'Lavado' ? document.getElementById('ln-tueste').value : null,
  };
  if (!item.cantidad) return toast('Pon una cantidad mayor a cero.', 'error');
  carritoActual.push(item);
  pintarCarrito();
}

function quitarDelCarrito(i) {
  carritoActual.splice(i, 1);
  pintarCarrito();
}

function pintarCarrito() {
  const lista = document.getElementById('carrito-lista');
  if (!lista) return;
  lista.innerHTML = carritoActual.length
    ? carritoActual.map((it, i) => `
      <div class="ledger-row">
        <div class="main"><div class="title">${it.tipo === 'cafe' ? `${escapeHtml(it.lote)} · ${escapeHtml(it.presentacion)} × ${it.cantidad}` : `${escapeHtml(it.servicio)} ${it.presentacion ? it.cantidad + ' ' + escapeHtml(it.presentacion) : it.cantidad + 'kg'}`}</div></div>
        <div class="amount pos">${fmt(it.valor)}</div>
        <div class="acciones"><button onclick="quitarDelCarrito(${i})" title="Quitar">✕</button></div>
      </div>`).join('')
    : '<div class="empty">Aún no has agregado nada.</div>';
  const total = carritoActual.reduce((s, it) => s + (Number(it.valor) || 0), 0);
  document.getElementById('carrito-total').textContent = fmt(total);
  const valorInput = document.getElementById('v-valor');
  if (valorInput) valorInput.value = total;
}

function aplicarQuickAdd(idx) {
  const qa = QUICK_ADD[idx];
  const tipoClienteSelect = document.getElementById('v-tipoCliente');
  if (qa.tipoCliente) tipoClienteSelect.value = qa.tipoCliente; // este botón siempre agrega con la tarifa de distribuidor, ajusta el pedido completo
  const tipoCliente = tipoClienteSelect.value;
  carritoActual.push({ tipo: 'cafe', lote: qa.lote, presentacion: qa.presentacion, cantidad: 1, valor: precioSugerido(qa.lote, qa.presentacion, tipoCliente) });
  pintarCarrito();
  document.getElementById('v-cliente').focus();
}

function lotesDeVenta(v) {
  if (v.items && v.items.length && v.items[0] && v.items[0].tipo) {
    return v.items.filter(it => it.tipo === 'cafe' && it.lote).map(it => [it.lote, it.valor]);
  }
  if (v.tipoVenta !== 'maquila' && v.lote) return [[v.lote, v.valor]];
  return [];
}

function detalleItemCafe(it) {
  const extras = [it.molienda, it.tueste ? 'Tostión ' + it.tueste : null].filter(Boolean).join(', ');
  return `${it.lote} ${it.presentacion} x${it.cantidad}` + (extras ? ` (${extras})` : '');
}

function detalleVenta(v) {
  if (v.items && v.items.length && v.items[0] && v.items[0].tipo) {
    return v.items.map(it => it.tipo === 'maquila'
      ? (it.presentacion ? `${it.servicio} ${it.cantidad} ${it.presentacion}` : `${it.servicio} ${it.cantidad}kg`)
      : detalleItemCafe(it)
    ).join(' · ');
  }
  if (v.tipoVenta === 'maquila') {
    return (v.servicios || []).map(s => s.presentacion ? `${s.servicio} ${s.cantidad} ${s.presentacion}` : `${s.servicio} ${s.cantidad}kg`).join(' · ');
  }
  if (v.lote) return `${v.lote} · ${v.presentacion || ''} × ${v.cantidad || 1}`;
  if (v.items && v.items.length) return v.items.map(it => `${it.cantidad}x ${it.proceso || ''} ${it.presentacion || ''}`).join(' · ');
  return '';
}

function filaVenta(v, esDeuda) {
  const envioPendiente = v.estadoEnvio !== 'Enviado';
  return `
    <div class="ledger-row ${esDeuda ? 'deuda-anterior' : ''} ${envioPendiente ? 'envio-pendiente' : ''}">
      <div class="main">
        <div class="title">${escapeHtml(v.cliente || 'Venta directa')} ${v.origenWeb ? '<span class="badge-web">🌐 Pedido web</span>' : ''}</div>
        <div class="meta">${new Date(Number(v.ts)).toLocaleDateString('es-CO')} · ${escapeHtml(v.usuario || '')} ${esDeuda ? '· desde ' + mesDe(v.ts) : ''}</div>
        <div class="details">${escapeHtml(detalleVenta(v))}</div>
        <div style="margin-top:5px"><button class="tag ${envioPendiente ? 'envio-pendiente' : 'envio-enviado'}" onclick="toggleEstadoEnvio(${v.id})">${envioPendiente ? '📦 Pendiente de envío' : '✅ Enviado'}</button></div>
      </div>
      <button class="tag ${v.estado === 'Pagado' ? 'pagado' : 'pendiente'}" onclick="toggleEstadoVenta(${v.id})">${v.estado}</button>
      <div class="amount pos">${fmt(v.valor)}</div>
      <div class="acciones">
        <button onclick="abrirRecibo(${v.id})" title="Recibo">🧾</button>
        <button onclick="abrirEdicionVenta(${v.id})" title="Editar">✎</button>
        <button onclick="eliminarVenta(${v.id})" title="Eliminar">✕</button>
      </div>
    </div>`;
}

async function toggleEstadoEnvio(id) {

async function registrarVenta(btn) {
  if (!carritoActual.length) return toast('Agrega al menos un producto o servicio al pedido.', 'error');
  if (btn) btn.disabled = true;
  try {
    const usuario = document.getElementById('v-usuario').value.trim() || 'Equipo';
    localStorage.setItem('cp_usuario', usuario);
    const ordenEnCurso = ordenes[ordenActiva];

    const payload = {
      usuario,
      cliente: nombreCanonico(document.getElementById('v-cliente').value) || 'Venta directa',
      tipoCliente: document.getElementById('v-tipoCliente').value,
      items: carritoActual,
      valor: Math.max(0, Number(document.getElementById('v-valor').value) || carritoActual.reduce((s, it) => s + (Number(it.valor) || 0), 0)),
      metodo: document.getElementById('v-metodo').value,
      estado: document.getElementById('v-estado').value,
      origenWeb: !!ordenEnCurso.origenWeb,
      ts: Date.now(),
    };

    const res = await apiFetch('/api/ventas', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    const row = await res.json();
    state.ventas.push(row);
    guardarCacheLocal('ventas');

    // Si esta orden venía de un pedido de la página web, ese pedido queda
    // marcado como convertido — ya no se queda suelto en la campanita.
    if (ordenEnCurso.pedidoWebId) {
      const p = state.pedidosWeb.find(x => x.id === ordenEnCurso.pedidoWebId);
      if (p) p.estado = 'convertido';
      guardarCacheLocal('pedidosWeb');
      apiFetch('/api/pedidos-web/' + ordenEnCurso.pedidoWebId, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ estado: 'convertido' }) });
    }

    finalizarOrdenActiva();
    toast('Venta registrada');
    renderTodo(); // esto reconstruye el botón, ya no hace falta rehabilitarlo a mano
    sincronizar(); // trae de vuelta el descuento de inventario / nuevo cliente calculados en el servidor
  } finally {
    if (btn) btn.disabled = false;
  }
}

async function subirGuiaEnvio(id, file) {
  if (!file) return;
  if (file.size > 4 * 1024 * 1024) return toast('La imagen pesa mucho — usa una de menos de 4 MB.', 'error');
  const dataUrl = await new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(file); });
  const v = state.ventas.find(x => x.id === id); if (v) v.guiaEnvio = dataUrl;
  guardarCacheLocal('ventas');
  const cont = document.getElementById('guia-preview');
  if (cont) cont.innerHTML = pintarGuiaPreview(v);
  toast('Subiendo guía…');
  await apiFetch('/api/ventas/' + id, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ guiaEnvio: dataUrl }) });
  toast('Guía de envío guardada');
}

async function quitarGuiaEnvio(id) {
  const v = state.ventas.find(x => x.id === id); if (v) v.guiaEnvio = null;
  guardarCacheLocal('ventas');
  const cont = document.getElementById('guia-preview');
  if (cont) cont.innerHTML = pintarGuiaPreview(v || {});
  await apiFetch('/api/ventas/' + id, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ guiaEnvio: null }) });
}

function descargarRecibo(id) {
  const v = state.ventas.find(x => x.id === id); if (!v) return;
  const pagado = v.estado === 'Pagado';
  if (typeof jspdf === 'undefined') return toast('No se pudo cargar el generador de PDF. Revisa tu conexión.', 'error');
  const { jsPDF } = jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a5' });
  const anchoPag = doc.internal.pageSize.getWidth();
  let y = 16;

  try { doc.addImage('data:image/png;base64,' + LOGO_RECIBO_B64, 'PNG', anchoPag/2 - 30, y, 60, 19.2); } catch {}
  y += 26;
  doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.setTextColor(120);
  doc.text(pagado ? 'Recibo de pago' : 'Recibo de pedido', anchoPag/2, y, { align: 'center' }); y += 10;

  doc.setDrawColor(220); doc.line(12, y, anchoPag - 12, y); y += 8;

  doc.setTextColor(40); doc.setFontSize(11);
  doc.text('Cliente: ' + (v.cliente || 'Venta directa'), 14, y); y += 6;
  doc.text('Fecha: ' + new Date(Number(v.ts)).toLocaleDateString('es-CO'), 14, y); y += 6;
  if (pagado && v.metodo) { doc.text('Método de pago: ' + v.metodo, 14, y); y += 6; }
  y += 2;

  doc.setFont('helvetica', 'bold'); doc.text('Detalle', 14, y); y += 6;
  doc.setFont('helvetica', 'normal'); doc.setFontSize(10);
  const detalle = detalleVenta(v).split(' · ');
  detalle.forEach(linea => { doc.text('• ' + linea, 16, y); y += 6; });
  y += 4;

  doc.setDrawColor(220); doc.line(12, y, anchoPag - 12, y); y += 10;
  doc.setFont('helvetica', 'bold'); doc.setFontSize(15);
  doc.text('TOTAL: ' + fmt(v.valor), 14, y);
  if (pagado) {
    doc.setTextColor(74, 107, 72); doc.setFontSize(12);
    doc.text('✓ PAGADO', anchoPag - 14, y, { align: 'right' });
  } else {
    doc.setTextColor(173, 75, 49); doc.setFontSize(12);
    doc.text('PENDIENTE DE PAGO', anchoPag - 14, y, { align: 'right' });
  }
  y += 14;

  // Los datos de pago solo se muestran si TODAVÍA no ha pagado — si ya
  // pagó, no hacen falta y el recibo queda más limpio.
  if (!pagado) {
    doc.setTextColor(120); doc.setFontSize(9);
    doc.text('Puedes pagar a:', 14, y); y += 5;
    doc.setFont('helvetica', 'bold'); doc.setTextColor(60);
    doc.text(DATOS_PAGO, 14, y); y += 10;
  }

  doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(150);
  doc.text('¡Gracias por tu compra!', anchoPag/2, y, { align: 'center' });

  doc.save('Recibo_CafePandora_' + (v.cliente || 'cliente').replace(/[^a-zA-Z0-9]/g,'_') + '_' + v.id + '.pdf');
}

/* ---------- Editar un pedido: agregar más líneas días después ---------- */
let editCarrito = [];
let editItemsNuevos = [];
let editItemsRemovidos = []; // líneas ORIGINALES que se quitaron en esta sesión (para devolver su inventario)
let editTipoCliente = 'Cliente normal';

function itemsNormalizados(v) {
  if (v.items && v.items.length && v.items[0] && v.items[0].tipo) return v.items.map(it => ({ ...it }));
  if (v.tipoVenta === 'maquila' && Array.isArray(v.servicios) && v.servicios.length) {
    return v.servicios.map(s => ({ tipo: 'maquila', servicio: s.servicio, presentacion: s.presentacion || null, cantidad: s.cantidad, valor: 0 }));
  }
  if (v.lote) return [{ tipo: 'cafe', lote: v.lote, presentacion: v.presentacion, cantidad: v.cantidad || 1, valor: v.valor }];
  return [];
}

function abrirEdicionVenta(id) {
  const v = state.ventas.find(x => x.id === id); if (!v) return;
  editCarrito = itemsNormalizados(v);
  editItemsNuevos = [];
  editItemsRemovidos = [];
  editTipoCliente = v.tipoCliente || 'Cliente normal';

  abrirModal(`
    <h3>Editar pedido — ${escapeHtml(v.cliente || 'Venta directa')}</h3>
    <p style="font-size:12px;color:var(--cafe-soft);margin-top:-6px">Puedes agregarle más café ahora si el pedido sigue en curso.</p>

    <div id="em-lista"></div>
    <div style="text-align:right;font-weight:700;margin:6px 0 10px">Total: <span id="em-total">$0</span></div>

    <h3 class="section-title" style="margin-top:4px">Agregar línea</h3>
    <div class="row">
      <div class="field"><label>Lote</label><select id="em-ln-lote" onchange="onEmLnLoteChange()">${LOTES.map(l => `<option>${l}</option>`).join('')}</select></div>
      <div class="field"><label>Presentación</label><select id="em-ln-presentacion" onchange="recalcularEmLinea()">${PRESENTACIONES.map(p => `<option>${p}</option>`).join('')}</select></div>
      <div class="field"><label>Cantidad</label><input id="em-ln-cantidad-cafe" type="number" value="1" min="1" onchange="recalcularEmLinea()"></div>
    </div>
    <div class="row">
      <div class="field"><label>Molienda</label><select id="em-ln-molienda">${MOLIENDAS.map(m => `<option>${m}</option>`).join('')}</select></div>
      <div class="field" id="em-ln-campo-tueste"><label>Tostión</label><select id="em-ln-tueste">${TUESTES_LAVADO.map(t => `<option>${t}</option>`).join('')}</select></div>
    </div>
    <div class="row">
      <div class="field"><label>Valor de esta línea</label><input id="em-ln-valor" type="number" placeholder="0" min="0"></div>
    </div>
    <button class="sec-btn" style="width:100%" onclick="agregarLineaAEdicion()">+ Agregar línea</button>

    <div class="row" style="margin-top:14px">
      <div class="field"><label>Estado</label><select id="m-estado"><option ${v.estado==='Pagado'?'selected':''}>Pagado</option><option ${v.estado==='Pendiente'?'selected':''}>Pendiente</option></select></div>
      <div class="field"><label>Método de pago</label><select id="m-metodo">${METODOS_PAGO.map(m => `<option ${m===v.metodo?'selected':''}>${m}</option>`).join('')}</select></div>
    </div>
    <div class="modal-actions">
      <button class="add-btn" onclick="guardarEdicionVenta(${id}, this)">Guardar</button>
      <button class="sec-btn" onclick="cerrarModal()">Cancelar</button>
    </div>
  `);
  onEmLnLoteChange();
  pintarEdicionCarrito();
}

function onEmLnLoteChange() {
  const esLavado = document.getElementById('em-ln-lote').value === 'Lavado';
  document.getElementById('em-ln-campo-tueste').style.display = esLavado ? 'flex' : 'none';
  recalcularEmLinea();
}

function recalcularEmLinea() {
  const lote = document.getElementById('em-ln-lote').value;
  const presentacion = document.getElementById('em-ln-presentacion').value;
  const cantidad = Number(document.getElementById('em-ln-cantidad-cafe').value) || 1;
  document.getElementById('em-ln-valor').value = precioSugerido(lote, presentacion, editTipoCliente) * cantidad;
}

function agregarLineaAEdicion() {
  const lote = document.getElementById('em-ln-lote').value;
  const item = {
    tipo: 'cafe',
    lote,
    presentacion: document.getElementById('em-ln-presentacion').value,
    cantidad: Number(document.getElementById('em-ln-cantidad-cafe').value) || 1,
    valor: Number(document.getElementById('em-ln-valor').value) || 0,
    molienda: document.getElementById('em-ln-molienda').value,
    tueste: lote === 'Lavado' ? document.getElementById('em-ln-tueste').value : null,
  };
  if (!item.cantidad) return toast('Pon una cantidad mayor a cero.', 'error');
  editCarrito.push(item);
  editItemsNuevos.push(item); // mismo objeto: así sabemos que es nuevo de esta sesión
  pintarEdicionCarrito();
}

function quitarDeEdicion(i) {
  const [removido] = editCarrito.splice(i, 1);
  const j = editItemsNuevos.indexOf(removido);
  if (j !== -1) {
    editItemsNuevos.splice(j, 1); // se agregó y se quitó en la misma sesión: se cancela, no hay que devolver nada
  } else {
    editItemsRemovidos.push(removido); // era una línea original: hay que devolverle su inventario
  }
  pintarEdicionCarrito();
}

function pintarEdicionCarrito() {
  const lista = document.getElementById('em-lista');
  if (!lista) return;
  lista.innerHTML = editCarrito.length
    ? editCarrito.map((it, i) => `
      <div class="ledger-row">
        <div class="main"><div class="title">${it.tipo === 'cafe' ? `${escapeHtml(it.lote)} · ${escapeHtml(it.presentacion)} × ${it.cantidad}` : `${escapeHtml(it.servicio)} ${it.presentacion ? it.cantidad + ' ' + escapeHtml(it.presentacion) : it.cantidad + 'kg'}`}</div></div>
        <div class="amount pos">${fmt(it.valor)}</div>
        <div class="acciones"><button onclick="quitarDeEdicion(${i})" title="Quitar">✕</button></div>
      </div>`).join('')
    : '<div class="empty">Sin líneas — agrega la primera abajo.</div>';
  document.getElementById('em-total').textContent = fmt(editCarrito.reduce((s, it) => s + (Number(it.valor) || 0), 0));
}

async function guardarEdicionVenta(id, btn) {
  if (btn) btn.disabled = true;
  const cambios = {
    items: editCarrito,
    valor: editCarrito.reduce((s, it) => s + (Number(it.valor) || 0), 0),
    estado: document.getElementById('m-estado').value,
    metodo: document.getElementById('m-metodo').value,
    nuevosItems: editItemsNuevos, // el backend descuenta inventario por estas líneas nuevas
    itemsRemovidos: editItemsRemovidos, // y le devuelve inventario a las líneas originales que quitaste
  };
  const v = state.ventas.find(x => x.id === id); Object.assign(v, cambios);
  guardarCacheLocal('ventas'); cerrarModal(); renderTodo();
  await apiFetch('/api/ventas/' + id, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(cambios) });
  sincronizar();
}

let clienteMaquilaActual = '';

    (coincide(o.cliente, q) || coincide(detalleOrdenMaquila(o), q)));

  document.getElementById('view-maquila').innerHTML = `
    <div class="card">

    return it.presentacion ? `${it.servicio} ${it.cantidad} ${it.presentacion}` : `${it.servicio} ${it.cantidad}kg`;
  }).join(' · ');
}

function filaOrdenMaquila(o) {

/* ---------- Autocompletado de cliente (reutiliza el mismo directorio) ---------- */
function filtrarSugerenciasClienteMaquila() {
  const input = document.getElementById('mq-cliente');
  const caja = document.getElementById('mqSugerencias');
  if (!input || !caja) return;
  const q = normalizar(input.value);
  const todos = listaClientesMaquila();
  const coinciden = (q ? todos.filter(c => normalizar(c.nombre).includes(q)) : todos).slice(0, 10);
  if (!coinciden.length) { caja.style.display = 'none'; return; }
  caja.innerHTML = coinciden.map(c => `
    <button type="button" onmousedown="elegirClienteMaquila('${escapeAttr(c.nombre).replace(/'/g, "\\'")}')">
      <span class="sug-nombre">${escapeHtml(c.nombre)}</span>
      <span class="sug-detalle">${c.compras ? c.compras + ' orden' + (c.compras===1?'':'es') : 'cliente nuevo'}</span>
    </button>`).join('');
  caja.style.display = 'block';
}
function elegirClienteMaquila(nombre) {
  document.getElementById('mq-cliente').value = nombre;
  const caja = document.getElementById('mqSugerencias');
  if (caja) caja.style.display = 'none';
}

/* ---------- Línea de servicio ---------- */
function onMaquilaServicioChange() {
  const servicio = document.getElementById('mq-servicio').value;
  const esTransporte = servicio === SERVICIO_TRANSPORTE;
  const filas = esTransporte ? [] : gruposDeServicio(servicio);
  const esKg = !esTransporte && filas.length === 1 && !filas[0].presentacion;
  document.getElementById('mq-campos-kg').style.display = esKg ? 'flex' : 'none';
  document.getElementById('mq-campos-pres').style.display = (!esTransporte && !esKg && filas.length) ? 'flex' : 'none';
  document.getElementById('mq-campos-transporte').style.display = esTransporte ? 'flex' : 'none';
  if (esTransporte) document.getElementById('mq-valor').value = ''; // el transporte siempre se escribe a mano
  else recalcularLineaMaquila();
}
function recalcularLineaMaquila() {
  const servicio = document.getElementById('mq-servicio').value;
  if (servicio === SERVICIO_TRANSPORTE) return; // valor manual, no se recalcula solo
  const filas = gruposDeServicio(servicio);
  if (!filas.length) return;
  const esKg = filas.length === 1 && !filas[0].presentacion;
  let valor = 0;
  if (esKg) {
    const kg = Number(document.getElementById('mq-kg').value) || 0;
    valor = kg * filas[0].precio;
  } else {
    const presentacion = document.getElementById('mq-presentacion').value;
    const cantidad = Number(document.getElementById('mq-cantidad').value) || 1;
    const tarifa = filas.find(f => f.presentacion === presentacion);
    valor = cantidad * (tarifa ? tarifa.precio : 0);
  }
  document.getElementById('mq-valor').value = valor;
}
function agregarLineaMaquila() {
  const servicio = document.getElementById('mq-servicio').value;
  if (!servicio) return toast('Configura al menos una tarifa de maquila primero.', 'error');
  const valor = Math.max(0, Number(document.getElementById('mq-valor').value) || 0);

  let item;
  if (servicio === SERVICIO_TRANSPORTE) {
    if (!valor) return toast('Escribe el valor del transporte.', 'error');
    const nota = document.getElementById('mq-nota-transporte').value.trim();
    item = { servicio: SERVICIO_TRANSPORTE, presentacion: null, cantidad: 1, valor, nota: nota || null };
  } else {
    const filas = gruposDeServicio(servicio);
    const esKg = filas.length === 1 && !filas[0].presentacion;
    item = esKg
      ? { servicio, presentacion: null, cantidad: Number(document.getElementById('mq-kg').value) || 0, valor }
      : { servicio, presentacion: document.getElementById('mq-presentacion').value, cantidad: Number(document.getElementById('mq-cantidad').value) || 1, valor };
    if (!item.cantidad) return toast('Pon una cantidad mayor a cero.', 'error');
  }
  carritoMaquila.push(item);
  pintarCarritoMaquila();
}
function quitarDeCarritoMaquila(i) {
  carritoMaquila.splice(i, 1);
  pintarCarritoMaquila();
}
function tituloItemMaquila(it) {
  if (it.servicio === SERVICIO_TRANSPORTE) return 'Transporte' + (it.nota ? ' · ' + escapeHtml(it.nota) : '');
  return it.presentacion ? `${escapeHtml(it.servicio)} · ${it.cantidad} ${escapeHtml(it.presentacion)}` : `${escapeHtml(it.servicio)} · ${it.cantidad}kg`;
}
function pintarCarritoMaquila() {
  const lista = document.getElementById('mq-carrito-lista');
  if (!lista) return;
  lista.innerHTML = carritoMaquila.length
    ? carritoMaquila.map((it, i) => `
      <div class="ledger-row">
        <div class="main"><div class="title">${tituloItemMaquila(it)}</div></div>
        <div class="amount pos">${fmt(it.valor)}</div>
        <div class="acciones"><button onclick="quitarDeCarritoMaquila(${i})" title="Quitar">✕</button></div>
      </div>`).join('')
    : '<div class="empty">Aún no has agregado nada.</div>';
  document.getElementById('mq-carrito-total').textContent = fmt(carritoMaquila.reduce((s, it) => s + (Number(it.valor) || 0), 0));
}

async function registrarOrdenMaquila(btn) {
  const cliente = nombreCanonicoMaquila(document.getElementById('mq-cliente').value) || '';
  if (!cliente) return toast('Escribe el nombre del cliente.', 'error');
  if (!carritoMaquila.length) return toast('Agrega al menos un servicio.', 'error');
  btn.disabled = true;
  try {
    const payload = {
      cliente,
      usuario: localStorage.getItem('cp_usuario') || 'Equipo',
      items: carritoMaquila,
      valor: carritoMaquila.reduce((s, it) => s + (Number(it.valor) || 0), 0),
      estado: document.getElementById('mq-estado').value,
      metodo: document.getElementById('mq-metodo').value,
      ts: Date.now(),
    };
    const res = await apiFetch('/api/ordenes-maquila', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    state.ordenesMaquila.push(await res.json());
    guardarCacheLocal('ordenesMaquila');
    carritoMaquila = [];
    clienteMaquilaActual = '';
    toast('Orden de maquila registrada');
    renderTodo();
    sincronizar();
  } finally { btn.disabled = false; }
}

async function toggleEstadoOrdenMaquila(id) {
  const o = state.ordenesMaquila.find(x => x.id === id); if (!o) return;
  o.estado = o.estado === 'Pagado' ? 'Pendiente' : 'Pagado';
  guardarCacheLocal('ordenesMaquila'); renderTodo();
  await apiFetch('/api/ordenes-maquila/' + id, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ estado: o.estado }) });
}

async function eliminarOrdenMaquila(id) {
  if (!confirm('¿Eliminar esta orden de maquila?')) return;
  state.ordenesMaquila = state.ordenesMaquila.filter(x => x.id !== id);
  guardarCacheLocal('ordenesMaquila'); renderTodo();
  await apiFetch('/api/ordenes-maquila/' + id, { method: 'DELETE' });
}

function onEmqServicioChange() {
  const servicio = document.getElementById('emq-servicio').value;
  const esTransporte = servicio === SERVICIO_TRANSPORTE;
  const filas = esTransporte ? [] : gruposDeServicio(servicio);
  const esKg = !esTransporte && filas.length === 1 && !filas[0].presentacion;
  document.getElementById('emq-campos-kg').style.display = esKg ? 'flex' : 'none';
  document.getElementById('emq-campos-pres').style.display = (!esTransporte && !esKg && filas.length) ? 'flex' : 'none';
  document.getElementById('emq-campos-transporte').style.display = esTransporte ? 'flex' : 'none';
  if (esTransporte) document.getElementById('emq-valor').value = '';
  else recalcularEmqLinea();
}
function recalcularEmqLinea() {
  const servicio = document.getElementById('emq-servicio').value;
  if (servicio === SERVICIO_TRANSPORTE) return;
  const filas = gruposDeServicio(servicio);
  if (!filas.length) return;
  const esKg = filas.length === 1 && !filas[0].presentacion;
  let valor = 0;
  if (esKg) {
    valor = (Number(document.getElementById('emq-kg').value) || 0) * filas[0].precio;
  } else {
    const presentacion = document.getElementById('emq-presentacion').value;
    const cantidad = Number(document.getElementById('emq-cantidad').value) || 1;
    const tarifa = filas.find(f => f.presentacion === presentacion);
    valor = cantidad * (tarifa ? tarifa.precio : 0);
  }
  document.getElementById('emq-valor').value = valor;
}
function agregarLineaEmq() {
  const servicio = document.getElementById('emq-servicio').value;
  const valor = Math.max(0, Number(document.getElementById('emq-valor').value) || 0);

  let item;
  if (servicio === SERVICIO_TRANSPORTE) {
    if (!valor) return toast('Escribe el valor del transporte.', 'error');
    const nota = document.getElementById('emq-nota-transporte').value.trim();
    item = { servicio: SERVICIO_TRANSPORTE, presentacion: null, cantidad: 1, valor, nota: nota || null };
  } else {
    const filas = gruposDeServicio(servicio);
    const esKg = filas.length === 1 && !filas[0].presentacion;
    item = esKg
      ? { servicio, presentacion: null, cantidad: Number(document.getElementById('emq-kg').value) || 0, valor }
      : { servicio, presentacion: document.getElementById('emq-presentacion').value, cantidad: Number(document.getElementById('emq-cantidad').value) || 1, valor };
    if (!item.cantidad) return toast('Pon una cantidad mayor a cero.', 'error');
  }
  editCarritoMaquila.push(item);
  pintarEmqCarrito();
}
function quitarDeEmqCarrito(i) {
  editCarritoMaquila.splice(i, 1);
  pintarEmqCarrito();
}
function pintarEmqCarrito() {
  const lista = document.getElementById('emq-lista');
  if (!lista) return;
  lista.innerHTML = editCarritoMaquila.length
    ? editCarritoMaquila.map((it, i) => `
      <div class="ledger-row">

}

async function guardarEdicionMaquila(id, btn) {
